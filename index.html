<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preload" href="assets/fonts/zhuque-fangsong-subset.woff2" as="font" type="font/woff2" crossorigin>
<title>红墙引 · 带着系统去宫斗</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="红墙引">
<style>
/* ============================================================
   样式目录
   主题令牌 → 开局/捏人 → 主界面 → 叙事与对话 → 面板与弹窗
   ============================================================ */
@font-face{
  font-family:"Zhuque Fangsong";
  src:url("assets/fonts/zhuque-fangsong-subset.woff2") format("woff2"); /* 子集：GB2312 一级汉字＋本作文案用字，4.47MB→1.46MB；缺字回落系统宋体 */
  font-weight:400;font-style:normal;font-display:swap;
}
/* ============================================================
   THEME · 深宫辞 v1 —— 翻译依据：design/TOKENS.md（覆盖 06 规范默认令牌）
   ============================================================ */
:root{
  --paper:#f5efe3; --paper-deep:#ede4d3; --card:#fdfbf5;
  --ink:#2b2620; --ink-soft:#6b6255;
  --cinnabar:#a63a2e; --cinnabar-deep:#8e2f24;
  --indigo:#2f4858; --gold:#b08d4a;
  --line:rgba(43,38,32,.14); --shadow:0 2px 12px rgba(43,38,32,.08);
  --shadow-flat:0 1px 0 rgba(43,38,32,.15); /* 贴地浅影：面板/卡片只用这一层 */
  /* 拐子纹角花（描金，2px 线）：弹窗四角、面板顶角用 */
  --corner-tl:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><g fill='none' stroke='%23b08d4a'><path d='M9 1 H1 V9' stroke-width='2'/><path d='M9 4.6 H4.6 V9' stroke-width='1.3'/></g></svg>");
  --corner-tr:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><g fill='none' stroke='%23b08d4a' transform='rotate(90 5 5)'><path d='M9 1 H1 V9' stroke-width='2'/><path d='M9 4.6 H4.6 V9' stroke-width='1.3'/></g></svg>");
  --corner-br:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><g fill='none' stroke='%23b08d4a' transform='rotate(180 5 5)'><path d='M9 1 H1 V9' stroke-width='2'/><path d='M9 4.6 H4.6 V9' stroke-width='1.3'/></g></svg>");
  --corner-bl:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><g fill='none' stroke='%23b08d4a' transform='rotate(270 5 5)'><path d='M9 1 H1 V9' stroke-width='2'/><path d='M9 4.6 H4.6 V9' stroke-width='1.3'/></g></svg>");
  --line-strong:rgba(43,38,32,.28); --line-gold:rgba(176,141,74,.55);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.30 0 0 0 0 0.25 0 0 0 0 0.16 0 0 0 0.055 0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  --scrim:rgba(43,38,32,.45);
  --delta-up:#f6e8e4; --delta-down:#e9edf0;
  --sans:"Zhuque Fangsong","STFangsong","FangSong","仿宋","Songti SC","STSong","宋体","SimSun",serif;
  --serif:"Zhuque Fangsong","STFangsong","FangSong","仿宋","Songti SC","STSong","宋体","SimSun",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --gbar-h:calc(54px + var(--sat)); /* 常驻顶栏实际高度：同步脚本会按实测值覆盖 */
  --sail:env(safe-area-inset-left,0px); --sair:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#1c1915; --paper-deep:#262119; --card:#2a241c;
  --ink:#efe7d7; --ink-soft:#a89c88;
  --cinnabar:#c85a4b; --cinnabar-deep:#b04a3c; --indigo:#7d99ab; --gold:#c8a869;
  --line:rgba(239,231,215,.16); --shadow:0 2px 12px rgba(0,0,0,.4);
  --shadow-flat:0 1px 0 rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --delta-up:#3a2b27; --delta-down:#26303a;
  --line-strong:rgba(239,231,215,.3); --line-gold:rgba(200,163,92,.5);
}}
:root[data-theme="dark"]{
  --paper:#1c1915; --paper-deep:#262119; --card:#2a241c;
  --ink:#efe7d7; --ink-soft:#a89c88;
  --cinnabar:#c85a4b; --cinnabar-deep:#b04a3c; --indigo:#7d99ab; --gold:#c8a869;
  --line:rgba(239,231,215,.16); --shadow:0 2px 12px rgba(0,0,0,.4);
  --shadow-flat:0 1px 0 rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55); --delta-up:#3a2b27; --delta-down:#26303a;
  --line-strong:rgba(239,231,215,.3); --line-gold:rgba(200,163,92,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--serif);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;overflow-x:hidden;min-height:100vh;min-height:100dvh}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font-family:inherit;color:var(--ink)}
.num,.tabbar,.hint,.sheet-close,.meter-v,.tag{font-family:var(--sans)}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}

/* ---------- ① 开局页：封面＝《红墙引》海报（assets/ui/cover.jpg），按钮＝绢签式 ---------- */
#screen-start{position:relative;align-items:center;justify-content:flex-end;text-align:center;padding:calc(var(--sat) + 24px) 28px calc(var(--sab) + 34px);background:url(assets/ui/cover.jpg) center/cover no-repeat #241f19}
#screen-start::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(26,18,12,.18),rgba(26,18,12,0) 26%,rgba(26,18,12,0) 50%,rgba(26,18,12,.66) 100%)}
#screen-start>*{position:relative;z-index:1}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:2px;font-size:15px;letter-spacing:.28em;text-indent:.28em;transition:border-color .2s,background .2s,box-shadow .2s,transform .1s}
.btn-primary{background:var(--cinnabar);color:#fdfbf5;border:1px solid var(--cinnabar-deep);box-shadow:var(--shadow-flat)}
.btn-primary:hover{border-color:var(--gold)}
.btn-primary:active{background:var(--cinnabar-deep);transform:translateY(1px);box-shadow:none}
.btn-ghost{border:1px solid var(--cinnabar);color:var(--cinnabar)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-line{border:1px solid var(--line-strong);color:var(--ink);background:var(--card)}
.btn-line:hover{border-color:var(--gold)}
.btn-line:active{transform:translateY(1px);box-shadow:none}
.btn[disabled]{background:var(--paper-deep);color:var(--ink-soft);border:1px solid var(--line-strong);box-shadow:none}
/* 开局页按钮：绢签式（设计来源：古风热区标签方案.html）——绢底＋外墨线＋金细线内框＋金角线 */
#screen-start .btn{position:relative;border:1px solid rgba(43,38,32,.55);border-radius:2px;background:var(--grain),linear-gradient(165deg,rgba(246,237,216,.96),rgba(233,220,189,.94));color:#33302A;box-shadow:0 1px 2px rgba(46,36,24,.2),0 6px 18px rgba(46,36,24,.24);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px)}
#screen-start .btn::before{content:"";position:absolute;inset:3px;pointer-events:none;border:1px solid var(--line-gold);border-radius:1px;background:linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 0/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 0/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 0/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 0/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 100%/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 100%/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 100%/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 100%/1.5px 9px;background-repeat:no-repeat}
#screen-start .btn:active{transform:translateY(1px);background:var(--grain),linear-gradient(165deg,rgba(232,219,187,.96),rgba(221,206,172,.95));box-shadow:inset 0 1px 5px rgba(56,44,30,.32),0 1px 2px rgba(46,36,24,.18)}
#screen-start .btn:active::before{border-color:rgba(166,58,46,.6)}
#screen-start .btn-primary{background:linear-gradient(165deg,#b0442f,#8e2f24);border-color:rgba(43,38,32,.4);color:#fdfbf5;text-shadow:none}
#screen-start .btn-ghost{border-color:var(--cinnabar);color:var(--cinnabar)}
#screen-start .btn-line{color:#33302A}
#screen-start .btn[disabled]{opacity:.5}
#screen-start .btn{margin-top:14px}

/* ---------- 捏主控 ---------- */
#screen-create{align-items:center;padding:calc(var(--sat) + 24px) 20px calc(var(--sab) + 24px)}
.create-wrap{width:min(560px,100%);display:flex;flex-direction:column;flex:1}
.create-head{text-align:center;margin-bottom:10px;position:relative}
.create-back{position:absolute;left:0;top:2px;font-size:14px;color:var(--ink-soft);padding:6px 8px}
.create-title{font-size:24px;letter-spacing:.22em;color:var(--ink)}
.create-sub{margin-top:6px;font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
#createBody{flex:1}
.cr-row{display:flex;align-items:flex-start;gap:10px;padding:13px 2px;border-bottom:1px dashed var(--line)}
.cr-k{width:60px;flex:none;font-size:14px;color:var(--ink-soft);padding-top:3px}
.cr-v{flex:1;min-width:0}
.cr-v input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;padding:2px 0;outline:none;color:var(--ink)}
.cr-txt{font-size:15px;line-height:1.8}
.cr-note{font-size:12px;color:var(--ink-soft);margin-top:2px}
/* 捏人·头像自选：按位份定池的候选网格 */
.cr-avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:2px}
.cr-av{position:relative;padding:0;border:1px solid var(--line-strong);border-radius:2px;overflow:hidden;background:var(--paper-deep);height:72px;display:flex;align-items:center;justify-content:center;transition:border-color .15s,box-shadow .15s}
.cr-av img{width:100%;height:100%;object-fit:cover;display:block}
.cr-av-rnd{font-size:13px;letter-spacing:.1em;color:var(--ink-soft)}
.cr-av.on{border-color:var(--cinnabar);box-shadow:0 0 0 1px var(--cinnabar),var(--shadow-flat)}
.cr-av:active{transform:translateY(1px)}
.cr-dice{width:34px;height:34px;flex:none;border-radius:2px;border:1px solid var(--line-strong);color:var(--cinnabar);font-size:15px;background:var(--card)}
.cr-dice:hover{border-color:var(--gold)}
.cr-chips{display:flex;flex-wrap:wrap;gap:8px}
.cr-chip{border:1px solid var(--line-strong);border-radius:2px;padding:5px 14px;font-size:14px;background:var(--card)}
.cr-chip:hover{border-color:var(--gold)}
.cr-chip.on{border-color:var(--cinnabar);color:var(--cinnabar)}
.cr-tags{display:flex;flex-wrap:wrap;gap:6px}
.cr-attrs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.cr-attrs b{font-family:var(--sans);font-weight:600}
.cr-emp{margin-top:4px}
.cr-emp textarea{width:100%;min-height:96px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:14px;line-height:1.7;padding:8px 10px;outline:none;color:var(--ink);resize:vertical;font-family:inherit}
.cr-emp textarea:focus{border-color:var(--cinnabar)}
.cr-empbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.cr-presets{margin-bottom:8px}
.cr-presets-k{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.cr-presets .cr-chip{font-size:13px;padding:4px 12px}
.cr-varbtn{border:1px solid var(--line-strong);border-radius:2px;padding:3px 12px;font-size:12px;color:var(--cinnabar);background:var(--card)}
.cr-varbtn:hover{border-color:var(--gold)}
.cr-count{font-size:12px;color:var(--ink-soft);font-family:var(--sans)}
.create-foot{display:flex;gap:10px;padding-top:16px}

/* ---------- 叙事流 ---------- */
.stream{flex:1;padding:16px 14px 12px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
.turncard{background:var(--card);border:1px solid var(--line-gold);border-radius:2px;box-shadow:var(--shadow-flat);padding:16px 16px 14px;position:relative;overflow:hidden}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-focus{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.card-focus b{color:var(--indigo);font-weight:600}
.card-title{font-size:17px;line-height:1.4;margin-bottom:6px}
.card-body{font-size:15px;line-height:1.7;text-align:justify}
.card-body+.news,.card-body+.deltas{margin-top:12px}
.news{background:var(--delta-up);border-radius:2px;padding:10px 12px;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.news b{color:var(--cinnabar);font-weight:600;font-size:12px;letter-spacing:.2em;display:block;margin-bottom:2px}
.deltas{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.delta{display:flex;align-items:center;gap:8px;background:var(--delta-up);border-left:3px solid var(--cinnabar);border-radius:0 2px 2px 0;padding:6px 10px;font-size:13px;font-family:var(--sans)}
.delta.down{background:var(--delta-down);border-left-color:var(--indigo)}
.delta .dv{margin-left:auto;font-weight:600;color:var(--cinnabar)}
.delta.down .dv{color:var(--indigo)}
.todo{margin-top:10px;font-size:12px;color:var(--ink-soft);line-height:1.7}
.todo b{color:var(--gold);font-weight:600;letter-spacing:.15em;font-size:12px}
.archive{margin-bottom:2px}
.archive summary{font-size:13px;color:var(--ink-soft);letter-spacing:.1em;padding:8px 0;text-align:center;list-style:none}
.archive summary::-webkit-details-marker{display:none}

/* ---------- 朱砂印章 ---------- */
.seal{flex:none;width:42px;min-height:42px;background:var(--cinnabar);color:#fdfbf5;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.35;letter-spacing:.05em;transform:rotate(-2deg);box-shadow:var(--shadow-flat);padding:4px 2px;text-align:center}

/* ---------- 旬首安排 ---------- */
.focus-cap{font-size:13px;color:var(--gold);letter-spacing:.15em;margin:2px 0 8px}

/* ---------- 底部操作栏（设计来源：shengongci-bottom-nav） ---------- */
.tabbar{position:sticky;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line-strong);height:calc(66px + var(--sab));padding:0 0 var(--sab)}
/* 金细线：贴顶边内侧，呼应诗题金线 */
.tabbar::after{content:"";position:absolute;top:3px;left:0;right:0;height:1px;background:var(--line-gold);pointer-events:none}
/* 装裱式内框细线 */
.tabbar::before{content:"";position:absolute;left:7px;right:7px;top:6px;bottom:calc(5px + var(--sab));border:1px solid var(--line);pointer-events:none}
/* 四角金色角线，如装裱角 */
.nav-corners{position:absolute;left:7px;right:7px;top:6px;bottom:calc(5px + var(--sab));pointer-events:none;background-repeat:no-repeat;
  background-image:linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold)),linear-gradient(var(--line-gold),var(--line-gold));
  background-size:9px 1px,1px 9px,9px 1px,1px 9px,9px 1px,1px 9px,9px 1px,1px 9px;
  background-position:left top,left top,right top,right top,left bottom,left bottom,right bottom,right bottom}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink);opacity:.72;transition:color .25s,opacity .25s}
.tab svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tab-label{letter-spacing:.28em;padding-left:.28em;line-height:1}
.tab-dot{position:absolute;top:7px;right:calc(50% - 26px);width:7px;height:7px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 0 2px var(--card);font-size:0;color:transparent;overflow:hidden}
/* 入口之间的界行细线 */
.tab + .tab::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:32px;background:var(--line)}
/* 朱砂小印点：选中标记 */
.tab::after{content:"";width:4px;height:4px;background:var(--cinnabar);transform:rotate(45deg) scale(0);transition:transform .28s}
.tab.active{color:var(--cinnabar);opacity:1}
.tab.active::after{transform:rotate(45deg) scale(1)}
.tab:active{opacity:.6}

/* ---------- 查询面板（bottom sheet） ---------- */
.scrim{position:fixed;inset:0;z-index:68;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--grain),var(--paper);border:1px solid var(--line-strong);border-bottom:0;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,.35,1);padding-bottom:var(--sab)}
.sheet::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:12px;pointer-events:none;background:var(--corner-tr) right top/10px 10px no-repeat,var(--corner-tl) left top/10px 10px no-repeat}
.sheet.on{transform:translateY(0)}
/* 面板提手：菱花替胶囊 */
.sheet-handle{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);margin:12px auto 8px}
/* 界画式分隔：细墨线＋中点菱花 */
.sheet-head{position:relative;display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;border-bottom:1px solid var(--line-strong)}
.sheet-head::after{content:"";position:absolute;left:50%;bottom:-3.5px;width:6px;height:6px;transform:translateX(-50%) rotate(45deg);background:var(--paper);border:1px solid var(--gold)}
/* 签条式标题：名前一枚小朱砂方块 */
.sheet-title{display:flex;align-items:center;gap:9px;font-size:17px;letter-spacing:.1em}
.sheet-title::before{content:"";width:8px;height:8px;background:var(--cinnabar);flex:none}
.sheet-close{font-size:14px;color:var(--ink-soft);letter-spacing:.1em;min-height:44px;padding:0 4px}
.sheet-body{overflow-y:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
.sec{margin-top:16px}
/* 左栏子菜单＋右侧内容分栏（状态/行囊/宫务） */
.sheet-split{display:flex;gap:14px;align-items:flex-start}
.sheet-snav{flex:none;width:74px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;align-self:flex-start;padding:16px 0 8px}
.sheet-snav button{min-height:40px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);color:var(--ink-soft);font-size:14px;letter-spacing:.06em}
.sheet-snav button:hover{border-color:var(--gold)}
.sheet-snav button.on{border-color:var(--cinnabar);color:var(--cinnabar)}
.sheet-snav .snav-n{font-size:11px;opacity:.6;font-family:var(--sans)}
.sheet-snav button.on .snav-n{opacity:.9}
.sheet-spane{flex:1;min-width:0}
.sheet-split.steady .sheet-spane{height:clamp(320px,52dvh,560px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:2px}
.sheet-pane{display:none}
.sheet-pane.on{display:block}
.sec-cap{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.15em;color:var(--ink);margin-bottom:8px}
.sec-cap::before{content:"";width:3px;height:14px;background:var(--cinnabar);border-radius:1px}
.meter{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px}
.meter-nm{flex:none;width:64px}
.meter-track{flex:1;height:3px;background:var(--paper-deep);border-radius:2px;overflow:hidden}
.meter-fill{display:block;height:100%;border-radius:2px}
.meter-v{flex:none;width:34px;text-align:right;font-size:13px;color:var(--ink-soft)}
.meter.m-cinnabar .meter-fill{background:var(--cinnabar)}.meter.m-indigo .meter-fill{background:var(--indigo)}
.meter.m-gold .meter-fill{background:var(--gold)}.meter.m-ink .meter-fill{background:var(--ink-soft)}
.sklink{display:flex;align-items:center;gap:6px;width:100%;background:transparent;border:0;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.sklink .meter{flex:1;min-width:0}
.sklink .sk-go{flex:none;font-size:12px;color:var(--ink-soft);letter-spacing:.05em}
.sklink:active .sk-go{color:var(--cinnabar)}
.rel{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px}
.rel-nm{flex:1}
.relpill{flex:none;font-size:11px;padding:2px 8px;border-radius:2px;border:1px solid currentColor;letter-spacing:.12em}
.relpill.p-good{color:var(--gold)}.relpill.p-mid{color:var(--ink-soft)}.relpill.p-bad{color:var(--cinnabar)}
/* 宫谱分段：人物／派系 */
.segline{display:flex;gap:8px;margin:0 0 14px}
.segline .seg{flex:1;min-height:38px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:14px;letter-spacing:.14em;text-indent:.14em;color:var(--ink-soft)}
.segline .seg:hover{border-color:var(--gold)}
.segline .seg.on{border-color:var(--cinnabar);color:var(--cinnabar)}
/* 宫谱内容区：固定高度，展开／收起分组与切换人物／派系都不改面板高度，只在框内滚动 */
.gongpu-body{height:clamp(320px,52dvh,560px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:2px}
/* 藏书阁：按才艺折叠，一本书一行 */
.libgroup{border-bottom:1px dashed var(--line)}
.libgroup>summary{display:flex;align-items:center;gap:8px;min-height:44px;list-style:none;cursor:pointer;font-size:15px;letter-spacing:.04em}
.libgroup>summary::-webkit-details-marker{display:none}
.libgroup>summary::before{content:'▸';flex:none;width:14px;color:var(--ink-soft);font-size:12px}
.libgroup[open]>summary::before{content:'▾'}
.libgroup .piececard{margin-top:8px}
.lg-name{flex:none}
.lg-count{flex:none;font-size:12px;color:var(--ink-soft);font-family:var(--sans)}
.lg-meta{margin-left:auto;font-size:11px;color:var(--gold);letter-spacing:.04em}
.librow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0 8px;border-bottom:1px dashed var(--line);font-size:13px}
.librow:last-child{border-bottom:0}
.lr-name{flex:1 1 150px;min-width:0;font-size:14px}
.lr-state{flex:none;font-size:11px;color:var(--ink-soft)}
.lr-act{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.lr-desc{flex:1 1 100%;font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:-2px}
.minibtn{min-height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:12px;color:var(--ink-soft);letter-spacing:.03em;white-space:nowrap}
.minibtn:hover{border-color:var(--gold);color:var(--ink)}
.minibtn.on{border-color:var(--cinnabar);color:var(--cinnabar)}
.minibtn:disabled{background:var(--paper-deep);color:var(--ink-soft);border-color:var(--line-strong)}
.minibtn:active{transform:translateY(1px)}
.libstrip{margin-bottom:8px}
/* 派系一系一卡 */
.faccard{border:1px solid var(--line-strong);border-radius:2px;background:var(--card);box-shadow:var(--shadow-flat);padding:12px 14px;margin-bottom:10px}
.faccard.off{opacity:.62}
.fac-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
.fac-nm{font-size:16px;letter-spacing:.08em}
.fac-meta{font-size:12px;color:var(--ink-soft);line-height:1.75}
.fac-step{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;line-height:1.75}
.fac-step b{font-weight:400;color:var(--cinnabar)}
.rel-v{display:inline-block;flex:none;width:64px;text-align:right;font-size:13px;color:var(--ink-soft)}
.itemrow{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px;border-bottom:1px dashed var(--line)}
.itemrow:last-child{border-bottom:0}
.itemrow .cnt{margin-left:auto;font-size:13px;color:var(--ink-soft)}
button.itemrow{width:100%;background:none;border:0;border-bottom:1px dashed var(--line);padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.itemrow:last-child{border-bottom:0}
button.itemrow:active{opacity:.6}
button.itemrow .go{flex:none;margin-left:8px;font-size:11px;color:var(--gold);letter-spacing:.08em}
button.itemrow>span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.itemrow .cnt{flex:none;max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-note{margin-top:18px;font-size:12px;color:var(--ink-soft);line-height:1.7}
.destinycard{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line-strong);border-radius:2px;padding:10px 12px;margin:6px 0;font:inherit;color:inherit;line-height:1.75;cursor:pointer}
.destinycard:hover{border-color:var(--gold)}
.destinycard.sel{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px rgba(166,58,46,.45)}
.destinycard .dc-name{display:block;letter-spacing:.14em;font-size:15px}
.destinycard .dc-note{display:block;font-size:12px;color:var(--ink-soft);margin-top:4px;letter-spacing:0}
.destinycard .dc-tag{font-size:11px;color:var(--cinnabar);letter-spacing:.08em;margin-left:6px}
.rowline{display:flex;align-items:center;gap:10px;min-height:42px;font-size:14px}
.rowline .rk{flex:none;width:64px;color:var(--ink-soft);font-size:14px}
.rowline .rv{flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:2px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.1em;margin:2px 4px 2px 0}
.tag.t-rumor{border-color:var(--ink-soft);color:var(--ink-soft);border-style:dashed}
.itag{flex:none;font-size:10px;line-height:1.7;padding:0 6px;border-radius:2px;border:1px solid var(--line);color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap}
.itag.on{border-color:var(--gold);color:var(--gold)}

/* 层级约定：底栏/热区 < 对话/地图 30 < 全局设置 67 < 遮罩 68 < 面板 70 < 弹窗 80 < toast 90 */
/* 设置/存档 */
.restmodal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(30,24,18,.45);padding:32px}
.restmodal.on{display:flex}
.rm-card{position:relative;background:var(--grain),var(--card);border:1px solid var(--line-strong);border-radius:2px;box-shadow:var(--shadow-flat);padding:20px;max-width:330px;width:100%;max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);display:flex;flex-direction:column}
/* 强调弹层：四角拐子纹角花（描金） */
.rm-card::before{content:"";position:absolute;inset:4px;pointer-events:none;background:var(--corner-tl) left top/10px 10px no-repeat,var(--corner-tr) right top/10px 10px no-repeat,var(--corner-bl) left bottom/10px 10px no-repeat,var(--corner-br) right bottom/10px 10px no-repeat}
/* 签条式标题：名前一枚小朱砂方块 */
.rm-title{font-size:16px;letter-spacing:.15em;text-align:center;flex:none}
.rm-title::before{content:"";display:inline-block;width:8px;height:8px;background:var(--cinnabar);margin-right:8px;vertical-align:1px}
.rm-body{font-size:13px;line-height:1.8;color:var(--ink-soft);margin:12px 0 18px;min-height:0;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.rm-body::-webkit-scrollbar{width:6px}
.rm-body::-webkit-scrollbar-track{background:transparent}
.rm-body::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.xunsum{margin:2px 0 10px}
.xunsum .xs-cap{font-size:12px;letter-spacing:.15em;color:var(--gold);margin:12px 0 4px}
.xunsum .xs-row{font-size:13px;line-height:1.85;color:var(--ink);word-break:break-word}
.xunsum .xs-none{font-size:13px;line-height:1.85;color:var(--ink-soft)}
.act-note{font-size:11px;color:var(--ink-soft);line-height:1.7;margin-top:12px;padding-top:8px;border-top:1px dashed var(--line)}
.rm-ops{display:flex;gap:10px;flex:none}
.rm-ops .btn{flex:1;min-height:44px;font-size:14px}
.setnav{display:flex;gap:8px;margin:2px 0 14px}
.setnav button{flex:1;min-height:40px;border-radius:2px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-size:14px;letter-spacing:.08em}
.setnav button:hover{border-color:var(--gold)}
.setnav button.on{border-color:var(--cinnabar);color:var(--cinnabar)}
.setrow{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px dashed var(--line);font-size:14px}
.setrow .sk{flex:none;width:88px;color:var(--ink-soft);font-size:14px}
.setrow input,.setrow select{flex:1;min-height:40px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);padding:0 10px;font-size:15px;outline:none}
.setrow input:focus{border-color:var(--gold)}
.setbtns{display:flex;gap:10px;margin-top:16px}
.setbtns .btn{min-height:46px;font-size:15px;letter-spacing:.1em;text-indent:.1em}
.slot{background:var(--card);border:1px solid var(--line-strong);border-radius:2px;box-shadow:var(--shadow-flat);padding:10px 12px;margin-bottom:10px}
.slot .sl-head{display:flex;align-items:baseline;gap:8px;font-size:15px}
.slot .sl-time{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.slot .sl-log{font-size:13px;color:var(--ink-soft);margin:4px 0 8px;line-height:1.6}
.slot .sl-note{margin-bottom:8px}
.slot .sl-note input{width:100%;min-height:34px;border:1px dashed var(--line);border-radius:2px;background:transparent;padding:0 9px;font-size:13px;outline:none;color:var(--ink)}
.slot .sl-note input:focus{border-style:solid;border-color:var(--gold)}
.slot .sl-ops{display:flex;gap:8px}
.slot .sl-ops button{flex:1;min-height:38px;border-radius:2px;border:1px solid var(--line-strong);font-size:13px;color:var(--indigo)}
.slot .sl-ops button:hover{border-color:var(--gold)}
.slot .sl-ops button.danger{color:var(--cinnabar)}
.slot .sl-ops button[disabled]{background:var(--paper-deep);color:var(--ink-soft)}
.slot.empty .sl-log{color:var(--ink-soft);font-style:italic}

/* NPC */
.npcrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border-bottom:1px dashed var(--line);font-size:15px;padding:6px 0}
.npcrow .nr-name{flex:none;min-width:88px}
.npcrow .nr-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden}
.npcrow .nr-main .nr-name{flex:none;min-width:0;letter-spacing:.02em}
.npcrow .nr-role{flex:0 1 auto;min-width:0;font-size:11px;color:var(--ink-soft);opacity:.7;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(-1px)}
.npcrow .nr-depth{flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:1px 8px;letter-spacing:.1em}
.npcrow .nr-rel{margin-left:auto;flex:none;display:flex;align-items:center;gap:6px;padding-right:2px;font-size:12px;color:var(--ink-soft)}
/* 承宠选项：两行，长说明不挤成小字签 */
.nightopt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:9px 2px;border-bottom:1px dashed var(--line);color:var(--ink)}
.nightopt:last-of-type{border-bottom:0}
.nightopt .no-main{font-size:15px;letter-spacing:.06em}
.nightopt .no-sub{font-size:12px;color:var(--ink-soft);line-height:1.65}
.nightopt.on .no-main{color:var(--cinnabar)}
.nightopt.on .no-sub{color:var(--cinnabar);opacity:.8}
.nightopt:disabled{opacity:.45}
.nr-av{width:34px;height:34px;font-size:14px}
.nd-head{display:flex;align-items:center;gap:14px;margin:2px 0 12px}
.nd-av{width:64px;height:64px;border-radius:50%;font-size:26px}
.nd-head .nd-nm{font-size:19px;letter-spacing:.1em;line-height:1.3}
.nd-head .nd-rk{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.06em}
.tl{border-left:2px solid var(--line);margin-left:5px;padding-left:14px}
.tl-item{position:relative;padding-bottom:12px;font-size:14px;line-height:1.7}
.tl-item::before{content:"";position:absolute;left:-20px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tl-item .tl-time{font-size:12px;color:var(--ink-soft)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;color:var(--indigo);margin-top:4px}


/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);z-index:90;background:var(--ink);color:var(--paper);font-size:13px;padding:8px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:all .25s;max-width:80vw;text-align:center;font-family:var(--sans)}
.toast.on{opacity:.92;transform:translateX(-50%) translateY(0)}

/* 全局设置入口：压在加载/弹窗之上，对话与铺排中也能打开 */
.global-set{position:fixed;right:0;top:calc(var(--gbar-h) + 2px);z-index:67;display:none;flex-direction:column;align-items:center;justify-content:center;width:30px;padding:8px 0;border:1px solid rgba(245,239,227,.26);border-right:0;border-radius:2px 0 0 2px;background:rgba(45,40,33,.7);color:#f5efe3;font-family:var(--serif);font-size:12px;line-height:1.35;letter-spacing:.08em;backdrop-filter:blur(3px);box-shadow:-1px 1px 0 rgba(0,0,0,.18)}
.global-set.on{display:flex}
.global-set:active{background:var(--cinnabar)}

/* ============================================================
   THEME v2 增量 —— 依据：design/v2-深宫辞主界面（Kimi Design 定稿）
   整屏住处（无滚动）：顶栏/热区/精力条/tabbar 全部锁在视口内
   ============================================================ */
#screen-main{position:fixed;inset:0;overflow:hidden;background:#d8cdb8}
/* 房间图占满全屏，锚定底部（顶部可裁），热区按同一裁剪框换算坐标 */
.homebg{position:absolute;inset:0;z-index:0;background:url(assets/rooms/suju.jpg) center bottom/cover no-repeat #d8cdb8}
.homebg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,18,.10),rgba(30,25,18,0) 18%,rgba(30,25,18,0) 72%,rgba(30,25,18,.22))}
/* 顶栏：时间盒 + 位份/银两/积分 */
/* 常驻顶栏：所在、位份、精力、银两、积分（住处／宫城图／场景页／对话共用） */
#globalbar{position:fixed;top:0;left:0;right:0;z-index:66;display:none;align-items:center;gap:8px;background:var(--indigo);color:#f5efe3;padding:calc(var(--sat) + 8px) 12px 8px;box-shadow:0 1px 0 rgba(30,25,18,.3)}
#globalbar.on{display:flex}
.gb-time{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid rgba(245,239,227,.5);border-radius:2px;padding:3px 7px;color:#f5efe3;font-size:10.5px;letter-spacing:.04em;line-height:1.25;max-width:88px}
.gb-time span{white-space:nowrap}
.gb-stats{flex:1;display:flex;align-items:stretch;gap:2px;min-width:0}
.tstat{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;min-width:0}
button.tstat{border:0;background:transparent;padding:0;margin:0;text-align:center;font-size:inherit;font-family:inherit;color:inherit;cursor:pointer;appearance:none;-webkit-appearance:none}
#globalbar .tstat{flex:1 1 0}
#globalbar .tstat label{font-size:9.5px;letter-spacing:.08em;color:rgba(245,239,227,.72);white-space:nowrap}
#globalbar .tstat b{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
#globalbar .tstat.rank b{font-size:11.5px;letter-spacing:.04em;color:rgba(245,239,227,.92)}
/* 热区 */
.hotspots{position:absolute;inset:0;z-index:4}
.hotspots.sleeping{pointer-events:none}
/* 歇下一旬：屋内渐黑/渐暗遮罩 */
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:6}
#dim.on{opacity:.88}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
.hs.hs-up{flex-direction:column-reverse} /* 文字在锚点上方：用于贴近底缘的物件（坐墩） */
/* 朱砂双环锚点：中环点蕊、双环相扣（设计来源：古风热区标签方案.html） */
.hs>i{position:relative;flex:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,var(--cinnabar) 0 2.5px,rgba(247,240,221,.85) 3px 4px,transparent 4.5px);border:1.5px solid var(--cinnabar);box-shadow:0 0 0 2.5px rgba(247,240,221,.5),0 0 0 4px var(--cinnabar),0 1px 4px rgba(40,30,20,.35)}
/* 引线：锚点与签之间的装裱细线 */
.hs>i::after{content:'';position:absolute;left:50%;top:100%;width:1px;height:7px;transform:translateX(-.5px);background:linear-gradient(180deg,var(--cinnabar),rgba(198,164,102,.9));opacity:.85}
.hs.hs-up>i::after{top:auto;bottom:100%;background:linear-gradient(0deg,var(--cinnabar),rgba(198,164,102,.9))}
@media (prefers-reduced-motion:no-preference){
  .hs>i{animation:hsBreathe 3.2s ease-in-out infinite}
  @keyframes hsBreathe{0%,100%{box-shadow:0 0 0 2.5px rgba(247,240,221,.5),0 0 0 4px var(--cinnabar),0 1px 4px rgba(40,30,20,.35)}50%{box-shadow:0 0 0 3.5px rgba(247,240,221,.35),0 0 0 5px rgba(166,58,46,.65),0 1px 4px rgba(40,30,20,.35)}}
}
/* 绢签标签（按钮本体）：绢底＋外墨线＋金细线内框＋金角线 */
.hs>span:not(.hs-badge){position:relative;display:inline-flex;align-items:center;min-height:36px;padding:8px 16px 9px;border:1px solid rgba(43,38,32,.55);border-radius:2px;background:var(--grain),linear-gradient(165deg,rgba(246,237,216,.96),rgba(233,220,189,.94));-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);font-size:14px;font-weight:600;letter-spacing:.18em;text-indent:.18em;line-height:1;color:#33302A;white-space:nowrap;text-shadow:0 1px 0 rgba(250,246,234,.6);box-shadow:0 1px 2px rgba(46,36,24,.2),0 6px 18px rgba(46,36,24,.24)}
.hs>span:not(.hs-badge)::before{content:"";position:absolute;inset:3px;pointer-events:none;border:1px solid var(--line-gold);border-radius:1px;background:linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 0/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 0/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 0/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 0/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 100%/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 100%/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 100%/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 100%/1.5px 9px;background-repeat:no-repeat}
.hs>span:not(.hs-badge)::after{content:"";position:absolute;inset:-6px} /* 隐形点按外扩：视觉纤秀，触达不缩水 */
.hs:active>span:not(.hs-badge){transform:translateY(1px);background:var(--grain),linear-gradient(165deg,rgba(232,219,187,.96),rgba(221,206,172,.95));box-shadow:inset 0 1px 5px rgba(56,44,30,.32),0 1px 2px rgba(46,36,24,.18)}
.hs:active>span:not(.hs-badge)::before{border-color:rgba(166,58,46,.6)}
/* 朱边小徽标（角标提示）：纸底朱边，如一方小印 */
.hs-badge{margin-top:1px;display:inline-flex;align-items:center;justify-content:center;min-height:22px;padding:0 9px;background:#fdfbf5;border:1.5px solid #b0442f;border-radius:999px;color:#b0442f;font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap;box-shadow:0 1px 3px rgba(46,36,24,.3)}
/* 份例红点：朱砂小点，坐在绢签右上角 */
.hs>span .hs-dot{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 0 2px rgba(247,240,221,.92)}
@media (prefers-reduced-motion:no-preference){.hs>span .hs-dot{animation:hsDotPulse 1.7s ease-in-out infinite}@keyframes hsDotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.74);opacity:.62}}}
#screen-main .tabbar{position:absolute;top:auto;left:0;right:0;bottom:0}
/* 底部胶囊按钮（弹窗/旬末用） */
/* 才艺修习面板（v2 圆角卡片网格） */
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.skillcell{min-height:60px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);box-shadow:var(--shadow-flat);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.skillcell:hover{border-color:var(--gold)}
.skillcell .slv{font-size:12px;color:var(--ink-soft);font-family:var(--sans)}
.skillcell.sel{border-color:var(--cinnabar);color:var(--cinnabar)}
.skillcell.sel .slv{color:var(--cinnabar)}
.skillcell.lock{opacity:.42}
/* 装潢：住处背景 */
.decorgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin:2px 0 12px}
.decorcard{position:relative;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);box-shadow:var(--shadow-flat);padding:6px 6px 8px;text-align:left;overflow:hidden}
.decorcard:hover{border-color:var(--gold)}
.decorcard .dc-thumb{display:block;width:100%;aspect-ratio:3/4;border-radius:2px;background:center 35%/cover no-repeat var(--paper-deep)}
.decorcard .dc-name{display:block;margin-top:7px;font-size:15px;letter-spacing:.12em}
.decorcard .dc-state{display:block;margin-top:1px;font-size:11px;color:var(--ink-soft);font-family:var(--sans);letter-spacing:.04em}
.decorcard.on{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px var(--cinnabar),var(--shadow-flat)}
.decorcard.on .dc-state{color:var(--cinnabar)}
.decorcard.lock .dc-thumb{opacity:.72}
/* 传膳菜单 */
.mealhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px;color:var(--ink-soft)}
.mealhead span:first-child{color:var(--gold);letter-spacing:.1em}
.mealrow{display:flex;align-items:center;gap:8px;width:100%;min-height:58px;padding:8px 12px;margin-bottom:8px;text-align:left;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);box-shadow:var(--shadow-flat)}
.mealrow:hover{border-color:var(--gold)}
.mealrow .m-name{font-size:15px;flex:none}
.mealrow .m-tag{flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:1px 8px;letter-spacing:.06em}
.mealrow .m-meta{margin-left:auto;text-align:right;font-size:12px;line-height:1.6;color:var(--ink-soft);flex:none}
.mealrow .m-meta b{font-size:14px;font-weight:400;color:var(--cinnabar)}
.mealrow:disabled{background:var(--paper-deep);box-shadow:none}
/* 手作 */
.craftgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.craftmat{position:relative;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);box-shadow:var(--shadow-flat);padding:9px 10px;font-size:14px;text-align:left}
.craftmat:hover{border-color:var(--gold)}
.craftmat.sel{border-color:var(--cinnabar);box-shadow:inset 0 0 0 1px rgba(166,58,46,.45)}
.craftmat .cm-name{font-size:14px;letter-spacing:.02em;line-height:1.4}
.craftmat .cm-kind{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:2px;padding:0 5px;margin-left:4px;vertical-align:1px;letter-spacing:.04em}
.craftmat .cm-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
.craftmat .cm-ops{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:5px}
.craftmat .cm-ops button{width:26px;height:26px;border-radius:2px;border:1px solid var(--line-strong);background:var(--paper);font-size:15px;line-height:1;color:var(--ink);display:flex;align-items:center;justify-content:center}
.craftmat .cm-ops button:hover{border-color:var(--gold)}
.craftmat .cm-ops button:disabled{opacity:.28}
.craftmat .cm-ops b{min-width:18px;text-align:center;font-weight:400;font-size:13px;color:var(--cinnabar)}
.craftchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.craftchip{min-width:50px;min-height:38px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);font-size:13px;color:var(--ink-soft);padding:0 12px}
.craftchip:hover{border-color:var(--gold)}
.craftchip.on{border-color:var(--cinnabar);color:var(--cinnabar)}
.craftchip:disabled{opacity:.32}
.craftinsp{width:100%;min-height:82px;border:1px solid var(--line-strong);border-radius:2px;background:var(--card);padding:10px 12px;font-size:14px;line-height:1.7;color:var(--ink);resize:vertical;outline:none;font-family:var(--serif)}
.craftinsp:focus{border-color:var(--gold)}
.craftcount{text-align:right;font-size:11px;color:var(--ink-soft);margin-top:3px}
.craftsum{background:var(--card);border:1px solid var(--line-strong);border-radius:2px;padding:10px 12px;font-size:12px;line-height:1.7;color:var(--ink-soft)}
.craftsum b{font-weight:400;color:var(--ink)}
.craftresult .cr-name{font-size:20px;letter-spacing:.08em;line-height:1.4}
.craftresult .cr-tags{margin:8px 0 10px}
.craftresult .cr-desc{font-size:14px;line-height:1.8;color:var(--ink);margin-bottom:8px}
.craftresult .cr-effect{font-size:13px;line-height:1.8;color:var(--ink-soft);border-left:2px solid var(--gold);padding-left:10px;margin-bottom:10px}
.qbadge{display:inline-block;font-size:11px;border:1px solid currentColor;border-radius:2px;padding:1px 8px;letter-spacing:.08em;vertical-align:2px}
.q-rough{color:var(--ink-soft)}
.q-normal{color:var(--indigo)}
.q-fine{color:var(--gold)}
.q-rare{color:var(--cinnabar)}
.q-epic{color:#7a4b9e}
/* v2 弹窗：直角墨线框＋拐子纹角花＋贴地浅影；遮罩 #241F18 65% */
.restmodal{background:rgba(36,31,24,.65)} /* 降低遮罩透明度，保留下层场景 */
.rm-ops .btn{letter-spacing:.1em}
/* 生成中动画省略号 */
.busy-dots i{display:inline-block;animation:bdot 1.2s infinite}
.busy-dots i:nth-child(2){animation-delay:.2s}
.busy-dots i:nth-child(3){animation-delay:.4s}
@keyframes bdot{0%,60%,100%{opacity:.15}30%{opacity:1}}
/* 铺排弹窗：随机诗句与出处 */
.busy-poem{font-size:15px;line-height:1.95;color:var(--ink);letter-spacing:.06em;animation:poemIn .45s ease both}
.busy-poem-src{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--ink-soft);letter-spacing:.04em;font-family:var(--sans);animation:poemIn .55s ease both}
@keyframes poemIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* 剧情对话：全屏聊天气泡界面 */
.chatview{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:var(--paper);padding-top:var(--gbar-h)}
.chatview.on{display:flex}
/* 场景底图：淡在纸下，只作氛围；没有对应场景图时保持留白 */
.chat-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
.chat-bg::before{content:'';position:absolute;inset:0;background-image:var(--bg);background-position:center bottom;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity .4s}
.chat-bg.on::before{opacity:.26}
.chat-head,.chat-body,.chat-opts{position:relative;z-index:1}
.chat-head{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;background:rgba(47,72,88,.88);color:#f5efe3}
.chat-head button{color:#f5efe3;font-size:13px;min-height:30px;padding:0 4px;white-space:nowrap}
.chat-head .ch-ava{display:flex;flex:none}
.chat-head .ch-ava .av{width:24px;height:24px;border-color:rgba(245,239,227,.4)}
.chat-head .ch-title{flex:1;font-size:13px;letter-spacing:.1em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 10px;display:flex;flex-direction:column;gap:14px}
@keyframes bin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg{display:flex;gap:9px;max-width:88%;align-self:flex-start;align-items:flex-start;animation:bin .22s}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg .mwho{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;padding:0 3px;line-height:1}
.msg.me .mwho{text-align:right}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);box-shadow:var(--shadow-flat);background:var(--card)}
.av.av-fb{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--cinnabar);border-color:rgba(166,58,46,.45);letter-spacing:0}
.av.sm{width:30px;height:30px;font-size:13px}
.bubble{max-width:100%;padding:10px 14px;border-radius:2px;font-size:15px;line-height:1.7;box-shadow:var(--shadow-flat);white-space:pre-wrap;word-break:break-word}
.bubble.npc{background:var(--card);border:1px solid var(--line-strong)}
.bubble .b-act{color:var(--ink-soft);font-size:.94em}
.bubble.me .b-act{color:#f5d9c8} /* 深红底上的动作段：浅暖色，灰色 ink-soft 在朱红底上对比不够 */
.bubble.me{background:var(--cinnabar);color:#fdfbf5}
.bubble.narr{align-self:center;width:94%;max-width:100%;background:var(--paper-deep);border:1px dashed var(--line);border-radius:2px;box-shadow:none;color:var(--ink-soft);font-size:14px;text-align:justify}
.bubble.narr::before{content:'旁 白';display:block;text-align:center;color:var(--gold);font-size:10px;letter-spacing:.6em;text-indent:.6em;margin-bottom:5px;opacity:.85}
.msg.quote{align-self:center;width:88%}
.bubble.quote{width:100%;background:var(--paper-deep);border:1px solid var(--line-strong);border-left:3px solid var(--gold);border-radius:2px;box-shadow:none;color:var(--ink-soft);font-size:14px;padding:9px 14px}
.bubble.quote .qtag{font-size:10px;letter-spacing:.3em;color:var(--gold);margin-bottom:4px}
.bubble.quote .qtext{text-align:justify}
.bubble.quote .qtext::before{content:'「'}
.bubble.quote .qtext::after{content:'」'}
.bubble.sys{align-self:center;background:transparent;box-shadow:none;color:var(--ink-soft);font-size:12px;padding:2px 8px;text-align:center}
.msg.typing .bubble{color:var(--ink-soft);font-size:13px;min-width:64px;text-align:center}
.chat-opts{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 14px calc(10px + var(--sab));border-top:1px solid var(--line-strong);background:var(--card)}
.chat-opts .cap{font-size:12px;color:var(--gold);letter-spacing:.15em}
.chat-opt{text-align:left;background:var(--paper);border:1px solid var(--line-strong);border-radius:2px;min-height:44px;padding:8px 14px;font-size:15px;line-height:1.5}
.chat-opt:hover{border-color:var(--gold)}
.chat-opt:active{border-color:var(--cinnabar);color:var(--cinnabar)}
.chat-opt .chk{font-family:var(--sans);font-size:11px;letter-spacing:.04em;color:var(--ink-soft);opacity:.85}
.chat-opt .chk::before{content:"· "}
.chat-warn{font-family:var(--sans);font-size:11px;line-height:1.5;color:var(--cinnabar);background:rgba(166,58,46,.06);border:1px solid rgba(166,58,46,.25);border-radius:2px;padding:5px 10px}
.chat-act{display:flex;gap:8px}
.chat-act input{flex:1;min-height:44px;border:1px solid var(--line-strong);border-radius:2px;background:var(--paper);padding:0 16px;font-size:15px;outline:none}
.chat-act input:focus{border-color:var(--gold)}
.chat-act .go{flex:none;min-width:64px;min-height:44px;border-radius:2px;border:1px solid var(--indigo);background:var(--indigo);color:#f5efe3;font-size:14px;letter-spacing:.1em}
.chat-act .go:active{transform:translateY(1px)}
.chat-act .go:disabled{background:var(--paper-deep);color:var(--ink-soft);border-color:var(--line-strong)}
.chat-tools{display:flex;gap:10px}
.chat-tool{flex:1;min-height:44px;border-radius:2px;border:1px solid var(--line-strong);background:var(--paper);font-size:14px;letter-spacing:.14em;text-indent:.14em;color:var(--ink-soft)}

.chat-tool.gift{border-color:var(--line-gold);color:var(--gold)}
.chat-tool:active{border-color:var(--cinnabar);color:var(--cinnabar)}
.chat-inter{display:none;grid-template-columns:1fr 1fr;gap:8px}
.chat-inter.on{display:grid}
.chat-inter .chat-tool{min-height:40px;background:var(--card);letter-spacing:.1em;text-indent:.1em}
/* 对话中也留住底部页签：随时翻看状态、行囊、才艺 */
.chatview .chat-opts{padding-bottom:10px}
.chat-tabbar{position:relative;flex:none;z-index:2;height:calc(58px + var(--sab))}
.chat-tabbar .tab svg{width:21px;height:21px}
.chat-tabbar .tab{font-size:11px}
/* 曲目／舞段／医案：不入行囊的成品 */
.piececard{border:1px solid var(--line-strong);border-radius:2px;background:var(--paper);padding:10px 12px;margin-bottom:8px}

.piece-top .pc-name{flex:1;letter-spacing:.06em}
.pc-meta{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.65}
.pc-btns{display:flex;gap:8px;margin-top:8px}
.pc-btns .btn{flex:1;min-height:38px;font-size:13px;padding:0 8px}
/* 宫城图：全屏目的地选择 */
.mapview{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--paper);padding-top:var(--gbar-h)}
.mapview.on{display:flex}
.map-head{flex:none;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;background:rgba(47,72,88,.88);color:#f5efe3}
.map-head button{color:#f5efe3;font-size:13px;min-height:30px;padding:0 4px;white-space:nowrap}
.map-head span{flex:1;font-size:14px;letter-spacing:.16em;text-align:center}
.map-bg{flex:1;position:relative;background:url(assets/ui/map.jpg) center/cover no-repeat #d8cdb8}
/* 场景页：进了门先看景，再择行事；底图按 PLACES 换，缺图时退到御花园 */
.placeview{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:#221d16;padding-top:var(--gbar-h)}
.placeview.on{display:flex}
.place-bg{position:absolute;inset:0;background-position:center bottom;background-size:cover;background-repeat:no-repeat;background-color:#d8cdb8}
.place-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,21,15,.38),rgba(26,21,15,.03) 26%,rgba(26,21,15,.05) 52%,rgba(26,21,15,.66) 100%)}
.place-head{position:relative;z-index:2;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;height:38px;padding:0 12px;background:rgba(47,72,88,.88);color:#f5efe3}
.place-head button{justify-self:start;color:#f5efe3;font-size:13px;min-height:30px;padding:0 4px;white-space:nowrap}
.place-head span{font-size:14px;letter-spacing:.16em;text-align:center;white-space:nowrap}
.place-panel{position:relative;z-index:2;margin-top:auto;padding:0 16px calc(20px + var(--sab));display:flex;flex-direction:column;align-items:flex-start}
.place-acts{display:flex;flex-direction:column;gap:8px;width:clamp(160px,52vw,210px)}
.place-act{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:44px;padding:8px 15px 9px;border:1px solid rgba(43,38,32,.55);border-radius:2px;background:var(--grain),linear-gradient(165deg,rgba(246,237,216,.96),rgba(233,220,189,.94));-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);font-size:14px;font-weight:600;letter-spacing:.18em;text-indent:.18em;line-height:1;color:#33302A;text-align:left;text-shadow:0 1px 0 rgba(250,246,234,.6);box-shadow:0 1px 2px rgba(46,36,24,.2),0 6px 18px rgba(46,36,24,.24)}
.place-act::before{content:"";position:absolute;inset:3px;pointer-events:none;border:1px solid var(--line-gold);border-radius:1px;background:linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 0/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 0/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 0/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 0/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 100%/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 0 100%/1.5px 9px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 100%/9px 1.5px,linear-gradient(rgba(198,164,102,.9),rgba(198,164,102,.9)) 100% 100%/1.5px 9px;background-repeat:no-repeat}
.place-act:active{transform:translateY(1px);background:var(--grain),linear-gradient(165deg,rgba(232,219,187,.96),rgba(221,206,172,.95));box-shadow:inset 0 1px 5px rgba(56,44,30,.32),0 1px 2px rgba(46,36,24,.18)}
.place-act:active::before{border-color:rgba(166,58,46,.6)}
.place-act:disabled{opacity:.45}
.place-act .pa-cost{position:relative;flex:none;font-family:var(--sans);font-size:11px;font-weight:400;letter-spacing:0;text-indent:0;color:rgba(51,48,42,.62)}
</style>

<body>

<!-- ① 开局页：主菜单（继续 / 开新档 / 设置） -->
<!-- 禁止在开局页底部添加版本号、build、字体、素材、署名等任何说明小字（用户要求，永久生效） -->
<section id="screen-start" class="screen active">

let _lastBusyPoem=-1;
function pickBusyPoem(){
  const n=BUSY_POEMS.length;
  if(!n)return null;
  let i=Math.floor(Math.random()*n);
  if(n>1&&i===_lastBusyPoem)i=(i+1)%n;
  _lastBusyPoem=i;
  return BUSY_POEMS[i];
}
function busyPoemHtml(){
  const p=pickBusyPoem();
  if(!p)return '';
  return `<div class="busy-poem">「${esc(p[0])}」</div><div class="busy-poem-src">—— ${esc(p[3])}·${esc(p[1])}《${esc(p[2])}》</div>`;
}

const WORLD_BOOK = "# 《带着系统去宫斗》世界书\n\n## 1. 文档信息\n\n- 游戏名称：带着系统去宫斗\n- 世界书版本：v2.3（三途版）\n- 游戏类型：古代后宫宫斗模拟 · 旬回合制 · 系统流 · 日常养成\n- 一句话简介：扮演带着“宫斗系统”入宫的低位妃嫔，在架空类唐盛世的后宫里修习才艺、经营人际、养育子嗣，也在阴谋与琐碎日常之间争宠、结盟、晋升。\n- 核心体验：两旬日程、低位逆袭、宫斗与日常交织、数值养成、抉择与后果。\n- 文档用途：保存固定设定与长期规则，不作为动态存档。\n\n## 2. 核心体验与玩家身份\n\n- 玩家扮演15—18岁通过选秀入宫的妃嫔，初始位份正七品至从九品，开局获得仅自己可见的“宫斗系统”。\n- 核心目标为开放成长：修习才艺、晋升位份、经营关系、养育子嗣、积累资源、应对宫斗与经营家族。主线不由模型随机发布：入宫第一夜在梦中选定一条「命途」（白首同心·一心之途／长乐岁安·岁岁之途／翻手为云·执柄之途），五阶推进，每阶有固定门槛与必须演出的关目，不设期限。命途终局条件达成后，是否收束进入结局由玩家决定，不自动结束。\n- 每月分上旬、下旬两旬，每旬为一个回合。玩家以精力值安排本旬行事，主持人据此生成日常、社交或主线事件，再结算实际结果。\n- 养成与宫斗同等重要。无事件的修习、散步和陪伴也有意义，不必每旬都出事；但剧情一旦触发，必须有对手、有得失，不许空转。主线任务通过日常场景和既有关系自然推进，不另开一条脱离生活的“任务通道”。\n- 所有事件抉择由玩家作出。突发事件触发后先给出应对选项并等待，不替玩家应对；不自动跨旬、不自动进结局。\n- 终局：主控死亡（病逝、被害、自裁、寿终正寝）即终局，须先呈现局面并结算后果。玩家也可随时宣告收束进入结局篇。游戏结束时主动询问是否查看番外或人物小传，番外须写出人物性格数据并细化后续故事。\n\n## 3. 世界观与固定事实\n\n- 时代背景：架空古代，参照唐朝盛世的礼制、服饰、宫殿与物产。国号、年号、经济、军事、文化状况在开局随机生成，彼此不得矛盾；一经生成即固定，不再变动。\n- 位份制度（共18级，升序排列，括号为编制）：\n  - 从九品：官女子（不限，须晋升方为正式妃嫔）\n  - 正九品：采女｜从八品：更衣｜正八品：选侍\n  - 从七品：答应｜正七品：常在｜从六品：宝林｜正六品：美人\n  - 从五品：才人｜正五品：贵人（以上不限人数）\n  - 从四品：嫔（6人）｜正四品：贵嫔（6人）\n  - 从三品：昭仪、昭容、昭媛、修仪、修容、修媛、充仪、充容、充媛（九嫔各1人）\n  - 正三品：妃（6人）\n  - 从二品：贤妃、良妃、淑妃、德妃（四妃各1人）\n  - 正二品：贵妃（2人）｜从一品：皇贵妃（1人，协理六宫）｜正一品：皇后（1人，统摄六宫）\n- 晋升依据：宠爱、子嗣、家族功劳，也可由才艺、威望、宫廷资历与重大功绩辅助；降级依据：失宠、犯错、母族株连。才艺不能替代礼制、宠爱或晋升所需的其他条件。\n- 晋位：门槛与进度由前端算，模型不得擅自升位。六样「晋位之资」——宠爱、威望、忌惮、子嗣、功绩（查清旧案、救驾、家族立功、诞育皇嗣等）、在本阶的资历（旬数）——每阶须凑够指定项数（见每旬【晋位】块）。晋位一年只有四个窗口（三、六、九、腊月下旬），资足而未到窗口只可造势（递话、备礼、托人说项、摸清谁掌名单），不得写 protagonist.rank；帝意偶动（宠爱高、知心不浅，或立了大功）时偶开一道破格口子，两旬内可越窗口。未经核准的升位会被前端驳回。\n- 晋位节奏：资足之后不得拖成数十旬的悬案。晋位必须上台面——风闻、廷议、拟名单、册文，或一次被人使坏的「再议」都是进展；阻力须落成一件可应对的事（谁压了名单、卡在哪道手续、下一步找谁），不许只用一句「再议」「时机未到」悬空。每隔数旬，晋位至少要有一次实际进展，或一个明确的、可指认的阻力。晋位一旦露头，敌视者必有动作（卡名单、放话、抢差事），这本身是本作的主戏之一。\n- 宫廷生态：前朝与后宫互相影响，妃嫔受宠可使家族受益，也可能引来朝臣弹劾；但不展开战争、政斗、商战剧情，故事核心始终是后宫生活与宫斗。\n- 唯一的超现实存在是宫斗系统。系统只对主控可见可闻，表现为面板、提示音与商城界面；游戏全程只有主控拥有系统，任何人不知道它的存在。除此之外禁止一切超现实元素。\n- 人物交互遵循古代社会语境，禁用现代科技、理论与术语；自然现象只可用阴阳五行等传统框架解释。玩家用现代概念提问时，以世界观内的理解范式回应。\n- 人物取名避免重名，须符合朝代风气与人物出身。\n\n## 4. 初始人物档案\n\n开局按下列规则随机生成。凡向玩家展示过的档案即为确认事实，写入存档后不再改动，玩家校准除外。\n\n### 主角（主控）\n\n- 姓名、容貌描述随机生成，贴合出身。\n- 年龄15—18岁；位份正七品常在至从九品官女子，按家世定档，家世高者通常偏高。\n- 出身剧本随机其一：家道中落的嫡女／被继母迫害的嫡女／想为生母一搏的庶女／被嫡母迫害的庶女／家庭幸福、野心勃勃想上位的嫡女／父母双亡、寄居亲戚家被侵吞财产的孤女／被未婚夫退婚的女子。\n- 家世：平民／商贾／小吏／官员／勋贵／宗室六档随机，注明父亲具体职位与嫡庶，影响初始位份和宫外支持。\n- 性格随机2—3项，只取固定性情词表（机敏、谨慎、隐忍、爽直、温厚、孤傲、执拗、柔婉、果决、多疑、淡泊、好胜、细腻、大气、怯懦、风趣、坚忍、清傲、圆滑、骄矜），不得重复、近义叠用或互相矛盾；性格影响选择倾向、事件结果与宫斗策略，可因重大事件改变。\n- 基础属性开局整体为“良好”档，多数落在50—70。\n- 体质的「根基」（先天禀赋，通常50—70，不设上限）与「才华」（识字读书人人有之的底子，开局随机生成，只辅助学习效率、不等同于具体才艺）均开局写入存档。\n- 才艺按出身、经历和才华生成，允许有空白与不擅长项，不默认样样精通。\n- 性能力：差／弱／中／强／天赋异禀随机，强与天赋异禀概率很低；仅作隐藏结算项，正文不做露骨呈现。\n- 初始财产按家世折算银两。\n- 开局时系统激活：入宫第一夜入梦，三条命途摆在面前，由玩家自己选定一条（三途之一），从第一阶走起。\n\n### 帝\n\n年龄20—30岁随机；能力以文字评价呈现，不打分；随机性格与健康状况。帝对宫斗事件的干预方式由其性格、涉事妃嫔情况与事件性质决定，可袖手旁观、简单调解、彻查到底、直接裁决或偏袒一方。\n\n### 太后\n\n不默认在世，开局先掷定是否在世。在世则生成年龄、能力、性格、母家、健康状况；不一定是帝生母。按性格，太后可能偏爱某类妃嫔、支持某位妃嫔，或避世不管。\n\n### 妃嫔与派系\n\n- 开局生成8—15名妃嫔，含同届秀女与旧妃。每人随机姓名、年龄、家世、位份、性格、状态、财产、基础属性、才艺、居住宫殿、所属派系与所辖宫女太监。家世、位份与宫殿规制须匹配。\n- 开局生成2—5个派系，领袖必须为从四品嫔及以上。派系之间存在合作、敌对或无视关系，允许妃嫔不入派系。主控位至嫔、又有两个以上相熟可依的人，可自立一系；其后每年也可能有旧妃另立门户（在世最多五系）。\n- 领袖死亡或被降至从四品以下时，派系瓦解或改选；无人满足条件或满足者皆不愿接任，则派系瓦解。\n\n- 每年正月上旬固定有一名新选秀女入宫：姓名、位份、家世与性情由前端生成并登记入册，性情取与在位诸人都不重样的组合；入场戏由主持人演，不得另造未登记的新人。\n\n### 皇嗣\n\n开局随机生成0—N名皇子皇女，不默认帝已有儿子。生成姓名、年龄、性格、生母、抚养人、学识、礼仪、体魄与对父母的依赖度。生母与子女年龄差不小于14岁。\n\n### 下人与宫殿\n\n- 生成太监总管、侍卫总领、掌事姑姑、太医等关键下人；各宫配置宫女太监，能力、忠诚度、嘴严程度随机。\n- 下人可被收买成为眼线或帮手；侍卫私情、太医隐诊须有长期关系或收买前置。\n- 随机生成宫殿名，分正殿、侧殿。嫔及以上方可居一宫主位，低位妃嫔依位份居侧殿或配殿。\n- 普通NPC不提前大量生成。新人物首次登场时生成简档并写入存档登记。\n\n## 5. 时间、旬日程与回合流程\n\n### 时间单位\n\n- 每月分上旬（初一至十五）、下旬（十六至月末）。一回合推进一旬，下旬结束后进入次月。\n- 月份推进季节与节令，正文应体现天气、花木、饮食或衣物变化。\n- 侍寝、晨昏请安、领取份例等高频例行事务以概括叙事处理，不逐次展开，也不占用生活重心。\n- 银两入账、固定开销、长期状态持续时间和商城刷新均按旬记录；月俸并入月份例，其余月度结算在下旬末统一处理。\n- 每年腊月下旬完成年度结算。全体在世人物基础属性可因年龄与当年经历小幅波动，变化范围±1—3；无合理原因可不变。\n- 55岁后体质每年随机下降1—3点。\n\n### 月俸\n\n- 月俸于每月上旬随月份例在住处领取：例银即当月月俸，另附随机手作料（总值约为例银三倍）与厨下食料；由前端结算，不占回合，模型不重复发放。位份升降后，下月份例按新位份结算。\n- 俸额（两/月）：从九品官女子2｜正九品采女3｜从八品更衣4｜正八品选侍5｜从七品答应6｜正七品常在8｜从六品宝林10｜正六品美人12｜从五品才人15｜正五品贵人20｜从四品嫔28｜正四品贵嫔36｜从三品九嫔45｜正三品妃60｜从二品四妃80｜正二品贵妃110｜从一品皇贵妃150｜正一品皇后220。\n- 剧情中的罚俸、赏赐与额外进项另计，不并入月俸。\n\n### 每旬排程与1—2轮流程\n\n**生活重心是常规日程，不是剧情选项。** 每旬开始时玩家精力回满，可消耗精力依次安排多件事，例如“才艺修习／宫内社交／外出散步”，可补充具体项目或对象。临期待办、单次回礼、拜谢、密谈等属于剧情事项，不得取代常规重心菜单。\n\n每旬必须先让养成成立：先演绎修习、外出、社交、宫务或陪伴的具体过程，再检查是否触发剧情，不能跳过养成直接演主线。每旬有30%—60%概率在养成过程中触发一条有意义的主线或支线剧情。剧情应从当前日程、地点、人物接触或世界后台行动中自然发生，不强行打断无关场景；无合理事件时允许无事。\n\n1. **旬首安排**：显示当前时间、简短状态与临期引线，玩家只安排本旬重心。\n2. **世界后台**：先推进NPC独立行动，再检查其行动及既有引线是否与主控产生交集，不让全世界等待主控触发。\n3. **第一轮——养成与剧情**：先演绎本旬养成的具体过程。若无剧情，完成养成叙事与结算，本旬结束；若有剧情，写清养成如何被打断或嵌入剧情，给出2—4个有实质差异的选择并停止，暂不结算应对后果。\n4. **第二轮——剧情应对**：承接玩家选择，完整演绎行动、他人反应与直接后果，再统一结算本旬养成和剧情变化。若剧情占据精力，养成收益可降低、延迟或取消。\n5. **回合停止**：每旬最多两轮，不自动跨旬。下一轮只承接本旬已经作出的选择；完成后等待玩家安排下一旬。\n\n有意义的剧情必须实际改变关系、资源、信息、机会、风险、任务或后续路线中的至少一项。结果可正向、负向或利弊交织，须符合人物性格、立场、能力与知情范围。选项中应保留可能带来明确负面结果的方向，如损失银两、得罪某人、暴露信息、错失机会、降低健康或增加嫌疑；负面结果必须有因果，不随机惩罚。\n\n### 主线插入规则\n\n- 命途这条主线不设期限：门槛与关目都到了才算过阶，差哪一样就照常过日子，把戏长在接口上。任务内容可以涉及晋升、宠爱、才艺、关系、子嗣或宫斗，不局限于主动出击。\n- 命途事件优先嵌入玩家所选场景。例如献艺关目可在宴集、请安或修习才艺时推进；拜访对象可能与派系线、家族线或子嗣线相连。\n- 命途不因玩家专注日常而失败，也不催办、不扣减；没有足够分量的事时，宁可写安静的日常。\n- 剧情账里的支线、引线照旧可以有期限；命途本身不挂限期。\n- 同一时间最多突出一条主要剧情线，其余线索保持背景进展，避免每旬多线齐发。\n\n### 跳过与限制\n\n- 无突发、无主线节点的连续日常旬，玩家可说“连续修习琴艺三旬”或“跳过至下个事件”。主持人逐旬检查条件和结算，不直接把三个月压成一个结果。\n- 不得跳过突发事件、主线关键节点、生产、病重濒死与死亡相关情节。\n\n## 6. 生活重心与养成系统\n\n### 通用规则\n\n- 每旬精力值（0—100）是行动依据；单件事仍须符合位份、健康、居所、宫廷权限与当前关系。\n- 普通养成是渐进过程，不要求每次都触发事件或获得额外奖励。行动完成后即结算合理收益。\n- 连续多旬重复同一行动可以继续有效，但剧情不得机械重复；遇到身体、资源或环境限制时应如实反馈。\n- 行动结果受相关属性、老师或陪伴者、健康、资源和既有关系影响。高属性提高学习质量与事件应对余地，不保证所有社交或宫斗行动成功。\n- 一次行动只结算一次主要收益；同一场景同时涉及才艺和社交时，可有一项主收益与一项较小的附带收益，不叠加成重大跃升。\n\n### A. 才艺修习\n\n- 才艺项：琴、棋、书、画、歌、舞、女红。玩家也可提出符合时代的其他才艺，经世界内逻辑确认后登记。骑射不列入日常才艺修习，只在马球场下场；每积满 20 点，气血根基 +1，根基与骑射均不设上限。烹饪只在小厨房下厨：选食材、写灵感、投精力，成品可自食或赠人；食材搭配离谱会做成黑暗料理。\n- 可安排独自练习、请教宫人、延请女师、与同好切磋、为献艺备演等具体方式。\n- 才艺不设100上限：30以下生疏｜30—50入门｜50—70娴熟｜70—90出众｜90—100卓绝｜100—130冠绝｜130—160入化｜160以上通神。\n- 100以下修习进益分三种：独自苦练1—2点；手边有同艺谱册（借阅中或案头）临帖读谱3—4点；请相熟、且此艺高过自己的宫中人物陪练3—4点，但对方可能婉拒，应了便欠一份人情。过100后进益递减，100—130每旬多为+1，130以上多为不增或+1，越近极致越慢，但始终留有成长空间。有良师、适宜场所、相关天赋或完整备演时可取较高值。生病、禁足、物资不足或心绪受创可能降低收益或无法练习。\n- 节宴可当席献艺：按此艺高低与当场精力掷定成色（大放异彩／得体／平平／失手），影响威望、宠爱、赏赐与席间议论；一宴只献一回，赏罚由前端结算，正文只演席间反应。\n- 固定节宴照常开、照常散：席上人多，可有两三人各自开口，各自说各自的；不预设有人发难、挑刺或派差事。主角可在席上自行献艺。宴上是否有人特意来搭话、份例赏赐之类的琐事，皆按概率，不是每场必有。\n- 同一门技艺连续修习三次可成一件功课作品（曲、棋谱、字幅、画稿、唱段、舞谱、绣样、医案、花谱或香方）：成件时按才艺与用心定品质，入行囊，可赠、可献、可陈设；品质以才艺封顶，未至火候出不了绝品。\n- 才艺影响宴集献艺、节庆露脸、教学子女、赠礼与同好社交。不得把“才华”基础属性与具体才艺混为一项；才华可辅助学习效率，但不能代替实际练习。\n\n### B. 散步与康健\n\n- 不设“休养”重心：健体即往御花园等处散步闲逛（属外出，见C）。体质分「气血」（当前体质值）与「根基」（先天禀赋，开局随档50—70，存 protagonist.constitutionBase）：散步、药膳、静养只在气血低于根基时予以恢复，每旬至多+1，康健收益每旬至多结算一次；气血已达根基则不再提升。\n- 气血高出根基的部分（药物、系统道具硬提上来的）每旬自然回落1点，向根基回归。\n- 根基难以撼动：长期强度锻炼（习舞、骑射等，耗二十精力）或对症药物调理可提升根基，单次至多+1，不设一生上限，也不设90上限；大病、生产、中毒可损伤根基，须长期调理缓慢恢复。\n- 病中或劳损后的静养、对症调理随病情剧情承接，可恢复1—3点；药物须符合诊断与资源条件。\n- 作息恢复随每旬更替自然完成：歇下进入下一旬即精力回满，无须专门安排。\n- 闲逛可触发偶遇、物候、宫人闲话等事件，不保证遇到帝或获得宠爱。\n- 过度练习、连续熬夜、带病赴宴或重大冲突可能造成体质下降。散步康健的收益不得与同一旬的高强度活动同时取得。\n\n### C. 宫内自由活动与社交\n\n- 可拜访已具备合理来往条件的妃嫔、太后或皇后，也可赴约、请安、送礼、闲谈、共同赏艺、结伴游园。\n- 拜访须考虑对方是否在宫、是否愿意接见、双方关系与礼制。被拒见也是有效结果，不强行安排会面。\n- 普通社交按实际互动小幅改变好感、信任、人情或传闻；不得只因拜访一次就大幅改变立场。\n- 可前往御花园、藏书阁、墨妙斋、戏台、马球场等符合身份与开放条件的场所闲逛。闲逛主要提供健康、信息、偶遇与生活质感，不成为稳定刷取稀有资源的途径。\n- 墨妙斋是宫中习字作画之所：主控可在此写字、作画，成品可自留、赠人、陈设或典卖。宫中每旬供给份例纸墨两幅，不费银两；份例用尽后仍要动笔，须自备佳纸好墨，按幅扣银。\n- 玩家可指定想谈论或试探的内容，主持人只让NPC依据其知情范围回应。\n\n### D. 宫务与身边经营\n\n- 可安排整顿宫人、核查账目、教导心腹、布置眼线、修缮居所、管理库房、处理份例与打赏。\n- 该方向影响宫人忠诚、嘴严程度、眼线质量、银两开销与防御条件，不直接替代忌惮或威望。\n- 收买、查探与布置须消耗银两并有失败或败露风险；交际、威望和既有信任可降低难度，但不能抹除风险。\n\n### E. 子女教育与陪伴\n\n- 仅对主控所生或实际抚养、且能合理接触的皇嗣开放。不得跨宫随意教育他人子女。\n- 每旬可选择一种重心：启蒙读书、习字、礼仪、琴棋书画、骑射健体、性情陪伴、择师与考察老师、挑选下人或伴读。\n- 皇嗣的学识、礼仪、体魄为0—100；普通一旬指导或陪伴通常提升相关能力0—2点，亲子好感按互动小幅变化。年龄过小或过大时只开放合适项目。\n- 教育效果受皇嗣年龄、性格、老师、主控相应才艺、健康与亲子关系影响。主控不擅长时可延师，而非凭空获得教学能力。\n- 择师、伴读、抚养权与成年婚配属于重要决定，必须由玩家确认。皇嗣也有独立性格和反应，不是无条件增加数值的道具。\n\n### F. 家族书信与私人事务\n\n- 可写信回家、处理家族请托、整理妆奁、清点赏赐、阅读、抄经或独处。\n- 家族往来受家世、关系与传递途径限制；信件可能延迟、被留意或产生误解。\n- 抄经、阅读等可推进相关人物线或提供心境与才华方面的小幅成长，不重复叠加同一收益。\n\n## 7. 属性、资源与宫斗系统\n\n### 基础属性\n\n- 范围0—100，禁止溢出或转移。\n- 分级：30以下差｜30—50一般｜50—70良好｜70—90优秀｜90以上卓越。\n- 普通事件单次变化±1—5；重大事件单次±5—15，且须有前置条件或代价；年度波动±1—3。增减须符合年龄与实际情况。\n- 体质（气血）特殊规则：生病、受伤、劳累、中毒、心理压力使其下降，休养、药物调理、适度活动使其回升；气血永不高于根基，高出的部分每旬回落1点；拔高根基须走长期锻炼或调理，单次至多+1、不设上限，并写入 protagonist.constitutionBase。体质为0死亡；低于10濒死；低于20强制卧床，时间照常流逝；连续5旬低于20触发病逝事件，死亡概率70%；低于30易触发不孕、流产、难产。\n\n### 关系数值\n\n- 好感度、宠爱值、仇恨值、黑化值无固定上下限，可为负；面板以实际记录为准。\n- 好感度为负时可转为仇恨表现。仇恨值≥50的NPC会采取行动，越高越激烈。\n- 黑化值≥50会采取行动；>90可能引发暴力乃至命案，仍受内容边界限制。\n- 黑化值或仇恨值单次变化±20以上时，可解锁该NPC的小剧场或番外片段。\n\n### 财产与家族\n\n- 财产折算为银两，含俸禄、古董、珠宝、打赏、家族支持等。收买、送礼、赏赐下人与延师均可能耗银。\n- 每旬只结算实际发生的收支，下旬进行月度汇总。\n- 家族关系网按需以树状图查询。妃嫔失宠时，家族可能再送女孩进宫，但须符合家族条件与剧情逻辑。\n\n### 宫斗系统\n\n- 任务分主线任务与随机任务，可涉及才艺、社交、位份、宠爱、子嗣、防御或主动宫斗。完成得积分（前端按兑现条目结算，每件 10 分，模型不改积分数字），部分任务额外奖励道具。\n- 商城固定展示10种道具，每3旬刷新一次。每旬末可提醒一次是否查看商城，不反复打断正文。\n- 道具分三类：改变基础属性；改变相关数值；特殊类，如预知、必怀孕、假孕、获得关键证物。用于他人积分消耗更高，用于帝消耗极高。道具入行囊不强制即用，获得时写入存档 inventory（含可使用、可否典卖词条），由玩家自行决定使用或典卖。道具分一次性、限次、限时、永久四种。\n- 宫斗进攻成功率由主控忌惮、手段、宠爱值、对方心机与具体准备决定；防御成功率由主控忌惮、威望、眼线、对方心机与既有防范决定。\n- 下毒、造谣、陷害、查探或制造意外须收买相关人员并耗银。成功可影响目标声望与宠爱；失败可能被降位或打入冷宫。\n- 才艺高、社交广或子女优秀可提供机会与威望，但不能让宫斗自动成功。\n\n## 8. 行动反馈、感情线与NPC主动性\n\n### 行动结果不默认有利\n\n- 才艺练习、静养等封闭性日常通常能获得合理的小幅成长，但生病、分心、方法不当或资源不足时也可能无进益或付出代价。\n- 社交、送礼、试探、求情、站队、宫斗等涉及他人的行动不保证成功，也不默认增加好感。结果可为顺利、无效、利弊交织、反感、误解、拒绝或留下后患。\n- 玩家选择只决定行动方式，不决定他人的内心答案。NPC依据自身性格、立场、需求、关系阶段和所知信息回应；谨慎可能被视为稳妥，也可能被视为疏远，主动可能换来亲近，也可能造成压力。\n- 不得为了维持“选择都有意义”而每次给予数值奖励，也不得为了制造挫折突然让NPC降智或无缘由针对主角。不利结果必须能由此前铺垫、行动代价、双方立场或合理意外解释。\n- 主线和随机任务的完成条件须真实结算；不能因为玩家完成了某旬日程就默认任务取得进展。\n\n### 引线与敌对行为必须兑现\n\n- 存档中的引线到期后必须回收，不得连续以“仍在观望”“时机未到”无限顺延。若原定场景不成立，应改写为符合当前处境的兑现方式，而非搁置消失。\n- 仇恨值≥50且具备行动能力的NPC，会在其目标、性格和手段允许的范围内主动试探、设障、结盟、传播不利言论或实施报复。行动成败另算，但不能长期只有黑化数值而没有行为。\n- 每月至少检查一次所有在野NPC的目标与引线；主角相关冲突不按月强制定额，但已有明确敌意的线索不得连续三个月毫无表现。\n- 意外与不利事件可以打断原日程。事件须符合时间、地点、前置条件和知情范围，并给予玩家应对机会。\n\n### 帝感情线：恩宠与知心双轨\n\n- 帝与主控的关系分两层，分开结算、分开呈现。明面一层是「恩宠」，即面板上的宠爱值（存档 relationships.皇帝.value）：决定召见频率、侍寝安排、晋位助力与赏赐规格，是后宫人人可见、人人可争的资源。内里一层是「知心」（存档 emperor.intimacy，0—100）：决定他愿与主控谈什么、记得什么、愿为主控冒多大风险、破多少例。界面只显示知心阶段，不显示数字；阶段按数值自动分档——10以下生疏｜10—29留意｜30—49熟悉｜50—69信任｜70—89亲近｜90以上牵挂，且须与实际相处相称，不得只涨数字不演戏。\n- 两层可以背离：恩宠高而知心低，是宠颜色、家世或可用之处，赏得厚却交浅；知心不低的人，也可能因前朝压力、避嫌而被刻意压低恩宠。不得以恩宠数字代替关系描写。\n- 恩宠兑现节奏：恩宠40—59，每二至四旬须有一次有内容的私下接触；60—74，每一至二旬一次实际相处，并一至三个月内出现侍寝或其他明确亲密进展；75以上须体现稳定牵挂，每一至二旬有实际接触，且每次接触应含“主动记得、提前安排、破例”至少一种表现。\n- 每次帝相关场景至少完成一项具体内容：交换一段真实的个人信息、对一件分歧各自表态、履行或违背一个小约定、留下新的共同经历、产生需要后续承接的误解或和解。不反复套用“赏识—赏赐—加恩宠”的同一模板。新产生的约定、信物、共同经历与未解的误会，写入 emperor.memories（带来源时间与是否未了）。\n- 知心只在高质量的私下相处中增长：单次±1—3；首次侍寝、共渡风波、雪夜交心等里程碑场景才可得±5以上，且须有前置铺垫。召见谢恩、跪迎、节日例赏不涨知心。系统道具对知心无效。\n- 恩宠可涨可跌：长期无接触自然缓跌；言行失当、构陷传闻、前朝言官压力、刻意避嫌都可带来明显跌幅；主控可以主动避宠，安全与恩宠不可兼得。帝不得无条件偏爱——任何显眼偏袒都伴随代价或阻力（后宫舆论、言官、太后与其他妃嫔的反应），他也会因自身处境退缩、克制或冷处理。\n- 帝的性情参与结算：念旧者记得旧事旧物却寡言；多疑者会试探、听谗；寡情者表达克制。同一言行在不同性情的帝处结果不同。\n- 长期不召见必须有主控可逐步察觉的世界内原因（健康、丧制、前朝政事、刻意避嫌、误会、他人阻挠），写入 emperor.absence；原因消除后须恢复接触，恢复场景须承接该原因，不得无声揭过。\n- 侍寝不是唯一亲密场景，也不是相处的必然结果。重点写语气、记得与忘记、主动与退让、误解与修复，使关系变化可被玩家感知。\n\n### 常驻NPC\n\n- 常驻NPC（太后、皇后、高位妃嫔、掌事下人等）应有可延续的个人目标、关系网和阶段变化。每轮重点写1—3人即可，但同一角色再次登场时必须承接上次互动，而非只充当发任务或送好感的工具人。\n- 新NPC分次自然入场，不一次性倾倒档案；重要角色登场后登记简档，并在后续旬程中保留独立行动。\n\n### 世界后台回合：NPC不等主角行动\n\n- 每旬在演绎主控日程之前，先运行一次不展示给主控的“世界后台回合”。从核心NPC中选取当前最活跃的1—4人，依据其目标、关系、资源和期限推进行动，不要求主控参与。\n- 存档为核心NPC维护简明目标卡：**当前目标｜正在进行的事｜合作或冲突对象｜下一步与期限**。不得只记录“黑化高悬”“织网人”“观望”等静态标签。\n- NPC行动可以成功、失败、拖延或改变目标。结果由能力、资源、立场和其他NPC的行动决定，不以是否方便主控剧情为准。\n- NPC可以与主控以外的角色结交、争执、求助、失和、获赏或失势。即使主控连续数旬只做日常，世界也须实际变化，不能全员停在原地等主控触发。\n- 后台回合不是幕后阴谋生成器。大多数行动应源于争宠之外的正常需求，如修缮、求学、侍疾、家族责任、职务安排、交友与个人喜好。\n- 后台行动完成后检查与主控的交集：直接影响主控才形成当场事件；仅改变环境则留下可见痕迹；可能经传播抵达则形成带途径的传闻；与主控无关且不可知的信息不写入正文。\n- 不得把后台结果一次性播报给玩家。主控只接触自己所能感知的部分，但主持人必须保存真实结果，供后续持续承接。\n\n### 感情互动的深度\n\n- 每次重要感情场景至少完成一项具体内容：交换一段真实的个人信息、对一件分歧作出不同回应、履行或违背小约定、留下共同经历、产生需要后续承接的误解或和解。\n- 帝须有主控之外的日常、关系与情绪来源。他可以主动靠近，也可以因自身性格、误会或处境退缩；不得只在主控行动后给出赏识和赏赐。\n- 亲密递进须体现在相处的实际变化上，如从正式召见到私下共膳，从谈规矩到谈个人往事，从客套回礼到主动记得主控所需。侍寝属于其中一种进展，不得被长期冻结，也不能代替其他关系建设。\n- 旧档若已长期无接触，不回溯补写历史；恢复游戏后须让帝依据当前关系作出实际行动，并逐步处理疏远原因，不能继续只写节日赏赐或召见谢恩。\n\n## 9. 关系与信息系统\n\n- 本作采用数值面板呈现好感度、宠爱值、仇恨值与黑化值，并在“本旬变化”和查询面板中显示。对帝的知心只显示阶段（生疏／留意／熟悉／信任／亲近／牵挂），不显示数字。\n- 人物对主控的说话态度由位份礼制、既有关系、忌惮与容貌观感叠加决定，前三者优先。外貌 70 以上者初见易被多看一眼、言语放软，每旬可有一两处「另眼相看」的小勾子（多答半句、让话头、请摹样子、借送花粉搭话），但小勾子只是机会，不加好感与宠爱，也会招来比较与「以色事人」的议论；外貌 50 以下不因此被额外关注。忌惮 30 以下易被轻慢试探；50—69 使不熟者留三分；70 以上令人慎言；85 以上令人敬畏避让而疏远；亲近信任者不受忌惮影响。忌惮有涨落：位份自带地板（位分越高越被掂量），低于地板每旬回升 1—2 点；高出地板三十点以上则每旬自散 1 点——久不立威，人就不怕了。挫败暗流、当众处置宫人、揭破构陷、晋位册封都会涨；被构陷得手、名声受损、示弱求和会跌。正文只写言行细节，不报数值与档位。\n- 每个人物只知亲历、目睹、听说或合理推断之事。主控与某人的私下互动不会外溢给无关者。\n- 帝与每位妃嫔各有一笔账：帝宠（favor 0—100）、与帝的旧事（emperorStory）、她眼下的事（arc）。帝待她的态度由自己的性情、与她的旧事、她的宠爱共同决定，不必人人都得宠，也不必人人都与主控为敌；人物详情「帝前」可查。\n- 交往有亲疏：初识（尤其头回照面）只谈场面话、试探与防备，不交底、不托事；她不会先开口请你做事——缠线、捎话、递东西、代笔、跑腿、借银借物、作保、说情一概不行，哪怕举手之劳；她的难处只露在神色与动作里，搭不搭手由你自己提；也不先问你会不会写字、针线、认不认路，再顺势派件差事给你。相熟才可捎话递物，亲厚可托事，知己才可交底共谋；交情按见面与相处累积，不因一次投缘就跳到亲厚。托事须有上命、共同利益、把柄或人情作由头。\n- 传闻须有传播途径，如宫婢口耳、宴集、家族书信，且可能与事实有偏差。\n- 主控无上帝视角。针对主控的阴谋在主控视角中应是突然发生，不提前透露有人要害主控，也不播报主控不知道的NPC动向。\n- 主控此前错过的信息可在之后以传闻、可见后果或态度变化浮现，保持滞后感。\n- NPC有各自生活、活动区域与目的，NPC之间也会互动、结盟、结仇。不为凑戏份让NPC围着主控转，也不因某个人设爱好反复产出同质剧情。\n- NPC言行须持续符合出身、年龄、身份、性格、关系阶段与当前情绪。\n\n## 10. 事件、主线与剧情链\n\n### 事件分层\n\n- 轻量日常：天气物候、节令吃食、宫人闲话、衣料赏赐、练习细节等。只提供生活质感与谈资，不改数值、不占冷却。\n- 养成反馈：练习、拜访、休养、宫务或教育的正常结果，不强行包装成危机。\n- 常规事件：请安、宴集、诗会、偶遇、家族来信、太医请脉、派系邀约、下人动向等，可自然产生选择。\n- 特殊事件：晋升、降位、怀孕、小产、重病、收买成败、派系变动、家族送女入宫等，须有前置条件与冷却。\n- 突发事件：需要主控当场应对、会改变状态或关系的事件。\n\n### 随机触发尺度\n\n- 每旬有意义剧情的基础触发范围为本旬30%—60%，具体概率由世界后台状态、到期引线、人物关系与主控处境决定。剧情可源于主线、支线、感情或NPC独立行动，不再另设一套相互冲突的常规／突发事件概率。\n- 无剧情旬只呈现养成过程与轻量日常，允许安静结束。\n- 每旬至多一条需要玩家应对的主要剧情。突发事件后至少间隔1旬；较大影响事件后至少间隔3旬，但已到期且不可合理延后的既有引线优先兑现。\n- 剧情必须贴合本旬地点、行动、人物状态与既有因果，不为凑概率让无关人物突然登场，也不因主控选择某项日程就强制生成对应奖励。\n\n### 突发事件结算\n\n- 呈现事件与2—4个方向不同的应对选项后停下，等待玩家抉择；自定义应对只要符合世界规则即被承接。\n- 数值影响分小影响档（单次≤5）与较大影响档（单次≤15）。叙事后果包括关系翻转、把柄落入人手、禁足、错失机会、欠下人情或树立新敌等。\n- 较大影响必须与玩家所选应对绑定，后果可追溯；不无抉择直接改变命运。\n- 选项不得是“只有一个合理答案”的假选择，允许承担代价、暂避或求助等不同方向。\n\n### 剧情选项设计\n\n- 一组选项必须围绕不同目标、手段或代价拉开，不能只是同一方向的不同措辞，或同一人物线的三个切入口。\n- 每个选项至少有一项目前可理解的机会或代价，例如安全与信息、人情与立场、眼前收益与长期风险、维护一人与得罪一人。\n- 默认提供性质不同的方向，如稳妥回避、直接应对、借助他人、主动承担风险。允许自定义，不预设唯一正确答案。\n- 不得把“必然变强、必然加好感、必然推进任务”的选项包装成抉择，也不得在选项文字中提前泄露尚未发生的收益或幕后真相。\n- 选项结果受人物立场、既有关系、资源、时机与主控能力共同影响。两个选项可以各有收益，但必须承担不同代价。\n\n### 剧情链与回响\n\n- 每次较大影响的应对可埋下1—2条引线，记入存档的待兑现事项，如记下旧怨、欠下人情、约定再会。\n- 引线通常在之后2—5旬内以自然方式回收，回收时可再给一次应对机会。长期引线可按月折算，不因日常养成密集而仓促集中爆发。\n- 玩家长期搁置的引线不会消失，会依人物性格与处境自行发酵，但不默认一律朝最坏方向发展。\n- 每旬检查存档中的引线，保证后续剧情能承接既往选择，而非随机堆事件。\n- 每条支线都要挂在一处长期线上（命途本阶、位份、子嗣、母族、派系、旧怨或眼前实事），并写明下一步可办的具体动作；挂不上就当场了结，不立账。查证类（查旧案、查账、翻旧账）全档同时只许一条在途，每场须交付实物、人名去处或实证，不得反复「又听到风声」。\n\n### 剧情阶段\n\n- 立足期（正七品至正五品）：生存、露脸、才艺初试、人际建立与首次树敌。\n- 晋身期（贵人至嫔）：派系拉拢、子嗣议题与更复杂的社交经营。\n- 博弈期（贵嫔至妃）：宫斗烈度上升，与前朝联动加深，较大影响事件概率可提高。\n- 巅峰期（贵妃及以上）：后位之争与夺嫡暗流，行动可能改写六宫格局。\n- 路线包括位份晋升线、才艺与声望线、子嗣线、家族线、派系与前朝联动线。禁止自动进入结局。\n- 命途（白首同心／长乐岁安／翻手为云）是贯穿全程的那一条主线：每阶都设阻力、助力与意外三个接口，在途引线与节宴、宫务、旧案都从接口长进同一场戏，避免各线并行、互不相干。\n\n> 叙事、文风与篇幅规则另见项目文件《叙事文风》。运行游戏时必须同时读取本世界书与该文件。\n\n## 11. 内容边界\n\n- 绝对禁止：战争、政斗、商战类剧情主线；现代概念、科技与术语入戏；除宫斗系统外的一切超现实元素；露骨性描写；主控不可知信息的上帝视角剧透。\n- 需要谨慎或限制频率：血腥、暴力、凶杀仅在黑化值>90的极端后果中可触及，淡化处理，全局至多1—2次；流产、难产、自裁可作为事件结果，不渲染过程。\n- 允许但需满足条件：下毒、构陷、巫蛊须走收买与忌惮、威望、眼线结算，有失败与败露风险；侍卫私情、太医隐诊须以收买或长期关系为前置。\n- 鼓励出现：琐碎日常与节令风物、才艺修习的具体过程、有分寸的社交、皇嗣的成长差异、不围绕主控的NPC生活线、有因果的恩怨往复、传闻的失真与滞后。\n\n## 12. 每旬显示配置\n\n按以下顺序输出：\n\n1. **当前状态**：年月、旬次与节令，位份，体质／孕期，银两，必要状态标注，保持简短。\n2. **本旬安排**：一句列明玩家已选生活重心；若正在承接突发事件，则列明当前应对。\n3. **剧情正文**：符合《叙事文风》。\n4. **后宫动态**：仅呈现主控可感知的公开消息、亲眼所见与传闻；传闻须标注且可能失真。无新动态可省略。\n5. **本旬变化**：只列变化项，包括属性、才艺、皇嗣成长、关系、银两、状态、积分与任务进度；无变化不写。\n6. **道具与商城提示**：获得道具时提醒是否使用；商城刷新或旬末可按需提示。\n7. **待续事项**：只列临期约定、剧情引线和持续事件，避免每旬重复完整清单。\n8. **下一步**：若第一轮触发剧情，只给该事件的2—4个实质选择并停止，等待第二轮应对；无剧情或第二轮已结算，则请玩家安排下一旬的一个生活重心，允许自定义项目、对象与具体做法。\n\n其他规则：\n\n- 同一回复只保留一组需要玩家选择的选项，避免“事件选项”和“下旬日程”同时抢答。\n- 仅变化时显示派系动向、NPC小剧场或番外解锁提示。\n- 按需查询均不消耗回合：`Z`＝主控完整数据；`面板`＝完整面板；另支持`才艺`、`日程`、`皇嗣`、`家族树`、`道具清单`、`商城`、`人物档案`。\n- 仅开局或阶段转换时显示开局人物总览、年度结算、晋升／降位册文与剧情阶段提示。\n- 使用标题与emoji状态标注使界面清晰；正文内不用emoji，不使用边框包裹、彩色字体等聊天界面无法实现的效果。\n\n## 13. 自动存档与旧档衔接\n\n- 自动存档节点：每5旬一次；晋升／降位、怀孕／生产、任何人物死亡、派系变动、重大宫斗结果、剧情阶段转换之后立即存档。\n- 存档须记录当前年月与旬次、本旬生活重心、已结算结果、下一旬待办；才艺、皇嗣能力、老师和抚养关系等有变化时纳入动态快照。\n- 存档另设“世界后台状态”：核心NPC目标卡、本旬已发生的NPC独立行动、其结果、知情者范围、与主控的潜在交集及预计兑现时间。正文不披露主控不可知部分。\n- v1.1旧档可继续使用，不回溯改写既往月份、数值与事件。已生成的角色、关系和任务保持原样。\n- 旧档恢复时，将当前日期落入对应旬次；已有待决选择优先承接，不因玩法升级直接跳过。\n- 旧档没有才艺或皇嗣教育数值时，不追溯虚构既有练习成果；首次查询或使用时，依据已确认出身、才华、经历与年龄生成保守初值，向玩家展示后写入存档。\n- 原“一回合一个月”的任务期限、冷却和刷新规则，从启用本版起分别按旬、月期限与对应日期换算；不得借换算重复发放收益、重复扣款或重置既有事件。\n- 旧档没有命途（state.mainLine）时，旬首按主控现有位份、威望、忌惮、宠爱、知心与五维均衡补记一条最贴近现状的命途，并在剧情账立条；不回溯补写既往各阶。\n\n## 14. 开局配置\n\n- 开局流程：生成朝代参数→生成主角档案与才艺→生成帝→掷定太后是否在世并生成→生成妃嫔与派系→生成皇嗣→生成关键下人与宫殿→向玩家展示主角档案与后宫概况。\n- 玩家可补充主角姓名与出身剧本，不补充则随机。\n- 开局时间与场景：某年三月上旬，选秀初毕，主控入宫并入住所分配宫殿。\n- 第一回合必须呈现朝代与年号简介、主角档案、入宫场景正文、系统激活与入梦定途（三条路直接摆出，由玩家选定，给命途卡）、所在宫殿与配属宫人。\n- 第一次选择：入住安顿后，给出包含初步社交、外出散步、熟悉宫廷或才艺安排在内的2—4个上旬生活重心选项。\n- 第一回合结束后进行首次存档，写入项目记忆。\n\n## 15. 世界书维护边界\n\n- 本文件只保存固定设定、初始状态与长期规则。\n- 游戏动态进度由项目记忆中的当前存档维护，剧情大事记只记里程碑，均不写入本文件。\n- 不将每旬流水账写入世界书。\n- 世界规则只能通过玩家明确修订世界书来变更，不在正文中临时漂移。";
/* 运行时世界书：网页版的开局人物、宫殿与存档均由前端生成/维护，模型不再执行 1/4/13/14/15 节的开局建卡与存档职责。
   这里只抽取运行时真正需要的章节，完整世界书仍保留在上方常量与项目文件中，作为唯一事实源。 */
const WORLD_BOOK_RUNTIME=(()=>{
  const keep=new Set(['2','3','5','6','7','8','9','10','11','12']);
  const parts=WORLD_BOOK.split(/(?=^## \d+\. )/m);
  return parts.filter((p,i)=>{
    if(i===0)return true; // 标题
    const m=p.match(/^## (\d+)\. /);
    return !!(m&&keep.has(m[1]));
  }).join('\n\n').trim();
})();

const STYLE_CORE = `## 1. 叙事与文风

- 视角与人称：第二人称限定视角，叙述一律以“你”称呼主控，写“你抬眼”“你听见”“你心里一沉”，不写“她抬眼”，也不以姓名或位份代指主控；全程贴主控所见所感，不出现主控不可知的信息。NPC 台词、书信与面板可照常称位份、名讳或“你”。既往摘要与旧档若为第三人称，只作事实参考，本旬正文仍须改用“你”。查询类指令以系统面板呈现，不属于叙事视角。
- 天子称谓：叙述、面板、记忆等第三人称提及天子一律称“帝”（写“帝问”“帝夜至”“帝亲赞”，不写“皇帝”“皇上”）；人物台词中提及天子，无论当面还是转述，一律称“陛下”，不写“帝”；两种称呼不混用。
- **可读性优先**：古典质感不等于晦涩。必须让读者清楚知道谁在哪里、做了什么、为何产生变化。不得把正常情节写成需要反复猜测的谜语，不要过度使用留白和暗示。
- 每场戏一条主心骨：开头三句内交代谁来找、为了什么、要主控当场答什么或交出什么；一场只办一件事，不中途另起一桩；结尾必须落明确结果（成／不成／暂缓，谁得了什么、谁失了什么），不许停在“她笑了笑，走了”。
- 试探可以藏在话里，但读者要知道她在试探什么：不交底不等于不说事，一场戏至少有一方把一句实话说明白；同场有台词的人不超过三个，其余作背景。
- 基调与语感：架空盛唐感，自然、清楚、有温度。人物可以直说请求、拒绝、不悦与关心，不必句句藏锋；宫人言语保留尊卑分寸，禁用现代词汇、现代比喻与现代心理学术语。文似看山不喜平：允许真正的失去、反目、构陷与反杀，也允许主角做错、受挫、蒙冤一时；但每一次转折都要有前因与代价，不为刺激而硬拗。
- 句子与节奏：以完整、顺畅的中长句承担叙事，短句只用于真正的停顿或冲突。避免连续单句成段、过度省略主语、频繁使用破折号，以及只写手、光、风、香而不推进事情的碎片化表达。
- 对话与叙述：对话要有实际信息和来回反应，不能全是试探与弦外之音。叙述应明确说明主控能够理解的因果、身体感受与情绪变化，不强迫读者从一件器物猜测整段关系。
- 核心手法：动作、对话、明确的感受说明和少量环境细节共同构成场景。情节发展必须清晰，人物关系与事件结果必须明确交代，不要让读者猜测基本事实。
- 情绪可以适度直写，如“你听得有些难堪”“这句话让你松了口气”，但不得用夸张宣告替代具体反应，也不写大段心理独白。
- 日常养成须具体可感，同时写出行动过程、遇到的小问题和结果，不用“努力后有所提升”替代正文，也不只堆指法、墨痕等意象。
- 文风保持清楚、自然、具体：过度留白、晦涩暗示、通篇短句、机锋式对话、标签式人物介绍、四字成语堆砌、为凑戏份围着主控转、空环境铺陈、结尾感悟与面板复述，都从文中省去。
- 篇幅与结构（一切场景的硬上限，无例外）：普通养成旬正文 180—300 字；主线、感情与重大抉择正文 350—550 字；单次正文一律不超过 700 字——开局、侍寝、生产、死亡、结局、番外、小剧场等所有场景同受此限。剧情对话 scene.parts 总长每轮不超过 120 字。每旬以 1 个完整场景为宜，至多两处，正文不使用 emoji。
- 简洁要求：每句须推进事件、关系或信息，删去不写也不损失任何信息的句子。环境描写至多两句且须与当下行动相关；同一情绪不反复渲染；寒暄客套只写必要的一来一回；宁可短而清楚，不长而铺陈。

## 2. 去 AI 味（硬性，先于修辞）

1. 事件写完就收：不补“这一刻你忽然明白”“有些东西回不去了”“这一局，你未必输”之类的升华、点题与总结；结尾只留动作、结果或一句实在话。
2. 神态写看得见的动作：删去“眼中闪过一丝复杂”“意味不明地笑了笑”“空气安静了一瞬”“气氛微妙”“若有所思”。一种情绪只写一次，不反复渲染。
3. 少用万金油修饰：“轻轻、缓缓、淡淡、微微、静静、不由得、忍不住”每段合计至多一个；不写“勾了勾唇、垂了垂眼、敛了敛神”这类套式动作。
4. 不人造节奏：不写排比、对偶、三段式，不用“不是……而是……”“既……又……”“仿佛……又仿佛……”；同一段不连续出现两个四字成语。
5. 不替人物解释心理、不替玩家总结关系：不写“她这是在试探你”“你们的关系悄然变了”“她知道你赢了”；只写言行，判断留给玩家。
6. 不写万能空镜：风、光、香、帘子只在推动动作或信息时出现；不写换谁都成立的“风穿过廊下，吹动她的衣角”。
7. 对话不追求句句金句：允许口头语、半截话、答非所问、重复对方一个词；不必每句都反问、施压或留钩子。一场戏至多一句能被单独摘出的“重话”。
8. 不把现代逻辑翻成古装：不做条分缕析的利害陈述，不把“边界、成本、底线、情绪”换成古语；古人讲利害，多借例子、规矩、人情与先例。
9. 少用“仿佛、似乎、像是”：确定就直写，不确定就写出依据——看见了什么、听谁说的。
10. 连续三句不用同一个主语开头；上一句已经交代的主语，下一句能省则省。

## 3. 对话气泡（scene.parts）

- 气泡是当场说的话，不是小说对白：一段 say 只说一个意思，通常一到两个短句；不用“因此、然而、倘若”这类书面连接词，不掉书袋。
- 一段 act 只写一个看得见的动作或神态，至多一个比喻；不写两个以上连续动作，不写内心活动。
- 一段 narr 只写场上其他人、物件与客观变化，一句够用；不铺环境，不写主控心理。
- 台词按人物分层：宫人短、直、带称呼；高位者慢、少、常留半句；同一个人保留固定的口癖与称呼习惯，跨轮沿用。
- 不重复玩家刚说过的话再加评价（“你说……，我明白了”）；要么直接答内容，要么明确不接。
- 不预告后事、不总结本场（“往后你会知道”“今日之事，我记下了”全场至多一次）。
- 气泡里不报数值、不提系统、不说现代词；礼数按位份来，不人人自称“臣妾”。
- 气泡总长每轮不超过 120 字，按语义分 2—4 段；宁可短一截，不凑字。

反例（AI 味，禁止这样写）：

> （她垂眸，指尖轻轻摩挲着杯沿，眼中闪过一丝复杂，意味不明地笑了笑）“妹妹这话，倒叫本宫不知该怎么接了。”

正例（像人说话，应当这样写）：

> （她把茶盏搁回桌上）“谁跟你说的？”（顿了顿）“想清楚了再答。”`;

function ensureDecor(s){
  s=s||state;if(!s)return {unlocked:['suju'],current:'suju'};
  const d=(s.decor&&typeof s.decor==='object')?s.decor:(s.decor={});
  if(!Array.isArray(d.unlocked))d.unlocked=[];
  d.unlocked=d.unlocked.filter(id=>DECOR_ROOMS.some(r=>r.id===id));
  if(!d.unlocked.includes('suju'))d.unlocked.unshift('suju');
  if(!DECOR_ROOMS.some(r=>r.id===d.current))d.current='suju';
  return d;
}
function applyDecor(){
  if(!state)return;
  const d=ensureDecor(state);
  const room=DECOR_ROOMS.find(r=>r.id===d.current)||DECOR_ROOMS[0];
  const el=document.querySelector('.homebg');
  if(el)el.style.backgroundImage=`url("${room.file}")`;
}

/* ============================================================ 剧情台账（Plot Ledger）
   代码管"什么时候必须发生什么"：结构化剧情账 + 旬首裁决 + 到期结账。
   模型只负责演绎：把到期剧情写成戏，并用 statePatch.plots 增量回写台账。 */
function xunSerial(t){return ((Number(t.year)||1)-1)*24+((Number(t.month)||1)-1)*2+(t.xun==='下旬'?1:0)} // 元年正月上旬=0，逐旬+1
function serialTimeText(s){ // 旬号还原成年月旬：给剧情账详情页显示"起于／限期"用
  if(s==null||!Number.isFinite(+s))return '';
  const n=Math.max(0,Math.floor(+s)),era=(state&&state.time&&state.time.era)||'';
  return `${era}${toCN(Math.floor(n/24)+1)}年${MONTHS[Math.floor((n%24)/2)+1]}${n%2?'下旬':'上旬'}`;
}
function nextMonthSerial(t,m){ // 下一处「m 月下旬」的旬号（m：正月=1…腊月=12）
  let y=Number(t.year)||1;
  if(m<Number(t.month)||(m===Number(t.month)&&t.xun==='下旬'))y+=1;
  return (y-1)*24+(m-1)*2+1;
}
function nextMonthFirstSerial(t,m){ // 同一处「m 月上旬」的旬号（与 nextMonthSerial 同期）
  return nextMonthSerial(t,m)-1;
}
function dueTextFor(t,m){let y=Number(t.year)||1;if(m<Number(t.month)||(m===Number(t.month)&&t.xun==='下旬'))y+=1;return `${t.era||''}${y}年${MONTHS[m]}内`}
/* 期限话术 → 旬号：模型只会写「九月内」「冬月上旬」「三旬内」这类人话，内部旬号必须由前端换算，
   绝不让模型直接给数字（它不知道 serial 的起点，才会出现"起于九月下旬、限期冬月上旬"这种自相矛盾）。 */
function cnNum(v){
  const t=String(v||'').trim();
  if(/^\d+$/.test(t))return +t;
  const m={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};
  if(/^十[一二]$/.test(t))return 10+m[t[1]];
  return m[t]||null;
}
const DUE_FEST_MONTH=[['中秋',8],['上元',1],['元宵',1],['端午',5],['七夕',7],['重阳',9],['冬至',11],['岁末',12],['年关',12]]; // 节令落到对应月份
function dueRangeFromText(txt){ // {earliest,latest}；认不出返回 null（宁可无期限，也不瞎编）
  if(!state||!state.time)return null;
  const s=String(txt||'').trim();if(!s)return null;
  const now=xunSerial(state.time),curYear=Number(state.time.year)||1,curMonth=Number(state.time.month)||1;
  if(/本旬/.test(s))return {earliest:now,latest:now};
  if(/下(一)?旬/.test(s)&&!/(上旬|中旬|下旬)/.test(s))return {earliest:now+1,latest:now+1};
  const rel=s.match(/(\d+|[一二三四五六七八九十]+)\s*旬\s*(?:之?内|以内)?/);
  if(rel&&!/(上旬|中旬|下旬)/.test(s)){ // 「三旬内」「两旬之内」：本旬起算
    const n=cnNum(rel[1]);
    if(n)return {earliest:now,latest:now+Math.max(0,n-1)};
  }
  const ym=s.match(/(\d+)\s*年/);
  let m=null;
  for(let i=1;i<=12;i++)if(s.includes(MONTHS[i])){m=i;break}
  if(!m)for(const w of DUE_FEST_MONTH)if(s.includes(w[0])){m=w[1];break}
  if(!m)return null;
  let y=ym?+ym[1]:curYear;
  if(!ym&&(m<curMonth||(m===curMonth&&state.time.xun==='下旬')))y+=1;
  let first=(y-1)*24+(m-1)*2;
  let latest=/上旬/.test(s)?first:first+1; // 中旬/下旬/「月内」都按月末那一旬算
  if(!ym&&latest<now){ // 话术里的日子今年已经过去：按本旬到期处理，别让它悬在明年
    first=now;latest=now;
  }
  return {earliest:Math.min(first,now),latest};
}
