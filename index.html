    return `<button class="npcrow" onclick="${onclick}">${avatarHtml(who,'nr-av')}<span class="nr-main"><span class="nr-name">${esc(c.name)}</span>${role}</span><span class="nr-rel">${this.relBadge(who)}</span></button>`;
  },
  sheetVisit(kind){ // 出门拜访：kind='妃'（六宫）/'医'（太医院）/缺省=全部相识
    const head=kind==='医'?'太医院当值的人不多。':'';
    const npcs=state.npcs||{};
    const all=[...new Set([...Object.keys(npcs).filter(id=>npcs[id].known),...Object.keys(state.relationships||{})])];
    const ids=kind?all.filter(who=>npcKind(who)===kind):all;
    const empty=kind==='医'?'暂无相识的太医。<br>太医院人来人往，往后会有熟脸。':(kind==='妃'?'尚无相识的妃嫔。<br>往来多了，六宫自然会熟。':'尚无相识可拜访。');
    const row=who=>this.npcRowHtml(who,`Game.visitNpc('${esc(who)}')`);
    return (head?`<div class="sheet-note" style="margin:0 0 6px">${head}</div>`:'')+
      (ids.length?`<div class="sec"><div class="sec-cap">可拜访的人物（${ids.length}）</div>${ids.map(row).join('')}</div>`:`<div class="sec"><div class="sheet-note">${empty}</div></div>`)+
      `<div class="sheet-note">拜访耗精力 ${focusEnergyCost('社交拜访')}。</div>`;
  },
  sheetItems(){
    let h='';
    const pend=((state.system&&state.system.shop)||[]).filter(it=>it.status==='待生效').map(it=>it.name);
    if(pend.length)h+=`<div class="sec"><div class="sec-cap">待生效（商城购入）</div>${pend.map(n=>`<div class="itemrow"><span>${esc(n)}</span><span class="cnt">下轮结算</span></div>`).join('')}</div>`;
    const inv=state.inventory||[];
    if(inv.length){
      h+=`<div class="sec"><div class="sec-cap">行囊（${inv.length} 种）</div>`+
        inv.map((it,i)=>{
          itemFlags(it);
          const tags=`<span class="itag${it.usable?' on':''}">${it.usable?'可使用':'不可使用'}</span><span class="itag${it.pawnable?' on':''}">${it.pawnable?'可典当':'不可典当'}</span>`;
          return `<button class="npcrow" onclick="UI.goSheet('物品详情',${i})"><span class="nr-name">${esc(it.name)}</span>${tags}<span class="nr-rel num">${it.count>0?'×'+esc(it.count):'已典出'}</span></button>`;
        }).join('')+`</div>`;
    }
    return h||'<div class="sheet-note">囊中空空。</div>';
  },
  sheetItemDetail(i){
    const it=(state.inventory||[])[i];
    if(!it)return '<div class="sheet-note">此物已不在囊中。</div>';
    itemFlags(it);
    const pawn=it.pawnable?`<button class="btn btn-primary" style="letter-spacing:.1em;text-indent:.1em" onclick="Game.pawnItem(${i})">典卖 · 约得银 ${pawnPrice(it)} 两</button>`
      :`<button class="btn" disabled style="opacity:.45;letter-spacing:.1em;text-indent:.1em">不可典卖</button>`;
    const usable=it.usable!==false;
    return `<div class="sec"><div class="sec-cap">${esc(it.name)}</div>
      <div class="itemrow"><span>件数</span><span class="cnt num">×${esc(it.count)}</span></div>
      ${it.src?`<div class="itemrow"><span>来历</span><span class="cnt">${esc(it.src)}</span></div>`:''}
      <div class="rowline" style="align-items:flex-start"><span style="flex:none">备注</span><span class="cnt" style="white-space:normal;text-align:right;max-width:70%">${esc(it.note||'—')}</span></div>
      <div class="itemrow"><span>可否使用</span><span class="cnt">${it.usable?'可':'不可'}</span></div>
      <div class="itemrow"><span>可否典卖</span><span class="cnt">${it.pawnable?'可':'不可'}</span></div></div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      ${usable?`<button class="btn btn-primary" style="letter-spacing:.1em;text-indent:.1em" onclick="Game.useItem(${i})">使用（耗精力 ${focusEnergyCost('使用道具')}）</button>`:`<button class="btn" disabled style="opacity:.45;letter-spacing:.1em;text-indent:.1em">不可使用</button>`}
      ${pawn}</div>
      <button class="backbtn" onclick="UI.sheetBack()">◀ 返回行囊</button>`;
  },
  sheetShop(){
    const p=state.protagonist||{};const shop=(state.system&&state.system.shop)||[];
    const rows=shop.map((it,i)=>{
      const pending=it.status==='待生效';
      const sold=it.status==='已购'||it.status==='已用';
      const lbl=pending?'待生效':(sold?it.status:'购买');
      const own=it.name==='读心笺'?` · 持有 ×${(state.inventory||[]).filter(x=>x.name==='读心笺').reduce((a,x)=>a+(Number(x.count)||0),0)}`:'';
      return `<div class="itemrow"><span>${esc(it.name)}</span><span class="cnt">积分 ${esc(it.cost)}${own}${it.status?` · ${esc(it.status)}`:''}</span>
        <button style="flex:none;min-width:64px;min-height:34px;border-radius:8px;border:1px solid ${sold?'var(--line)':'var(--cinnabar)'};color:${sold?'var(--ink-soft)':'var(--cinnabar)'};font-size:13px" ${sold||pending?'disabled':''} onclick="Game.buyItem(${i})">${lbl}</button></div>`;
    }).join('');
    return `<div class="sec"><div class="sec-cap">宫斗系统 · 商城</div>
      <div class="sheet-note" style="margin:0 0 6px">可用积分：<b class="num">${esc(p.points??0)}</b> · 购买即扣，下轮生效</div>${rows||'商城暂无物品'}</div>`;
  },
  relBadge(who){
    const r=(state.relationships||{})[who];
    const isObj=r&&typeof r==='object';
    const val=isObj?r.value:r;const note=isObj?(r.note||''):String(r||'');
    const num=(typeof val==='number')?val:null;
    const cls=num==null?'p-mid':(num>=50?'p-good':(num>0?'p-mid':'p-bad'));
    const tag=num==null?'—':(num>=50?'往来密切':(num>=20?'相熟':(num>0?'相识':(num===0?'初识':'有隙')))); // 只按数值客观描述熟悉程度：不用友善/敌意等感情词，也不采信模型自填的 type/note 标签
    return `<span class="relpill ${cls}">${esc(tag)}</span><span class="rel-v num">${num==null?'':num}</span>`;
  },
  sheetNpcs(){
    const npcs=state.npcs||{};
    const ids=Object.keys(npcs).filter(id=>npcs[id].known);
    const rels=Object.keys(state.relationships||{});
    const metOnly=rels.filter(who=>!ids.includes(who));
    if(!ids.length&&!metOnly.length)return '<div class="sec"><div class="sheet-note">尚无相识之人。</div></div>';
    const row=who=>this.npcRowHtml(who,`UI.goSheet('NPC详情','${esc(who)}')`);
    return `<div class="sec"><div class="sec-cap">人物谱（${ids.length+metOnly.length}）</div>`+
      ids.map(row).join('')+
      metOnly.map(row).join('')+
      `</div>`;
  },
  mindSection(id){ // 她对你：默认不可知；印象位即按钮，点击即耗读心笺一张即时生成，不落档
    const v=impView[id];
    if(v&&typeof v==='object')return `<div class="rel"><span class="rel-v" style="width:auto">${esc(v.text)}</span></div><div class="sheet-note">——读心所见，止于第 ${xunNoOf(v.turn)} 旬；要知如今，再点一次。</div>`;
    if(v==='…')return '<div class="sheet-note">笺上火光一闪，她的影子正在笺上聚拢……</div>';
    const own=(state.inventory||[]).filter(x=>x.name==='读心笺').reduce((a,x)=>a+(Number(x.count)||0),0);
    if(own)return `<button class="npcrow" style="width:100%" onclick="Game.readMind('${esc(id)}')"><span class="nr-name">她心底如何看待你——不可知</span><span class="nr-depth">读心笺 ×1 · 点击窥心</span></button><div class="sheet-note">囊中尚有 ${own} 张；点击即消耗一张，即时窥见此刻心意。</div>`;
    return '<div class="sheet-note">她待你如何，只在言行举止间露出三分；真实心意，无从揣度。读心笺可在商城以积分购得。</div>';
  },
  sheetNpcDetail(id){
    const n=(state.npcs||{})[id];
    if(!n){ // 只知名讳：暂无双层档案，先给关系概况
      return `<button class="backbtn" onclick="UI.sheetBack()">◀ 返回人物谱</button>
      <div class="sec"><div class="sec-cap">概况</div>
        <div class="rowline"><span class="rk">称谓</span><span class="rv">${esc(id)}</span></div>
        <div class="rowline"><span class="rk">关系</span><span class="rv">${this.relBadge(id)}</span></div>
        <div class="rowline"><span class="rk">相识</span><span class="rv">—</span></div></div>
      <div class="sheet-note">尚无档案。</div>`;
    }
    const prof=n.profile||{};
    const imp=prof.impressions||{};
    const me=state.protagonist.name||'主控';
    const impRow=([who,v])=>`<div class="rel"><span class="rel-nm">${esc(who)}</span><span class="rel-v" style="width:auto">${esc(v.note||v.tag||'')}</span></div>`;
    const impOther=Object.entries(imp).filter(([w])=>w!==me).map(impRow).join('')||'<div class="sheet-note">未见她对旁人的表态。</div>';
    const bio=[...(prof.biography||[])].reverse().map(e=>`<div class="tl-item"><div class="tl-time">${esc(e.time)} ${e.src==='传闻'?'<span class="tag t-rumor">传闻·存疑</span>':`<span class="tag">${esc(e.src||'亲见')}</span>`}</div>${esc(e.text)}</div>`).join('');
    const recent=(prof.recent||[]).map(x=>`<div class="itemrow"><span>${esc(x)}</span></div>`).join('');
    const realName=n.realName||n.name||id, addr=n.name||id;
    const intel=n.skillIntel&&typeof n.skillIntel==='object'?n.skillIntel:{};
    const bond=bondValue(state,id);
    const intelSection=Object.keys(intel).map(name=>{
      const v=Number((n.skills||{})[name])||0;
      const selfHas=skillUnlocked(state.protagonist.skills||{},name);
      const bondOk=bond!=null&&bond>=SKILL_TEACH_BOND;
      const act=selfHas
        ?'<div class="sheet-note">此艺你已入门，不必再学。</div>'
        :(!(v>SKILL_TEACH_MIN)
          ?'<div class="sheet-note">她于此道未至精熟，教不了人。</div>'
          :(bondOk?`<div class="setbtns"><button class="btn btn-line" onclick="Game.askTeach('${esc(id)}','${esc(name)}')">当面求教「${esc(name)}」 · 精力 ${focusEnergyCost('求师')}</button></div>`
            :`<div class="sheet-note">交情尚浅（好感 ${bond??'—'}／${SKILL_TEACH_BOND}），她未必肯教。再往来些时日。</div>`));
      return `<div class="rowline"><span class="rk">${esc(name)}</span><span class="rv num">${esc(v)} · ${SKILL_LEVEL(v)}</span></div>${act}`;
    }).join('');
    return `<button class="backbtn" onclick="UI.sheetBack()">◀ 返回人物谱</button>
      <div class="sec"><div class="sec-cap">概况</div>
        <div class="nd-head">${avatarHtml(id,'nd-av')}<div><div class="nd-nm">${esc(realName)}</div><div class="nd-rk">${esc([n.rank,n.faction].filter(Boolean).join(' · ')||'宫中之人')}</div></div></div>
        <div class="rowline"><span class="rk">本名</span><span class="rv">${esc(realName)}</span></div>
        ${addr!==realName?`<div class="rowline"><span class="rk">称谓</span><span class="rv">${esc(addr)}</span></div>`:''}
        ${n.rank?`<div class="rowline"><span class="rk">位份</span><span class="rv">${esc(n.rank)}</span></div>`:''}
        ${n.faction?`<div class="rowline"><span class="rk">派系</span><span class="rv">${esc(n.faction)}</span></div>`:''}
        <div class="rowline"><span class="rk">相识</span><span class="rv">${esc(n.metAt||'—')}</span></div>
        <div class="rowline"><span class="rk">解锁度</span><span class="rv">${esc(prof.depth||'初识')}</span></div></div>
      <div class="sec"><div class="sec-cap">已感知的性情</div>${normalizePersona(prof.traits).map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<div class="sheet-note">所知尚浅。</div>'}</div>
      <div class="sec"><div class="sec-cap">才艺见闻</div>${intelSection||'<div class="sheet-note">尚未听说她精于何艺。多来往，或问身边侍女打听。</div>'}</div>
      <div class="sec"><div class="sec-cap">她对你</div>${this.mindSection(id)}</div>
      <div class="sec"><div class="sec-cap">她对他人（据你所知）</div>${impOther}</div>
      <div class="sec"><div class="sec-cap">生平所知</div>${bio?`<div class="tl">${bio}</div>`:'<div class="sheet-note">还没有可记的往来。</div>'}</div>
      ${recent?`<div class="sec"><div class="sec-cap">最近动向</div>${recent}</div>`:''}`;
  },
  paneSaves(){
    const cur=state?`<div class="sheet-note">当前：第 ${xunNo()} 旬 · ${esc(fmtTime())}</div>`:'';
    const slotHtml=(key,label,auto)=>{
      let p=null;try{p=JSON.parse(localStorage.getItem(key))}catch(e){}
      const t=p?new Date(p.savedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      if(!p)return auto?`<div class="slot empty"><div class="sl-head">${label}</div><div class="sl-log">空档位</div></div>`
        :`<div class="slot empty"><div class="sl-head">${label}</div><div class="sl-log">空档位</div>
        <div class="sl-ops"><button onclick="Game.overwriteSlot('${key}')">存入当前进度</button></div></div>`;
      return `<div class="slot"><div class="sl-head">${label}<span class="sl-time num">${t} · 第${p.turn==null?'?':xunNoOf(p.turn)}旬</span></div>
        <div class="sl-log">${esc(p.log||'（无摘要）')}</div>
        <div class="sl-ops"><button onclick="Game.loadSlot('${key}',${auto?1:0})">读取</button>${auto?'':`<button onclick="Game.overwriteSlot('${key}')">覆盖</button>`}<button class="danger" onclick="Game.deleteSlot('${key}')">删除</button></div></div>`;
    };
    return cur+`<div class="sec"><div class="sec-cap">自动档</div>${slotHtml(SV.auto,'自动存档',true)}</div>
      <div class="sec"><div class="sec-cap">手动档</div>${[1,2,3].map(i=>slotHtml(SV.manual(i),'档位 '+i,false)).join('')}</div>
      <div class="setbtns"><button class="btn btn-ghost" onclick="Game.exportSave()">导出当前档</button><button class="btn btn-line" onclick="Game.importSave()">导入 JSON</button></div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="Game.onImportFile(this)">
      <div class="sheet-note">导入会直接覆盖当前进度，操作前请确认。</div>`;
  },
  sheetSettings(){
    return `<div class="setnav">
      <button class="${setPane==='存档'?'on':''}" onclick="Game.switchSetPane('存档')">存档</button>
      <button class="${setPane==='API'?'on':''}" onclick="Game.switchSetPane('API')">API 设置</button>
    </div>${setPane==='存档'?this.paneSaves():this.paneApi()}`;
  },
  paneApi(){
    const s=loadSettings();
    return `<div class="sec"><div class="sec-cap">模型服务</div>
      <div class="setrow"><span class="sk">API Key</span><input id="setKey" type="password" placeholder="sk-…" value="${esc(s.apiKey)}"></div>
      <div class="setrow"><span class="sk">接口地址</span><input id="setBase" placeholder="https://api.deepseek.com/v1" value="${esc(s.baseUrl)}"></div>
      <div class="setrow"><span class="sk">模型</span><input id="setModel" placeholder="deepseek-chat" value="${esc(s.model)}"></div>
      <div class="setrow"><span class="sk">流式输出</span><select id="setStream"><option value="1" ${s.stream!==false?'selected':''}>开启（边写边看，推荐）</option><option value="0" ${s.stream===false?'selected':''}>关闭（接口不支持流式时）</option></select></div>
      <div class="setrow"><span class="sk">外观</span><select id="setTheme"><option value="auto" ${s.theme==='auto'?'selected':''}>跟随系统</option><option value="light" ${s.theme==='light'?'selected':''}>宣纸（浅色）</option><option value="dark" ${s.theme==='dark'?'selected':''}>墨底（深色）</option></select></div>
      <div class="setbtns"><button class="btn btn-primary" onclick="Game.saveSettingsFromUI()">保存设置</button><button class="btn btn-line" id="btnTestApi" onclick="Game.testApi()">测试连通</button></div>
      <div id="apiTestRes" style="display:none;margin-top:10px;font-size:13px;line-height:1.7;border-radius:8px;padding:8px 10px"></div></div>
      <div class="sec"><div class="sec-cap">数据</div>
      <div class="setbtns"><button class="btn btn-line" onclick="Game.clearAll()">清空本地全部数据</button></div>
      <div class="sheet-note">Key 只保存在本机浏览器。</div></div>`;
  }
};

const WL_HIGH_RANKS = {
  '贵妃':'正二品 贵妃','贤妃':'从二品 贤妃','良妃':'从二品 良妃','淑妃':'从二品 淑妃',
  '德妃':'从二品 德妃','妃':'正三品 妃','贵嫔':'正四品 贵嫔','嫔':'从四品 嫔'
};
const WL_LOW_RANKS = {
  '贵人':'正五品 贵人','才人':'从五品 才人','美人':'正六品 美人','宝林':'从六品 宝林',
  '常在':'正七品 常在','答应':'从七品 答应','选侍':'正八品 选侍','更衣':'从八品 更衣','采女':'正九品 采女'
};

function wlPick(a){return a[Math.floor(Math.random()*a.length)]}
function wlInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function wlShuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=c[i];c[i]=c[j];c[j]=t}return c}
function wlPickN(a,n){return wlShuffle(a).slice(0,n)}

function buildOpeningWorld(proto){
  const d=wlPick(WORLD_LIB.dynasties);
  const era=wlPick(d.eras);
  const eraYear=wlInt(1,8);
  const emperor={
    name:d.surname+wlPick(WORLD_LIB.emperorNames),
    age:wlInt(20,30),
    traits:wlPick(WORLD_LIB.emperorTraits),
    health:wlPick(WORLD_LIB.emperorHealth),
    hobby:wlPick(WORLD_LIB.emperorHobbies)
  };
  const hasQueen=Math.random()<0.6;
  const dowager=Math.random()<0.7?Object.assign({},wlPick(WORLD_LIB.dowagers)):null;
  if(dowager&&!hasQueen)dowager.stance=dowager.stance.replace(/皇后/g,'主位');
  const time={era,year:eraYear,month:3,xun:'上旬'};
  const metAt=fmtTime(time);
  const used=new Set([proto.name, emperor.name, dowager?dowager.title:'']);
  const otherSurnames=WORLD_LIB.surnames.filter(x=>x!==d.surname);
  const takeName=(make)=>{
    for(let i=0;i<40;i++){const n=make();if(n&&!used.has(n)){used.add(n);return n}}
    return make()+wlInt(2,9);
  };
  const makeConsortName=(short)=>{ // 本名不入称谓：称谓随位份（姓+位份），本名另取且长期不变
    let surname=wlPick(otherSurnames),name='';
    for(let i=0;i<40;i++){
      const s=i?wlPick(otherSurnames):surname;
      if(!used.has(s+short)){surname=s;name=s+short;break}
    }
    if(name)used.add(name);else{name=surname+short+wlInt(2,9);used.add(name)}
    const realName=takeName(()=>surname+wlPick(WORLD_LIB.givenNames));
    return{name,realName};
  };

  /* 宫殿：中宫固定椒房殿，其余高位各占一宫 */
  const allPalaces=WORLD_LIB.palaces.slice();
  const jiaofang=allPalaces.find(p=>p.name==='椒房殿');
  const restPalaces=wlShuffle(allPalaces.filter(p=>p.name!=='椒房殿'));

  const consorts=[];
  const highTitles=wlPickN(['贵妃','贤妃','良妃','淑妃','德妃','妃','贵嫔','嫔','嫔','贵嫔'],wlInt(3,5));
  let palaceIdx=0;
  if(hasQueen){
    const surname=wlPick(otherSurnames.filter(x=>x!==proto.name.slice(0,1)));
    const realName=takeName(()=>surname+wlPick(WORLD_LIB.givenNames));
    const queenTraits=rollPersona(wlInt(1,2));
    const queen={name:takeName(()=>'皇后'+surname+'氏'), realName, rank:'正一品 皇后', short:'皇后',
      age:wlInt(21,29), palace:jiaofang, isQueen:true, faction:'',
      traits:queenTraits,
      family:wlPick(WORLD_LIB.highFamilies),
      hidden:{真实性情:personaLine(queenTraits,'最重中宫体面'), 当前目标:'稳住六宫次序，不让任何一派坐大', 对主控:'尚未留意'}};
    consorts.push(queen);
  }
  for(const short of highTitles){
    const palace=restPalaces[palaceIdx++];
    if(!palace)break;
    const rank=WL_HIGH_RANKS[short];
    const {name,realName}=makeConsortName(short);
    const traits=rollPersona(wlInt(1,3));
    consorts.push({name, realName, rank, short, age:wlInt(18,30), palace, isQueen:false, faction:'',
      traits,
      family:wlPick(WORLD_LIB.highFamilies),
      hidden:{
        真实性情:personaLine(traits),
        当前目标:wlPick(['争一争圣心','守住现有位份','扶持自己人','看清宫里谁可用']),
        对主控:'新入宫的低位妃嫔，先看主控的分量与用处'
      }});
  }

  /* 低位妃嫔：分居各宫侧殿 */
  const lowTitles=wlPickN(Object.keys(WL_LOW_RANKS),wlInt(5,7));
  const highForLow=consorts.filter(c=>!c.isQueen);
  for(const short of lowTitles){
    const rank=WL_LOW_RANKS[short];
    const {name,realName}=makeConsortName(short);
    const main=wlPick(highForLow);
    const traits=rollPersona(wlInt(1,2));
    consorts.push({name, realName, rank, short, age:wlInt(15,27), palace:main.palace, isQueen:false,
      faction:'', mainName:main.name,
      traits,
      family:wlPick(WORLD_LIB.lowFamilies),
      hidden:{
        真实性情:personaLine(traits),
        当前目标:wlPick(['熬出资历','攀上一门靠山','攒些银钱','不被人踩下去']),
        对主控:'同是低位，既可能结伴，也可能先踩一脚'
      }});
  }

  /* 派系：由高位妃嫔领衔 */
  const leaders=wlShuffle(consorts.filter(c=>c.isQueen||WL_HIGH_RANKS[c.short]));
  const factionCount=Math.min(3,Math.max(2,leaders.length));
  const factions=[];
  for(let i=0;i<factionCount;i++){
    const leader=leaders[i];if(!leader)break;
    const name=leader.isQueen?'中宫':leader.palace.name+'一系';
    const f={name,leader:leader.name,
      stance:leader.isQueen?'主和':wlPick(WORLD_LIB.factionStances),
      goal:leader.isQueen?'稳住中宫':wlPick(WORLD_LIB.factionGoals),members:[]};
    leader.faction=name;
    const memberPool=consorts.filter(x=>x!==leader&&!x.isQueen&&!leaders.includes(x));
    for(const c of wlPickN(memberPool,wlInt(1,2))){
      if(!c.faction){c.faction=name;f.members.push(c.name)}
    }
    factions.push(f);
  }
  for(const c of consorts){
    if(!c.faction&&factions.length&&Math.random()<0.35)c.faction=wlPick(factions).name;
  }

  /* 主控居所：选一位非皇后的高位主位 */
  const mainCandidates=consorts.filter(c=>!c.isQueen&&WL_HIGH_RANKS[c.short]);
  const main=wlPick(mainCandidates);
  const hall=/官女子/.test(proto.rank||'')?'配殿':'侧殿';
  const location=main.palace.name+hall;

  /* 皇嗣 */
  const maxConsortAge=Math.max(...consorts.map(c=>c.age));
  const maxHeirAge=Math.min(12,emperor.age-14,maxConsortAge-14);
  const heirCount=maxHeirAge<0?0:wlPick([0,0,1,1,1,2,2,3]);
  const heirs=[];
  const usedHeirGiven=new Set();
  for(let i=0;i<heirCount;i++){
    const age=wlInt(0,maxHeirAge);
    const mothers=consorts.filter(c=>c.age>=age+14);
    if(!mothers.length)continue;
    const mother=wlPick(mothers);
    let given=wlPick(WORLD_LIB.heirGiven.filter(g=>!usedHeirGiven.has(g)));
    if(!given)continue;
    usedHeirGiven.add(given);
    heirs.push({name:d.surname+given, given, gender:Math.random()<0.6?'皇子':'皇女',
      age, mother:mother.name, traits:wlPick(WORLD_LIB.heirTraits),
      学识:wlInt(20,60), 礼仪:wlInt(20,60), 体魄:wlInt(25,65), 依赖:wlInt(40,80)});
  }

  /* 关键下人 */
  const eunuch=wlPick(WORLD_LIB.eunuchs);
  const guard=wlPick(WORLD_LIB.guards);
  const headMaid=wlPick(WORLD_LIB.headMaids);
  const physician=wlPick(WORLD_LIB.physicians);
  const maids=wlPickN(WORLD_LIB.maids.filter(m=>m.name!==headMaid.name),2);

  const npcs={};
  const rels={};
  const addNpc=(name,rank,faction,traits,family,hidden,depth='初识',known=false,realName='',age=null)=>{
    if(!name||npcs[name])return;
    npcs[name]={known, metAt, name, rank, faction, realName, age,
      profile:{traits:normalizePersona(traits||[]), biography:family?[{time:metAt,text:`出身${family}`,src:'亲见'}]:[], impressions:{}, recent:[], depth},
      hidden:hidden||{}};
  };
  const addRelRaw=(who,val)=>{if(who&&!rels[who])rels[who]=val};
  const addRel=(who,type,value)=>addRelRaw(who,{type,value:clamp01_100(value)});

  addNpc('皇帝','皇帝','',[emperor.traits],'',{
    真实性情:emperor.traits, 在意:'旧物与“不取”；最厌被人拿命做局', 当前目标:'前朝与后宫都求一个稳', 对主控:'尚未留意'
  },'听说',true,emperor.name,emperor.age);
  addRel('皇帝','宠爱',0);

  if(dowager){
    addNpc('太后','太后','',[dowager.personality],dowager.family,{
      真实性情:dowager.personality, 健康:dowager.health, 当前目标:dowager.stance, 对主控:'先看行事，不急着表态'
    },'听说',true,'',50);
    addRel('太后','好感',wlInt(0,20));
  }

  for(const c of consorts){
    addNpc(c.name,c.rank,c.faction,c.traits,c.family,c.hidden,c.isQueen?'听说':'初识',c.isQueen,c.realName,c.age);
    if(c.isQueen)addRel(c.name,'好感',wlInt(0,15));
  }
  for(const h of heirs){
    addNpc(h.name,'皇嗣','',[h.traits],`生母${h.mother}`,{
      生母:h.mother, 性情:h.traits, 对主控:'尚不熟悉'
    },'初识',false,'',h.age);
  }
  for(const [role,person] of [['太监总管',eunuch],['侍卫总领',guard],['掌事姑姑',headMaid],['太医',physician]]){
    addNpc(person.name,role,'',[person.personality],'',{
      真实性情:person.personality, 对主控:'新主子的分量还看不准，先守着本分'
    },'初识',false,'',role==='太医'?40:role==='掌事姑姑'?38:role==='侍卫总领'?25:35);
  }
  for(const m of maids){
    addNpc(m.name,'宫女','',[m.personality],'',{
      真实性情:m.personality, 对主控:'刚分到新主子，且看主控待下人如何'
    },'初识',false,'',18);

  /* 主线任务与剧情账 */
  const quest=wlPick(WORLD_LIB.quests);
  let targetMonth=3+quest.months, targetYear=eraYear;
  if(targetMonth>12){targetMonth-=12;targetYear+=1}
  const latest=nextMonthSerial(time,targetMonth);
  const dueText=dueTextFor(time,targetMonth);
  const plot={id:'p-main-1',line:'主线',title:quest.title,stage:'进行中',earliest:nextMonthFirstSerial(time,targetMonth),latest,dueText,
    note:`${quest.desc}；${quest.hint}`};

  /* 初始行囊 */
  const inventory=[
    {name:'家传玉佩',count:1,note:'贴身之物，不典不卖',pawnable:false,usable:false,src:'家中所赠'},
    {name:'素缎帕子',count:2,note:'',pawnable:true,usable:false,src:'行囊'},
    {name:'宫花一匣',count:1,note:'入宫时内务府所发',pawnable:true,usable:false,src:'内务府'}
  ];
  if(/勋贵|宗室/.test(proto.family||''))inventory.push({name:'赤金缠枝簪',count:1,note:'家里压箱底的体面',pawnable:true,usable:false,src:'家中所赠'});

  const protagonist=JSON.parse(JSON.stringify(proto));
  protagonist.maids=maids.map(m=>m.name);
  protagonist.points=protagonist.points||0;
  protagonist.health=protagonist.health||'康健';
  protagonist.salary='每月6两，下旬末统一结算';
  protagonist.special='宫斗系统已激活；首个主线任务见剧情账';
  protagonist.security='入口两道手，药食先验';
  protagonist.settleRule='并行多事时主收益打折＋一项附带收益';

  const state={
    game:'带着系统去宫斗', saveVersion:'web-2', turn:0,
    time, location, lastNode:`选秀入宫，居${location}`,
    energy:100, energyWarned:false, mealCount:0,
    world:{
      dynasty:d.name, surname:d.surname, era, year:eraYear, years:d.years, flavor:d.flavor,
      emperor, dowager: dowager?{title:dowager.title, family:dowager.family, personality:dowager.personality, health:dowager.health, stance:dowager.stance}:null,

  ];

  return {
    state, text, tutorial,

    changes:[],
    todo:[`向主位${main.name}请安`,`主线期限：${dueText}`],

}
function unlockNpc(name,depth='听说'){ // 渐进解锁：听说过/打过交道后才进人物谱
  if(!state||!state.npcs)return;
  const n=state.npcs[name];if(!n)return;
  n.known=true;
  n.profile=n.profile||{traits:[],biography:[],impressions:{},recent:[],depth:'初识'};
  if(depth)n.profile.depth=depth;
  if(!state.relationships[name])state.relationships[name]={type:'好感',value:0};
  if(depth==='听说'&&Array.isArray(n.profile.biography)&&!n.profile.biography.some(b=>b.src==='传闻')){
    n.profile.biography.unshift({time:fmtTime(),text:'在宫中听人提起过此人',src:'传闻'});
  }
}

function sceneSpeaker(p,sc){ // 定对话对方：模型漏写 who 时，从台词里唯一能对上的人物取名，别一律显示"宫中来人"
  const raw=String((sc&&sc.who)||(p&&p.eventSource)||'').trim();
  if(raw&&!/^(宫中来人|来人|某人|众人|宫人|宫女|太监|不详|事发)$/.test(raw))return raw;
  const line=String((sc&&sc.line)||''); // 只认台词里点名的人：翻叙述猜人容易把传话太监错认成太后
  const npcs=(state&&state.npcs)||{};
  const hits=Object.keys(npcs).filter(id=>id&&id.length>=2&&line.includes(id));
  return hits.length===1?hits[0]:(raw||'宫中来人');
}

/* ============================================================ 游戏流程 */
const Game={
  /* 开局 */
  continueGame(){
    const cur=loadCurrent();
    if(cur){state=normalizeState(cur.state);history=cur.history||[];toast('已恢复本机进度（第'+xunNo()+'旬）')}
    else{state=normalizeState(JSON.parse(JSON.stringify(DEFAULT_SAVE)));history=[];toast('已载入 v36 存档：'+fmtTime())}
    persistCurrent(); // 旧档迁移（补精力、行囊、台账等）立即落盘，避免每次读档重复迁移
    pendingBuys=[];this.enterMain();
  },
  askNewGame(){ // 开新档入口（主界面）：有旧进度先确认覆盖
    if(loadCurrent()&&!confirm('开新档会替换本机当前进度（可在 设置→存档 先把旧档存入手动档位）。确认开新档？'))return;
    this.openCreator();
  },
  openCreator(){crRollAll();UI.show('#screen-create');renderCreator()},
  backToStart(){UI.show('#screen-start')},
  rollCreator(field){ // 单项重掷
    ({name:crRollName,age:crRollAge,family:()=>crRollFamily(),origin:crRollOrigin,persona:crRollPersona,look:crRollLook,attrs:crRollAttrs,skills:crRollSkills}[field]||(()=>{}))();
    renderCreator();
  },
  pickFamily(i){crRollFamily(i);renderCreator()},
  crSetName(v){cr.name=String(v||'').slice(0,8)||cr.name},
  rerollCreator(){crRollAll();renderCreator();toast('重新掷过了')},
  confirmCreate(){ // 捏定主控 → 本地世界书库组装其余世界
    const fam=CR_FAMILIES[cr.family];
    this._createdProtagonist={name:cr.name.trim()||'无名氏',age:cr.age,rank:fam.rank,
      family:`${fam.k}：${fam.d}`,origin:cr.origin,personality:normalizePersona(cr.persona),look:cr.look,
      attributes:Object.assign({},cr.attrs),skills:Object.assign({},cr.skills),
      constitutionBase:cr.constitutionBase||(cr.attrs&&cr.attrs['体质'])||50,
      silver:fam.silver,points:100,health:'康健',maids:[]};
    this.startWorldGen();
  },
  startWorldGen(){ // 本地世界书库随机开局：不调模型，瞬时组装
    if(!this._createdProtagonist){this.openCreator();return}
    UI.show('#screen-main');
    state=null;history=[];
    const stream=$('#stream');if(stream)stream.innerHTML='';cardCount=0;
    pendingBuys=[];soldNotes=[];lastUseIdx=null;sceneCtx=null;
    UI.showBusy('正在生成初始时代背景与宫册名录','从世界书库中抽取时代、帝后、妃嫔与派系——不必等模型落笔。',false);
    lastRequest={type:'newgame'};
    setTimeout(()=>{
      try{
        const built=buildOpeningWorld(this._createdProtagonist);
        state=normalizeState(built.state);
        history=[{turn:0,focus:'入宫',choice:'',narrative:built.text,log:'选秀入宫，系统激活'}];
        Game._openingOptions=built.options;
        Game._tutorialSteps=built.tutorial;
        UI.hideBusy();
        UI.updateStatusbar();
        UI.renderTurnCard({narrative:built.text,haremNews:built.news,changes:built.changes,todo:built.todo,hasEvent:true},{focus:'入宫'});
        persistCurrent();
        saveToSlot(0,true); // 新档立即入自动档
        phase='PROFILE';
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        $('#sheetTitle').textContent='主角档案';
        $('#sheetBody').innerHTML=UI.profileCard();
        const sc=$('.sheet-close');if(sc)sc.style.display='none'; // 强制确认档案，不能收起
        $('#scrim').classList.add('on');$('#sheet').classList.add('on');
      }catch(e){
        UI.hideBusy();
        this.handleCallErr(e);
      }
    },600);
  },
  /* 强制引导：五步走完才进第一旬 */
  showTutorial(){
    const steps=Game._tutorialSteps||[];
    if(!steps.length){this.openFocus();return}
    Game._tutorialIndex=0;
    this.renderTutorial();
    $('#tutorialModal').classList.add('on');
  },
  renderTutorial(){
    const steps=Game._tutorialSteps||[];const i=Game._tutorialIndex||0;const st=steps[i];if(!st)return;
    if(st.unlock&&st.unlock.length){ // 展示到这一步时解锁人物
      let changed=false;
      for(const name of st.unlock){const was=state.npcs[name]&&state.npcs[name].known;unlockNpc(name,st.depth||'初识');if(state.npcs[name]&&!was)changed=true}
      if(changed)persistCurrent();
    }
    $('#tutTitle').textContent=st.title;
    $('#tutBody').innerHTML=esc(st.text).replace(/\n/g,'<br>');
    $('#tutStep').textContent=`第 ${i+1} / ${steps.length} 步`;
    $('#tutBtn').textContent=(i>=steps.length-1)?'开始第一旬':'继续';
  },
  tutorialNext(){
    const steps=Game._tutorialSteps||[];
    if(Game._tutorialIndex>=steps.length-1){
      $('#tutorialModal').classList.remove('on');
      Game._tutorialSteps=null;
      this.openFocus();
      return;
    }
    Game._tutorialIndex++;
    this.renderTutorial();
  },
  /* 进入主界面 */
  enterMain(){
    UI.show('#screen-main');
    $('#stream').innerHTML='';cardCount=0;
    ensureXunBook(); // 本旬小结的起点快照
    UI.updateStatusbar();
    phase='FOCUS_SELECT'; // 住处即主界面：各热区与面板直接发起
    UI.goHome();
  },
  openFocus(){if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}UI.openSheet('吩咐')}, // 吩咐：自拟本旬要做的事
  hsGoOut(){if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}$('#mapClock').textContent=fmtTime();$('#mapview').classList.add('on')}, // 出门＝宫城图选目的地
  mapBack(){$('#mapview').classList.remove('on')},
  mapGo(place){ // 宫城图目的地：养心殿见驾、六宫访妃嫔、太医院问医、藏书阁寻书、御花园散步闲逛；出宫暂留空
    if(place==='养心殿'){this.visitNpc('皇帝');return}
    if(place==='六宫'){UI.openSheet('六宫');return}       // 不关宫城图：面板浮在图上，拜访落定由 settle 收图
    if(place==='太医院'){UI.openSheet('太医院');return}
    if(place==='藏书阁'){UI.openSheet('藏书阁');return}   // 暂未编目：先给入口，内容后补
    if(place==='御花园'){
      if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
      if((state.energy??0)<=0){$('#mapview').classList.remove('on');this.collapse();return}
      const hits=matchLeads(['御花园','花园','散步']);
      const phits=matchPending(['御花园','花园','散步']);
      const leadHint=hits.length?`\n【呼应引线】园中散步与在途引线相关：${hits.map(p=>`「${p.title}」（${p.line}）`).join('；')}。请让此番闲逛与之产生实质交集（撞见、听闻、想起要办的事），能推进的推进并回写台账，暂不能的也在 note 留一笔现状。`:'';
      const pendHint=phits.length?`\n【呼应待续】园中散步与待续琐事相关：${phits.map(x=>pendText(x)).join('；')}。请顺势办理或想起此事，办妥的从 statePatch.pending 移除，未办妥的更新现状。`:'';
      const walkNo=(Number(state.walkCount)||0)+1;state.walkCount=walkNo; // 康健收益每旬至多结算一次
      const ti=Number(state.protagonist&&state.protagonist.attributes&&state.protagonist.attributes['体质'])||0;
      const tb=Number(state.protagonist&&state.protagonist.constitutionBase)||0;
      const gainNote=(walkNo>1)?'本旬康健收益已结算过，此次只演见闻、体质不再提升。'
        :(tb>0&&ti>=tb)?'气血已达根基，散步只作维持、不再提升。'
        :'体质正常且无疾病时，本次散步体质+1（恢复气血）——请写入 changes 与 statePatch。';
      const msg=`第${xunNo()}旬第一轮：玩家往御花园散步闲逛（本旬第 ${walkNo} 次，耗精力 ${focusEnergyCost('散步')}）。演绎一路物候风景与园中见闻：可触发偶遇、宫人闲话、物候小事等轻量事件；偶遇与宠爱顺其自然，稀有资源随缘。${gainNote}（同一旬高强度活动与康健收益不兼得。）${leadHint}${pendHint}`;
      this.round1(msg,'外出·御花园散步',focusEnergyCost('散步'),{leadIds:hits.map(p=>p.id),pendTexts:phits.map(pendText)}); // 宫城图不关：加载与结果都叠在图上，避免背景弹回房间
      return
    }
    toast(place+' · 暂未开放，敬请期待');
  },
  visitNpc(who){
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    if((state.energy??0)<=0){this.collapse();return}
    UI.closeSheet();
    const npc=(state.npcs&&state.npcs[who]&&(state.npcs[who].name||who))||who;
    const hits=matchLeads([who,npc]);
    const phits=matchPending([who,npc]);
    const leadHint=hits.length?`\n【呼应引线】此人与在途引线相关：${hits.map(p=>`「${p.title}」（${p.line}）`).join('；')}。请借此次会面推进或了结它：能兑现的当旬兑现并回写台账；暂不能了结的，也要让会面与之产生实质关联（新信息、态度变化、埋下下一步），并更新 note。`:'';
    const pendHint=phits.length?`\n【呼应待续】此次行动与待续琐事相关：${phits.map(x=>pendText(x)).join('；')}。请在本旬演绎中顺手办理或问起此事，办妥的从 statePatch.pending 移除；未办妥的更新一句现状（回写即重置挂账计旬）。`:'';

  nextTurn(){ // 休息，进入下一旬：旬数+1，精力回满，日历按两旬制推进
    state.turn=(state.turn||0)+1;state.energy=ENERGY_MAX;state.energyWarned=false;state.mealCount=0;state.walkCount=0;state.time=advanceTime(state.time);

  round1(msg,focus,cost,opts){
    ensureXunBook(); // 先记本旬起点，再发起行动
    phase='NARRATING';UI.showBusy('铺排中','正在铺排本旬剧情……',true);
    if(soldNotes.length){msg+=`\n另：主控已将 ${soldNotes.join('、')} 典卖换银（银两已自行囊前端结算，请在世界后台与传闻中承接，勿重复发银）。`}
    const adj=adjudicatePlots(opts&&opts.skipDice); // 旬首剧情裁决：到期/超期剧情与冷却状态（主动触发时骰子让位）
    Game._lastAdj=adj;Game._lastFocus=focus; // 供剧情场景收尾与纪事摘要
    if(adj.text)msg+='\n'+adj.text;
    lastRequest={type:'r1',msg,focus,cost,opts};
    const settle=p=>{
      $('#mapview').classList.remove('on'); // 目的地行动落定即收起宫城图（加载层 z-60 本就叠在图上）
      UI.hideBusy();
      pendingBuys=[];soldNotes=[];lastUseIdx=null;
      finalize(p,{focus,adj});
      logXunAction(focus);
      if(opts&&opts.leadIds&&opts.leadIds.length){ // 与本次行动相关的引线：主动推进过，刷新 touch（不兑现也不发酵）
        const now=xunSerial(state.time);
        for(const id of opts.leadIds){const pl=(state.plots||[]).find(x=>x.id===id&&x.stage==='进行中');if(pl)pl.touch=now}
      }
      if(opts&&opts.pendTexts&&opts.pendTexts.length){ // 相关的待续琐事同理：办过问过即刷新挂账计旬
        for(const t of opts.pendTexts){const it=(state.pending||[]).find(x=>pendText(x)===t);if(it)it.touch=state.turn}
      }
      const meta=ensurePlotMeta();
      if(p.hasEvent||adj.due.length||adj.overdue.length)meta.lastEventTurn=state.turn;
      if(isMajorTurn(p.statePatch,p))meta.lastBigTurn=state.turn;
      if(adj.hit){meta.rollHit=false;meta.rollTargetId=null} // 本旬骰子已用毕，同旬后续行动不再重复强制
      state.energy=Math.max(0,Math.min(ENERGY_MAX,Math.round((typeof state.energy==='number'?state.energy:ENERGY_MAX)-(typeof cost==='number'?cost:focusEnergyCost(focus)))));
      persistCurrent();UI.updateStatusbar();
      if(state.energy<=0){this.collapse();return}
      checkRestWarn();
      if(p.hasEvent&&(p.scene||(Array.isArray(p.options)&&p.options.length))){this.showIncident(p)} // 先弹"事发"简报，确认后进剧情对话
      else{ // 无事发生：本旬结果原地弹窗呈现，不再经纪事中转
        const todo=(p.todo&&p.todo.length)?['待续：'+p.todo.join('；')]:[];
        UI.actResult(focus,filterText(p.narrative),todo);
      }
    };
    callModel(msg).then(raw=>{
      const p0=parsePayload(raw);
      const noEvent=(this._eventMandated(adj)||(opts&&opts._xunPop))&&!p0.hasEvent; // 裁决要求触发而模型没触发：仍纠正一次（旬首发酵弹出为硬强制）
      if(noEvent){
        const fixMsg=msg+`\n【纠正】前端剧情裁决已裁定本旬必须触发剧情（${this._mandateText(adj)}），你却输出 hasEvent=false。请重新输出完整 JSON：hasEvent=true，用剧情对话 scene 结构呈现本轮剧情（scene.state="ongoing"、scene.line 为对方的话或动作、顶层 options 给 2—4 个接话选项），停下等待玩家应对、不结算后果；本旬养成过程简要并入 narrative。`;
        lastRequest={type:'r1',msg:fixMsg,focus,cost,opts};
        UI.showBusy('铺排中','正在重新生成剧情……',true);
        return callModel(fixMsg).then(raw2=>settle(parsePayload(raw2)));
      }
      settle(p0);
    }).catch(e=>{UI.hideBusy();this.handleCallErr(e)});
  },
  /* 剧情触发判定辅助：裁决是否强制本旬出剧情（到期/超期/剧情骰命中） */
  _eventMandated(adj){return !!(adj&&(adj.due&&adj.due.length||adj.overdue&&adj.overdue.length||adj.hit))},
  _mandateText(adj){
    if(!adj)return '';
    const names=[...(adj.overdue||[]),...(adj.due||[])].map(p=>`「${p.title}」到期须兑现`);
    if(adj.stale&&adj.stale.length)names.push(`「${adj.stale.map(p=>p.title).join('」「')}」发酵须处置`);
    if(adj.pendStale&&adj.pendStale.length)names.push(`待续琐事（${adj.pendStale.map(pendText).join('；')}）发酵须处置`);
    if(adj.target)names.push(`剧情骰命中「${adj.target.title}」须在途线后续`);
    else if(adj.hit)names.push('剧情骰命中须开全新引子');
    return names.join('；')||'剧情骰命中';
  },
  showIncident(p){ // 事发简报：说明发生了什么事，确认后进全屏对话应对
    const adj=Game._lastAdj||{due:[],overdue:[],target:null,hit:false};
    const sc=p.scene||{};
    const plot=adj.target||[...(adj.overdue||[]),...(adj.due||[])][0]||(adj.stale||[])[0];
    const who=sceneSpeaker(p,sc);
    const title=plot?plot.title:(who==='宫中来人'?'事发':who);
    const meta=[sc.when,sc.where].filter(Boolean).join('｜');
    const lead=sc.line?filterText(sc.line):this.chatLead(p);
    const setup=filterText(p.narrative||'');
    const setupTail=setup?setup.split(/(?<=[。！？])/).filter(Boolean).slice(-2).join('').slice(-180):''; // 先交代在何处遇上谁，避免剧情凭空开始
    $('#incTitle').textContent=title==='事发'?'事发':'事发 · '+title;
    $('#incBody').innerHTML=(meta?`<div style="font-size:12px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:8px">${esc(meta)}</div>`:'')
      +(setupTail&&setupTail!==lead?`<div style="line-height:1.9;margin-bottom:8px">${esc(setupTail)}</div>`:'')
      +`<div style="line-height:1.9">${esc(lead)}</div>`;
    Game._pendingEvent=p;
    $('#incidentModal').classList.add('on');
  },
  incidentGo(){ // 简报确认：进入剧情对话界面
    $('#incidentModal').classList.remove('on');
    const p=Game._pendingEvent;Game._pendingEvent=null;
    if(!p){phase='FOCUS_SELECT';UI.goHome();return}
    if(p.scene){this.openScene(p);return}
    if(Array.isArray(p.options)&&p.options.length){currentEvent={options:p.options};this.openChat(p);return}
    phase='FOCUS_SELECT';UI.goHome(); // 事发却没有可应对内容：退回主界面，别把玩家留在死状态
  },
  /* 剧情对话（旧两轮制退路）：事件未给 scene 结构时使用的聊天式应对 */
  openChat(p){
    phase='EVENT_CHOICE';
    const who=sceneSpeaker(p,p.scene);

  chatLead(p){ // 截取 narrative 末段当开场白
    const t=filterText(p.narrative||'');
    if(!t)return '（情势有变，请应对。）';
    const s=t.split(/(?<=[。！？])/);

  },
  bubble(side,name,text){ // side: npc 对方(左,头像+姓名) / me 主控(右) / narr 旁白(独立气泡) / sys 系统提示
    const body=$('#chatBody');
    const wrap=document.createElement('div');
    const b=document.createElement('div');
    b.className='bubble '+side;b.textContent=text;
    if(side==='npc'||side==='me'){
      const meName=(state&&state.protagonist&&state.protagonist.name)||'我';
      const who=side==='me'?meName:(name||'');
      wrap.className='msg '+side;
      wrap.insertAdjacentHTML('beforeend',avatarHtml(who,'mav'));
      const col=document.createElement('div');col.className='mcol';
      const whoEl=document.createElement('div');whoEl.className='mwho';whoEl.textContent=who;
      col.appendChild(whoEl);col.appendChild(b);wrap.appendChild(col);
    }else{
      wrap.className='msg '+side;wrap.appendChild(b);
    }
    body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
    return wrap;
  },
  sayNarrative(text){ // 旁白回显：独立气泡，不配头像姓名；智能识别对话
    const parts=filterText(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    for(const line of parts){
      // 检测是否包含对话引号（「」『』“”或 ""）
      const hasDialog=/[「『“"]/.test(line);
      if(hasDialog && sceneCtx){
        const segments=[];
        const regex=/([「『“"])(.*?)([」』”"])/g;
        let lastIndex=0;
        let match;
        while((match=regex.exec(line))!==null){
          // 对话前的旁白
          if(match.index>lastIndex){
            segments.push({type:'narr',text:line.slice(lastIndex,match.index).trim()});
          }
          // 对话内容
          segments.push({type:'dialog',text:match[2].trim()});
          lastIndex=regex.lastIndex;
        }
        // 最后剩余的旁白
        if(lastIndex<line.length){
          segments.push({type:'narr',text:line.slice(lastIndex).trim()});
        }
        // 渲染各部分
        for(const seg of segments){
          if(!seg.text)continue;
          if(seg.type==='dialog'){
            this.bubble('npc',sceneCtx.who||'',seg.text);
            sceneCtx.lines.push({who:'npc',text:seg.text});
          }else{
            this.bubble('narr','',seg.text);
            sceneCtx.lines.push({who:'narr',text:seg.text});
          }
        }
      }else{
        // 无对话：整句作为旁白
        this.bubble('narr','',line);
        if(sceneCtx)sceneCtx.lines.push({who:'narr',text:line});
      }
    }
  },
  sayLine(text){ // 对方本轮话语：配其头像与姓名
    const parts=filterText(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    for(const line of parts){
      this.bubble('npc',sceneCtx?sceneCtx.who:'',line);
      if(sceneCtx)sceneCtx.lines.push({who:'npc',text:line});
    }
  },
  recordLine(who,text){if(sceneCtx&&text)sceneCtx.lines.push({who,text:String(text)})},

  chatRound2(choice){ // 旧两轮制聊天的第二轮：演绎 + 分句回显为气泡
    phase='RESOLVING';this.chatBusy(true);
    const msg=`第${xunNo()}旬第二轮：玩家应对「${choice}」。请演绎行动、他人反应与直接后果，统一结算本旬养成与剧情变化；hasEvent 必须为 false；若本旬应对使剧情线推进或了结，只经 statePatch.plots 回写发生变化的条目。`;
    lastRequest={type:'r2',msg,choice};
    callModel(msg).then(raw=>{
      const p=parsePayload(raw);
      const last=history[history.length-1];if(last)last.choice=choice;
      finalize(p,{focus:last?last.focus:'',choice,adj:Game._lastAdj});
      // 把叙事拆成气泡依次回显，随后给"继续"按钮
      const body=$('#chatBody');
      const parts=filterText(p.narrative||'').split(/(?<=[。！？；])/).filter(x=>x.trim());
      const step=()=>{
        if(parts.length){this.bubble('narr','',parts.shift().trim());body.scrollTop=body.scrollHeight;setTimeout(step,420)}
        else{
          $('#chatOpts').innerHTML='<button class="btn btn-primary" style="letter-spacing:.2em;text-indent:.2em" onclick="Game.chatDone()">继续</button>';
        }
      };
      setTimeout(step,300);
    }).catch(e=>{this.chatBusy(false);this.handleCallErr(e)});
  },
  chatDone(){
    phase='FOCUS_SELECT';
    currentEvent=null;
    $('#chatview').classList.remove('on');
    UI.goHome();toast('本旬事了');
  },
  /* 剧情场景：开场 → 多轮应对（点选项或自由接话）→ resolve 收尾统一结算 */
  openScene(p){
    phase='EVENT_CHOICE';
    const sc=p.scene||{};
    sceneCtx={who:sceneSpeaker(p,sc),round:1,lastOptions:Array.isArray(p.options)?p.options:(Array.isArray(sc.options)?sc.options:[]),lines:[]};
    $('#chatTitle').textContent='剧情对话 · '+sceneCtx.who;
    $('#chatAva').innerHTML=avatarHtml(sceneCtx.who);
    $('#chatClock').textContent=fmtTime();
    const body=$('#chatBody');body.innerHTML='';
    if(sc.when||sc.where)this.bubble('sys','',`${sc.when||''}${sc.when&&sc.where?'｜':''}${sc.where||''}`);
    if(p.narrative){this.sayNarrative(p.narrative);p._narrShown=true} // 触发剧情的当旬正文：先铺出在何处、如何遇上此人，再进第一句台词
    const opening=sc.line?filterText(sc.line):this.chatLead(p);
    sceneCtx.lines.push({who:'npc',text:opening});
    this.bubble('npc',sceneCtx.who,opening);
    $('#chatview').classList.add('on');
    if(sc.state==='resolve'){ // 一轮即收尾：直接结算，不给接话选项
      this._sceneResolve(p);
      return;
    }
    this.renderSceneOpts(sceneCtx.lastOptions);
  },
  renderSceneOpts(options){
    phase='EVENT_CHOICE';
    if(sceneCtx)sceneCtx.lastOptions=options||[];
    const box=$('#chatOpts');
    box.innerHTML=`<div class="cap">— 接话或行动 · 多接一句耗精力 ${SCENE_EXTRA_COST} —</div>`+
      (options||[]).map((o,i)=>`<button class="chat-opt" onclick="Game.scenePick(${i})">${esc(o.text||o)}</button>`).join('')+
      `<button class="chat-opt" onclick="Game.sceneEnd()">结束对话</button>`+
      `<div class="chat-act"><input id="chatInput" placeholder="接句话、或描述你的动作" onkeydown="if(event.key==='Enter')Game.sceneCustom()"><button class="go" onclick="Game.sceneCustom()">发送</button></div>`;
  },
  scenePick(i){
    if(phase!=='EVENT_CHOICE'||!sceneCtx)return;
    const opt=(sceneCtx.lastOptions||[])[i];if(!opt)return;
    this.bubble('me','',opt.text||String(opt));
    this.sceneRound(opt.text||String(opt));
  },
  sceneCustom(){
    if(phase!=='EVENT_CHOICE'||!sceneCtx)return;
    const v=$('#chatInput').value.trim();if(!v)return;
    this.bubble('me','',v);
    this.sceneRound(v);
  },
  sceneContextBlock(){ // 本场已发生对话，供模型承接；只取最近 10 句且每句截断
    if(!sceneCtx||!sceneCtx.lines.length)return '';
    const lines=sceneCtx.lines.slice(-10).map(l=>`${l.who==='me'?'玩家':l.who==='npc'?sceneCtx.who:'旁白'}：${String(l.text||'').slice(0,80)}`).join('\n');
    return `\n【本场对话记录】\n${lines}\n请承接以上对话，不要重复已说过的话。`;
  },
  requestScene(msg,choice,maxTokens,noHistory,compact){ // 场景请求统一出口：失败可重试，重试不重复扣精力
    phase='RESOLVING';this.chatBusy(true);
    lastRequest={type:'sc',msg,choice,maxTokens,noHistory,compact};
    const req={};if(maxTokens)req.maxTokens=maxTokens;
    if(compact)req.messages=[{role:'system',content:buildSceneSystem(sceneCtx?sceneCtx.who:'')},{role:'user',content:msg}]; // ongoing：精简提示词，不结算
    else if(noHistory)req.noHistory=true; // 收尾轮保留完整提示词，只省历史正文
    callModel(msg,req).then(raw=>{
      const p=parsePayload(raw);
      const sc=p.scene||{};
      const sopts=(Array.isArray(p.options)&&p.options.length)?p.options:(Array.isArray(sc.options)?sc.options:[]);
      if(compact){ // 精简轮只演对方这一句，不 resolve、不结算；收尾留给「结束对话」或轮数上限
        phase='EVENT_CHOICE';
        if(sc.when||sc.where)this.bubble('sys','',`${sc.when||''}${sc.when&&sc.where?'｜':''}${sc.where||''}`);
        const line=sc.line?filterText(sc.line):(p.narrative?this.chatLead(p):'');
        if(line)this.sayLine(line);
        this.renderSceneOpts(sopts);
        $('#chatBody').scrollTop=$('#chatBody').scrollHeight;
        return;
      }
      // 模型没给 resolve、也没给台词和选项：按收尾处理，避免卡在只有"结束对话"的死循环
      if(sc.state==='resolve'||(!sc.line&&!sopts.length)){this._sceneResolve(p);return}
      phase='EVENT_CHOICE';
      if(sc.when||sc.where)this.bubble('sys','',`${sc.when||''}${sc.when&&sc.where?'｜':''}${sc.where||''}`);
      if(sc.line)this.sayLine(sc.line);
      this.renderSceneOpts(sopts);
      $('#chatBody').scrollTop=$('#chatBody').scrollHeight;
    }).catch(e=>{
      this.chatBusy(false);phase='EVENT_CHOICE';
      this.renderSceneOpts(sceneCtx?sceneCtx.lastOptions||[]:[]);
      if(e.name==='AbortError'){toast('已取消');return}
      this.handleCallErr(e);
    });
  },
  sceneRound(choice){
    if(!sceneCtx)return;
    if(sceneCtx.standalone&&!sceneCtx.logged){logXunAction('问话·'+sceneCtx.who);sceneCtx.logged=true}
    if((state.energy??0)<SCENE_EXTRA_COST){toast('精力将尽，这话说不成了——不如就此打住');phase='EVENT_CHOICE';this.renderSceneOpts(sceneCtx.lastOptions||[]);return}
    state.energy=Math.max(0,Math.round(state.energy-SCENE_EXTRA_COST));UI.updateStatusbar();checkRestWarn(); // 多接一句的代价
    this.recordLine('me',choice);
    sceneCtx.round++;
    const r=sceneCtx.round,cap=r>=SCENE_MAX_ROUNDS;
    const settlement=sceneCtx.standalone
      ?'并收束这场问话：只结算它实际带来的关系、情报、差事与行囊变化；主角才艺与属性成长留到旬末小结，修习、散步等与问话无关的收益也留到那时。没有变化就不写 changes。'
      :'并一并完整结算本旬养成与剧情（narrative 收尾、changes、statePatch，含 statePatch.plots 的变动条目）。';
    const msg=`第${xunNo()}旬剧情对话第${r}轮：玩家应对「${choice}」。只演绎${sceneCtx.who}的当即反应与场面变化：输出 scene.line（≤70 字，对方本轮的话或动作）、scene.where/when（有变化才写）、scene.state 与 2—3 个接话选项；此阶段不结算数值。${cap?`本场对话已达上限，本轮 scene.state 必须为"resolve"，${settlement}`:'本轮只演 ongoing：narrative 留空字符串，changes=[]，statePatch={}，只写 scene 与 options；即使话已说尽，也只写对方收束性的一句，由玩家选择「结束对话」。'}`+this.sceneContextBlock();
    this.requestScene(msg,choice,MAX_OUTPUT_TOKENS,!cap,!cap); // 未到上限：精简提示词 + 不带历史；到上限：完整提示词收尾结算
  },
  sceneEnd(){ // 玩家主动结束：对方应声简短收尾，统一结算（不耗精力）；本地开场且一言未发则不调 API、不结算
    if(phase!=='EVENT_CHOICE'||!sceneCtx)return;
    this.bubble('me','','（结束对话）');
    this.recordLine('me','（结束对话）');
    const said=sceneCtx.lines.some(l=>l.who==='me'&&l.text!=='（结束对话）');
    if(sceneCtx.local&&!said){
      const bye=['“奴婢省得，小主早些安置。”她福身退下，帘子轻轻一落，屋里静下来。','“那奴婢不打扰小主了。”她敛衽一礼，悄声退出去。','“小主若有事，再唤奴婢。”她放下帘子，退了出去。'][Math.floor(Math.random()*3)];
      phase='RESOLVING';
      this.bubble('npc',sceneCtx.who,bye);
      $('#chatOpts').innerHTML='<button class="btn btn-primary" style="letter-spacing:.2em;text-indent:.2em" onclick="Game.sceneDone()">继续</button>';
      return;
    }
    const settle=sceneCtx.standalone
      ?'这只是一位宫中人在旬中回话，并非本旬养成重心：只结算这场问话实际带来的关系、情报、交办差事与行囊变化；主角才艺与属性成长留到旬末小结，修习、散步等无关收益也留到那时。没有变化就不写 changes。'
      :'并完整结算本旬养成与剧情（changes、statePatch，含 statePatch.plots 的变动条目）。';
    const msg=`第${xunNo()}旬剧情对话：玩家示意话已说完，结束与${sceneCtx.who}的对话。请收尾：scene.state="resolve"，补一段简短的收场演绎（narrative 一两句即可，如各自散去、欠身告退），${settle}收场只写本场已发生的事。`+this.sceneContextBlock();
    this.requestScene(msg,'（结束对话）');
  },
  _sceneResolve(p){
    phase='RESOLVING';
    const body=$('#chatBody');
    if(sceneCtx&&sceneCtx.standalone)p=stripStandaloneGrowth(p); // 旬中问话不结算本旬养成，兜底剔除模型硬塞的才艺/属性成长
    if(!p._narrShown)this.sayNarrative(p.narrative);
    finalize(p,{focus:Game._lastFocus||'剧情',choice:'剧情应对',adj:Game._lastAdj});
    body.scrollTop=body.scrollHeight;
    $('#chatOpts').innerHTML='<button class="btn btn-primary" style="letter-spacing:.2em;text-indent:.2em" onclick="Game.sceneDone()">继续</button>';
  },
  sceneDone(){
    phase='FOCUS_SELECT'; // 剧情收尾后必须复位，否则主界面所有行动都会被"请先结束当前旬务"挡下
    sceneCtx=null;currentEvent=null;
    $('#chatview').classList.remove('on');
    UI.goHome();toast('本旬事了');
  },
  pickOpening(i){
    if(phase!=='FOCUS_PICK'&&phase!=='FOCUS_SELECT')return;
    const list=Game._openingOptions||((currentEvent&&currentEvent.options)||[]).map(o=>o.text||String(o));
    const t=list[i];if(t==null)return;
    Game._openingOptions=null; // 首旬四选一只出现一次，之后"吩咐"回到自拟面板
    UI.closeSheet();
    this.round1(`第${xunNo()}旬第一轮：玩家消耗精力 ${focusEnergyCost(t)} 选定上旬生活重心「${t}」。按第一轮流程演绎本旬。`,t,focusEnergyCost(t));
  },
  cancelCall(){if(abortCtrl)abortCtrl.abort();UI.hideBusy();toast('已取消');
    if(lastRequest&&lastRequest.type==='sc'&&sceneCtx){phase='EVENT_CHOICE';this.renderSceneOpts(sceneCtx.lastOptions||[]);return}
    if(lastRequest&&lastRequest.type==='r2'){phase='EVENT_CHOICE';this.renderChatOpts(currentEvent.options)}else if(state){phase='FOCUS_SELECT';UI.goHome()}},
  handleCallErr(e){
    if(e.name==='AbortError')return;
    if(lastUseIdx!=null){const it=(state.inventory||[])[lastUseIdx];if(it){it.count=(Number(it.count)||0)+1;persistCurrent()}lastUseIdx=null} // 使用失败，件数回滚
    if(e.noKey){UI.errCard('尚未填写 API Key',null);return}
    if(e.empty){UI.errCard('生成失败：模型连续返回空内容（接口 JSON 模式偶发，已自动重试）',e.detail||'');return}
    UI.errCard('生成失败：'+e.message,[e.detail,e.raw].filter(Boolean).join('\n'));
  },
  retry(){
    if(!lastRequest)return;
    const r=lastRequest;
    if(r.type==='r1')this.round1(r.msg,r.focus,r.cost,r.opts);
    else if(r.type==='sc')this.requestScene(r.msg,r.choice,r.maxTokens,r.noHistory,r.compact);
    else if(r.type==='r2'){UI.showBusy('铺排中','正在结算本旬应对……',true);phase='RESOLVING';
      callModel(r.msg).then(raw=>{UI.hideBusy();const p=parsePayload(raw);const last=history[history.length-1];finalize(p,{focus:last?last.focus:'',choice:r.choice,adj:Game._lastAdj});UI.actResult(last?last.focus:'本旬行事',filterText(p.narrative),[])}).catch(e=>{UI.hideBusy();this.handleCallErr(e)})}
    else if(r.type==='newgame'){if(this._createdProtagonist)this.startWorldGen();else this.askNewGame()}
  },
  errRetry(){$('#errModal').classList.remove('on');this.retry()},
  errBackHome(){ // 请求失败后退出错误弹窗：不让玩家困在 NARRATING/RESOLVING 的死状态
    $('#errModal').classList.remove('on');
    phase='FOCUS_SELECT';sceneCtx=null;currentEvent=null;
    $('#chatview').classList.remove('on');$('#mapview').classList.remove('on');$('#chatOpts').innerHTML='';
    UI.hideBusy();UI.goHome();
  },
  /* 商城 */

  /* 才艺修习面板 */
  openSkills(){selSkill=null;UI.openSheet('才艺修习')},
  confirmSkill(){ // 本地即时结算：小进度 + 结果弹窗（不等 AI，避免请求失败时无反馈）
    if(!selSkill)return;
    const k=selSkill;selSkill=null;UI.closeSheet();

  localPractice(k){
    if(!state||!state.protagonist){toast('尚未开局');return}
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前应对');return}
    if((state.energy??0)<=0){this.collapse();return}
    ensureXunBook();
    const p=state.protagonist;
    p.skills=p.skills||{};
    const key=Object.keys(p.skills).find(x=>x.indexOf(k)>-1)||k;
    const before=Number(p.skills[key])||0;
    const cost=focusEnergyCost('才艺修习');
    const gain=1+Math.floor(Math.random()*3); // 1—3 点，符合世界书"普通一旬"
    p.skills[key]=clamp01_100(before+gain);
    state.energy=Math.max(0,Math.round(state.energy-cost));
    const flavor=[
      `你敛息凝神，一味苦修${k}，收势时指节微酸——但${k}确有进益。`,
      `这一旬心无旁骛，${k}进益${gain}点，${before<30?'虽仍生疏，倒也像了个样子':before<70?'日渐娴熟':'愈发精纯'}。`,
      `反复打磨之下，${k}又精进了${gain}点。宫人路过，都夸你勤勉。`,
      `灯下调息练到深夜，${k}小有进益，只稍觉乏累。`,
      `一段时日闷头修习，${k}涨了${gain}点，心中有数，脚下生风。`
    ][Math.floor(Math.random()*5)];
    history.push({turn:state.turn,focus:`才艺修习·${k}`,choice:'',narrative:flavor,log:`${k} +${gain}`});
    logXunAction(`才艺修习·${k}`);
    persistCurrent();UI.updateStatusbar();checkRestWarn();
    UI.actResult('才艺修习',flavor,[]);
    if(state.energy<=0)setTimeout(()=>this.collapse(),600);
  },
  askMaidSkill(k){ // 侍女打听：耗 5 精力，问出一位精于此道的能人，写入其 skillIntel
    if(!state||!state.protagonist){toast('尚未开局');return}
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    if((state.energy??0)<=0){this.collapse();return}
    ensureXunBook();
    const skillName=CR_SKILLNAME[k]||k;
    if(skillUnlocked(state.protagonist.skills||{},k)){toast('此艺已入门');return}
    const cost=5;
    const cands=[];
    for(const who in (state.npcs||{})){
      const n=state.npcs[who];if(!n)continue;
      const key=skillKeyIn(n.skills||{},k),v=key?Number(n.skills[key])||0:0;
      if(!(v>SKILL_TEACH_MIN))continue; // 只打听真正教得了的人
      if(n.skillIntel&&n.skillIntel[skillName])continue; // 已经听说了
      cands.push({who,n,v});
    }
    UI.closeSheet();
    const maids=(state.protagonist.maids||[]).filter(Boolean);
    const maid=maids.length?maids[Math.floor(Math.random()*maids.length)]:'身边的宫女';
    state.energy=Math.max(0,Math.round((state.energy??0)-cost));
    let flavor,deltas;
    if(cands.length){
      const c=cands[Math.floor(Math.random()*cands.length)];
      if(!c.n.known)unlockNpc(c.who,'听说');
      revealNpcSkill(c.n,skillName,'侍女打听');
      const name=c.n.name||c.n.realName||c.who;
      flavor=(c.who===maid)
        ?`你唤${maid}来问，她脸一红，低声道：“奴婢自己倒会些${skillName}，只是不敢说教得了小主。小主若不嫌弃，奴婢把知道的都说给您听。”`
        :`你唤${maid}来问，宫里谁在${skillName}上有真本事。她想了一会儿，压低声音道：“若说${skillName}，${name}是下过苦功的。小主若想学，怕是得亲自登门。”`;
      deltas=[`听说${name}精于${skillName}`];
      history.push({turn:state.turn,focus:`侍女打听·${skillName}`,choice:'',narrative:flavor,log:`听说${name}精于${skillName}`});
    }else{
      flavor=`你唤${maid}来问，她绞着帕子想了半晌，摇头道：“奴婢在宫里当差这些年，没听说谁在${skillName}上特别出挑。许是问错人了。”`;
      deltas=['未打听到新的能人'];
    }
    logXunAction(`侍女打听·${skillName}`);
    persistCurrent();UI.updateStatusbar();checkRestWarn();
    UI.actResult('侍女打听',flavor,deltas);
    if(state.energy<=0)setTimeout(()=>this.collapse(),600);
  },
  askTeach(who,k){ // 登门求师：须已知其才艺、好感达标、对方此艺精熟
    if(!state||!state.protagonist){toast('尚未开局');return}
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    if((state.energy??0)<=0){this.collapse();return}
    const n=(state.npcs||{})[who];if(!n)return;
    const skillName=CR_SKILLNAME[k]||k;
    if(skillUnlocked(state.protagonist.skills||{},k)){toast('此艺已入门');return}
    if(!(n.skillIntel&&n.skillIntel[skillName])){toast('你还不知道她擅此艺');return}
    const tKey=skillKeyIn(n.skills,k),tv=tKey?Number(n.skills[tKey])||0:0;
    if(!(tv>SKILL_TEACH_MIN)){toast('她于此道未至精熟，教不了人');return}
    const relVal=bondValue(state,who);
    if(!(relVal>=SKILL_TEACH_BOND)){toast(`交情尚浅（好感 ${relVal??0}／${SKILL_TEACH_BOND}）`);return}
    UI.closeSheet();
    const npc=n.realName||n.name||who;
    const hits=matchLeads([who,npc]);
    const phits=matchPending([who,npc]);
    const leadHint=hits.length?`\n【呼应引线】此人与在途引线相关：${hits.map(p=>`「${p.title}」（${p.line}）`).join('；')}。请借此次求师自然推进或了结它，能兑现的当旬兑现并回写台账。`:'';
    const pendHint=phits.length?`\n【呼应待续】此次求师与待续琐事相关：${phits.map(x=>pendText(x)).join('；')}。请在本旬演绎中顺手办理或问起此事，办妥的从 statePatch.pending 移除；未办妥的更新一句现状。`:'';
    const msg=`第${xunNo()}旬第一轮：玩家登门拜访「${npc}」，寒暄之后当面提起想学「${skillName}」。双方好感 ${relVal}（已过 ${SKILL_TEACH_BOND}），她于此艺精熟（${skillName} ${tv}，${SKILL_LEVEL(tv)}，高于 ${SKILL_TEACH_MIN}）。依她的性情，可以应允，也可先考较、提一个小条件或要一份人情。应允后本旬为拜师入门：在 statePatch 写入 protagonist.skills.${skillName} 为 5—10（刚入门的起点），changes 写明「习得${skillName}（入门）」，并把往后随她学艺的约定写入 pending。若她提出条件而玩家未应，可留作后续，待条件满足再判定学成。${leadHint}${pendHint}`;
    this.round1(msg,'求师·'+npc+'·'+skillName,focusEnergyCost('求师'),{skipDice:true,leadIds:hits.map(p=>p.id),pendTexts:phits.map(pendText)});
  },
  /* 行囊 */
  useItem(i){
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    if((state.energy??0)<=0){this.collapse();return}
    const it=(state.inventory||[])[i];if(!it||it.count<=0||it.usable===false)return;
    it.count-=1;const gone=it.count<=0;lastUseIdx=i;
    const label=`使用「${it.name}」`;
    const cost=focusEnergyCost('使用道具');
    const buyNote=pendingBuys.length?`\n本旬起生效的商城购买：${pendingBuys.join('、')}（积分已扣，请将其效果并入本旬结算与 statePatch）。`:'';
    UI.closeSheet();
    this.round1(`第${xunNo()}旬第一轮：玩家消耗精力 ${cost} ${label}（${gone?'已用尽':'尚余 '+it.count+' 件'}${it.note?'；'+it.note:''}）。演绎使用此物的具体过程与其效果，然后决定是否触发剧情（hasEvent）。${buyNote}`,label,cost);
  },
  pawnItem(i){
    const it=(state.inventory||[])[i];if(!it||!it.pawnable||it.count<=0)return;
    ensureXunBook();
    const price=pawnPrice(it);
    it.count-=1;if(it.count<=0)state.inventory.splice(i,1);
    state.protagonist.silver=Number(state.protagonist.silver||0)+price;
    soldNotes.push(`「${it.name}」典卖得银 ${price} 两`);
    logXunAction(`典当·${it.name}`);
    persistCurrent();UI.updateStatusbar();
    toast(`已典当「${it.name}」，银两变化记入旬末小结`);
    if(it.count<=0)UI.sheetBack();else UI.renderSheet('物品详情',i);
  },
  readMind(id){ // 读心笺：耗一张，专项轻量请求生成"她此刻对主控的印象"（不占回合、不耗精力、不落档；失败退回）
    if(abortCtrl){toast('已有请求进行中，稍候再试');return}
    const inv=state.inventory||[];
    const idx=inv.findIndex(it=>it.name==='读心笺'&&(Number(it.count)||0)>0);
    if(idx<0){toast('囊中没有读心笺，可在商城以积分购得');return}
    const npc=(state.npcs||{})[id];
    if(!npc){toast('此人尚无档案，无从窥起');return}
    inv[idx].count-=1;if(inv[idx].count<=0)inv.splice(idx,1);
    impView[id]='…';
    UI.renderSheet('NPC详情',id);
    const prof=npc.profile||{};
    const name=npc.name||id;
    const rel=(state.relationships||{})[id];
    const hist=history.slice(-14)
      .filter(h=>((h.narrative||'')+' '+(h.focus||'')+' '+(h.choice||'')).indexOf(name)>-1)
      .map(h=>`第${h.turn}旬「${h.focus}」${h.choice?('，应对「'+h.choice+'」'):''}：${(h.narrative||'').slice(0,150)}`);
    const sys='你是文字游戏《带着系统去宫斗》的主持人。这是一次【读心笺】系统道具查询，不是回合推进：不演绎剧情、不推进时间、不结算、不写 statePatch。依据所附该人物的完整真相（hidden）与她同主控的近期往来，写出此人此刻对主控的真实内心印象。只输出 JSON：{"impression":"…"}；impression 用第二人称称呼主控（行文中写“你”）、一两句、80字以内，可含她未曾表露的算计、戒备、轻蔑或柔情，但只写对你（主控）的印象，不写他人，不用 emoji。';
    const payload={who:name,hidden:npc.hidden||{},known:{traits:normalizePersona(prof.traits),recent:(prof.recent||[]).slice(-6),biography:(prof.biography||[]).slice(-8)},relationship:rel==null?null:rel,recentWithMe:hist,me:state.protagonist&&state.protagonist.name};
    const msg='请写出「她此刻对主控（行文中称“你”）的印象」，人物资料如下：\n'+JSON.stringify(payload);
    callModel(msg,{messages:[{role:'system',content:sys},{role:'user',content:msg}],maxTokens:220,expect:'impression'})
      .then(raw=>{
        let text='';
        try{const a=raw.indexOf('{'),b=raw.lastIndexOf('}');if(b>a)text=String((JSON.parse(raw.slice(a,b+1))||{}).impression||'').trim()}catch(e){}
        if(!text)throw new Error('模型未返回有效印象');
        impView[id]={text:text.slice(0,200),turn:state.turn};
        persistCurrent();UI.renderSheet('NPC详情',id);
      })
      .catch(e=>{
        impView[id]=null;
        addToInventory([{name:'读心笺',count:1,note:'系统道具：窥一人此刻对你的真实心意',usable:false,pawnable:false,src:'宫斗系统'}]); // 失败原数退回
        persistCurrent();UI.renderSheet('NPC详情',id);
        toast('窥心失败：'+(e.message||e));
      });
  },
  /* 存档操作 */
  loadSlot(key,auto){if(loadFromSlot(key)){UI.closeSheet();this.enterMain();toast('读档完成')}else toast('读取失败')},
  overwriteSlot(key){
    const i=key===SV.manual(1)?1:key===SV.manual(2)?2:3;
    const ok=state?saveToSlot(i,false):copyCurrentToSlot(key);
    if(ok){UI.renderSheet('设置');toast('已保存')}
    else toast(state?'保存失败':'当前没有可保存的进度');
  },
  deleteSlot(key){localStorage.removeItem(key);UI.renderSheet('设置');toast('已删除')},
  exportSave(){
    const blob=new Blob([JSON.stringify({game:'带着系统去宫斗',saveVersion:'web-1',exportedAt:new Date().toISOString(),state,history},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`红墙引-第${xunNo()}旬.json`;a.click();
  },
  importSave(){const f=$('#importFile');if(f)f.click()},
  onImportFile(input){
    const file=input.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{try{
      const p=JSON.parse(reader.result);
      const st=p.state||p;if(!st.protagonist)throw new Error('不是有效的存档');
      if(!confirm('导入将覆盖当前进度，确认？'))return;
      state=normalizeState(st);history=p.history||[];
      persistCurrent();UI.closeSheet();this.enterMain();toast('导入完成');
    }catch(e){toast('导入失败：'+e.message)}};
    reader.readAsText(file);input.value='';
  },
  /* 设置 */
  switchSetPane(p){setPane=p;UI.renderSheet('设置')},
  openSettings(p){if(p)setPane=p;UI.openSheet('设置')},
  saveSettingsFromUI(){
    saveSettings({apiKey:$('#setKey').value.trim(),baseUrl:$('#setBase').value.trim()||'https://api.deepseek.com/v1',model:$('#setModel').value.trim()||'deepseek-chat',theme:$('#setTheme').value,stream:$('#setStream').value!=='0'});
    toast('设置已保存');
  },
  testApi(){
    this.saveSettingsFromUI();
    const s=loadSettings();
    const res=$('#apiTestRes'),btn=$('#btnTestApi');
    if(!s.apiKey){res.style.display='block';res.style.background='var(--delta-up)';res.style.color='var(--cinnabar)';res.textContent='✕ 尚未填写 API Key';return}
    res.style.display='block';res.style.background='var(--paper-deep)';res.style.color='var(--ink-soft)';res.textContent='正在请求 '+s.baseUrl+' …';
    btn.disabled=true;
    const t0=Date.now();
    fetch(s.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body:JSON.stringify({model:s.model||'deepseek-chat',messages:[{role:'user',content:'ping'}],max_tokens:1})
    }).then(async r=>{
      const ms=Date.now()-t0;
      if(r.ok){
        let model='';try{model=(await r.json()).model||''}catch(e){}
        res.style.background='var(--delta-down)';res.style.color='var(--indigo)';
        res.textContent='✓ 连通正常（'+ms+'ms'+(model?' · '+model:'')+'）';
      }else{
        const txt=(await r.text().catch(()=>'')).slice(0,300);
        res.style.background='var(--delta-up)';res.style.color='var(--cinnabar)';
        res.textContent='✕ HTTP '+r.status+' '+r.statusText+(txt?'：'+txt:'');
      }
    }).catch(e=>{
      res.style.background='var(--delta-up)';res.style.color='var(--cinnabar)';
      res.textContent='✕ 请求失败：'+e.message+'（可能是网络不可达、跨域被拦截或地址填错）';
    }).finally(()=>{btn.disabled=false});
  },
  clearAll(){
    if(!confirm('将清空所有存档与设置，且不可恢复。确认？'))return;
    Object.keys(localStorage).filter(k=>k.startsWith('sgd_')).forEach(k=>localStorage.removeItem(k));
    location.href=location.pathname;
  }
};

/* 主角档案卡（新开局确认） */
UI.profileCard=function(){
  const p=state.protagonist;const at=p.attributes||{},sk=p.skills||{};
  const row=([k,v])=>`<div class="rowline"><span class="rk">${esc(k)}</span><span class="rv num">${esc(v)}</span></div>`;
  return `<div class="sec"><div class="sec-cap">主角档案</div>
    <div class="nd-head">${avatarHtml(p.name,'nd-av')}<div><div class="nd-nm">${esc(p.name||'—')}</div><div class="nd-rk">${esc([p.rank,(p.family||'').split('：')[0]].filter(Boolean).join(' · '))}</div></div></div>
    <div class="rowline"><span class="rk">姓名</span><span class="rv">${esc(p.name||'—')}</span></div>
    <div class="rowline"><span class="rk">位份</span><span class="rv">${esc(p.rank||'—')}</span></div>
    <div class="rowline"><span class="rk">家世</span><span class="rv">${esc(p.family||'—')}</span></div>
    <div class="rowline"><span class="rk">出身</span><span class="rv">${esc(p.origin||'—')}</span></div>
    <div class="rowline"><span class="rk">性情</span><span class="rv">${esc(normalizePersona(p.personality).join('、'))}</span></div>
    ${p.look?`<div class="rowline"><span class="rk">容貌</span><span class="rv">${esc(p.look)}</span></div>`:''}</div>
    <div class="sec"><div class="sec-cap">属性</div>${Object.entries(at).filter(([k])=>k!=='才华').map(([k,v])=>row([k==='体质'&&p.constitutionBase?`体质（根基${p.constitutionBase}）`:k,v])).join('')}</div>
    <div class="sec"><div class="sec-cap">才艺</div>${Object.entries(sk).map(row).join('')}<div class="rowline"><span class="rk">才华</span><span class="rv num">${esc(at.才华??'—')}</span></div></div>
    <div class="setbtns"><button class="btn btn-primary" onclick="Game.confirmProfile()">确认此档案，开始第一旬</button></div>`;
};
Game.confirmProfile=function(){
  phase='FOCUS_SELECT';
  const sc=$('.sheet-close');if(sc)sc.style.display='';
  UI.closeSheet();
  currentEvent={options:(Game._openingOptions||[]).map(t=>({text:t}))};
  Game.showTutorial(); // 五步引导走完，再进首旬安排
};

/* 兜底：未捕获异常至少给出可见提示，不再静默留下"空白/点不动"的界面 */
window.addEventListener('error',e=>{
  if(!e||!e.message)return;
  try{toast('脚本出错：'+e.message,6000)}catch(_){}
});
window.addEventListener('unhandledrejection',e=>{
  const r=e&&e.reason;if(!r||r.name==='AbortError')return;
  try{toast('脚本出错：'+((r&&(r.message||r))||'未知错误'),6000)}catch(_){}
});

/* DEV 实时预览：URL 加 ?dev=1 开启；文件保存后约 1.5s 自动刷新 */
if(location.search.indexOf('dev=1')>-1 || localStorage.getItem('devReload')==='1'){
  let _lm=null;
  setInterval(async()=>{
    try{
      const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
      const m=r.headers.get('Last-Modified');
      if(m&&_lm&&m!==_lm)location.reload();
      if(m)_lm=m;
    }catch(e){}
  },1500);
}
/* 键盘弹起时保证输入框可见 */
if(window.visualViewport){
  visualViewport.addEventListener('resize',()=>{
    const a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))setTimeout(()=>a.scrollIntoView({block:'center'}),80);
  });
}
window.addEventListener('resize',()=>UI.layoutHotspots());
/* 开屏主菜单：继续 / 开新档 / 设置（不再自动进入） */
(function(){
  setTimeout(()=>{
    const btn=document.getElementById('btnContinue');
    const cur=loadCurrent();
    if(cur&&cur.state){
      const t=cur.state.time||{};
      btn.innerHTML=`继续 · 第${(cur.state.turn||0)+1}旬${t.era?` · ${esc(t.era)}${toCN(t.year||1)}年`:''}`;
    }else{btn.disabled=true;btn.textContent='暂无本机进度 · 请开新档'}
  },900);
})();
</script>
