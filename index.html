<style>
/* ============================================================
   样式目录
   主题令牌 → 开局/捏人 → 主界面 → 叙事与对话 → 面板与弹窗
   ============================================================ */
@font-face{
  font-family:"Zhuque Fangsong";
  src:url("assets/fonts/zhuque-fangsong.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
/* ============================================================
   THEME · 深宫辞 v1 —— 翻译依据：design/TOKENS.md（覆盖 06 规范默认令牌）
   ============================================================ */
:root{
  --paper:#f5efe3; --paper-deep:#ede4d3; --card:#fdfbf5;
  --ink:#2b2620; --ink-soft:#6b6255;
  --cinnabar:#a63a2e; --cinnabar-deep:#8e2f24;
  --indigo:#2f4858; --gold:#b08d4a;
  --line:rgba(43,38,32,.14); --shadow:0 2px 12px rgba(43,38,32,.08);
  --scrim:rgba(43,38,32,.45);
  --delta-up:#f6e8e4; --delta-down:#e9edf0;
  --sans:"Zhuque Fangsong","STFangsong","FangSong","仿宋","Songti SC","STSong","宋体","SimSun",serif;
  --serif:"Zhuque Fangsong","STFangsong","FangSong","仿宋","Songti SC","STSong","宋体","SimSun",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sail:env(safe-area-inset-left,0px); --sair:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#1c1915; --paper-deep:#262119; --card:#2a241c;
  --ink:#efe7d7; --ink-soft:#a89c88;
  --cinnabar:#c85a4b; --cinnabar-deep:#b04a3c; --indigo:#7d99ab; --gold:#c8a869;
  --line:rgba(239,231,215,.16); --shadow:0 2px 12px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.55); --delta-up:#3a2b27; --delta-down:#26303a;
}}
:root[data-theme="dark"]{
  --paper:#1c1915; --paper-deep:#262119; --card:#2a241c;
  --ink:#efe7d7; --ink-soft:#a89c88;
  --cinnabar:#c85a4b; --cinnabar-deep:#b04a3c; --indigo:#7d99ab; --gold:#c8a869;
  --line:rgba(239,231,215,.16); --shadow:0 2px 12px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.55); --delta-up:#3a2b27; --delta-down:#26303a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--serif);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;overflow-x:hidden;min-height:100vh;min-height:100dvh}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font-family:inherit;color:var(--ink)}
.num,.tabbar,.hint,.sheet-close,.meter-v,.tag{font-family:var(--sans)}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}

/* ---------- ① 开局页 ---------- */
#screen-start{align-items:center;justify-content:center;text-align:center;padding:calc(var(--sat) + 40px) 32px calc(var(--sab) + 40px);position:relative}

#screen-start>*{position:relative;z-index:1}
.title-cal{font-size:52px;letter-spacing:.12em;color:var(--ink);font-family:var(--serif);font-weight:700;line-height:1.2}
.title-sub{margin-top:10px;font-size:14px;color:var(--ink-soft);letter-spacing:.18em}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin:26px 0 22px;color:var(--gold)}
.ornament::before,.ornament::after{content:"";width:64px;height:1px;background:var(--gold);opacity:.7}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border-radius:10px;font-size:15px;letter-spacing:.28em;text-indent:.28em}
.btn-primary{background:var(--cinnabar);color:#fdfbf5;box-shadow:var(--shadow)}
.btn-primary:active{background:var(--cinnabar-deep)}
.btn-ghost{border:1px solid var(--cinnabar);color:var(--cinnabar)}
.btn-line{border:1px solid var(--line);color:var(--ink-soft)}
.btn[disabled]{opacity:.45}
#screen-start .btn{margin-top:14px}

/* ---------- 捏主控 ---------- */
#screen-create{align-items:center;padding:calc(var(--sat) + 24px) 20px calc(var(--sab) + 24px)}
.create-wrap{width:min(560px,100%);display:flex;flex-direction:column;flex:1}
.create-head{text-align:center;margin-bottom:10px;position:relative}
.create-back{position:absolute;left:0;top:2px;font-size:14px;color:var(--ink-soft);padding:6px 8px}
.create-title{font-size:24px;letter-spacing:.22em;color:var(--ink)}
.create-sub{margin-top:6px;font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
#createBody{flex:1}
.cr-row{display:flex;align-items:flex-start;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}
.cr-k{width:60px;flex:none;font-size:14px;color:var(--ink-soft);padding-top:3px}
.cr-v{flex:1;min-width:0}
.cr-v input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;padding:2px 0;outline:none;color:var(--ink)}
.cr-txt{font-size:15px;line-height:1.8}
.cr-note{font-size:12px;color:var(--ink-soft);margin-top:2px}
.cr-dice{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);color:var(--cinnabar);font-size:15px;background:var(--card)}
.cr-chips{display:flex;flex-wrap:wrap;gap:8px}
.cr-chip{border:1px solid var(--line);border-radius:16px;padding:5px 14px;font-size:14px;background:var(--card)}
.cr-chip.on{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(200,84,60,.07)}
.cr-tags{display:flex;flex-wrap:wrap;gap:6px}
.cr-attrs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.cr-attrs b{font-family:var(--sans);font-weight:600}
.create-foot{display:flex;gap:10px;padding-top:16px}

/* ---------- 叙事流 ---------- */
.stream{flex:1;padding:16px 14px 12px;display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;margin:0 auto}
.turncard{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:16px 16px 14px;position:relative;overflow:hidden}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card-focus{font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.card-focus b{color:var(--indigo);font-weight:600}
.card-title{font-size:17px;line-height:1.4;margin-bottom:6px}
.card-body{font-size:15px;line-height:1.7;text-align:justify}
.card-body+.news,.card-body+.deltas{margin-top:12px}
.news{background:var(--delta-up);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.news b{color:var(--cinnabar);font-weight:600;font-size:12px;letter-spacing:.2em;display:block;margin-bottom:2px}
.deltas{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.delta{display:flex;align-items:center;gap:8px;background:var(--delta-up);border-left:3px solid var(--cinnabar);border-radius:0 6px 6px 0;padding:6px 10px;font-size:13px;font-family:var(--sans)}
.delta.down{background:var(--delta-down);border-left-color:var(--indigo)}
.delta .dv{margin-left:auto;font-weight:600;color:var(--cinnabar)}
.delta.down .dv{color:var(--indigo)}
.todo{margin-top:10px;font-size:12px;color:var(--ink-soft);line-height:1.7}
.todo b{color:var(--gold);font-weight:600;letter-spacing:.15em;font-size:12px}
.archive{margin-bottom:2px}
.archive summary{font-size:13px;color:var(--ink-soft);letter-spacing:.1em;padding:8px 0;text-align:center;list-style:none}
.archive summary::-webkit-details-marker{display:none}

/* ---------- 朱砂印章 ---------- */
.seal{flex:none;width:42px;min-height:42px;background:var(--cinnabar);color:#fdfbf5;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.35;letter-spacing:.05em;transform:rotate(-2deg);box-shadow:var(--shadow);padding:4px 2px;text-align:center}

/* ---------- 旬首安排 ---------- */
.focus-cap{font-size:13px;color:var(--gold);letter-spacing:.15em;margin:2px 0 8px}

/* ---------- 底部操作栏 ---------- */
.tabbar{position:sticky;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--sab))}
.tab{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-soft);letter-spacing:.1em}
.tab::before{content:"";width:4px;height:4px;border-radius:50%;background:transparent}
.tab.active{color:var(--cinnabar)}
.tab.active::before{background:var(--cinnabar)}
.tab:active{opacity:.6}

/* ---------- 查询面板（bottom sheet） ---------- */
.scrim{position:fixed;inset:0;z-index:31;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:32;background:var(--paper);border-radius:16px 16px 0 0;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,.35,1);padding-bottom:var(--sab)}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 10px;border-bottom:1px solid var(--line)}
.sheet-title{font-size:17px;letter-spacing:.1em}
.sheet-close{font-size:14px;color:var(--ink-soft);letter-spacing:.1em;min-height:44px;padding:0 4px}
.sheet-body{overflow-y:auto;padding:6px 18px 24px;-webkit-overflow-scrolling:touch}
.sec{margin-top:16px}
.sec-cap{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.15em;color:var(--ink);margin-bottom:8px}
.sec-cap::before{content:"";width:3px;height:14px;background:var(--cinnabar);border-radius:1px}
.meter{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px}
.meter-nm{flex:none;width:64px}
.meter-track{flex:1;height:3px;background:var(--paper-deep);border-radius:2px;overflow:hidden}
.meter-fill{display:block;height:100%;border-radius:2px}
.meter-v{flex:none;width:34px;text-align:right;font-size:13px;color:var(--ink-soft)}
.meter.m-cinnabar .meter-fill{background:var(--cinnabar)}.meter.m-indigo .meter-fill{background:var(--indigo)}
.meter.m-gold .meter-fill{background:var(--gold)}.meter.m-ink .meter-fill{background:var(--ink-soft)}
.rel{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px}
.rel-nm{flex:1}
.relpill{flex:none;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;letter-spacing:.12em}
.relpill.p-good{color:var(--gold)}.relpill.p-mid{color:var(--ink-soft)}.relpill.p-bad{color:var(--cinnabar)}
.rel-v{flex:none;width:64px;text-align:right;font-size:13px;color:var(--ink-soft)}
.itemrow{display:flex;align-items:center;gap:10px;min-height:38px;font-size:14px;border-bottom:1px dashed var(--line)}
.itemrow:last-child{border-bottom:0}
.itemrow .cnt{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.sheet-note{margin-top:18px;font-size:12px;color:var(--ink-soft);line-height:1.7}
.rowline{display:flex;align-items:center;gap:10px;min-height:42px;font-size:14px}
.rowline .rk{flex:none;width:64px;color:var(--ink-soft);font-size:14px}
.rowline .rv{flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--gold);color:var(--gold);letter-spacing:.1em;margin:2px 4px 2px 0}
.tag.t-rumor{border-color:var(--ink-soft);color:var(--ink-soft);border-style:dashed}
.itag{flex:none;font-size:10px;line-height:1.7;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap}
.itag.on{border-color:var(--gold);color:var(--gold)}

/* 设置/存档 */
.restmodal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(30,24,18,.45);padding:32px}
.restmodal.on{display:flex}
.rm-card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px;max-width:330px;width:100%}
.rm-title{font-size:16px;letter-spacing:.15em;text-align:center}
.rm-body{font-size:13px;line-height:1.8;color:var(--ink-soft);margin:12px 0 18px}
.xunsum{margin:2px 0 10px}
.xunsum .xs-cap{font-size:12px;letter-spacing:.15em;color:var(--gold);margin:12px 0 4px}
.xunsum .xs-row{font-size:13px;line-height:1.85;color:var(--ink);word-break:break-word}
.xunsum .xs-none{font-size:13px;line-height:1.85;color:var(--ink-soft)}
.act-note{font-size:11px;color:var(--ink-soft);line-height:1.7;margin-top:12px;padding-top:8px;border-top:1px dashed var(--line)}
.rm-ops{display:flex;gap:10px}
.rm-ops .btn{flex:1;min-height:44px;font-size:14px}
.setnav{display:flex;gap:8px;margin:2px 0 14px}
.setnav button{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:14px;letter-spacing:.08em}
.setnav button.on{border-color:var(--cinnabar);color:var(--cinnabar);background:rgba(191,66,53,.06)}
.setrow{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px dashed var(--line);font-size:14px}
.setrow .sk{flex:none;width:88px;color:var(--ink-soft);font-size:14px}
.setrow input,.setrow select{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 10px;font-size:15px;outline:none}
.setrow input:focus{border-color:var(--gold)}
.setbtns{display:flex;gap:10px;margin-top:16px}
.setbtns .btn{min-height:46px;font-size:15px;letter-spacing:.1em;text-indent:.1em}
.slot{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;margin-bottom:10px}
.slot .sl-head{display:flex;align-items:baseline;gap:8px;font-size:15px}
.slot .sl-time{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.slot .sl-log{font-size:13px;color:var(--ink-soft);margin:4px 0 8px;line-height:1.6}
.slot .sl-ops{display:flex;gap:8px}
.slot .sl-ops button{flex:1;min-height:38px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--indigo)}
.slot .sl-ops button.danger{color:var(--cinnabar)}
.slot.empty .sl-log{color:var(--ink-soft);font-style:italic}

/* NPC */
.npcrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border-bottom:1px dashed var(--line);font-size:15px;padding:6px 0}
.npcrow .nr-name{flex:none;min-width:88px}
.npcrow .nr-main{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;overflow:hidden}
.npcrow .nr-main .nr-name{flex:none;min-width:0;letter-spacing:.02em}
.npcrow .nr-role{flex:0 1 auto;min-width:0;font-size:11px;color:var(--ink-soft);opacity:.7;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateY(-1px)}
.npcrow .nr-depth{flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;letter-spacing:.1em}
.npcrow .nr-rel{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.nr-av{width:34px;height:34px;font-size:14px}
.nd-head{display:flex;align-items:center;gap:14px;margin:2px 0 12px}
.nd-av{width:64px;height:64px;border-radius:16px;font-size:26px}
.nd-head .nd-nm{font-size:19px;letter-spacing:.1em;line-height:1.3}
.nd-head .nd-rk{font-size:12px;color:var(--ink-soft);margin-top:3px;letter-spacing:.06em}
.tl{border-left:2px solid var(--line);margin-left:5px;padding-left:14px}
.tl-item{position:relative;padding-bottom:12px;font-size:14px;line-height:1.7}
.tl-item::before{content:"";position:absolute;left:-20px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tl-item .tl-time{font-size:12px;color:var(--ink-soft)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:14px;color:var(--indigo);margin-top:4px}


/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%) translateY(20px);z-index:40;background:var(--ink);color:var(--paper);font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;max-width:80vw;text-align:center;font-family:var(--sans)}
.toast.on{opacity:.92;transform:translateX(-50%) translateY(0)}

/* ============================================================
   THEME v2 增量 —— 依据：design/v2-深宫辞主界面（Kimi Design 定稿）
   整屏住处（无滚动）：顶栏/热区/精力条/tabbar 全部锁在视口内
   ============================================================ */
#screen-main{position:fixed;inset:0;overflow:hidden;background:#d8cdb8}
/* 房间图占满全屏，锚定底部（顶部可裁），热区按同一裁剪框换算坐标 */
.homebg{position:absolute;inset:0;z-index:0;background:url(assets/room.jpg) center bottom/cover no-repeat #d8cdb8}
.homebg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,25,18,.10),rgba(30,25,18,0) 18%,rgba(30,25,18,0) 72%,rgba(30,25,18,.22))}
/* 顶栏：时间盒 + 位份/银两/积分 */
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--indigo);color:#f5efe3;padding:calc(var(--sat) + 10px) 14px 10px;box-shadow:0 2px 10px rgba(30,25,18,.25)}
.tb-time{flex:none;border:1px solid rgba(245,239,227,.75);outline:1px solid rgba(245,239,227,.35);outline-offset:2px;border-radius:2px;padding:6px 12px;color:#f5efe3;font-size:14px;letter-spacing:.12em;display:flex;gap:10px;align-items:baseline;background:transparent}
.tb-stats{flex:1;display:flex;justify-content:space-around;gap:6px;text-align:center}
.tstat{display:flex;flex-direction:column;line-height:1.3;min-width:52px}
.tstat label{font-size:11px;color:rgba(245,239,227,.75)}
.tstat b{font-size:17px;font-weight:600}
/* 热区 */
.hotspots{position:absolute;inset:0;z-index:4}
.hotspots.sleeping{pointer-events:none}
/* 歇下一旬：屋内渐黑/渐暗遮罩 */
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease;z-index:6}
#dim.on{opacity:.88}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
.hs.hs-up{flex-direction:column-reverse} /* 文字在圆点上方：用于贴近底缘的物件（坐墩） */
.hs>i{width:20px;height:20px;border-radius:50%;border:3px solid #b0442f;background:rgba(253,251,245,.92);box-shadow:0 1px 5px rgba(30,25,18,.4);position:relative;flex:none}
.hs>i::after{content:'';position:absolute;top:-7px;right:-7px;width:9px;height:9px;border-radius:50%;background:#b0442f;border:1.5px solid rgba(253,251,245,.9)}
.hs>span{background:rgba(253,251,245,.95);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:14px;color:#33302A;box-shadow:0 2px 8px rgba(46,36,21,.25);white-space:nowrap}
.hs:active>span{background:var(--paper-deep)}
.hs-badge{margin-top:1px;background:#fdfbf5;border:1px solid #b0442f;color:#b0442f;border-radius:999px;padding:4px 12px;font-size:13px;white-space:nowrap;box-shadow:0 2px 8px rgba(46,36,21,.2)}
/* 精力条（三色，底部横条） */
.energyrow{position:absolute;left:0;right:0;bottom:calc(50px + var(--sab));z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;background:transparent;border-top:none}
.energyrow .elabel{font-size:15px;color:#33302A;flex:none;text-shadow:0 1px 3px rgba(245,239,227,.9),0 0 6px rgba(245,239,227,.7)}
.etrack{flex:1;height:12px;border-radius:999px;background:#e6dccb;border:1px solid rgba(43,38,32,.18);overflow:hidden}
.etrack>i{display:block;height:100%;border-radius:999px;transition:width .35s,background .35s}
.energyrow b{flex:none;font-size:14px;color:#33302A;min-width:64px;text-align:right;text-shadow:0 1px 3px rgba(245,239,227,.9),0 0 6px rgba(245,239,227,.7)}
#screen-main .tabbar{position:absolute;top:auto;left:0;right:0;bottom:0}
/* 底部胶囊按钮（弹窗/旬末用） */
/* 才艺修习面板（v2 圆角卡片网格） */
.skillgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.skillcell{min-height:60px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.skillcell .slv{font-size:12px;color:var(--ink-soft);font-family:var(--sans)}
.skillcell.sel{border-color:var(--cinnabar);color:var(--cinnabar)}
.skillcell.sel .slv{color:var(--cinnabar)}
.skillcell.lock{opacity:.42}
/* 传膳菜单 */
.mealhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:13px;color:var(--ink-soft)}
.mealhead span:first-child{color:var(--gold);letter-spacing:.1em}
.mealrow{display:flex;align-items:center;gap:8px;width:100%;min-height:58px;padding:8px 12px;margin-bottom:8px;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.mealrow .m-name{font-size:15px;flex:none}
.mealrow .m-tag{flex:none;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:1px 8px;letter-spacing:.06em}
.mealrow .m-meta{margin-left:auto;text-align:right;font-size:12px;line-height:1.6;color:var(--ink-soft);flex:none}
.mealrow .m-meta b{font-size:14px;font-weight:400;color:var(--cinnabar)}
.mealrow:disabled{opacity:.42;box-shadow:none}
/* v2 弹窗：圆角14 · 阴影 Y10 B30 · 遮罩 #241F18 80% */
.restmodal{background:rgba(36,31,24,.65)} /* 降低遮罩透明度，保留下层场景 */
.rm-card{border-radius:14px;box-shadow:0 10px 30px rgba(46,36,21,.4)}
.rm-ops .btn{border-radius:22px;letter-spacing:.1em}
/* 生成中动画省略号 */
.busy-dots i{display:inline-block;animation:bdot 1.2s infinite}
.busy-dots i:nth-child(2){animation-delay:.2s}
.busy-dots i:nth-child(3){animation-delay:.4s}
@keyframes bdot{0%,60%,100%{opacity:.15}30%{opacity:1}}
/* 铺排弹窗：随机诗句与出处 */
.busy-poem{font-size:15px;line-height:1.95;color:var(--ink);letter-spacing:.06em;animation:poemIn .45s ease both}
.busy-poem-src{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--ink-soft);letter-spacing:.04em;font-family:var(--sans);animation:poemIn .55s ease both}
@keyframes poemIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* 剧情对话：全屏聊天气泡界面 */
.chatview{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--paper)}
.chatview.on{display:flex}
.chat-head{flex:none;display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 14px 10px;background:var(--indigo);color:#f5efe3}
.chat-head button{color:#f5efe3;font-size:15px;min-height:34px;padding:0 4px}
.chat-head .ch-ava{display:flex;flex:none}
.chat-head .ch-ava .av{width:30px;height:30px;border-color:rgba(245,239,227,.4)}
.chat-head .ch-title{flex:1;font-size:16px;letter-spacing:.15em;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 12px 10px;display:flex;flex-direction:column;gap:14px}
@keyframes bin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg{display:flex;gap:9px;max-width:88%;align-self:flex-start;align-items:flex-start;animation:bin .22s}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .mcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.msg .mwho{font-size:11px;color:var(--ink-soft);letter-spacing:.1em;padding:0 3px;line-height:1}
.msg.me .mwho{text-align:right}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--card)}
.av.av-fb{display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--cinnabar);border-color:rgba(166,58,46,.45);letter-spacing:0}
.av.sm{width:30px;height:30px;font-size:13px}
.bubble{max-width:100%;padding:10px 14px;border-radius:14px;font-size:15px;line-height:1.7;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word}
.bubble.npc{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.bubble.me{background:var(--cinnabar);color:#fdfbf5;border-top-right-radius:4px}
.bubble.narr{align-self:center;width:94%;max-width:100%;background:var(--paper-deep);border:1px dashed var(--line);border-radius:10px;box-shadow:none;color:var(--ink-soft);font-size:14px;text-align:justify}
.bubble.narr::before{content:'旁 白';display:block;text-align:center;color:var(--gold);font-size:10px;letter-spacing:.6em;text-indent:.6em;margin-bottom:5px;opacity:.85}
.bubble.sys{align-self:center;background:transparent;box-shadow:none;color:var(--ink-soft);font-size:12px;padding:2px 8px;text-align:center}
.msg.typing .bubble{color:var(--ink-soft);font-size:13px;min-width:64px;text-align:center}
.chat-opts{flex:none;display:flex;flex-direction:column;gap:8px;padding:10px 14px calc(10px + var(--sab));border-top:1px solid var(--line);background:var(--card)}
.chat-opts .cap{font-size:12px;color:var(--gold);letter-spacing:.15em}
.chat-opt{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:8px 14px;font-size:15px;line-height:1.5}
.chat-opt:active{border-color:var(--cinnabar);color:var(--cinnabar)}
.chat-act{display:flex;gap:8px}
.chat-act input{flex:1;min-height:44px;border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:0 16px;font-size:15px;outline:none}
.chat-act .go{flex:none;min-width:64px;min-height:44px;border-radius:999px;background:var(--indigo);color:#f5efe3;font-size:14px;letter-spacing:.1em}
/* 宫城图：全屏目的地选择 */
.mapview{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--paper)}
.mapview.on{display:flex}
.map-head{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 10px) 14px 10px;background:var(--indigo);color:#f5efe3}
.map-head button{color:#f5efe3;font-size:15px;min-height:34px;padding:0 4px}
.map-head span{flex:1;font-size:16px;letter-spacing:.2em;text-align:center}
.map-bg{flex:1;position:relative;background:url(assets/map.jpg) center/cover no-repeat #d8cdb8}
</style>
</head>
<body>

<!-- ① 开局页：主菜单（继续 / 开新档 / 设置） -->
<!-- 禁止在开局页底部添加版本号、build、字体、素材、署名等任何说明小字（用户要求，永久生效） -->
<section id="screen-start" class="screen active">
  <div class="title-cal">红墙引</div>
  <div class="title-sub">带着系统去宫斗 · 旬回合养成</div>
  <div class="ornament">❦</div>
  <div style="width:min(300px,80vw)">
    <button id="btnContinue" class="btn btn-primary" onclick="Game.continueGame()">继续本机进度</button>
    <button class="btn btn-line" onclick="Game.askNewGame()">开新档</button>
    <button class="btn btn-ghost" onclick="Game.openSettings('API')">设置</button>
  </div>
</section>

<!-- ①b 捏主控：本地随机生成主控档案（demo），确认后一键生成皇帝妃嫔等其余世界 -->
<section id="screen-create" class="screen">
  <div class="create-wrap">
    <div class="create-head">
      <button class="create-back" onclick="Game.backToStart()">‹ 返回</button>
      <div class="create-title">捏主控</div>
      <div class="create-sub">凡展示过的档案即为确认事实，入宫后不可更改</div>
    </div>
    <div id="createBody"></div>
    <div class="create-foot">
      <button class="btn btn-line" onclick="Game.rerollCreator()">全部重掷</button>
      <button class="btn btn-primary" onclick="Game.confirmCreate()">以此档案入宫</button>
    </div>
  </div>
</section>

<!-- ② 主界面（住处 · 整屏交互；房间图占满全屏，锚定底部，顶部可裁） -->
<section id="screen-main" class="screen">
  <div class="homebg"></div>
  <div class="hotspots" id="hotspots">
    <button class="hs hs-up" data-x="0.20" data-y="0.92" onclick="Game.restFlow()"><i></i><span>歇下一旬</span></button>
    <button class="hs" data-x="0.12" data-y="0.50" onclick="Game.openFocus()"><i></i><span>吩咐</span><span class="hs-badge" id="hsBadge" style="display:none">有人扣门求见</span></button>
    <button class="hs" data-x="0.52" data-y="0.40" onclick="Game.hsGoOut()"><i></i><span>出门</span></button>
    <button class="hs" data-x="0.90" data-y="0.60" onclick="Game.openSkills()"><i></i><span>才艺修习</span></button>
    <button class="hs" data-x="0.93" data-y="0.80" onclick="Game.openMeal()"><i></i><span>传膳</span></button>
  </div>
  <div class="topbar num">
    <button class="tb-time" onclick="UI.openSheet('局面')"><span id="tbEra">—</span><span id="tbXun">—</span></button>
    <div class="tb-stats">
      <div class="tstat"><label>位份</label><b id="tbRank">—</b></div>
      <div class="tstat"><label>银两</label><b id="tbSilver">—</b></div>
      <button class="tstat" style="border:0;background:transparent;padding:0;margin:0;text-align:center;font-size:inherit;font-family:inherit;color:inherit;cursor:pointer;appearance:none;-webkit-appearance:none" onclick="Game.openShop()" title="打开商城"><label>积分</label><b id="tbPoints">—</b></button>
    </div>
  </div>
  <div id="dim"></div>
  <div class="energyrow num"><span class="elabel">精力</span><div class="etrack"><i id="eFill" style="width:100%;background:#33302A"></i></div><b id="eNum">100/100</b></div>
  <nav class="tabbar">
    <button class="tab" data-tab="状态" onclick="UI.openSheet('状态',this)">状态</button>
    <button class="tab" data-tab="行囊" onclick="UI.openSheet('行囊',this)">行囊</button>
    <button class="tab" data-tab="人物" onclick="UI.openSheet('人物',this)">人物</button>
    <button class="tab" data-tab="设置" onclick="UI.openSheet('设置',this)">设置</button>
  </nav>
  <!-- 隐藏叙事流：结算卡片仍写入（历史/导出用），不再作为界面呈现 -->
  <div class="stream" id="stream" style="display:none"></div>
</section>

<div class="scrim" id="scrim" onclick="UI.closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle">查询面板</div>
    <button class="sheet-close" onclick="UI.closeSheet()">收起</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<!-- 剧情对话：全屏聊天气泡 -->
<div class="chatview" id="chatview">
  <div class="chat-head num"><button onclick="Game.closeChat()">◀ 返回</button><span class="ch-ava" id="chatAva"></span><span class="ch-title" id="chatTitle">剧情对话</span><span class="fh-time" id="chatClock"></span></div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-opts" id="chatOpts"></div>
</div>
<!-- 宫城图：出门选目的地 -->
<div class="mapview" id="mapview">
  <div class="map-head num"><button onclick="Game.mapBack()">◀ 住处</button><span>宫城图</span><span class="fh-time" id="mapClock"></span></div>
  <div class="map-bg">
    <button class="hs" style="left:50%;top:15%" onclick="Game.mapGo('养心殿')"><i></i><span>养心殿</span></button>
    <button class="hs" style="left:50%;top:42%" onclick="Game.mapGo('六宫')"><i></i><span>六宫</span></button>
    <button class="hs" style="left:18%;top:26%" onclick="Game.mapGo('藏书阁')"><i></i><span>藏书阁</span></button>
    <button class="hs" style="left:15%;top:58%" onclick="Game.mapGo('御花园')"><i></i><span>御花园</span></button>
    <button class="hs" style="left:85%;top:50%" onclick="Game.mapGo('太医院')"><i></i><span>太医院</span></button>
    <button class="hs" style="left:50%;top:85%" onclick="Game.mapGo('出宫')"><i></i><span>出宫</span></button>
  </div>
</div>
<div class="restmodal" id="restModal">
  <div class="rm-card">
    <div class="rm-title" id="restTitle">歇下一旬</div>
    <div class="rm-body" id="restBody">灯花渐暗，夜色四合。就此歇下，精力尽复，醒来又是新的一旬。</div>
    <div class="rm-ops"><button class="btn btn-line" onclick="Game.dismissRest()">再撑一撑</button><button class="btn btn-primary" onclick="Game.restNow()">休息，进入下一旬</button></div>
  </div>
</div>
<!-- 行事结果弹窗（本地即时结算） -->
<div class="restmodal" id="actModal">
  <div class="rm-card">
    <div class="rm-title" id="actTitle">修习</div>
    <div class="rm-body" id="actBody" style="max-height:48vh;overflow:auto"></div>
    <div class="rm-ops"><button class="btn btn-primary" onclick="Game.closeActResult()">好</button></div>
  </div>
</div>

let _lastBusyPoem=-1;
function pickBusyPoem(){
  const n=BUSY_POEMS.length;
  if(!n)return null;
  let i=Math.floor(Math.random()*n);
  if(n>1&&i===_lastBusyPoem)i=(i+1)%n;
  _lastBusyPoem=i;
  return BUSY_POEMS[i];
}
function busyPoemHtml(){
  const p=pickBusyPoem();
  if(!p)return '';
  return `<div class="busy-poem">「${esc(p[0])}」</div><div class="busy-poem-src">—— ${esc(p[3])}·${esc(p[1])}《${esc(p[2])}》</div>`;

禀随机，强与天赋异禀概率很低；仅作隐藏结算项，正文不做露骨呈现。\n- 初始财产按家世折算银两。\n- 开局时系统激活，发布首个主线任务。\n\n### 皇帝\n\n年龄20—30岁随机；能力以文字评价呈现，不打分；随机性格与健康状况。皇帝对宫斗事件的干预方式由其性格、涉事妃嫔情况与事件性质决定，可袖手旁观、简单调解、彻查到底、直接裁决或偏袒一方。\n\n### 太后\n\n不默认在世，开局先掷定是否在世。在世则生成年龄、能力、性格、母家、健康状况；不一定是皇帝生母。按性格，太后可能偏爱某类妃嫔、支持某位妃嫔，或避世不管。\n\n### 妃嫔与派系\n\n- 开局生成8—15名妃嫔，含同届秀女与旧妃。每人随机姓名、年龄、家世、位份、性格、状态、财产、基础属性、才艺、居住宫殿、所属派系与所辖宫女太监。家世、位份与宫殿规制须匹配。\n- 开局生成2—5个派系，领袖必须为从四品嫔及以上。派系之间存在合作、敌对或无视关系，允许妃嫔不入派系。\n- 领袖死亡或被降至从四品以下时，派系瓦解或改选；无人满足条件或满足者皆不愿接任，则派系瓦解。\n\n### 皇嗣\n\n开局随机生成0—N名皇子皇女，不默认皇帝已有儿子。生成姓名、年龄、性格、生母、抚养人、学识、礼仪、体魄与对父母的依赖度。生母与子女年龄差不小于14岁。\n\n### 下人与宫殿\n\n- 生成太监总管、侍卫总领、掌事姑姑、太医等关键下人；各宫配置宫女太监，能力、忠诚度、嘴严程度随机。\n- 下人可被收买成为眼线或帮手；侍卫私情、太医隐诊须有长期关系或收买前置。\n- 随机生成宫殿名，分正殿、侧殿。嫔及以上方可居一宫主位，低位妃嫔依位份居侧殿或配殿。\n- 普通NPC不提前大量生成。新人物首次登场时生成简档并写入存档登记。\n\n## 5. 时间、旬日程与回合流程\n\n### 时间单位\n\n- 每月分上旬（初一至十五）、下旬（十六至月末）。一回合推进一旬，下旬结束后进入次月。\n- 月份推进季节与节令，正文应体现天气、花木、饮食或衣物变化。\n- 侍寝、晨昏请安、领取份例等高频例行事务以概括叙事处理，不逐次展开，也不占用生活重心。\n- 银两入账、固定开销、长期状态持续时间和商城刷新均按旬记录；月度俸禄与常规月结在下旬末统一结算。\n- 每年腊月下旬完成年度结算。全体在世人物基础属性可因年龄与当年经历小幅波动，变化范围±1—3；无合理原因可不变。\n- 55岁后体质每年随机下降1—3点。\n\n### 每旬排程与1—2轮流程\n\n**生活重心是常规日程，不是剧情选项。** 每旬开始时玩家精力回满，可消耗精力依次安排多件事，例如“才艺修习／宫内社交／外出散步”，可补充具体项目或对象。临期待办、单次回礼、拜谢、密谈等属于剧情事项，不得取代常规重心菜单。\n\n每旬必须先让养成成立：先演绎修习、外出、社交、宫务或陪伴的具体过程，再检查是否触发剧情，不能跳过养成直接演主线。每旬有30%—60%概率在养成过程中触发一条有意义的主线或支线剧情。剧情应从当前日程、地点、人物接触或世界后台行动中自然发生，不强行打断无关场景；无合理事件时允许无事。\n\n1. **旬首安排**：显示当前时间、简短状态与临期引线，玩家只安排本旬重心。\n2. **世界后台**：先推进NPC独立行动，再检查其行动及既有引线是否与主控产生交集，不让全世界等待主控触发。\n3. **第一轮——养成与剧情**：先演绎本旬养成的具体过程。若无剧情，完成养成叙事与结算，本旬结束；若有剧情，写清养成如何被打断或嵌入剧情，给出2—4个有实质差异的选择并停止，暂不结算应对后果。\n4. **第二轮——剧情应对**：承接玩家选择，完整演绎行动、他人反应与直接后果，再统一结算本旬养成和剧情变化。若剧情占据精力，养成收益可降低、延迟或取消。\n5. **回合停止**：每旬最多两轮，不自动跨旬。下一轮只承接本旬已经作出的选择；完成后等待玩家安排下一旬。\n\n有意义的剧情必须实际改变关系、资源、信息、机会、风险、任务或后续路线中的至少一项。结果可正向、负向或利弊交织，须符合人物性格、立场、能力与知情范围。选项中应保留可能带来明确负面结果的方向，如损失银两、得罪某人、暴露信息、错失机会、降低健康或增加嫌疑；负面结果必须有因果，不随机惩罚。\n\n### 主线插入规则\n\n- 主线任务有明确的阶段目标与合理期限，以月或旬记录。任务内容可以涉及晋升、宠爱、才艺、关系、子嗣或宫斗，不局限于主动出击。\n- 主线事件优先嵌入玩家所选场景。例如献艺任务可在宴集、请安或修习才艺时推进；拜访对象可能与派系线、家族线或子嗣线相连。\n- 到期主线事件可以在旬首直接发生，但仍须给玩家安排或应对的空间。重大主线若占用整旬，则本旬不再重复结算原定养成收益。\n- 主线不得因玩家专注日常而无提示地失败。期限临近时至少提醒一次；若玩家明确选择搁置，再按任务条件结算后果。\n- 同一时间最多突出一条主要剧情线，其余线索保持背景进展，避免每旬多线齐发。\n\n### 跳过与限制\n\n- 无突发、无主线节点的连续日常旬，玩家可说“连续修习琴艺三旬”或“跳过至下个事件”。主持人逐旬检查条件和结算，不直接把三个月压成一个结果。\n- 不得跳过突发事件、主线关键节点、生产、病重濒死与死亡相关情节。\n\n## 6. 生活重心与养成系统\n\n### 通用规则\n\n- 每旬精力值（0—100）是行动依据；单件事仍须符合位份、健康、居所、宫廷权限与当前关系。\n- 普通养成是渐进过程，不要求每次都触发事件或获得额外奖励。行动完成后即结算合理收益。\n- 连续多旬重复同一行动可以继续有效，但剧情不得机械重复；遇到身体、资源或环境限制时应如实反馈。\n- 行动结果受相关属性、老师或陪伴者、健康、资源和既有关系影响。高属性提高学习质量与事件应对余地，不保证所有社交或宫斗行动成功。\n- 一次行动只结算一次主要收益；同一场景同时涉及才艺和社交时，可有一项主收益与一项较小的附带收益，不叠加成重大跃升。\n\n### A. 才艺修习\n\n- 才艺项：琴、棋、书、画、歌、舞、女红。玩家也可提出符合时代的其他才艺，经世界内逻辑确认后登记。\n- 可安排独自练习、请教宫人、延请女师、与同好切磋、为献艺备演等具体方式。\n- 才艺为0—100：30以下生疏｜30—50入门｜50—70娴熟｜70—90出众｜90以上卓绝。\n- 普通一旬修习通常提升1—3点；有良师、适宜场所、相关天赋或完整备演时可取较高值。生病、禁足、物资不足或心绪受创可能降低收益或无法练习。\n- 才艺影响宴集献艺、节庆露脸、教学子女、赠礼与同好社交。不得把“才华”基础属性与具体才艺混为一项；才华可辅助学习效率，但不能代替实际练习。\n\n### B. 散步与康健\n\n- 不设“休养”重心：健体即往御花园等处散步闲逛（属外出，见C）。体质分「气血」（当前体质值）与「根基」（先天禀赋，开局随档50—70，存 protagonist.constitutionBase）：散步、药膳、静养只在气血低于根基时予以恢复，每旬至多+1，康健收益每旬至多结算一次；气血已达根基则不再提升。\n- 气血高出根基的部分（药物、系统道具硬提上来的）每旬自然回落1点，向根基回归。\n- 根基难以撼动：长期强度锻炼（习舞、骑射等，耗二十精力）或对症药物调理可提升根基，单次至多+1，一生至多+5，上限90；大病、生产、中毒可损伤根基，须长期调理缓慢恢复。\n- 病中或劳损后的静养、对症调理随病情剧情承接，可恢复1—3点；药物须符合诊断与资源条件。\n- 作息恢复随每旬更替自然完成：歇下进入下一旬即精力回满，无须专门安排。\n- 闲逛可触发偶遇、物候、宫人闲话等事件，不保证遇到皇帝或获得宠爱。\n- 过度练习、连续熬夜、带病赴宴或重大冲突可能造成体质下降。散步康健的收益不得与同一旬的高强度活动同时取得。\n\n### C. 宫内自由活动与社交\n\n- 可拜访已具备合理来往条件的妃嫔、太后或皇后，也可赴约、请安、送礼、闲谈、共同赏艺、结伴游园。\n- 拜访须考虑对方是否在宫、是否愿意接见、双方关系与礼制。被拒见也是有效结果，不强行安排会面。\n- 普通社交按实际互动小幅改变好感、信任、人情或传闻；不得只因拜访一次就大幅改变立场。\n- 可前往御花园、藏书阁、戏台、马球场等符合身份与开放条件的场所闲逛。闲逛主要提供健康、信息、偶遇与生活质感，不成为稳定刷取稀有资源的途径。\n- 玩家可指定想谈论或试探的内容，主持人只让NPC依据其知情范围回应。\n\n### D. 宫务与身边经营\n\n- 可安排整顿宫人、核查账目、教导心腹、布置眼线、修缮居所、管理库房、处理份例与打赏。\n- 该方向影响宫人忠诚、嘴严程度、眼线质量、银两开销与防御条件，不直接替代忌惮或威望。\n- 收买、查探与布置须消耗银两并有失败或败露风险；交际、威望和既有信任可降低难度，但不能抹除风险。\n\n### E. 子女教育与陪伴\n\n- 仅对主控所生或实际抚养、且能合理接触的皇嗣开放。不得跨宫随意教育他人子女。\n- 每旬可选择一种重心：启蒙读书、习字、礼仪、琴棋书画、骑射健体、性情陪伴、择师与考察老师、挑选下人或伴读。\n- 皇嗣的学识、礼仪、体魄为0—100；普通一旬指导或陪伴通常提升相关能力0—2点，亲子好感按互动小幅变化。年龄过小或过大时只开放合适项目。\n- 教育效果受皇嗣年龄、性格、老师、主控相应才艺、健康与亲子关系影响。主控不擅长时可延师，而非凭空获得教学能力。\n- 择师、伴读、抚养权与成年婚配属于重要决定，必须由玩家确认。皇嗣也有独立性格和反应，不是无条件增加数值的道具。\n\n### F. 家族书信与私人事务\n\n- 可写信回家、处理家族请托、整理妆奁、清点赏赐、阅读、抄经或独处。\n- 家族往来受家世、关系与传递途径限制；信件可能延迟、被留意或产生误解。\n- 抄经、阅读等可推进相关人物线或提供心境与才华方面的小幅成长，不重复叠加同一收益。\n\n## 7. 属性、资源与宫斗系统\n\n### 基础属性\n\n- 范围0—100，禁止溢出或转移。\n- 分级：30以下差｜30—50一般｜50—70良好｜70—90优秀｜90以上卓越。\n- 普通事件单次变化±1—5；重大事件单次±5—15，且须有前置条件或代价；年度波动±1—3。增减须符合年龄与实际情况。\n- 体质（气血）特殊规则：生病、受伤、劳累、中毒、心理压力使其下降，休养、药物调理、适度活动使其回升；气血永不高于根基，高出的部分每旬回落1点；拔高根基须走长期锻炼或调理，单次至多+1、上限90，并写入 protagonist.constitutionBase。体质为0死亡；低于10濒死；低于20强制卧床，时间照常流逝；连续5旬低于20触发病逝事件，死亡概率70%；低于30易触发不孕、流产、难产。\n\n### 关系数值\n\n- 好感度、宠爱值、仇恨值、黑化值无固定上下限，可为负；面板以实际记录为准。\n- 好感度为负时可转为仇恨表现。仇恨值≥50的NPC会采取行动，越高越激烈。\n- 黑化值≥50会采取行动；>90可能引发暴力乃至命案，仍受内容边界限制。\n- 黑化值或仇恨值单次变化±20以上时，可解锁该NPC的小剧场或番外片段。\n\n### 财产与家族\n\n- 财产折算为银两，含俸禄、古董、珠宝、打赏、家族支持等。收买、送礼、赏赐下人与延师均可能耗银。\n- 每旬只结算实际发生的收支，下旬进行月度汇总。\n- 家族关系网按需以树状图查询。妃嫔失宠时，家族可能再送女孩进宫，但须符合家族条件与剧情逻辑。\n\n### 宫斗系统\n\n- 任务分主线任务与随机任务，可涉及才艺、社交、位份、宠爱、子嗣、防御或主动宫斗。完成得积分，部分任务额外奖励道具。\n- 商城固定展示10种道具，每3旬刷新一次。每旬末可提醒一次是否查看商城，不反复打断正文。\n- 道具分三类：改变基础属性；改变相关数值；特殊类，如预知、必怀孕、假孕、获得关键证物。用于他人积分消耗更高，用于皇帝消耗极高。道具入行囊不强制即用，获得时写入存档 inventory（含可使用、可否典卖词条），由玩家自行决定使用或典卖。道具分一次性、限次、限时、永久四种。\n- 宫斗进攻成功率由主控忌惮、手段、宠爱值、对方心机与具体准备决定；防御成功率由主控忌惮、威望、眼线、对方心机与既有防范决定。\n- 下毒、造谣、陷害、查探或制造意外须收买相关人员并耗银。成功可影响目标声望与宠爱；失败可能被降位或打入冷宫。\n- 才艺高、社交广或子女优秀可提供机会与威望，但不能让宫斗自动成功。\n\n## 8. 行动反馈、感情线与NPC主动性\n\n### 行动结果不默认有利\n\n- 才艺练习、静养等封闭性日常通常能获得合理的小幅成长，但生病、分心、方法不当或资源不足时也可能无进益或付出代价。\n- 社交、送礼、试探、求情、站队、宫斗等涉及他人的行动不保证成功，也不默认增加好感。结果可为顺利、无效、利弊交织、反感、误解、拒绝或留下后患。\n- 玩家选择只决定行动方式，不决定他人的内心答案。NPC依据自身性格、立场、需求、关系阶段和所知信息回应；谨慎可能被视为稳妥，也可能被视为疏远，主动可能换来亲近，也可能造成压力。\n- 不得为了维持“选择都有意义”而每次给予数值奖励，也不得为了制造挫折突然让NPC降智或无缘由针对主角。不利结果必须能由此前铺垫、行动代价、双方立场或合理意外解释。\n- 主线和随机任务的完成条件须真实结算；不能因为玩家完成了某旬日程就默认任务取得进展。\n\n### 引线与敌对行为必须兑现\n\n- 存档中的引线到期后必须回收，不得连续以“仍在观望”“时机未到”无限顺延。若原定场景不成立，应改写为符合当前处境的兑现方式，而非搁置消失。\n- 仇恨值≥50且具备行动能力的NPC，会在其目标、性格和手段允许的范围内主动试探、设障、结盟、传播不利言论或实施报复。行动成败另算，但不能长期只有黑化数值而没有行为。\n- 每月至少检查一次所有在野NPC的目标与引线；主角相关冲突不按月强制定额，但已有明确敌意的线索不得连续三个月毫无表现。\n- 意外与不利事件可以打断原日程。事件须符合时间、地点、前置条件和知情范围，并给予玩家应对机会。\n\n### 皇帝感情线与宠爱兑现\n\n- 宠爱不是只用于晋升的抽象分数，必须影响皇帝是否主动召见、独处、共膳、游园、书信往还、赠物、记住细节与侍寝安排。赏赐不能替代全部相处。\n- 感情进展以连续场景体现：从留意、熟悉、信任到亲近与牵挂。每次相处应增加新的共同经历、分歧、理解或试探，不反复使用“赏识—赏赐—加宠爱”的同一模板。\n- 宠爱40—59时，通常每一至两个月应有一次有内容的私下接触；宠爱60—74时，通常每月至少有一次实际相处，并在一至三个月内出现侍寝或其他明确的亲密进展。更高宠爱应体现稳定牵挂与特殊对待，而非只涨数字。\n- 皇帝长期不召见必须有主控可逐步察觉的世界内原因，如健康、丧制、前朝政事、刻意避嫌、误会或他人阻挠；不得无解释地连续三个月只有宠爱增长而没有任何实际接触。\n- 侍寝不是唯一亲密场景，也不是每次相处的必然结果。重点写语气、记得与忘记、主动与退让、误解与修复，使关系变化可被玩家感知。\n\n### 其他男主与常驻NPC\n\n- 除皇帝外，逐步设置2—3名具有独立身份、目标、弱点与生活轨迹的可发展男性角色，可来自侍卫、太医、宗室或世家等符合世界观的群体。身份仅作候选方向，不强迫固定职业或全员恋爱。\n- 其他男主须通过值班、诊治、宴集、家族往来、共同事件等合理途径登场。先建立可辨识的人物关系，再依据持续互动发展感情；不得一见面无故倾心，也不得默认所有男主都爱主角。\n- 感情路线允许停留于知己、欣赏、利用、亏欠、暧昧或遗憾。后宫身份带来的礼制、风险与知情边界始终有效，重大关系选择由玩家决定。\n- 常驻NPC应有可延续的个人目标、关系网和阶段变化。每轮重点写1—3人即可，但同一角色再次登场时必须承接上次互动，而非只充当发任务或送好感的工具人。\n- 新NPC分次自然入场，不一次性倾倒档案；重要角色登场后登记简档，并在后续旬程中保留独立行动。\n\n### 世界后台回合：NPC不等主角行动\n\n- 每旬在演绎主控日程之前，先运行一次不展示给主控的“世界后台回合”。从核心NPC中选取当前最活跃的1—4人，依据其目标、关系、资源和期限推进行动，不要求主控参与。\n- 存档为核心NPC维护简明目标卡：**当前目标｜正在进行的事｜合作或冲突对象｜下一步与期限**。不得只记录“黑化高悬”“织网人”“观望”等静态标签。\n- NPC行动可以成功、失败、拖延或改变目标。结果由能力、资源、立场和其他NPC的行动决定，不以是否方便主控剧情为准。\n- NPC可以与主控以外的角色结交、争执、求助、失和、获赏或失势。即使主控连续数旬只做日常，世界也须实际变化，不能全员停在原地等主控触发。\n- 后台回合不是幕后阴谋生成器。大多数行动应源于争宠之外的正常需求，如修缮、求学、侍疾、家族责任、职务安排、交友与个人喜好。\n- 后台行动完成后检查与主控的交集：直接影响主控才形成当场事件；仅改变环境则留下可见痕迹；可能经传播抵达则形成带途径的传闻；与主控无关且不可知的信息不写入正文。\n- 不得把后台结果一次性播报给玩家。主控只接触自己所能感知的部分，但主持人必须保存真实结果，供后续持续承接。\n\n### 感情互动的深度\n\n- 每次重要感情场景至少完成一项具体内容：交换一段真实的个人信息、对一件分歧作出不同回应、履行或违背小约定、留下共同经历、产生需要后续承接的误解或和解。\n- 皇帝须有主控之外的日常、关系与情绪来源。他可以主动靠近，也可以因自身性格、误会或处境退缩；不得只在主控行动后给出赏识和赏赐。\n- 亲密递进须体现在相处的实际变化上，如从正式召见到私下共膳，从谈规矩到谈个人往事，从客套回礼到主动记得主控所需。侍寝属于其中一种进展，不得被长期冻结，也不能代替其他关系建设。\n- 旧档若已长期无接触，不回溯补写历史；恢复游戏后须让皇帝依据当前关系作出实际行动，并逐步处理疏远原因，不能继续只写节日赏赐或召见谢恩。\n\n## 9. 关系与信息系统\n\n- 本作采用数值面板呈现好感度、宠爱值、仇恨值与黑化值，并在“本旬变化”和查询面板中显示。\n- 每个人物只知亲历、目睹、听说或合理推断之事。主控与某人的私下互动不会外溢给无关者。\n- 传闻须有传播途径，如宫婢口耳、宴集、家族书信，且可能与事实有偏差。\n- 主控无上帝视角。针对主控的阴谋在主控视角中应是突然发生，不提前透露有人要害主控，也不播报主控不知道的NPC动向。\n- 主控此前错过的信息可在之后以传闻、可见后果或态度变化浮现，保持滞后感。\n- NPC有各自生活、活动区域与目的，NPC之间也会互动、结盟、结仇。不为凑戏份让NPC围着主控转，也不因某个人设爱好反复产出同质剧情。\n- NPC言行须持续符合出身、年龄、身份、性格、关系阶段与当前情绪。\n\n## 10. 事件、主线与剧情链\n\n### 事件分层\n\n- 轻量日常：天气物候、节令吃食、宫人闲话、衣料赏赐、练习细节等。只提供生活质感与谈资，不改数值、不占冷却。\n- 养成反馈：练习、拜访、休养、宫务或教育的正常结果，不强行包装成危机。\n- 常规事件：请安、宴集、诗会、偶遇、家族来信、太医请脉、派系邀约、下人动向等，可自然产生选择。\n- 特殊事件：晋升、降位、怀孕、小产、重病、收买成败、派系变动、家族送女入宫等，须有前置条件与冷却。\n- 突发事件：需要主控当场应对、会改变状态或关系的事件。\n\n### 随机触发尺度\n\n- 每旬有意义剧情的基础触发范围为本旬30%—60%，具体概率由世界后台状态、到期引线、人物关系与主控处境决定。剧情可源于主线、支线、感情或NPC独立行动，不再另设一套相互冲突的常规／突发事件概率。\n- 无剧情旬只呈现养成过程与轻量日常，允许安静结束。\n- 每旬至多一条需要玩家应对的主要剧情。突发事件后至少间隔1旬；较大影响事件后至少间隔3旬，但已到期且不可合理延后的既有引线优先兑现。\n- 剧情必须贴合本旬地点、行动、人物状态与既有因果，不为凑概率让无关人物突然登场，也不因主控选择某项日程就强制生成对应奖励。\n\n### 突发事件结算\n\n- 呈现事件与2—4个方向不同的应对选项后停下，等待玩家抉择；自定义应对只要符合世界规则即被承接。\n- 数值影响分小影响档（单次≤5）与较大影响档（单次≤15）。叙事后果包括关系翻转、把柄落入人手、禁足、错失机会、欠下人情或树立新敌等。\n- 较大影响必须与玩家所选应对绑定，后果可追溯；不无抉择直接改变命运。\n- 选项不得是“只有一个合理答案”的假选择，允许承担代价、暂避或求助等不同方向。\n\n### 剧情选项设计\n\n- 一组选项必须围绕不同目标、手段或代价拉开，不能只是同一方向的不同措辞，或同一人物线的三个切入口。\n- 每个选项至少有一项目前可理解的机会或代价，例如安全与信息、人情与立场、眼前收益与长期风险、维护一人与得罪一人。\n- 默认提供性质不同的方向，如稳妥回避、直接应对、借助他人、主动承担风险。允许自定义，不预设唯一正确答案。\n- 不得把“必然变强、必然加好感、必然推进任务”的选项包装成抉择，也不得在选项文字中提前泄露尚未发生的收益或幕后真相。\n- 选项结果受人物立场、既有关系、资源、时机与主控能力共同影响。两个选项可以各有收益，但必须承担不同代价。\n\n### 剧情链与回响\n\n- 每次较大影响的应对可埋下1—2条引线，记入存档的待兑现事项，如记下旧怨、欠下人情、约定再会。\n- 引线通常在之后2—5旬内以自然方式回收，回收时可再给一次应对机会。长期引线可按月折算，不因日常养成密集而仓促集中爆发。\n- 玩家长期搁置的引线不会消失，会依人物性格与处境自行发酵，但不默认一律朝最坏方向发展。\n- 每旬检查存档中的引线，保证后续剧情能承接既往选择，而非随机堆事件。\n\n### 剧情阶段\n\n- 立足期（正七品至正五品）：生存、露脸、才艺初试、人际建立与首次树敌。\n- 晋身期（贵人至嫔）：派系拉拢、子嗣议题与更复杂的社交经营。\n- 博弈期（贵嫔至妃）：宫斗烈度上升，与前朝联动加深，较大影响事件概率可提高。\n- 巅峰期（贵妃及以上）：后位之争与夺嫡暗流，行动可能改写六宫格局。\n- 路线包括位份晋升线、才艺与声望线、子嗣线、家族线、派系与前朝联动线。禁止自动进入结局。\n\n> 叙事、文风与篇幅规则另见项目文件《叙事文风》。运行游戏时必须同时读取本世界书与该文件。\n\n## 11. 内容边界\n\n- 绝对禁止：战争、政斗、商战类剧情主线；现代概念、科技与术语入戏；除宫斗系统外的一切超现实元素；露骨性描写；主控不可知信息的上帝视角剧透。\n- 需要谨慎或限制频率：血腥、暴力、凶杀仅在黑化值>90的极端后果中可触及，淡化处理，全局至多1—2次；流产、难产、自裁可作为事件结果，不渲染过程。\n- 允许但需满足条件：下毒、构陷、巫蛊须走收买与忌惮、威望、眼线结算，有失败与败露风险；侍卫私情、太医隐诊须以收买或长期关系为前置。\n- 鼓励出现：琐碎日常与节令风物、才艺修习的具体过程、有分寸的社交、皇嗣的成长差异、不围绕主控的NPC生活线、有因果的恩怨往复、传闻的失真与滞后。\n\n## 12. 每旬显示配置\n\n按以下顺序输出：\n\n1. **当前状态**：年月、旬次与节令，位份，体质／孕期，银两，必要状态标注，保持简短。\n2. **本旬安排**：一句列明玩家已选生活重心；若正在承接突发事件，则列明当前应对。\n3. **剧情正文**：符合《叙事文风》。\n4. **后宫动态**：仅呈现主控可感知的公开消息、亲眼所见与传闻；传闻须标注且可能失真。无新动态可省略。\n5. **本旬变化**：只列变化项，包括属性、才艺、皇嗣成长、关系、银两、状态、积分与任务进度；无变化不写。\n6. **道具与商城提示**：获得道具时提醒是否使用；商城刷新或旬末可按需提示。\n7. **待续事项**：只列临期约定、剧情引线和持续事件，避免每旬重复完整清单。\n8. **下一步**：若第一轮触发剧情，只给该事件的2—4个实质选择并停止，等待第二轮应对；无剧情或第二轮已结算，则请玩家安排下一旬的一个生活重心，允许自定义项目、对象与具体做法。\n\n其他规则：\n\n- 同一回复只保留一组需要玩家选择的选项，避免“事件选项”和“下旬日程”同时抢答。\n- 仅变化时显示派系动向、NPC小剧场或番外解锁提示。\n- 按需查询均不消耗回合：`Z`＝主控完整数据；`面板`＝完整面板；另支持`才艺`、`日程`、`皇嗣`、`家族树`、`道具清单`、`商城`、`人物档案`。\n- 仅开局或阶段转换时显示开局人物总览、年度结算、晋升／降位册文与剧情阶段提示。\n- 使用标题与emoji状态标注使界面清晰；正文内不用emoji，不使用边框包裹、彩色字体等聊天界面无法实现的效果。\n\n## 13. 自动存档与旧档衔接\n\n- 自动存档节点：每5旬一次；晋升／降位、怀孕／生产、任何人物死亡、派系变动、重大宫斗结果、剧情阶段转换之后立即存档。\n- 存档须记录当前年月与旬次、本旬生活重心、已结算结果、下一旬待办；才艺、皇嗣能力、老师和抚养关系等有变化时纳入动态快照。\n- 存档另设“世界后台状态”：核心NPC目标卡、本旬已发生的NPC独立行动、其结果、知情者范围、与主控的潜在交集及预计兑现时间。正文不披露主控不可知部分。\n- v1.1旧档可继续使用，不回溯改写既往月份、数值与事件。已生成的角色、关系和任务保持原样。\n- 旧档恢复时，将当前日期落入对应旬次；已有待决选择优先承接，不因玩法升级直接跳过。\n- 旧档没有才艺或皇嗣教育数值时，不追溯虚构既有练习成果；首次查询或使用时，依据已确认出身、才华、经历与年龄生成保守初值，向玩家展示后写入存档。\n- 原“一回合一个月”的任务期限、冷却和刷新规则，从启用本版起分别按旬、月期限与对应日期换算；不得借换算重复发放收益、重复扣款或重置既有事件。\n\n## 14. 开局配置\n\n- 开局流程：生成朝代参数→生成主角档案与才艺→生成皇帝→掷定太后是否在世并生成→生成妃嫔与派系→生成皇嗣→生成关键下人与宫殿→向玩家展示主角档案与后宫概况。\n- 玩家可补充主角姓名与出身剧本，不补充则随机。\n- 开局时间与场景：某年三月上旬，选秀初毕，主控入宫并入住所分配宫殿。\n- 第一回合必须呈现朝代与年号简介、主角档案、入宫场景正文、系统激活与首个主线任务、所在宫殿与配属宫人。\n- 第一次选择：入住安顿后，给出包含初步社交、外出散步、熟悉宫廷或才艺安排在内的2—4个上旬生活重心选项。\n- 第一回合结束后进行首次存档，写入项目记忆。\n\n## 15. 世界书维护边界\n\n- 本文件只保存固定设定、初始状态与长期规则。\n- 游戏动态进度由项目记忆中的当前存档维护，剧情大事记只记里程碑，均不写入本文件。\n- 不将每旬流水账写入世界书。\n- 世界规则只能通过玩家明确修订世界书来变更，不在正文中临时漂移。";
/* 运行时世界书：网页版的开局人物、宫殿与存档均由前端生成/维护，模型不再执行 1/4/13/14/15 节的开局建卡与存档职责。
   这里只抽取运行时真正需要的章节，完整世界书仍保留在上方常量与项目文件中，作为唯一事实源。 */
const WORLD_BOOK_RUNTIME=(()=>{
  const keep=new Set(['2','3','5','6','7','8','9','10','11','12']);
  const parts=WORLD_BOOK.split(/(?=^## \d+\. )/m);
  return parts.filter((p,i)=>{
    if(i===0)return true; // 标题
    const m=p.match(/^## (\d+)\. /);
    return !!(m&&keep.has(m[1]));

/* ============================================================ 剧情台账（Plot Ledger）
   代码管"什么时候必须发生什么"：结构化剧情账 + 旬首裁决 + 到期结账。

function xunSerial(t){return ((Number(t.year)||1)-1)*24+((Number(t.month)||1)-1)*2+(t.xun==='下旬'?1:0)} // 元年正月上旬=0，逐旬+1
function nextMonthSerial(t,m){ // 下一处「m 月下旬」的旬号（m：正月=1…腊月=12）
  let y=Number(t.year)||1;
  if(m<Number(t.month)||(m===Number(t.month)&&t.xun==='下旬'))y+=1;
  return (y-1)*24+(m-1)*2+1;
}
function nextMonthFirstSerial(t,m){ // 同一处「m 月上旬」的旬号（与 nextMonthSerial 同期）
  return nextMonthSerial(t,m)-1;
}
function dueTextFor(t,m){let y=Number(t.year)||1;if(m<Number(t.month)||(m===Number(t.month)&&t.xun==='下旬'))y+=1;return `${t.era||''}${y}年${MONTHS[m]}内`}

function sanitizePlot(p){ // 单条台账归一；字段缺失时给默认值（仅新建条目用）

  return {
    id:String(p.id),
    line:['主线','支线','引线','敌对','目标'].includes(p.line)?p.line:'支线',
    title:String(p.title||'').slice(0,30),
    stage:['进行中','已兑现','已作废'].includes(p.stage)?p.stage:'进行中',
    earliest:numOrNull(p.earliest),latest:numOrNull(p.latest),
    dueText:String(p.dueText||'').slice(0,40),note:String(p.note||'').slice(0,140),
    touch:numOrNull(p.touch),staleMiss:numOrNull(p.staleMiss)||0 // touch=最近推进旬号；staleMiss=发酵后连续被无视次数
  };

function mergePlots(base,incoming,nowTurn){ // 增量回写：模型只给变化条目，未提及的保持不变；凡回写即记 touch=本旬
  const list=Array.isArray(base)?base.slice():[];
  const byId=new Map(list.map(p=>[p.id,p]));
  const arr=Array.isArray(incoming)?incoming:[incoming];
  for(const raw of arr){
    if(!raw||!raw.id)continue;
    const old=byId.get(String(raw.id));
    if(!old){
      const p=sanitizePlot(raw);
      if(p&&p.title){p.touch=nowTurn;list.push(p);byId.set(p.id,p)}
      continue;
    }
    const merged=Object.assign({},old);
    for(const k of ['title','line','stage','earliest','latest','dueText','note'])if(raw[k]!==undefined)merged[k]=raw[k];
    const p=sanitizePlot(merged);
    if(p){p.touch=nowTurn;Object.assign(old,p)}
  }
  return list;
}

function matchLeads(ctxList){ // 与给定语境（人名/地名/事由）相关的在途引线：标题或备注含对方名讳/地名即命中
  const cvs=(ctxList||[]).map(s=>String(s||'').trim()).filter(s=>s.length>=2);

  return activePlots().filter(p=>{
    const hay=`${p.title||''}｜${p.note||''}`;
    if(!hay||hay==='｜')return false;
    return cvs.some(cv=>{
      if(hay.includes(cv))return true;

function autoSettleDuePlots(adj){ // 模型漏写台账时由前端结账；只有模型明确改写期限才放过

    if(!cur||cur.stage!=='进行中')continue;
    const snap=adj.before&&adj.before[old.id];
    if(snap!=null&&cur.dueText&&cur.dueText!==snap)continue; // 已改写期限并在 note 说明理由
    cur.stage='已兑现';
    cur.note=(cur.note?cur.note+'；':'')+'前端自动结账：到期已兑现';
    settled.push(cur.title||cur.id);
  }

function autoExpireStalePlots(adj){ // 发酵条目模型连续不理会：计 staleMiss，满额自动作废/清除（机会流失）；本旬有回写则重置
  if(!adj||!state)return [];
  const now=xunSerial(state.time);const expired=[];
  if(Array.isArray(adj.stale))for(const old of adj.stale){
    const p=(state.plots||[]).find(x=>x.id===old.id);
    if(!p||p.stage!=='进行中')continue;
    if(p.touch===state.turn){p.staleMiss=0;continue} // 本旬已回写（兑现/改写/作废）：重置计数
    if(p.latest!=null)continue; // 已改为有期限：转到期/超期流程
    if(now-(p.touch??now)<STALE_PLOT_XUN)continue;
    p.staleMiss=(p.staleMiss||0)+1;
    if(p.staleMiss>=STALE_AUTO_EXPIRE){
      p.stage='已作废';p.staleMiss=0;
      p.note=(p.note?cur_note(p):'')+'搁置太久无人理会，机会流失（前端自动作废）';
      expired.push(p.title||p.id);
    }
  }
  if(Array.isArray(adj.pendStale))for(const old of adj.pendStale){ // 待续琐事同款：连续不理自动清除
    const cur=(state.pending||[]).find(x=>pendText(x)===pendText(old));
    if(!cur)continue; // 已被模型处理（办掉/升级/改写）
    if((cur.touch??null)===state.turn){cur.staleMiss=0;continue} // 本旬有回写：重置

    }

}

function personaCanon(t){ // 词条归一：去标点、同义词折回标准词；认不出的保留原描述
  let s=String(t==null?'':t).trim();

    for(const k in PERSONA_ALIAS)if(s.includes(k))hits.add(PERSONA_ALIAS[k]);
    if(hits.size===1)return [...hits][0];
  }
  return s;

function personaCompatible(list,t){

  for(const x of raw){

/* NPC 才艺：用于“求师”。太医必有医术、姑姑宫女必有女红，妃嫔则在十艺里随机一二门。
   旧档与模型新建人物缺此字段时，按名讳哈希稳定补齐，读音一致、重载不变。 */
function npcSkillPlan(id,rank){
  const s=String(id||'')+' '+String(rank||'');
  if(/林守拙/.test(s))return{fixed:['棋','医术'],pool:[]};
  if(/太医|院判|医官/.test(s))return{fixed:['医术'],pool:['莳花','香道','书']};
  if(/掌事|姑姑|嬷嬷|女官|女史/.test(s))return{fixed:['女红'],pool:['香道','书','莳花']};
  if(/宫女|侍女/.test(s))return{fixed:['女红'],pool:['歌','舞','香道','书']};
  if(/太监|内侍|宦官/.test(s))return{fixed:['棋'],pool:['书','香道']};
  if(/侍卫|禁军|校尉/.test(s))return{fixed:['棋'],pool:['书','医术']};
  if(/皇帝|皇上|陛下/.test(s))return{fixed:[],pool:['琴','棋','书']};
  if(/太后|太妃|太嫔/.test(s))return{fixed:[],pool:['书','画','香道']};
  if(/后|妃|昭仪|昭容|昭媛|修仪|修容|修媛|充仪|充容|充媛|贵人|美人|才人|宝林|常在|答应|选侍|更衣|采女|官女子/.test(s))
    return{fixed:[],pool:['琴','棋','书','画','歌','舞','女红','莳花','香道']};
  return{fixed:[],pool:['棋','书','女红']};
}
function ensureNpcSkills(n,id){
  if(!n||typeof n!=='object')return n&&n.skills;
  if(n.skills&&typeof n.skills==='object'&&Object.keys(n.skills).length)return n.skills;
  if(/皇嗣|皇子|皇女|公主|阿哥|格格/.test(String(n.rank||'')))return n.skills; // 年幼皇嗣不设
  const plan=npcSkillPlan(id||n.name,n.rank);
  const h=hashStr('nsk|'+(n.realName||n.name||id||''));
  const out={};
  const add=(k,v)=>{const nm=CR_SKILLNAME[k]||k;if(out[nm]==null)out[nm]=clamp01_100(v)};
  plan.fixed.forEach((k,i)=>add(k,45+((h>>>(3+i*6))%36))); // 吃饭的本事：45—80
  const extra=plan.pool.filter(k=>!plan.fixed.includes(k));
  if(extra.length){
    const want=Math.min(extra.length,plan.fixed.length?(h%2):1+(h%2)); // 专业者另可兼一门；妃嫔等一至二门
    const start=(h>>>9)%extra.length;
    for(let i=0;i<want;i++)add(extra[(start+i)%extra.length],30+((h>>>(4+i*7))%41)); // 兼任与闲艺：30—70
  }
  n.skills=out;
  return n.skills;
}

function filterText(t){ // 正文过滤：去 emoji / markdown 残留

    .replace(/[\u{1F000}-\u{1FAFF}\u{1FC00}-\u{1FFFD}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'')
    .trim();
}

function setPath(obj,path,val){

  for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}
  o[ks[ks.length-1]]=val;
}
function getPath(obj,path){

function mergeDeep(target,src){ // 模型偶尔把嵌套对象整块写进 statePatch：合并而非替换，避免丢掉未提及的字段
  for(const k in src){
    if(k==='__proto__'||k==='constructor'||k==='prototype')continue;
    const v=src[k],cur=target[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&cur&&typeof cur==='object'&&!Array.isArray(cur))mergeDeep(cur,v);
    else if(v!==undefined)target[k]=v;
  }
  return target;
}

const HAREM_TITLE_WORDS=['皇贵妃','贵妃','贵嫔','昭仪','昭容','昭媛','修仪','修容','修媛','充仪','充容','充媛','贤妃','良妃','淑妃','德妃','妃','嫔','贵人','美人','才人','宝林','常在','答应','选侍','更衣','采女','官女子'];
function npcRealName(n,used){ // 旧档里「姓+位份」的称谓补一个稳定本名；已是本名的原样返回
  const raw=String(n&&n.name||'').trim();
  if(!raw)return '';
  let surname='';
  const q=raw.match(/^皇后(.+?)氏$/);
  if(q)surname=q[1];
  if(!surname)for(const t of HAREM_TITLE_WORDS){
    if(raw.length>t.length&&raw.endsWith(t)){surname=raw.slice(0,-t.length);break}
  }
  const pool=(typeof WORLD_LIB!=='undefined'&&Array.isArray(WORLD_LIB.givenNames))?WORLD_LIB.givenNames:[];
  if(!surname||surname.length>1||!pool.length)return raw;
  const start=hashStr('npc:'+raw)%pool.length;
  for(let k=0;k<pool.length;k++){
    const cand=surname+pool[(start+k)%pool.length];
    if(!used.has(cand)){used.add(cand);return cand}
  }
  return raw;
}
function ensureNpcRealNames(s){ // 幂等：已有本名不动，缺的按名讳哈希稳定补齐
  const npcs=(s&&s.npcs)||{};
  const used=new Set();
  for(const id in npcs){const n=npcs[id];if(!n)continue;if(n.name)used.add(n.name);if(n.realName)used.add(n.realName)}
  const emperorName=s.world&&s.world.emperor&&s.world.emperor.name;
  for(const id in npcs){
    const n=npcs[id];if(!n||typeof n!=='object'||n.realName)continue;
    if(emperorName&&(n.name==='皇帝'||id==='皇帝')){n.realName=emperorName;continue}
    n.realName=npcRealName(n,used)||n.name||id;
  }
}
function normalizeState(s){
  s.npcs=(s.npcs&&typeof s.npcs==='object'&&!Array.isArray(s.npcs))?s.npcs:{};
  s.items=(s.items&&typeof s.items==='object')?s.items:{};
  s.relationships=(s.relationships&&typeof s.relationships==='object'&&!Array.isArray(s.relationships))?s.relationships:{};
  s.system=(s.system&&typeof s.system==='object')?s.system:{shop:[]};
  if(!Array.isArray(s.system.shop))s.system.shop=[];
  s.pending=normalizePending(s.pending,s.turn);s.time=s.time||{era:'元朔',year:1,month:3,xun:'上旬'};
  if(s.time.xun==='中旬')s.time.xun='下旬'; // 旧三旬制存档归入两旬制
  if(typeof s.energy!=='number'||!(s.energy>=0)){ // 旧档（无精力字段）：turn 由「已完成旬数」转为「当前旬号」
    s.energy=ENERGY_MAX;
    s.turn=(typeof s.turn==='number'?s.turn:0)+1;
  }
  s.energy=Math.min(ENERGY_MAX,Math.round(s.energy));
  if(typeof s.mealCount!=='number'||!(s.mealCount>=0))s.mealCount=0; // 本旬已传膳次数（每旬至多三次）
  for(const id in s.npcs){ // 人物档案补全：旧档或模型新建的人物缺字段时人物谱会直接报错
    const n=s.npcs[id];if(!n||typeof n!=='object')continue;
    ensureNpcSkills(n,id); // 补才艺：求师名单据此生成
    if(n.skillIntel!=null&&(typeof n.skillIntel!=='object'||Array.isArray(n.skillIntel)))n.skillIntel={}; // 已知才艺见闻
    const pr=n.profile=n.profile&&typeof n.profile==='object'?n.profile:{};
    pr.traits=normalizePersona(Array.isArray(pr.traits)?pr.traits:[]);
    pr.biography=Array.isArray(pr.biography)?pr.biography:[];
    pr.impressions=pr.impressions&&typeof pr.impressions==='object'?pr.impressions:{};
    for(const who in pr.impressions)if(typeof pr.impressions[who]==='string')pr.impressions[who]={note:pr.impressions[who]};
    pr.recent=Array.isArray(pr.recent)?pr.recent:[];
    pr.depth=pr.depth||'初识';
  }
  ensureNpcRealNames(s); // 旧档人物补本名；已有本名不覆盖
  s.protagonist=s.protagonist||{};s.protagonist.attributes=s.protagonist.attributes||{};s.protagonist.skills=s.protagonist.skills||{};
  if(typeof s.protagonist.maids==='string')s.protagonist.maids=s.protagonist.maids.split(/[、,，\s]+/).filter(Boolean);
  if(!Array.isArray(s.protagonist.maids))s.protagonist.maids=[];
  s.protagonist.personality=normalizePersona(s.protagonist.personality); // 旧档性情去重、归并近义、剔除相斥
  const at=s.protagonist.attributes,sk=s.protagonist.skills;
  if(sk['医术·药理']&&!sk['医术']){sk['医术']=sk['医术·药理'];delete sk['医术·药理']} // 旧档才艺名归一
  if(at['才华']==null)at['才华']=50+Math.floor(Math.random()*21); // 识字读书人人有之：才华开局随机，与才艺修习无关
  if(at['体质']==null)at['体质']=50+Math.floor(Math.random()*21);
  if(s.protagonist.constitutionBase==null){ // 旧档补设体质根基（先天禀赋）：不高于70，高出的气血逐旬回落
    s.protagonist.constitutionBase=Math.max(50,Math.min(70,Math.round(Number(at['体质'])||50)));
  }
  if(at['忌惮']==null){ // 心机+野心合并为「忌惮」：宫中众人对主控的忌惮程度
    const a=Number(at['心机']),b=Number(at['野心']);
    at['忌惮']=clamp01_100((a>0&&b>0)?(a+b)/2:((a>0?a:(b>0?b:0))));
  }
  delete at['心机'];delete at['野心'];
  // 行囊迁移：旧分类 items → 统一 inventory（名/件数/备注/可否典卖）
  if(!Array.isArray(s.inventory)){
    s.inventory=[];
    const cats=[['systemItems','系统'],['medical','医药'],['empressDowager','太后所赐'],['emperor','御赐'],['others','其他'],['misc','杂物'],['plants','花草']];
    for(const [k,label] of cats){
      const raw=(s.items||{})[k];if(!raw)continue;
      for(const x of (Array.isArray(raw)?raw:[raw])){
        const it=parseLegacyItem(x,label);
        if(it)s.inventory.push(it);
      }
    }
    if(s.items&&s.items.pawned)s.inventory.push({name:'当票：'+String(s.items.pawned),count:0,note:'已送出典卖之物，赎当须加价',pawnable:false,usable:false,src:'当铺'});
  }
  s.inventory=s.inventory.filter(it=>it&&it.name);
  delete s.items; // 旧分类行囊已并入 inventory
  if(!s.pawnFix1){for(const it of s.inventory)it.pawnable=guessPawnable(it.name,it.note);s.pawnFix1=true} // 一次性重算可否典卖
  if(!s.itemFlagV1){for(const it of s.inventory)it.usable=guessUsable(it.name,it.note);s.itemFlagV1=true} // 旧档一次性重算可否使用
  for(const it of s.inventory)itemFlags(it); // 补齐缺失词条
  if(!s.plotLedgerV1){migratePlotLedger(s);s.plotLedgerV1=true} // 一次性迁移剧情台账
  if(!Array.isArray(s.plots))s.plots=[];
  if(!s.readMindV1){const sys=s.system=s.system||{};const shop=sys.shop=Array.isArray(sys.shop)?sys.shop:[];if(!shop.some(it=>it&&it.name==='读心笺'))shop.push({name:'读心笺',cost:15});s.readMindV1=true} // 旧档商城补读心笺
  s.pending=(s.pending||[]).filter(x=>!/当票|赎当|已逾期/.test(pendText(x))); // 典当银货两讫、当场结清：不留逾期话口
  s.inventory=(s.inventory||[]).filter(it=>!/当票/.test(String(it.name||''))); // 旧档当票条目一并清除
  backfillAvatars(s); // 头像：旧档主控/人物补配（新档在开局生成时已分配）
  syncSkillIntel(s); // 旧档里已经交好的人：按好感补上“知其才艺”
  return s;
}
function parseLegacyItem(x,src){ // 旧档条目解析：剥离「×N」与（备注），按词条推断可否典卖
  if(x==null)return null;
  if(typeof x==='object'){
    const o=Object.assign({count:1,note:'',pawnable:null,usable:null},x);
    o.src=o.src||src;return itemFlags(o);
  }
  let s=String(x),count=1,note='';
  const m=s.match(/×\s*(\d+)/);if(m){count=+m[1];s=s.replace(/×\s*\d+/,'')}
  const pi=s.indexOf('（');
  if(pi>=0){const pe=s.lastIndexOf('）');if(pe>pi){note=s.slice(pi+1,pe);s=s.slice(0,pi)}}
  s=s.replace(/[：:]\s*$/,'').trim();
  if(!s)return null;
  return itemFlags({name:s,count,note,pawnable:null,usable:null,src});
}
const USABLE_RE=/药|丸|散|膏|丹|汤|茶|香|露|酒|糖|羹|粥|饼|果|符|珠|笺|玉容|益气|静心|驻颜|子嗣|免罪|藏锋|传声/;
function guessUsable(name,note){ // 只有能实际消耗/生效的东西才可"使用"；信物、文书、衣饰、摆件只能收藏或转赠
  return USABLE_RE.test(String(name||'')+String(note||''));
}
function guessPawnable(name,note){ // 御赐/御前之物、有情感羁绊或违禁之物不可典卖
  return !/御赐|御前|太后|先皇后|自书|自抄|密信|七夕诗|地藏经|药|谱|抄本|避毒|藏锋|旧函|手串|当票|私藏|风险|不当|帕|纸|笺|帖/.test(String(name||'')+String(note||''));
}
function itemFlags(it){ // 补齐物品词条：可使用 / 可典当
  if(!it)return it;
  if(typeof it.usable!=='boolean')it.usable=guessUsable(it.name,it.note);
  if(typeof it.pawnable!=='boolean')it.pawnable=guessPawnable(it.name,it.note);
  return it;
}
let acquiredThisTurn=[]; // 本旬新得之物：结算时提示"可使用/可典当"
function addToInventory(list){ // 入库：按 名+备注 合并件数，件数归零即除名
  if(!Array.isArray(list)||!state||!Array.isArray(state.inventory))return;
  for(const raw0 of list){
    const raw=typeof raw0==='string'?parseLegacyItem(raw0,'行囊'):raw0; // 兼容模型把物品写成字符串
    if(!raw||!raw.name)continue;
    const it=itemFlags(Object.assign({count:1,note:''},raw));
    const n=Number(it.count);it.count=Number.isFinite(n)?n:1;
    let key=state.inventory.findIndex(o=>o.name===it.name&&o.note===it.note);
    if(key<0&&it.count<0)key=state.inventory.findIndex(o=>o.name===it.name); // 消耗/送出：备注可能不同，按名扣减
    if(key>=0){
      const ex=state.inventory[key];
      ex.count=(Number(ex.count)||0)+it.count;
      if(it.count>0&&it.note)ex.note=it.note;
      if(typeof raw.usable==='boolean')ex.usable=raw.usable;
      if(typeof raw.pawnable==='boolean')ex.pawnable=raw.pawnable;
      if(ex.count<=0)state.inventory.splice(key,1); // 归零除名
    }else if(it.count>0){
      state.inventory.push(it);
    }
    if(it.count>0)acquiredThisTurn.push({name:it.name,usable:it.usable,pawnable:it.pawnable});
  }
}
function pawnPrice(it){ // 典卖估价：按质地分档（本地即时结算，通报主持人）
  const s=String(it.name||'')+String(it.note||'');
  if(/赤金|金错|东珠|红宝石|白玉|翡翠|玛瑙/.test(s))return 20;
  if(/云锦|锦缎|织金|缂丝|裘/.test(s))return 12;

function compactState(s){ // 只压缩送入模型的那一份，localStorage 里仍是完整存档

        if(Array.isArray(pr.recent))pr.recent=pr.recent.slice(-2);

function modelText(message){ // content 可能是字符串、分段数组（部分网关）或对象，统一取出文本
  const c=message&&message.content;

  if(c&&typeof c==='object')return typeof c.text==='string'?c.text:(typeof c.content==='string'?c.content:JSON.stringify(c));

async function callModel(userMsg,opts){
  const s=loadSettings();

  const baseMsgs=(opts&&opts.messages)||buildMessages(userMsg,opts&&opts.noHistory);
  const maxTokens=(opts&&opts.maxTokens)||MAX_OUTPUT_TOKENS;
  const timeoutMs=(opts&&opts.timeoutMs)||REQUEST_TIMEOUT;

    if(expect==='payload'){parsePayload(raw);return}

      let ok=false;
      try{
        const t=String(raw==null?'':raw),a=t.indexOf('{'),b=t.lastIndexOf('}');
        if(b>a)ok=typeof (JSON.parse(t.slice(a,b+1))||{}).impression==='string';

    const started=Date.now();
    try{
      const body={model:s.model||'deepseek-chat',messages,temperature:0.75,max_tokens:maxTokens,response_format:{type:'json_object'}};
      if(useStream)body.stream=true;
      const res=await fetch(s.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST',signal:ctrl.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
        body:JSON.stringify(body)
      });
      if(!res.ok){
        const text=(await res.text()).slice(0,300);
        if(useStream&&(res.status===400||res.status===422)&&/stream|event-stream/i.test(text))return await send(messages,false); // 网关不支持流式：退回整包
        throw new Error('HTTP '+res.status+'：'+text);
      }
      const ctype=String(res.headers.get('content-type')||'');
      let content='',finish='',usage=null,respModel='';
      if(useStream&&/text\/event-stream/i.test(ctype)&&res.body&&typeof res.body.getReader==='function'){

          const payload=str.slice(5).trim();

          if(obj.error){const em=obj.error.message||obj.error.code||JSON.stringify(obj.error);throw new Error('接口返回错误：'+em)}
          if(obj.usage)usage=obj.usage;

          const piece=modelText({content:choice.delta&&choice.delta.content});
          if(piece)content+=piece;

        };
        for(;;){
          const {done,value}=await reader.read();
          if(done)break;
          buf+=dec.decode(value,{stream:true});

          while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);onLine(line)}
        }

        const u=usage;
        console.info(`[API] ${((Date.now()-started)/1000).toFixed(1)}s  prompt ${u.prompt_tokens??'?'} / completion ${u.completion_tokens??'?'} tokens`
          +(u.prompt_cache_hit_tokens!=null?` / cache hit ${u.prompt_cache_hit_tokens}`:''));
      }
      if(finish==='length'||finish==='max_tokens'){ // 截断的 JSON 必然解析失败，标记后由外层精简重试
        const err=new Error('输出达到长度上限被截断，JSON 未闭合');err.raw=content;err.truncated=true;throw err;
      }
      if(!String(content).trim()){ // JSON 模式会把无法识别的输出替换成空格：这是接口已知问题，自动重试
        const err=new Error('模型返回了空内容（接口 JSON 模式偶发）');
        err.empty=true;err.raw='';err.detail=`模型：${respModel||s.model||'—'}${finish?`｜finish_reason：${finish}`:''}`;
        throw err;
      }
      return content;
    }catch(e){
      if(timedOut){const err=new Error(`请求超时（${Math.round(timeoutMs/1000)} 秒），请重试或换更快的模型`);err.timeout=true;throw err}
      throw e;
    }finally{
      clearTimeout(timer);
      if(abortCtrl===ctrl)abortCtrl=null;
    }
  };
  let messages=baseMsgs,truncatedTried=false;
  for(let emptyTried=0,parseTried=0;;){
    let raw;
    try{
      raw=await send(messages,allowStream);
    }catch(e){
      if(e.truncated&&!truncatedTried&&!(opts&&opts.noRetry)){ // 截断：压缩篇幅后重试
        truncatedTried=true;
        console.info('[API] 输出被截断，追加精简要求后重试一次');
        messages=appendBudgetNote(messages);
        continue;
      }
      if(e.empty&&emptyTried<JSON_RETRY_EMPTY&&!(opts&&opts.noRetry)){ // 空内容：DeepSeek 等 JSON 模式偶发，重试通常即可
        emptyTried++;
        console.info(`[API] 返回空内容，自动重试（${emptyTried}/${JSON_RETRY_EMPTY}）`);
        messages=appendJsonHint(messages,true);
        continue;
      }
      throw e;
    }
    try{
      validate(raw);
      return raw;
    }catch(e){
      if(e.invalidJson&&parseTried<JSON_RETRY_PARSE&&!(opts&&opts.noRetry)){
        parseTried++;
        console.info('[API] 返回不是有效 JSON，追加纠正后重试：'+e.message);
        messages=appendJsonHint(messages,false,e);
        continue;
      }
      throw e;
    }
  }
}
function parsePayload(raw){
  const src=raw==null?'':String(raw);
  let t=src.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const fail=m=>{const e=new Error(m);e.raw=src.trim();e.invalidJson=true;throw e};
  if(!t)fail('模型返回了空内容');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0)fail('返回不是 JSON');
  if(b<=a)fail('输出在 JSON 闭合前被截断（可重试）');
  let p;try{p=JSON.parse(t.slice(a,b+1))}catch(e){
    fail(/end of (JSON )?input|unterminated|unexpected end/i.test(e.message)?'输出在 JSON 闭合前被截断（可重试）':'JSON 解析失败：'+e.message);
  }
  if(typeof p.narrative!=='string')fail('JSON 缺 narrative 字段');
  if(p.narrative.length>420)console.info(`[文风] 正文 ${p.narrative.length} 字，超出 420 字上限`);
  // 字段洗净：模型偶发把数组写成字符串、把 scene 写成字符串，后续 .map/.join 会直接抛错并让界面无响应
  const asList=v=>Array.isArray(v)?v:(v==null||v===''?[]:[v]);
  const asText=v=>typeof v==='string'?v:String(v==null?'':JSON.stringify(v));
  const asOption=o=>typeof o==='string'?{text:o}:(o&&typeof o==='object'?o:{text:asText(o)});
  p.changes=asList(p.changes).map(asText).filter(Boolean);
  p.todo=asList(p.todo).map(asText).filter(Boolean);
  p.options=asList(p.options).map(asOption);
  if(p.eventSource!=null&&typeof p.eventSource!=='string')p.eventSource=asText(p.eventSource);
  if(p.scene!=null&&(typeof p.scene!=='object'||Array.isArray(p.scene)))p.scene={line:asText(p.scene)};
  if(p.scene){
    if(p.scene.line!=null&&typeof p.scene.line!=='string')p.scene.line=asText(p.scene.line);
    if(p.scene.who!=null&&typeof p.scene.who!=='string')p.scene.who=asText(p.scene.who);
    if(p.scene.where!=null&&typeof p.scene.where!=='string')p.scene.where=asText(p.scene.where);
    if(p.scene.when!=null&&typeof p.scene.when!=='string')p.scene.when=asText(p.scene.when);
    if(p.scene.options!=null)p.scene.options=asList(p.scene.options).map(asOption); // 字符串/单对象也不能留到 .map
  }
  if(p.dossier!=null&&!Array.isArray(p.dossier))p.dossier=[];
  if(p.statePatch!=null&&(typeof p.statePatch!=='object'||Array.isArray(p.statePatch)))p.statePatch={};
  return p;
}

/* ============================================================ 结算 */
function advanceTime(t){ // 两旬制日历推进：上旬→同月下旬；下旬→次月上旬（跨年自动）
  t=Object.assign({},t);
  if(t.xun==='上旬'){t.xun='下旬'}
  else{t.xun='上旬';t.month=(Number(t.month)||1)+1;if(t.month>12){t.month=1;t.year=(Number(t.year)||1)+1}}
  delete t.note;
  return t;
}
function applyPatch(patch){
  if(!patch)return[];
  const majors=[];
  let baseCap=Number(state&&state.protagonist&&state.protagonist.constitutionBase)||0; // 体质根基：气血上限
  const pb=patch['protagonist.constitutionBase'];
  if(typeof pb==='number')baseCap=Math.max(baseCap,Math.round(pb)); // 同补丁先抬根基，再按新根基钳气血
  for(const k in patch){
    if(k==='log')continue;
    if(k==='turn')continue; // 回合数前端自管
    if(k==='time')continue;  // 日历前端自管（两旬制固定规则，避免与模型重复推进）
    if(k==='inventory.add'){addToInventory(Array.isArray(patch[k])?patch[k]:[patch[k]]);continue} // 行囊入库（前端合并件数）
    if(k==='plots'){state.plots=mergePlots(state.plots,patch[k],state.turn);continue} // 剧情台账按 id 增量合并；回写即记 touch=本旬
    if(k==='pending'){state.pending=normalizePending(Array.isArray(patch[k])?patch[k]:[patch[k]],state.turn).filter(x=>!/当票|赎当|已逾期/.test(x.t));continue} // 模型回写也过滤：典当类话口不入待续
    if(/^items\./.test(k)){ // 旧式分类写入：转行囊
      const cat=k.slice(5),arr=Array.isArray(patch[k])?patch[k]:[patch[k]];
      const label={systemItems:'系统',medical:'医药',empressDowager:'太后所赐',emperor:'御赐',others:'其他',misc:'杂物',plants:'花草'}[cat]||cat;
      for(const x of arr){const it=parseLegacyItem(x,label);if(it)addToInventory([it])}
      continue;
    }
    if(k==='inventory')continue; // 行囊只走 inventory.add，整表覆盖会把已合并的件数冲掉
    if(k==='statePatch')continue;
    if(/(^|\.)(__proto__|constructor|prototype)(\.|$)/.test(k))continue;
    let v=patch[k];
    if(v===undefined||v===null)continue; // 空值不参与结算，避免整块字段被 null 冲掉
    if(k==='protagonist.constitutionBase'&&typeof v==='number'){v=Math.max(30,Math.min(90,Math.round(v)));setPath(state,k,v);continue} // 体质根基 30—90：锻炼/调理/伤病在此结算
    if(/protagonist\.(attributes|skills)\./.test(k)&&typeof v==='number')v=clamp01_100(v);
    if(k==='protagonist.attributes.体质'&&baseCap>0)v=Math.min(v,baseCap); // 气血（体质）永不高于根基
    if(v&&typeof v==='object'&&!Array.isArray(v)){ // 模型把 {"protagonist":{"attributes":{...}}} 整块写进来时按字段合并
      const cur=getPath(state,k);
      if(cur&&typeof cur==='object'&&!Array.isArray(cur)){mergeDeep(cur,v);continue}
    }
    setPath(state,k,v);
    if(k==='protagonist.rank')majors.push('位份变动');
    if(/死亡|薨|病逝|暴毙/.test(k))majors.push('死亡');
  }
  return majors;
}
function applyDossier(list){
  if(!Array.isArray(list))return;
  for(const d of list){
    if(!d||!d.npc)continue;
    const id=d.npc;
    if(!state.npcs[id]){
      state.npcs[id]={known:true,metAt:fmtTime(),name:id,realName:d.realName||'',rank:d.rank||'',faction:d.faction||'',age:Number(d.age)||null,
        profile:{traits:[],biography:[],impressions:{},recent:[],depth:'初识'},hidden:d.hidden||{}};
    }
    const npc=state.npcs[id];
    if(d.rank)npc.rank=String(d.rank); // 位份会升降：以最新档案为准
    if(d.faction)npc.faction=String(d.faction);
    if(d.realName)npc.realName=String(d.realName);
    if(d.age!=null)npc.age=Number(d.age)||npc.age;
    if(!npc.avatar&&state.avatarMap&&state.avatarMap[id]){npc.avatar=state.avatarMap[id];delete state.avatarMap[id]} // 同一人只留一张脸
    const acat=npc.avatarCat||avatarCatFor(state,id,d.rank||npc.rank||'');
    if(!npc.avatarCat)npc.avatarCat=acat;
    if(npc.avatar&&!avatarIsAcceptable(avatarIdOf(npc.avatar),acat,npcTraits(npc),npc.age))npc.avatar=''; // 旧映射与身份不符则重配
    if(!npc.avatar)npc.avatar=giveAvatar(state,id,d.rank||'',d.traits,npc.age,acat); // 新登场人物按身份与性情补一张剩余头像
    ensureNpcSkills(npc,id); // 新人物补才艺，供往后求师
    const prof=npc.profile=npc.profile||{traits:[],biography:[],impressions:{},recent:[],depth:'初识'};
    npc.known=true; // 模型在 dossier 里报到，说明主控已听说/见到，立即解锁
    if(!state.relationships[id])state.relationships[id]={type:'好感',value:0};
    if(d.hidden&&typeof d.hidden==='object')npc.hidden=Object.assign(npc.hidden||{},d.hidden);
    const dt=Array.isArray(d.traits)?d.traits:(d.traits?[d.traits]:[]);

  }

}
function isMajorTurn(patch,payload){
  if(!patch)return false;
  if(patch['protagonist.rank'])return true;
  const blob=JSON.stringify(patch)+' '+(payload.changes||[]).join(' ');
  return /晋|降位|有孕|遇喜|喜脉|薨|病逝|死亡|派系|剧情阶段/.test(blob);
}
/* 侍女问话等旬中插话：本旬养成不在此结算。模型若仍写了才艺/属性成长，剔除键与对应变化条目 */
const STANDALONE_GROWTH_RE=/^(琴艺|棋艺|书法|画艺|歌艺|舞艺|女红|医术|药理|莳花|香道|外貌|才华|交际|忌惮|手段|威望|体质|孕率)\s*[+＋\-－]/;
function stripStandaloneGrowth(p){
  if(!p)return p;
  const patch=(p.statePatch&&typeof p.statePatch==='object'&&!Array.isArray(p.statePatch))?p.statePatch:{};
  const dropped=[];
  const walk=(o,pre)=>{
    for(const k of Object.keys(o)){
      const key=pre?pre+'.'+k:k;
      if(/^protagonist\.(skills|attributes)\./.test(key)){dropped.push(k);delete o[k];continue}
      const v=o[k];
      if(v&&typeof v==='object'&&!Array.isArray(v)&&/^protagonist(\.(skills|attributes))?$/.test(key))walk(v,key);
    }
  };
  walk(patch,'');
  if(Array.isArray(p.changes))p.changes=p.changes.filter(c=>{
    const s=String(c);
    if(dropped.some(n=>n&&s.includes(n)))return false;
    return !STANDALONE_GROWTH_RE.test(s.trim());
  });
  return p;
}
/* ---------- 本旬小结：只汇总已发生的行事与真实数值差，不新增任何变化 ---------- */
function snapshotStats(){
  const p=(state&&state.protagonist)||{};
  const rel={};
  for(const k in (state.relationships||{})){
    const v=state.relationships[k];
    if(v&&typeof v==='object'&&typeof v.value==='number')rel[k]=v.value;
  }
  const inv={};
  for(const it of (state.inventory||[]))if(it&&it.name)inv[it.name]=Number(it.count)||0;
  return {
    attributes:Object.assign({},p.attributes||{}),
    skills:Object.assign({},p.skills||{}),
    silver:Number(p.silver)||0,
    points:Number(p.points)||0,
    rank:String(p.rank||''),
    energy:Math.round(Number(state.energy)||0),
    relationships:rel,
    inventory:inv
  };
}
function ensureXunBook(){
  if(!state)return null;
  if(!state.xunBook||state.xunBook.turn!==state.turn||!state.xunBook.snap){
    state.xunBook={turn:state.turn,actions:[],snap:snapshotStats()};
  }
  return state.xunBook;
}
function resetXunBook(){
  if(!state)return;
  state.xunBook={turn:state.turn,actions:[],snap:snapshotStats()};
}
function logXunAction(focus){
  const b=ensureXunBook();if(!b)return;
  const f=String(focus||'').trim();if(!f)return;
  const last=b.actions[b.actions.length-1];
  if(last&&last.focus===f){last.count=(Number(last.count)||1)+1;return}

function buildXunSummary(){
  const b=ensureXunBook()||{actions:[],snap:{}};
  const s=b.snap||{};const now=snapshotStats();
  const acts=(b.actions||[]).map(a=>Number(a.count)>1?`${a.focus} ×${a.count}`:a.focus);
  const diffs=[];
  const num=v=>typeof v==='number'&&Number.isFinite(v);
  const add=(label,a,z)=>{
    if(!num(a)||!num(z)||a===z)return;
    const d=Math.round((z-a)*10)/10;
    diffs.push(`${label}　${a} → ${z}（${d>0?'+':''}${d}）`);
  };
  const addMap=(label,from,to)=>{
    const keys=new Set([...Object.keys(from||{}),...Object.keys(to||{})]);
    for(const k of keys)add(`${label}·${k}`,(from||{})[k],(to||{})[k]);
  };
  addMap('属性',s.attributes,now.attributes);
  addMap('才艺',s.skills,now.skills);
  add('银两',s.silver,now.silver);
  add('积分',s.points,now.points);
  addMap('关系',s.relationships,now.relationships);
  if(s.rank&&now.rank&&s.rank!==now.rank)diffs.push(`位份　${s.rank} → ${now.rank}`);
  const invNames=new Set([...Object.keys(s.inventory||{}),...Object.keys(now.inventory||{})]);
  for(const n of invNames){
    const a=Number((s.inventory||{})[n])||0,z=Number((now.inventory||{})[n])||0;

  }

}
function xunSummaryHtml(){

function finalize(payload,meta){
  try{
    const tiBefore=state&&state.protagonist&&state.protagonist.attributes?Number(state.protagonist.attributes['体质']):null;
    const majors=applyPatch(payload.statePatch);
    if(payload&&Array.isArray(payload.changes)&&tiBefore!=null){ // 体质被根基钳住、实际未涨时，撤下"体质+"变化条，面板不说假话
      const tiAfter=Number(state.protagonist.attributes['体质']);
      if(!(tiAfter>tiBefore))payload.changes=payload.changes.filter(c=>!/^体质\s*[+＋]/.test(String(c)));
    }
    autoSettleDuePlots(meta&&meta.adj);
    autoExpireStalePlots(meta&&meta.adj);
    try{applyDossier(payload.dossier)}catch(e){console.warn('[dossier] 人物档案回写失败',e)} // 单条人物档案出错不拖垮整旬结算
    const intelChanged=syncSkillIntel(state); // 交好到相熟：补记已知才艺
    history.push({turn:state.turn,focus:meta.focus||'',choice:meta.choice||'',narrative:filterText(payload.narrative),log:String((payload.statePatch&&payload.statePatch.log)||'')});
    if(history.length>HISTORY_CAP)history.splice(0,history.length-HISTORY_CAP);
    try{UI.renderTurnCard(payload,meta)}catch(e){console.warn('[card] 纪事卡渲染失败',e)}
    UI.updateStatusbar();
    if(intelChanged)toast('来往渐深，你已知道某人的才艺（人物谱可查）',3200);
    if(majors.length||isMajorTurn(payload.statePatch,payload)){
      saveToSlot(0,true);toast('已自动存档（'+fmtTime()+'）');
    }
    if(acquiredThisTurn.length){ // 新得之物：顺手标出能否使用、能否典当
      const list=acquiredThisTurn.slice(0,3).map(x=>`「${x.name}」${x.usable?'可使用':'不可使用'}·${x.pawnable?'可典当':'不可典当'}`).join('、');
      toast('获得 '+list+(acquiredThisTurn.length>3?' 等':''),4200);
      acquiredThisTurn=[];
    }
  }catch(e){
    console.error('[结算] 失败',e);
    toast('本旬结算出错：'+(e.message||e),4000);
  }
  persistCurrent();
}

    const c=this.npcCard(who);
