  }
  for(const c of consorts){
    if(!c.faction&&factions.length&&Math.random()<0.35)c.faction=wlPick(factions).name;
  }

  /* 主控居所：选一位非皇后的高位主位 */
  const mainCandidates=consorts.filter(c=>!c.isQueen&&WL_HIGH_RANKS[c.short]);
  const main=wlPick(mainCandidates);
  const hall=/官女子/.test(proto.rank||'')?'配殿':'侧殿';
  const location=main.palace.name+hall;

  /* 皇嗣 */
  const maxConsortAge=Math.max(...consorts.map(c=>c.age));
  const maxHeirAge=Math.min(12,emperor.age-14,maxConsortAge-14);
  const heirCount=maxHeirAge<0?0:wlPick([0,0,1,1,1,2,2,3]);
  const heirs=[];
  const usedHeirGiven=new Set();
  for(let i=0;i<heirCount;i++){
    const age=wlInt(0,maxHeirAge);
    const mothers=consorts.filter(c=>c.age>=age+14);
    if(!mothers.length)continue;
    const mother=wlPick(mothers);
    let given=wlPick(WORLD_LIB.heirGiven.filter(g=>!usedHeirGiven.has(g)));
    if(!given)continue;
    usedHeirGiven.add(given);
    heirs.push({name:d.surname+given, given, gender:Math.random()<0.6?'皇子':'皇女',
      age, mother:mother.name, traits:wlPick(WORLD_LIB.heirTraits),
      学识:wlInt(20,60), 礼仪:wlInt(20,60), 体魄:wlInt(25,65), 依赖:wlInt(40,80)});
  }

  /* 关键下人 */
  const eunuch=wlPick(WORLD_LIB.eunuchs);
  const guard=wlPick(WORLD_LIB.guards);
  const headMaid=wlPick(WORLD_LIB.headMaids);
  const physician=wlPick(WORLD_LIB.physicians);
  const maids=wlPickN(WORLD_LIB.maids.filter(m=>m.name!==headMaid.name),2);

  const npcs={};
  const rels={};
  const addNpc=(name,rank,faction,traits,family,hidden,depth='初识',known=false,realName='',age=null)=>{
    if(!name||npcs[name])return;
    npcs[name]={known, metAt, name, rank, faction, realName, age,
      profile:{traits:normalizePersona(traits||[]), biography:family?[{time:metAt,text:`出身${family}`,src:'亲见'}]:[], impressions:{}, recent:[], depth},
      hidden:hidden||{}};
  };
  const addRelRaw=(who,val)=>{if(who&&!rels[who])rels[who]=val};
  const addRel=(who,type,value)=>addRelRaw(who,{type,value:clamp01_100(value)});

  addNpc('皇帝','皇帝','',[emperor.traits],'',{
    真实性情:emperor.traits, 在意:'旧物与“不取”；最厌被人拿命做局', 当前目标:'前朝与后宫都求一个稳', 对主控:'尚未留意'
  },'听说',true,emperor.name,emperor.age);
  addRel('皇帝','宠爱',0);

  if(dowager){
    addNpc('太后','太后','',[dowager.personality],dowager.family,{
      真实性情:dowager.personality, 健康:dowager.health, 当前目标:dowager.stance, 对主控:'先看行事，不急着表态'
    },'听说',true,'',50);
    addRel('太后','好感',wlInt(0,20));
  }

  for(const c of consorts){
    addNpc(c.name,c.rank,c.faction,c.traits,c.family,c.hidden,c.isQueen?'听说':'初识',c.isQueen,c.realName,c.age);
    const np=npcs[c.name];
    if(np){ // 帝与妃嫔各有一笔账：帝宠、旧事、眼下的事
      const kids=heirs.filter(h=>h.mother===c.name).length;
      np.child=kids>0;
      np.favor=clamp01_100(8+rankScoreOf(c.rank)*2+(c.isQueen?22:0)+(kids?10:0)+wlInt(-6,10));
      const tt=normalizePersona(c.traits||[]).join('');
      np.emperorStory=c.isQueen?'中宫多年，帝待她以礼，敬多于亲'
        :(/温厚|柔婉|细腻/.test(tt)?'曾侍过帝一场病，此后逢年节总记得她一句'
        :(/骄矜|好胜|清傲/.test(tt)?'母家势大，入宫那年十里红妆，帝也给过三分体面'
        :(kids?'膝下有子女，帝偶尔会问起孩子':'入宫几年，不功不过，牌子时有时无')));
      np.arc='眼下的心思：'+wlPick(['为入冬的份例与人别苗头','盯着中宫行事的分寸，想寻个错处','替母家求一件事，还没寻着由头','与新入宫的人暗中较劲','想把养在名下的孩子往前推一步','称病避着，不肯站队']);
    }
    if(c.isQueen)addRel(c.name,'好感',wlInt(0,15));
  }
  for(const h of heirs){
    addNpc(h.name,'皇嗣','',[h.traits],`生母${h.mother}`,{
      生母:h.mother, 性情:h.traits, 对主控:'尚不熟悉'
    },'初识',false,'',h.age);
  }
  for(const [role,person] of [['太监总管',eunuch],['侍卫总领',guard],['掌事姑姑',headMaid],['太医',physician]]){
    addNpc(person.name,role,'',[person.personality],'',{
      真实性情:person.personality, 对主控:'新主子的分量还看不准，先守着本分'
    },'初识',false,'',role==='太医'?40:role==='掌事姑姑'?38:role==='侍卫总领'?25:35);
  }
  for(const m of maids){
    addNpc(m.name,'宫女','',[m.personality],'',{
      真实性情:m.personality, 对主控:'刚分到新主子，且看主控待下人如何'
    },'初识',false,'',18);
  }

  /* 主线：入梦定途，路线在此不生成；由入梦选择后 startMainLine 落账 */

  /* 初始行囊 */
  const inventory=[
    {name:'家传玉佩',count:1,note:'贴身之物，不典不卖',pawnable:false,usable:false,src:'家中所赠'},
    {name:'素缎帕子',count:2,note:'',pawnable:true,usable:false,src:'行囊'},
    {name:'宫花一匣',count:1,note:'入宫时内务府所发',pawnable:true,usable:false,src:'内务府'}
  ];
  if(/勋贵|宗室/.test(proto.family||''))inventory.push({name:'赤金缠枝簪',count:1,note:'家里压箱底的体面',pawnable:true,usable:false,src:'家中所赠'});

  const protagonist=JSON.parse(JSON.stringify(proto));
  protagonist.maids=maids.map(m=>m.name);
  protagonist.points=protagonist.points||0;
  protagonist.health=protagonist.health||'康健';
  protagonist.salary=`每月${monthlySalaryFor(protagonist.rank)}两，月初份例领取`;
  protagonist.special='宫斗系统已激活；首个主线任务见剧情账';
  protagonist.security='入口两道手，药食先验';
  protagonist.settleRule='并行多事时主收益打折＋一项附带收益';

  const state={
    game:'带着系统去宫斗', saveVersion:'web-2', turn:0,
    time, location, lastNode:`选秀入宫，居${location}`,
    energy:100, energyWarned:false, mealCount:0,
    bedchamber:{log:[],last:null,seq:0}, pregnancy:null, postpartumUntil:0, xunIntent:null,
    heirs:heirs.map((h,i)=>({id:'h-init-'+i,name:h.name,gender:h.gender,age:h.age,birthTurn:-h.age*24,
      mother:h.mother,raisedBy:h.mother,traits:[h.traits],health:'康健',
      学识:h['学识'],礼仪:h['礼仪'],体魄:h['体魄'],依赖:h['依赖']})),
    world:{
      dynasty:d.name, surname:d.surname, era, year:eraYear, years:d.years, flavor:d.flavor,
      emperor, dowager: dowager?{title:dowager.title, family:dowager.family, personality:dowager.personality, health:dowager.health, stance:dowager.stance}:null,
      factions:factions.map(f=>f.name),
      factionLeaders:factions.map(f=>({name:f.name, leader:f.leader, stance:f.stance, goal:f.goal})),
      mainConsort:main.name, mainPalace:main.palace.name, residence:location,
      heirs:heirs.length?heirs.map(h=>`${h.gender}${h.name}（${h.age}岁，生母${h.mother}）`).join('；'):'暂无皇嗣',
      keyServants:[eunuch.name,guard.name,headMaid.name,physician.name]
    },
    protagonist, npcs, relationships:rels,
    system:{mainQuests:'命途未定', activeQuest:'入梦定途', points:100, shop:[] /* 货色由 refreshShop 按旬轮换填入 */},
    inventory, items:{}, pending:[{t:`向主位${main.name}请安，认一认宫里的人`,touch:1}], // touch=第1旬：新档首条琐事不当发酵处理
    plots:[], plotLedgerV1:true, pawnFix1:true, mainLine:null,
    chronicle:[{time:fmtTime(time),text:`选秀入宫，初封${proto.rank}，居${location}；宫斗系统激活，入梦相问。`}],
    plotMeta:{lastEventTurn:-99,lastBigTurn:-99,rollTurn:-1,graceTurn:3},
    npcGoalCards:{
      [main.name]:`稳住主位与宫务；正在看新入宫的低位妃嫔是否可用。下一步：等主控来请安`,
      '皇帝':`前朝求稳，后宫不喜生事；下一步：看今岁选秀的新人里有没有可留意者`,
      ...(factions[0]?{[factions[0].leader]:`${factions[0].goal}；${factions[0].stance}。下一步：先试探新入宫的低位妃嫔`}:{})
    },
    recentConfirmedFacts:[
      `${d.name}${era}${eraYear}年三月上旬入宫，初封${proto.rank}，居${location}，主位${main.name}`,
      `当今帝${emperor.name}，${emperor.traits}`,
      `${dowager?dowager.title+'在世，'+dowager.stance:'太后已崩逝'}`,
      '宫斗系统入梦相问，命途待定'
    ],
    nextStep:'从住处安排第一旬生活重心'
  };

  /* 开局头像：按身份、年龄与性情为每人（含主控）分配一张，全档不重复 */
  {const heirCat={};heirs.forEach(h=>heirCat[h.name]=(h.gender==='皇子'?'prince':'princess'));
   const assign=[{who:'__me__',cat:avatarCatFor(state,'__me__',protagonist.rank)||'consort',traits:protagonist.personality,age:protagonist.age}];
   for(const id in npcs){
     const cat=heirCat[id]||avatarCatFor(state,id,npcs[id].rank)||'consort';
     npcs[id].avatarCat=cat; // 记下发放时的身份池：皇嗣等泛称旧档回读时仍按皇子/皇女校验
     assign.push({who:id,cat,traits:npcTraits(npcs[id]),age:npcs[id].age});
   }
   const dealt=dealAvatars(assign,cr.avatar?[AV(cr.avatar)]:[]); // 玩家选定的脸优先占位，其余按池分发、全局不重复
   protagonist.avatar=cr.avatar?AV(cr.avatar):(dealt['__me__']||'');
   for(const id in npcs)npcs[id].avatar=dealt[id];}

  /* 开局隐秘：每个在册人物自带一两条秘密，是日后查证线与读心笺的交付物 */
  state.secrets=[];state.secretSeq=0;
  for(const id in npcs)if(npcs[id]&&npcs[id].rank)secretAssignS(state,id,npcTraits(npcs[id]));

  /* 开局正文 */
  const closing=wlPick([
    '你站在殿门前，忽然明白，从今往后，每一步都要自己走。',
    '宫墙很高，春日的日头落在檐角。你攥了攥袖口，没有回头。',
    '远处传来更漏声。你知道自己没有退路，也不打算退。',
    '风从廊下过，吹动新换的宫装。你把腰背挺直了些。'
  ]);
  const maidFlavor=wlPick([
    '宫人手脚麻利，话却不多；你看得出来，这些人还在看你这个新主子的分量。',
    '两个宫女一个爱笑，一个沉静，替你归置箱笼时，眼睛都往那几匹料子上瞟。',
    '掌事姑姑说话滴水不漏，问一句答一句，倒把宫里的规矩先摆在了前头。'
  ]);
  const familyLabel=(protagonist.family||'').split('：')[0]||'寒门';
  const heirLine=heirs.length
    ? heirs.slice(0,2).map(h=>`${h.gender}${h.name}${h.age}岁，养在${h.mother}名下`).join('；')
    : (hasQueen?'皇后膝下犹空':'宫中膝下犹空');
  const factionLine=factions.length?factions.map(f=>f.name).join('、')+'各有各的往来':'六宫表面和气';
  const paras=[
    `${d.name}国立国${d.years}，当今国号${d.name}，年号${era}，帝${emperor.name}在位第${eraYear}年。${d.flavor}。帝今年${emperor.age}岁，${emperor.traits}。`,
    `${era}${eraYear}年三月初，这届选秀毕了。你名叫${protagonist.name}，出身${familyLabel}，经选秀入宫，初封${protagonist.rank}，居${location}，主位${main.name}。${main.palace.flavor}。宫门在身后合上时，你听见铜环轻轻一响。`,
    `${dowager?dowager.title+'尚在，'+dowager.stance:'太后已崩逝'}。这宫里原有${consorts.length}位有名有份的妃嫔。${factionLine}；${heirLine}。主位${main.name}遣人传话，说今日不必过去，明日晨起再叙。你把这些名字一一记下，知道往后的日子，多半要和这些人打交道。`,
    `${headMaid.name}领着${protagonist.maids.join('、')}来迎，行礼时口称“小主”。侧殿不大，一榻一几，窗下摆着一盆半开的兰。${maidFlavor}`,
    `【宫斗系统】激活。那声音只说了一句：今夜入梦，我要问你几句话。它不疾不徐，只有你一个人听得见。`,
    closing
  ];
  const text=paras.join('\n\n');
  const tutorial=[
    {title:'入宫',depth:'',text:[paras[0],paras[1],paras[5]].join('\n\n'),unlock:[]},
    {title:'六宫格局',depth:'听说',
      text:paras[2]+'\n\n'+`掌事姑姑说，几处派系各有领头的人：${state.world.factionLeaders.map(f=>`${f.name}以${f.leader}为首`).join('；')}。这些名字先记下，往后遇上了，才知谁该敬、谁该避。`,
      unlock:[main.name,...state.world.factionLeaders.map(f=>f.leader),...heirs.map(h=>h.name)]},
    {title:'住处与身边人',depth:'初识',
      text:paras[3]+'\n\n'+`往后每一旬，你有精力一百：修习才艺耗十五，出门拜访、料理宫务各耗二十，往御花园散步闲逛耗十，用一件东西耗五；精力见了底会当场昏厥，伤的是体质。乏了不必硬撑——就此歇下、进入下一旬，精力自然回满，不耗什么。日子怎么排，要你自己拿主意。\n\n体质是气血，先天根基各有高下，状态页写作「体质　气血／根基」。散步、药膳能把气血养回根基，却养不过根基，高出的部分每旬还会回落；想拔高根基，得靠长期的锻炼与调理。气血太低易病，孕产也多凶险。`,
      unlock:[headMaid.name,...maids.map(m=>m.name)]},
    {title:'宫斗系统',depth:'',
      text:paras[4]+'\n\n'+`系统只对你一人可见。它替你在入梦里定下一条路（命途）：五阶，每阶有门槛与一场必须演出来的关目，不设期限，都到了才过阶。点【局面】里的剧情账，或底下的「命途」，随时可看走到第几阶、还差什么。\n\n完成任务得积分，积分可在商城换道具；道具能改属性、改关系，也能在要紧时救你一命。便宜的读心笺还能窥见一人此刻对你的真实心意。当前积分 100，点顶栏「积分」即可打开商城；商城道具每三旬刷新。`,
      unlock:[]},
    {title:'第一旬',depth:'',
      text:`从这一旬起，没有现成的路。你可以先熟悉住处、去给主位${main.name}请安、认一认宫人，或闭门修习。每做一件事耗精力，做完一件，还可接着安排下一件。\n\n才艺只带你入宫时会的这一两门；其余诸艺，得先打听谁会——与相识之人交好，或问身边侍女。知道之后，才好登门求师。\n\n下方【状态】【行囊】【人物】随时可查。人物谱只记你听说过、打过交道的人——没见过的人，不会凭空出现在册子上。\n\n点【开始第一旬】，从四件事里挑一件最要紧的。`,
      unlock:[]}
  ];

  const news=[
    `${dowager?dowager.title+'尚在，'+dowager.stance:'太后已崩逝'}`,
    `${factions.map(f=>f.name).join('、')}在宫中各有往来`,
    heirs.length?`${heirs[0].gender}${heirs[0].name}${heirs[0].age}岁`:'宫中暂无皇嗣'
  ].join('；')+'。';

  const topSkill=Object.keys(protagonist.skills||{})[0];
  const options=[
    '往御花园散步，认一认宫中路径',
    `去给主位${main.name}请安`,
    '认一认身边宫人，理清宫务',
    topSkill?`闭门修习才艺·${topSkill}`:'闭门修习才艺·读书习字'
  ];

  return {
    state, text, tutorial,
    news,
    changes:[],
    todo:[`向主位${main.name}请安`],
    options
  };
}
function unlockNpc(name,depth='听说'){ // 渐进解锁：听说过/打过交道后才进人物谱
  if(!state||!state.npcs)return;
  const n=state.npcs[name];if(!n)return;
  n.known=true;
  n.profile=n.profile||{traits:[],biography:[],impressions:{},recent:[],depth:'初识'};
  if(depth)n.profile.depth=depth;
  if(!state.relationships[name])state.relationships[name]={type:'好感',value:0};
  if(depth==='听说'&&Array.isArray(n.profile.biography)&&!n.profile.biography.some(b=>b.src==='传闻')){
    n.profile.biography.unshift({time:fmtTime(),text:'在宫中听人提起过此人',src:'传闻'});
  }
}

const WHO_PLACEHOLDER=/^(宫中来人|来人|某人|某某|众人|宫人|宫女|太监|内侍|侍女|嬷嬷|姑姑|不详|未知|无名|此人|对方|旁人|无|你|我|主控)$/;
function isPlaceholderWho(who){ // 「…」「某人」这类占位不是人：当作没写，交给 parts 与叙述去认人
  const w=String(who==null?'':who).trim();
  if(!w)return true;
  if(/^[\s.。·…⋯、，,．\-—－_~～?？!！:：;；'"“”‘’*＊]+$/.test(w))return true;
  return WHO_PLACEHOLDER.test(w);
}
function sceneSpeaker(p,sc){ // 定对话对方：模型漏写 who 或写成「…」时，先认 parts 里的 say.who／拜访对象，再从叙述里认人
  const raw=String((sc&&sc.who)||(p&&p.eventSource)||'').trim();
  if(!isPlaceholderWho(raw))return raw;
  const parts=Array.isArray(sc&&sc.parts)?sc.parts:[];
  const isQuote=x=>/^(quote|quoted|cite|citation|refer|references|引用|转述|引述)$/i.test(String((x&&(x.type||x.t||x.role))||'').trim());
  const partWho=[...new Set(parts.filter(x=>!isQuote(x)).map(x=>String((x&&x.who)||'').trim()).filter(w=>!isPlaceholderWho(w)))]; // quote 的 who 是原话者，不是对话对方
  if(partWho.length===1)return partWho[0];
  if(!isPlaceholderWho(sceneWhoHint))return sceneWhoHint; // 主动拜访：拜访对象比叙述里被提及的人更可靠
  if(partWho.length>1)return partWho[0]; // 一轮里几个人都开了口：认最先开口的那个
  const line=[String((sc&&sc.line)||''),...parts.map(x=>String((x&&x.text)||x||'')),String((p&&p.narrative)||'')].join(' ');
  const npcs=(state&&state.npcs)||{},proto=String((state&&state.protagonist&&state.protagonist.name)||'');
  let best='',bestHits=0,tie=false;
  for(const id in npcs){
    if(!id||id===proto)continue;
    const n=npcs[id]||{};let hits=0;
    for(const nm of [id,n.name,n.realName]){const s=String(nm||'').trim();if(s.length<2||s===proto)continue;const c=line.split(s).length-1;if(c>hits)hits=c}
    if(!hits)continue;
    if(hits>bestHits){best=id;bestHits=hits;tie=false}
    else if(hits===bestHits)tie=true;
  }
  if(best&&(!tie||bestHits>=2))return best; // 只提到一个人，或其中一人被反复提起：就认这一个
  return '宫中来人'; // 实在认不出：不把「…」当人名带进对话
}
function isServantWho(who){ // 通传引路一类：太监、宫女、嬷嬷——能开场，但不能一直占着对话人
  const w=String(who||'').trim();if(!w)return false;
  const n=((state&&state.npcs)||{})[w]||{};
  const name=String(n.realName||n.name||w),rank=String(n.rank||n.role||n.title||'');
  const cls=avatarClassOf(name,rank);
  if(cls==='eunuch'||cls==='maid'||cls==='matron')return true;
  if(/公公|太监|内侍|宦官|宫女|宫人|侍女|姑姑|嬷嬷|首领/.test(name+' '+rank+' '+w))return true;
  const lib=libAvatarCat(name);return lib==='eunuch'||lib==='maid'||lib==='matron';
}
function emperorSceneId(){ // 帝的存档键：档案、关系两处兜底，实在没有就用「皇帝」
  const npcs=(state&&state.npcs)||{},rels=(state&&state.relationships)||{};
  const isEmp=id=>(typeof UI!=='undefined'?UI.isEmperorId(id):/^(皇帝|皇上|陛下|圣上|圣人|天子|万岁|今上|官家|大家)$/.test(id));
  return Object.keys(npcs).find(isEmp)||Object.keys(rels).find(isEmp)||'皇帝';
}
function sceneHandoffTarget(parts,narr,cur){ // 该不该把对话人交回正主：帝已开口或已到场，宫人却还占着位置
  const curW=String(cur||'').trim();if(!curW)return '';
  const isEmpId=w=>typeof UI!=='undefined'?UI.isEmperorId(w):/^(皇帝|皇上|陛下|圣上|圣人|天子|万岁|今上|官家|大家)$/.test(String(w||'').trim());
  if(isEmpId(curW))return '';
  if((parts||[]).some(p=>p&&p.who&&canonicalSceneWho(p.who)&&canonicalSceneWho(p.who)!==curW))return ''; // 模型自己标了换人：按它的标注分气泡，不猜
  const says=(parts||[]).filter(p=>p&&p.type==='say').map(p=>String(p.text||'')).join(' ');
  const acts=(parts||[]).filter(p=>p&&p.type==='act').map(p=>String(p.text||'')).join(' ');
  const narrs=(parts||[]).filter(p=>p&&p.type==='narr').map(p=>String(p.text||'')).join(' ');
  const strayEmp=(parts||[]).some(p=>p&&p.type==='say'&&/朕|寡人/.test(String(p.text||''))&&!isEmpId(p.who)); // 只有帝自称，却挂在旁人名下
  if(strayEmp)return emperorSceneId();
  if(!isServantWho(curW))return '';
  const scene=String(narr||'')+' '+narrs+' '+acts;
  const presence=/御案|御笔|御前|御览|御座|龙颜|龙袍|天子/.test(scene)||/(^|[。！？；\s])(陛下|皇上|圣上)[，,]/.test(says); // 「上首」是座次、「御书房／御膳房」是地方：都不等于帝在场
  return presence?emperorSceneId():'';
}
function applySceneHandoff(parts,narr,cur){ // 交人：未标 who 的台词归正主，交人后的动作也归正主，宫人的陪衬动作仍归宫人
  const to=sceneHandoffTarget(parts,narr,cur);
  if(!to)return '';
  const curName=String(cur||'');
  const empSpeaks=(parts||[]).some(p=>p&&p.type==='say'&&isPlaceholderWho(p.who)); // 正主开口却没标 who：这时没点名的动作就是在写他
  for(const p of parts||[]){
    if(!p)continue;
    if(p.who&&p.type==='say'&&/朕|寡人/.test(String(p.text||''))&&canonicalSceneWho(p.who)!==to)p.who=to; // 帝自称的台词被错挂到旁人名下
    if(!isPlaceholderWho(p.who)||(p.type!=='act'&&p.type!=='say'))continue;
    if(p.type==='say'){p.who=to;continue}
    const txt=String(p.text||'');
    const aboutCur=(curName&&txt.includes(curName))||/奴才|奴婢|公公|太监|宫人|内侍|退到一边|退了出去/.test(txt); // 明确写宫人的动作：仍归他
    p.who=(/御|龙|朕|陛下|皇上|圣上|天子/.test(txt)||(empSpeaks&&!aboutCur))?to:cur;
  }
  return to;
}
function canonicalSceneWho(who){ // 对话中换人守卫：只认档案在册的人物并归一到称谓 id；认不出返回 ''
  const w=String(who||'').trim();
  if(isPlaceholderWho(w))return '';
  const npcs=(state&&state.npcs)||{};
  if(npcs[w])return w;
  for(const id in npcs){const x=npcs[id];if(x&&(x.name===w||x.realName===w))return id}
  if(typeof UI!=='undefined'&&UI.isEmperorId(w)){ // 皇上/陛下/圣上等称谓：归一到帝的存档键，标题、头像、关系才找得到人
    return Object.keys(npcs).find(id=>UI.isEmperorId(id))||Object.keys((state&&state.relationships)||{}).find(id=>UI.isEmperorId(id))||'皇帝';
  }
  return '';
}

function studioState(s){ // 墨妙斋账目：幂等建账，份例按旬归零

function studioSkillOf(s,type){ // 写字看「书」，作画看「画」；未解锁返回 key=null

function studioQualityOf(score,skill){ // 分数定档，造诣封顶：未至20最多寻常，20—49精巧，50—79珍品，80以上才可能绝品

function marketKey(){const t=state.time||{};return `${Number(t.year)||1}-${Number(t.month)||1}`} // 货单按月对键：换月初次点开即重采买
function marketSeason(m){m=Number(m)||1;return m>=3&&m<=5?'春':(m>=6&&m<=8?'夏':(m>=9&&m<=11?'秋':'冬'))}
function marketHash(str){let h=0;const s=String(str);for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function marketFinish(it,ym){ // 落价与存货：品相定带宽，名字散列取稳定扰动，本月内价码不变
  const band=MARKET_TIER_PRICE[it.tier]||MARKET_TIER_PRICE['寻常'];
  const h=marketHash(it.name+'@'+ym);
  it.price=band[0]+h%(band[1]-band[0]+1);
  it.stock=MARKET_TIER_STOCK[it.tier]||3;
  it.desc=String(it.desc||'').trim().slice(0,60);
  if(MARKET_MAT_KIND[it.kind]){ // 净材料：入库即作手作之料
    it.mat=true;it.matKind=MARKET_MAT_KIND[it.kind];
    it.matTier=MARKET_TIER_MAT[it.tier]||1;
    it.matTags=it.matKind==='绣'?['布帛']:(it.matKind==='香'?['香']:['药']);
    it.usable=false;delete it.effect;
  }else{
    it.usable=!!it.usable;
    if(it.usable)it.effect=String(it.effect||'').trim().slice(0,60);
    else delete it.effect;
  }
  return it;
}
function marketNormalize(list,ym){ // 洗净模型货单：按名去重、限件数、珍罕至多一件，缺品类/缺件数从兜底补
  const seen=new Set(),out=[];
  let rare=0;
  for(const raw of (Array.isArray(list)?list:[])){
    if(!raw||typeof raw!=='object')continue;
    const name=String(raw.name||'').trim().replace(/["'「」『』]/g,'').slice(0,12);
    if(!name||seen.has(name))continue;
    const kind=MARKET_KINDS.includes(raw.kind)?raw.kind:'玩意儿';
    let tier=['寻常','精巧','珍罕'].includes(raw.tier)?raw.tier:'寻常';
    if(tier==='珍罕'){if(rare>=1)tier='精巧';else rare++}
    seen.add(name);
    out.push(marketFinish({name,kind,tier,desc:raw.desc,usable:raw.usable,effect:raw.effect},ym));
    if(out.length>=MARKET_SLOTS)break;
  }
  for(const k of ['布料','香料','药品','食物','玩意儿']){ // 常见五类每类至少一件
    if(out.length>=MARKET_SLOTS)break;
    if(out.some(x=>x.kind===k))continue;
    const fb=MARKET_FALLBACK.find(f=>f.kind===k&&!seen.has(f.name));
    if(fb){seen.add(fb.name);out.push(marketFinish(Object.assign({},fb),ym))}
  }
  for(const fb of MARKET_FALLBACK){ // 补足额定件数；已有一件珍罕则不再添珍罕
    if(out.length>=MARKET_SLOTS)break;
    if(seen.has(fb.name))continue;
    if(fb.tier==='珍罕'&&out.some(x=>x.tier==='珍罕'))continue;
    seen.add(fb.name);out.push(marketFinish(Object.assign({},fb),ym));
  }
  return out;
}
function marketFallback(ym){ // 接口失败时的兜底货单：按月散列洗牌，五类俱全
  let seed=marketHash('fb@'+ym)||1;
  const rnd=()=>((seed=(seed*1103515245+12345)>>>0)/4294967296);
  const pool=MARKET_FALLBACK.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  const out=[],seen=new Set();
  for(const k of ['布料','香料','药品','食物','玩意儿']){
    const it=pool.find(x=>x.kind===k);
    if(it){seen.add(it.name);out.push(marketFinish(Object.assign({},it),ym))}
  }
  for(const it of pool){
    if(out.length>=MARKET_SLOTS)break;
    if(seen.has(it.name))continue;
    seen.add(it.name);out.push(marketFinish(Object.assign({},it),ym));
  }
  return out;
}
async function marketGenerate(ym){ // 首次点开该月：请求模型开货单；失败与空货单由调用方兜底
  if(abortCtrl)throw new Error('已有请求正在进行，稍候再采买');
  const s=state,t=s.time||{};
  const input={time:fmtTime(t),season:marketSeason(t.month),silver:Number(s.protagonist.silver)||0,rank:s.protagonist.rank||''};
  const msg='请按规则开本月货单。输入：'+JSON.stringify(input);
  const raw=await callModel(msg,{
    messages:[{role:'system',content:MARKET_SYSTEM},{role:'user',content:msg}],
    maxTokens:1200,
    expect:'market'
  });
  if(state!==s)throw new Error('采买期间存档已切换，货单未落地');
  const a=raw.indexOf('{'),b=raw.lastIndexOf('}');
  const o=JSON.parse(raw.slice(a,b+1));
  return marketNormalize(o.items,ym);
}

  _gardenMeetPick(){ // 御花园偶遇人选：帝单独按恩宠掷骰，不与known人物挤同一个池子（池子越大越撞不见帝）；其余为太后与已认识的宫中人物
    const dg=disguiseActive(state); // 易容中：撞见被冒名者本人会当场穿帮，先从名册里摘掉
    if(state&&state.gardenMeetWhom){
      if(dg&&(state.gardenMeetWhom===dg.who||state.gardenMeetWhom===dg.name))state.gardenMeetWhom=null; // 邂逅笺记的正是这张脸：作废，改按寻常偶遇
      else return state.gardenMeetWhom; // 邂逅笺：下一次必遇所选之人，不再掷骰
    }
    const npcs=(state&&state.npcs)||{};
    const rels=(state&&state.relationships)||{};
    const empRelKey=Object.keys(rels).find(k=>UI.isEmperorId(k)); // 帝的存档键可能是「皇帝」，也可能是本名
    const empId=Object.keys(npcs).find(k=>UI.isEmperorId(k))||empRelKey||'皇帝'; // 档案缺帝时仍可撞见，按「皇帝」兜底
    const rel=rels[empRelKey]||rels['皇帝'];
    const favor=typeof rel==='number'?rel:(Number(rel&&rel.value)||0);
    const absence=String((state&&state.emperor&&state.emperor.absence)||'').trim(); // 避嫌/病中/前朝缠身：园中不该撞见他
    let empChance=favor>=75?0.42:favor>=60?0.33:0.30; // 遇人后再分给帝的占比；乘 60% 偶遇率＝每次散步：低两档约18%、60档约20%、75档约25%
    const lastGarden=Number(state&&state.emperor&&state.emperor.lastGardenTurn); // 上次园中撞见帝的旬号
    if(lastGarden===state.turn)empChance=0; // 同旬已见过：再逛也不重复
    else if(lastGarden===state.turn-1)empChance*=0.5; // 上旬刚见过：减半
    if(absence)empChance=0;
    if(empId&&empChance>0&&Math.random()<empChance)return empId;
    const pool=Object.keys(npcs).filter(id=>{const n=npcs[id];if(!n||UI.isEmperorId(id))return false;
      if(dg&&(id===dg.who||id===dg.name))return false;
      if(/太后/.test(id+(n.rank||'')))return true;
      return !!n.known});
    if(!pool.length)return absence?null:(empId||null);
    const deck=[];
    for(const id of pool){const n=npcs[id]||{};
      const w=/皇嗣/.test(n.rank||'')?1:(/太后/.test(id+(n.rank||''))?1:2); // 皇嗣、太后各一份，其余熟人两份：别让公主/太后把偶遇占满
      for(let i=0;i<w;i++)deck.push(id)}
    return deck[Math.floor(Math.random()*deck.length)];
  },

  horseTrain(){ // 骑射：本地结算，不调模型；每满20点，气血根基+1
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    if(!state||!state.protagonist){toast('尚未开局');return}
    const p=state.protagonist,at=p.attributes=p.attributes||{};
    const qi=Number(at['体质'])||0;
    if(qi<20){toast('气血太虚，上不了马；先养一养',3200);return}
    if((state.energy??0)<HORSE_TRAIN_COST){toast(`精力不足：下场学骑射要耗 ${HORSE_TRAIN_COST} 精力`);return}
    ensureXunBook(); // 先记本旬起点，再落数值：旬末小结才看得出这一笔
    p.skills=p.skills||{};
    const key=skillKeyIn(p.skills,'骑射')||'骑射';
    const before=Number(p.skills[key])||0;
    const gain=qi>=70?3:(qi<40?1:2);
    const after=before+gain;
    const crossed=Math.floor(after/20)-Math.floor(before/20);
    const baseBefore=Math.max(qi,Number(p.constitutionBase)||0);
    let baseAfter=baseBefore,qiAfter=qi;
    if(crossed>0){
      baseAfter=baseBefore+crossed;
      qiAfter=Math.min(100,baseAfter,qi+crossed);
      p.constitutionBase=baseAfter;
      at['体质']=qiAfter;
    }
    p.skills[key]=after;
    state.energy=Math.max(0,Math.round((state.energy??0)-HORSE_TRAIN_COST));
    logXunAction('马球场·骑射');
    const flavor=crossed>0
      ?`马场风硬，你跑了几圈，收缰时掌心发热。这一槛过去，骑射又长了一截，气血根基也厚了一分。`
      :(gain>=3
        ?`你下场跑了几趟，马背上的起伏渐渐顺了。收缰时人有些喘，手上却比先前稳。`
        :`你牵着马在场边走了几圈，上马时仍有些生涩。风灌进袖口，倒把心口那点郁气吹散了些。`);
    const deltas=[`骑射 +${gain}（${before} → ${after}）`];
    if(crossed>0){
      deltas.push(`气血根基 +${crossed}（${baseBefore} → ${baseAfter}）`);
      if(qiAfter>qi)deltas.push(`气血 +${qiAfter-qi}（${qi} → ${qiAfter}）`);
    }
    history.push({turn:state.turn,focus:'马球场·骑射',choice:'',narrative:flavor,log:`骑射 +${gain}`});
    persistCurrent();markSafe();UI.updateStatusbar();
    if($('#sheet')&&$('#sheet').classList.contains('on'))UI.renderSheet('马球场'); // 面板还开着：先把骑射/根基的新数刷新，再看结果
    UI.actResult('马球场 · 学骑射',flavor,deltas);
    checkRestWarn();
    if(state.energy<=0)setTimeout(()=>this.collapse(),600);
  },

    const sceneLike=!!(opts&&(opts._xunPop||opts.whoHint||opts.meetWho||opts.foodFx||(opts.mode&&(opts.mode.kind==='fest'||opts.mode.who))));
    const itl=(!bigEvent&&!sceneLike)?drawInterlude(state,{focus,bigEvent:false}):null;
    if(itl){ // 插曲紧跟主控的安排：它是本旬的正事，不是附在别的剧情后面的一句
      Game._lastInterlude=itl;
      adj.text=String(adj.text||'').replace(/本旬剧情骰未命中[^\n]*/,'本旬剧情骰未命中：本旬只有下面这张插曲要演，不许另起别的剧情，也不许只顺带提一句。');
      msg+='\n'+interludePromptOf(itl);
    }
    if(adj.text)msg+='\n'+adj.text;
    if(loadSettings().fastRoutine!==false&&!bigEvent&&!sceneLike&&!itl)msg+='\n【速览】本旬大概率是例行养成：narrative 只写≤40字的一句摘要（交代做了什么、有何进益即可），不铺陈过程、景物与心绪，把笔墨留给 changes 与 statePatch；若剧情骰命中或横生枝节，照常展开不必受这句限制。';
    lastRequest={type:'r1',msg,focus,cost,opts};
    const settle=p=>{
      $('#mapview').classList.remove('on'); // 目的地行动落定即收起宫城图（加载层 z-60 本就叠在图上）
      UI.hideBusy();
      soldNotes=[];lastUseIdx=null;
      if(Game._festSerial!=null){state.lastFestSerial=Game._festSerial;Game._festSerial=null} // 节宴已演：记旬号，同旬后续行动不再重复摆宴
      finalize(p,{focus,adj});
      if(adj.seed&&adj.seed.plotId){ // 引子牌：模型漏立账时前端补一条，免得这张牌演完就散
        const wrote=!!(p.statePatch&&p.statePatch.plots&&(!Array.isArray(p.statePatch.plots)||p.statePatch.plots.length));
        const et=(adj.seed.entry&&adj.seed.entry.title)||adj.seed.title||'';
        const has=(state.plots||[]).some(pl=>pl&&pl.stage==='进行中'&&(String(pl.id)===adj.seed.plotId||(et&&plotKeyOf(pl.title)===plotKeyOf(et))));
        if(!wrote&&!has)state.plots=mergePlots(state.plots,[seedPlotEntry(adj.seed)],xunSerial(state.time));
      }
      if(opts&&opts.mode&&opts.mode.returnHome){ // 出宫是一日往来：结算后地点归回本宫住处
        const hm=Game.homeLocation();if(hm)state.location=hm;
        saveToSlot(0,true); // 自动档同步改回住处，别把宫外地点带进下次读档
      }
      if(opts&&opts.frameTarget){ // 借脸行事：模型没落账时，前端补一条最简引线，保证这件事日后有人查
        const tn=String(opts.frameTarget);
        const has=(state.plots||[]).some(pl=>pl&&pl.stage==='进行中'&&(String(pl.title||'').includes(tn)||String(pl.note||'').includes(tn)));
        if(!has){
          state.plots=mergePlots(state.plots,[{id:'p-frame-'+state.turn,title:`${tn}·被人冒名`,line:'支线',
            goal:`查清是谁顶着${tn}的脸在外行事，以及这件事会怎样落到${tn}头上`,
            note:`${opts.frameLabel||'宫外'}留下了${tn}的名号，尚未查证`,stage:'进行中',dueText:'四旬内'}],xunSerial(state.time));
          ensurePlotMeta().lastEventTurn=state.turn; // 借脸行事本身算一条内容：本旬不再另起随机剧情
          saveToSlot(0,true);
          toast('此事已记入剧情账',2400);
        }
      }
      logXunAction(focus);
      if(opts&&opts.leadIds&&opts.leadIds.length){ // 呼应过的引线：模型回写台账才算实质推进（touch 已由 mergePlots 刷新）；只演不写记一次落空
        const now=xunSerial(state.time);
        const written=new Set((Array.isArray(p.statePatch&&p.statePatch.plots)?p.statePatch.plots:[p.statePatch&&p.statePatch.plots]).map(x=>x&&String(x.id)));
        for(const id of opts.leadIds){const pl=(state.plots||[]).find(x=>x.id===id&&x.stage==='进行中');if(!pl)continue;
          pl.echo=now;
          pl.echoTotal=(pl.echoTotal||0)+1; // 总呼应次数+1：到 ECHO_LEAD_TOTAL 后散步/拜访不再主动提示
          if(written.has(String(id)))pl.echoMiss=0; // 有回写：实质推进
          else pl.echoMiss=(pl.echoMiss||0)+1; // 无回写：落空一次；满 ECHO_MISS_MAX 后不再呼应，交由旬首发酵处置
        }
      }
      // 相关的待续琐事：挂账计旬是否重置只看本轮 statePatch 是否真改/真删（见 applyPatch 的 pending 分支），不再"提过即刷新"，免得一条琐事被每旬顺口一提就永不过期
      const meta=ensurePlotMeta();
      if(p.hasEvent||adj.due.length||adj.overdue.length||adj.mainPub||adj.gardenMeet||adj.fest||(adj.schemeFire&&adj.schemeFire.length))meta.lastEventTurn=state.turn;
      if(adj.gardenMeet&&UI.isEmperorId(adj.gardenMeet))(state.emperor=state.emperor||{}).lastGardenTurn=state.turn; // 记下园中撞见帝的旬号：同旬不再重复、下旬减半
      if(adj.gardenMeet&&state.gardenMeetWhom===adj.gardenMeet)state.gardenMeetWhom=null; // 邂逅笺的约定已兑现
      if(adj.mainPub||(opts&&opts._mainPubPop))meta._mainMissed=!activePlots().some(x=>x.line==='主线'); // 新主线是否落账：未落账则下轮裁决加重语气（含旬首断档直弹）
      if(isMajorTurn(p.statePatch,p))meta.lastBigTurn=state.turn;
      if(adj.hit){meta.rollHit=false;meta.rollTargetId=null} // 本旬骰子已用毕，同旬后续行动不再重复强制
      state.energy=Math.max(0,Math.min(ENERGY_MAX,Math.round((typeof state.energy==='number'?state.energy:ENERGY_MAX)-(typeof cost==='number'?cost:focusEnergyCost(focus)))));
      if(opts&&opts.foodFx){ // 吃食：不耗精力；正常菜按火候回精力、补身，黑暗料理当场掷定奇效或生病
        const fx=opts.foodFx,p0=state.protagonist,at0=p0&&p0.attributes;
        const deltas=[];
        if(at0){
          const base=Math.max(0,Number(p0.constitutionBase)||0);
          let qi=Number(at0['体质'])||0;
          let gainE=Math.max(0,Math.round(Number(fx.energy)||0));
          if(fx.dark){
            if(Math.random()<0.55){ // 奇效
              const roll=Math.floor(Math.random()*3);
              if(roll===0){gainE+=15;deltas.push('黑暗料理·奇效：精力 +15')}
              else if(roll===1){const cap=base>0?base:100;const nv=Math.min(cap,qi+3);if(nv>qi){at0['体质']=nv;deltas.push(`黑暗料理·奇效：体质 +${Math.round(nv-qi)}`)}else{gainE+=10;deltas.push('黑暗料理·奇效：精力 +10')}}
              else{const b=clamp01_100(Number(at0['外貌'])||0);const nv=clamp01_100(b+1);if(nv>b){at0['外貌']=nv;deltas.push('黑暗料理·奇效：外貌 +1')}else{gainE+=10}}
            }else{ // 生病
              const nv=Math.max(1,Math.round(qi-5));
              at0['体质']=nv;p0.health='肠胃不适';
              deltas.push(`黑暗料理：体质 -${Math.round(qi-nv)}（肠胃不适）`);
            }
          }else{
            if(fx.qi&&qi<base){at0['体质']=qi+1;deltas.push('体质 +1')}
            if(fx.glow&&Number(state.cookGlowTurn)!==Number(state.turn)){
              const b=clamp01_100(Number(at0['外貌'])||0);
              if(b<100){at0['外貌']=b+1;state.cookGlowTurn=state.turn;deltas.push('外貌 +1')}
            }
          }
          const beforeE=Math.round(state.energy);
          state.energy=Math.min(ENERGY_MAX,beforeE+gainE);
          if(state.energy>beforeE)deltas.push(`精力 +${state.energy-beforeE}`);
          opts.foodDeltas=deltas;
          if(deltas.length)toast(deltas.join(' · '),3200);
        }
      }
      state.inventory=(state.inventory||[]).filter(x=>x&&(!Number.isFinite(Number(x.count))||Number(x.count)>0)); // 用尽即从行囊除名，别留一行「已典出」
      persistCurrent();markSafe();UI.updateStatusbar();
      if(state.energy<=0){this.collapse();return}
      checkRestWarn();
      if(p.hasEvent&&(p.scene||(Array.isArray(p.options)&&p.options.length))){if(adj.fest)p._fest=adj.fest;this.showIncident(p)} // 先弹"事发"简报，确认后进剧情对话
      else{ // 无事发生：本旬结果原地弹窗呈现，不再经纪事中转
        this.backHome(); // 散步、赴宴等一过性外出到此收束：地点归回本宫住处
        this._placeCloseAfterResult=!!this._place; // 场景页留到结果弹窗关闭：别让结果压回住处
        const itl=Game._lastInterlude;
        UI.actResult(focus+(itl?` · 插曲「${itl.card.title}」`:''),filterText(p.narrative),(opts&&opts.foodDeltas)||[]); // 结果弹窗只讲本旬做了什么：待续归局面页，不在弹窗末尾重复
      }
    };
    callModel(msg).then(raw=>{
      const p0=parsePayload(raw);
      const itlMiss=this._interludeMissed(p0); // 插曲被写成一句闲笔或干脆没演：先按插曲纠正，它同时要求 event 牌进对话
      if(itlMiss){
        const card=itlMiss.card;
        const mode=itlMiss.event
          ?'用剧情对话 scene 结构开场（scene.state="ongoing"，scene.who 写在场的人，scene.parts 写对方的动作与第一句话，顶层 options 给 2—4 个接话选项），hasEvent=true，停下等玩家应对、不结算后果'
          :'给它单独一整段（不少于 80 字）写出来——具体的人、声响、光线、手上在做什么，不要用一句话带过；hasEvent=false，不给选项';
        const fixMsg=msg+`\n【纠正】上一版没有演出本旬插曲「${card.title}」（${itlMiss.hook}）：本旬就这一段事，你却另写了别的，或只顺带提了一句。请重写完整 JSON：正文以这张插曲为主，${mode}；主控原定的「${focus}」一句交代即可，不得改掉，也不得另起别的剧情。`;
        lastRequest={type:'r1',msg:fixMsg,focus,cost,opts};
        UI.showBusy('铺排中','正在重写这段插曲……',true);
        return callModel(fixMsg).then(raw2=>settle(parsePayload(raw2)));
      }
      const newMainIn=Array.isArray(p0.statePatch&&p0.statePatch.plots)&&p0.statePatch.plots.some(x=>x&&x.line==='主线'&&(!x.stage||x.stage==='进行中')); // 新主线已借正文或与发酵处置同场埋入并落账：hasEvent=false 也算兑现，不再纠正
      const noEvent=(((this._eventMandated(adj)||(this._lastInterlude&&this._lastInterlude.event))&&!(adj.mainPub&&newMainIn))||(opts&&opts._xunPop))&&!p0.hasEvent; // 裁决或插曲要求触发而模型没触发：仍纠正一次（旬首发酵弹出为硬强制）
      if(noEvent){
        const fixMsg=msg+`\n【纠正】前端剧情裁决已裁定本旬必须触发剧情（${this._mandateText(adj,opts)}），你却输出 hasEvent=false。请重新输出完整 JSON：hasEvent=true，用剧情对话 scene 结构呈现本轮剧情（scene.state="ongoing"、scene.parts 按语义分段：act 写对方动作神态，say 写对方台词，quote 写转述他人原话，narr 只写其他人物与客观场面，台词都不带引号、不按标点硬切；顶层 options 给 2—4 个接话选项），停下等待玩家应对、不结算后果；本旬养成过程简要并入 narrative。`;
        lastRequest={type:'r1',msg:fixMsg,focus,cost,opts};
        UI.showBusy('铺排中','正在重新生成剧情……',true);
        return callModel(fixMsg).then(raw2=>settle(parsePayload(raw2)));
      }
      const stranger=this._strangerDemand(p0); // 生人一开口就派差事：与交情不符，纠正一次
      if(stranger){
        const t=relTier(stranger);
        const fixMsg=msg+`\n【纠正】上一版里 ${stranger} 与主控${t.first?'只是头一回照面':`只是${t.label}`}（好感 ${t.value==null?0:t.value}），却一开口就把差事交给她——问她会什么再派活、让她去抄去送去跑腿、或替她出力。交情不到时她只谈场面话、打量试探，难处只露在神色与动作里；托事须有上命、共同利益、把柄或人情作由头。请重写本轮：人物、地点与其余情节不变，删去任何请托与派差，改成她自己的处境、旁人的一句话、一句场面话或一个场面变化；仍用 scene 结构（scene.who 写「${stranger}」，hasEvent=true，步骤同前），不结算后果。`;
        lastRequest={type:'r1',msg:fixMsg,focus,cost,opts};
        UI.showBusy('铺排中','正在重新生成剧情……',true);
        return callModel(fixMsg).then(raw2=>settle(parsePayload(raw2)));
      }
      settle(p0);
    }).catch(e=>{UI.hideBusy();this.handleCallErr(e)});
  },
  /* 交情不到的人不得先开口请主控做事：开场台词里出现派差、借物、代笔这类请求就重写一次 */
  _strangerDemand(p){
    if(!p||!p.scene||p.scene.state==='resolve')return '';
    const sc=p.scene;
    const who=sceneSpeaker(p,sc);
    if(isPlaceholderWho(who)||(typeof UI!=='undefined'&&UI.isEmperorId(who)))return '';
    const t=relTier(who);
    if(t.key!=='new')return ''; // 只拦头回照面：有隙、结怨者借势发难是合逻辑的
    const parts=this.sceneParts(sc)||[];
    const said=parts.filter(x=>x.type==='say'||x.type==='quote').map(x=>String(x.text||'')).join(' ')
      +' '+String(p.narrative||'');
    if(/口谕|懿旨|上命|奉旨|传旨|差遣|娘娘吩咐|主子吩咐/.test(said))return ''; // 有上命在：托事有由头，不算自来熟
    const demand=/(你去|你替我|你代我|你帮我|你把这|替我|代我|帮我|烦你|劳你|劳烦|托你|拜托你)[^。！？\n]{0,12}(抄|誊|写|送|递|捎|跑|办|取|拿|问|打听|传话|回禀|留意)/.test(said)
      ||/(抄|誊)(一份|一册|一遍|下来)|(跑|走|去)一趟|(去把|去将)[^。！？\n]{0,10}(关上|拿来|送去|端来|收了|取了|问清)|三日为限|限你[^。\n]{0,6}(日|天)|交给你去办/.test(said)
      ||/[？?]/.test(said)&&/会不会|可会|识不识字|认不认得|手巧不巧|你会[^。！？\n]{0,4}(写字|针线|绣|认路)/.test(said);
    return demand?who:'';
  },
  /* 本旬插曲有没有真的演出来：牌面自带几个关键词，正文/气泡/选项里一个都没有，就是被略过了 */
  _interludeMissed(p){
    const itl=Game._lastInterlude;
    if(!itl||!itl.card||!itl.card.keys||!p)return null;
    if(Game._interludeRetried===state.turn)return null; // 一旬只重写一次，别和模型拉锯
    const parts=(this.sceneParts(p.scene)||[]).map(x=>`${x.who||''}${x.text||''}`).join(' ');
    const opts=Array.isArray(p.options)?p.options.map(o=>String((o&&o.text)||o||'')).join(' '):'';
    const text=`${p.narrative||''} ${parts} ${opts}`;
    if(itl.card.keys.test(text))return null;
    Game._interludeRetried=state.turn;
    return itl;
  },
  /* 剧情触发判定辅助：裁决是否强制本旬出剧情（到期/超期/剧情骰命中/主线断档/御花园偶遇） */
  _eventMandated(adj){return !!(adj&&((adj.schemeFire&&adj.schemeFire.length)||(adj.fest&&!adj.festSoft)||adj.due&&adj.due.length||adj.overdue&&adj.overdue.length||adj.hit||adj.mainPub||adj.gardenMeet||adj.empDue))},
  _mandateText(adj,opts){
    if(!adj)return '';
    const names=[];
    const itl=this._lastInterlude;
    if(itl&&itl.event)names.push(`本旬插曲「${itl.card.title}」须当场应对`);
    names.push(...[...(adj.overdue||[]),...(adj.due||[])].map(p=>`「${p.title}」到期须兑现`));
    if(adj.schemeFire&&adj.schemeFire.length)names.push(adj.schemeFire.map(s=>`「${s.who}」发难须当旬应对`).join('；'));
    if(adj.fest&&!adj.festSoft)names.push(`固定节宴「${adj.fest.name}」须当旬演出`);
    if(opts&&opts._mainPubPop)names.push('主线断档须以 scene 开新主线并落账');
    if(adj.stale&&adj.stale.length)names.push(`「${adj.stale.map(p=>p.title).join('」「')}」发酵须处置`);
    if(adj.pendStale&&adj.pendStale.length)names.push(`待续琐事（${adj.pendStale.map(pendText).join('；')}）发酵须处置`);
    if(adj.target)names.push(`剧情骰命中「${adj.target.title}」须在途线后续`);
    else if(adj.hit)names.push('剧情骰命中须开全新引子');
    if(adj.mainPub)names.push('主线断档须开立新主线并落账');
    if(adj.gardenMeet)names.push(`御花园偶遇「${adj.gardenMeet}」须触发`);
    if(adj.empDue)names.push('「恩宠账」到期须安排有内容的帝相处并回写 emperor.contact');
    return names.join('；')||'剧情骰命中';
  },
  /* 本宫住处：以存档 world.residence 为准，旧档回退推算；外出地点不写进这里 */
  homeLocation(){
    const st=state||{},w=st.world||{};
    const loc=String(st.location||'').trim();
    if(/侧殿|配殿/.test(loc)&&(!w.mainPalace||loc.includes(w.mainPalace)))return loc; // 旧档或迁居后：当前就在自己屋里
    if(w.residence)return w.residence;
    const ch=[...(st.chronicle||[]).map(x=>String((x&&x.text)||x||'')),...(st.recentConfirmedFacts||[]).map(String),String(st.lastNode||'')].join('\n');
    const m=ch.match(/居([^，。；\s]{2,12}?(?:侧殿|配殿))/);
    if(m)return m[1];
    if(w.mainPalace)return w.mainPalace+(/官女子/.test((st.protagonist&&st.protagonist.rank)||'')?'配殿':'侧殿');
    return '';
  },
  backHome(){ // 一旬事毕回本宫住处：免得上一场外出地点滞留成下一场的场景
    if(!state)return;
    const home=this.homeLocation();
    if(home&&state.location!==home){state.location=home;persistCurrent();markSafe()}
  },
  /* 场景底图：先认点得到的去处，再按宫室／园子兜底。本宫住处不单独出图 */
  placeBgOf(where){ // 只认确有其图的地方：宫城图各处、庭院、御花园、他宫殿堂
    const w=String(where||'').trim();if(!w)return '';
    const key=this.placeKeyOf(w);
    if(key)return PLACES[key].bg;
    const st=state||{},home=(st.world&&st.world.mainPalace)||((String(this.homeLocation()||st.location||'').match(/^([^殿宫阁轩堂斋楼]{1,9}[殿宫阁轩堂斋楼])/)||[])[1]||'');
    if(home&&w.includes(home))return /正殿|主殿|中殿|殿中|正厅/.test(w)?'assets/scenes/hall.jpg':''; // 侧殿就是自己屋里
    if(/住处|你的屋子|自己屋里/.test(w))return '';
    if(/殿|宫|阁|轩|堂|斋|楼|暖阁|厢房|寝/.test(w))return 'assets/scenes/hall.jpg';
    if(/园|苑|梅林|菊山|亭|池|廊|桥|石径|假山|山石|水边|院中|后院|庭院/.test(w))return 'assets/scenes/garden.jpg';
    return '';
  },
  sceneBgFile(where){ // 事发简报压在主界面时用：比对话更宽，认不出的仍回本宫住处
    return this.placeBgOf(where)||'assets/rooms/suju.jpg';
  },
  applySceneBg(where){
    if(this._place){ // 人在场景里：简报就压在这张景上；剧情确已换到别处才跟着换
      const key=this.placeKeyOf(where);
      if(key&&key!==this._place)$('#placeBg').style.backgroundImage=this.bgLayers(key);
      return;
    }
    const el=document.querySelector('.homebg');if(!el)return;
    el.style.backgroundImage=`url(${this.sceneBgFile(where)})`;
  },
  setChatBg(where){ // 剧情对话的淡底图：有景就铺，没景就留白
    const el=$('#chatBg');if(!el)return;
    const key=this.placeKeyOf(where)||this._place;
    if(!key){el.classList.remove('on');el.style.removeProperty('--bg');return}
    el.style.setProperty('--bg',this.bgLayers(key));
    el.classList.add('on');
  },
  showIncident(p){ // 事发简报：说明发生了什么事，确认后进全屏对话应对
    const adj=Game._lastAdj||{due:[],overdue:[],target:null,hit:false};
    const sc=p.scene||{};
    const scheme=(adj.schemeFire&&adj.schemeFire[0])||null;
    Game._pendingScheme=scheme; // 进对话后由 openScene 认领：这场戏要按暗流结算
    const plot=adj.target||[...(adj.overdue||[]),...(adj.due||[])][0]||(adj.stale||[])[0];
    const who=sceneSpeaker(p,sc);
    if(isPlaceholderWho(sc.who))sc.who=who; // 回写兜底说话人，进入对话时不再丢
    const title=scheme?scheme.who:((adj.fest&&!adj.festSoft)?adj.fest.name:(plot?plot.title:(adj.seed?adj.seed.title:(who==='宫中来人'?'事发':who))));
    const meta=[sc.when,sc.where].filter(Boolean).join('｜');
    const parts=this.sceneParts(sc);
    const lead=sc.line?filterText(sc.line):(parts?parts.map(x=>x.type==='say'?`“${x.text}”`:x.type==='quote'?`${x.who?x.who+'说：':''}「${x.text}」`:x.text).join(''):this.chatLead(p));
    const setup=filterText(p.narrative||'');
    const setupTail=setup?setup.split(/(?<=[。！？])/).filter(Boolean).slice(-2).join('').slice(-180):''; // 先交代在何处遇上谁，避免剧情凭空开始
    const fore=(plot&&plot.note&&!scheme)?`<div style="line-height:1.8;margin-bottom:8px;font-size:13px;color:var(--ink-soft)">前情 · ${esc(String(plot.note).slice(0,90))}</div>`:''; // 派系账的前情先说给玩家听，免得戏开场了她却摸不着头脑
    $('#incTitle').textContent=scheme?('暗流 · '+title):(title==='事发'?'事发':'事发 · '+title);
    const itl=Game._lastInterlude;
    $('#incBody').innerHTML=(meta?`<div style="font-size:12px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:8px">${esc(meta)}</div>`:'')
      +(itl?`<div style="margin-bottom:8px"><span class="itag on">本旬插曲·${esc(itl.card.title)}</span></div>`:'')
      +fore
      +(setupTail&&setupTail!==lead?`<div style="line-height:1.9;margin-bottom:8px">${esc(setupTail)}</div>`:'')
      +`<div style="line-height:1.9">${esc(lead)}</div>`;
    Game._pendingEvent=p;
    this.applySceneBg(sc.where||(state&&state.location));
    $('#incidentModal').classList.add('on');
  },
  incidentGo(){ // 简报确认：进入剧情对话界面
    $('#incidentModal').classList.remove('on');
    this.applySceneBg();
    const p=Game._pendingEvent;Game._pendingEvent=null;
    if(!p){phase='FOCUS_SELECT';this.leavePlace();UI.goHome();return}
    if(p.scene){this.openScene(p);return}
    if(Array.isArray(p.options)&&p.options.length){ // 模型没给 scene：也走多轮对话，别一句应答就把人送走
      const who=sceneSpeaker(p,{});
      this.openScene(Object.assign({},p,{narrative:'',scene:{line:this.chatLead(p),who,state:'ongoing',when:fmtTime(),where:state&&state.location}}));
      return;
    }
    phase='FOCUS_SELECT';this.leavePlace();UI.goHome(); // 事发却没有可应对内容：退回主界面，别把玩家留在死状态
  },
  chatLead(p){ // 截取 narrative 末段当开场白
    const t=filterText(p.narrative||'');
    if(!t)return '（情势有变，请应对。）';
    const s=t.split(/(?<=[。！？])/);
    return s.slice(-3).join('').slice(-220)||t.slice(-220);
  },
  bubble(side,name,text,segs){ // side: npc 对方(左,头像+姓名) / me 主控(右) / narr 旁白(独立气泡) / sys 系统提示；segs=[{text}|{act}] 时 act 以（）并入气泡
    const body=$('#chatBody');
    const wrap=document.createElement('div');
    const b=document.createElement('div');
    b.className='bubble '+side;
    if(Array.isArray(segs)&&segs.length){
      for(const s of segs){
        if(!s)continue;
        if(s.act){
          const t=String(s.act).replace(/[。\s]+$/,'');
          const sp=document.createElement('span');sp.className='b-act';sp.textContent='（'+t+'）';b.appendChild(sp);
        }else if(s.text){
          b.appendChild(document.createTextNode(s.text));
        }
      }
    }else{
      b.textContent=text;
    }
    if(side==='npc'||side==='me'){
      const meName=(state&&state.protagonist&&state.protagonist.name)||'我';
      const who=side==='me'?meName:(name||'');
      wrap.className='msg '+side;
      wrap.insertAdjacentHTML('beforeend',avatarHtml(who,'mav'));
      const col=document.createElement('div');col.className='mcol';
      const whoEl=document.createElement('div');whoEl.className='mwho';whoEl.textContent=dispName(who);
      col.appendChild(whoEl);col.appendChild(b);wrap.appendChild(col);
    }else{
      wrap.className='msg '+side;wrap.appendChild(b);
    }
    body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
    return wrap;
  },
  splitSpeech(text){ // 引号内=人物台词，引号外=旁白；无引号时整段按 plain 返回，由调用方决定算谁的
    const out=[];const re=/([「『“"])([\s\S]*?)([」』”"])/g;let last=0,m;
    while((m=re.exec(text))!==null){
      const pre=text.slice(last,m.index).trim();
      if(pre)out.push({type:'narr',text:pre});
      const say=String(m[2]||'').trim();
      if(say)out.push({type:'dialog',text:say});
      last=re.lastIndex;
    }
    const tail=text.slice(last).trim();
    if(tail)out.push({type:last===0?'plain':'narr',text:tail});
    return out.filter(s=>s.text&&!/^[\s。，、；：！？…—·'"“”‘’「」『』()（）]+$/.test(s.text)); // 纯标点不成段
  },
  sceneParts(sc){ // API 语义分段：scene.parts=[{type:"narr"|"act"|"say"|"quote",text,who?}]
    let arr=sc&&sc.parts;
    if(typeof arr==='string'){try{arr=JSON.parse(arr)}catch(e){arr=null}}
    if(!Array.isArray(arr))return null;
    const pick=p=>{ // 台词字段各家写法不一：text/content/line/dialogue…都认，别因为换了键名就把整句话吞掉
      if(typeof p==='string')return p;
      for(const k of ['text','content','line','dialogue','dialog','speech','words','utterance']){
        const v=p[k];if(typeof v==='string'&&v.trim())return v;
      }
      return '';
    };
    const out=[];
    const NARR_VERB_RE=/转身|混进|递到|递进|随人流|看见|听见|只见|忽见|走来|走去|散去|跪下|起身|抬头|低头|摆手|坐下|站起|回头|侧身|垂下眼|抬眼|开口前|说完便/; // 叙事动作：判"整段是经过"而非台词
    const fixParenQuote=t=>String(t||'').replace(/(低声道|回道|问道|答道|叹道|笑道|说道|传的话|说是|嘱咐|叮嘱|写着|写道|言道|说|问|答|言)）([^（）]{1,40}?)（/g,'$1「$2」'); // 模型拿圆括号当引号（说是）…（）：界面把圆括号当动作渲染，先洗回「」
    for(const p of arr){
      if(p==null)continue;
      let text=filterText(pick(p)).trim();
      if(!text||/^[\s。，、；：！？…—·'"“”‘’「」『』()（）]+$/.test(text))continue;
      text=fixParenQuote(text);
      const raw=String(p.type||p.t||p.role||'').trim().toLowerCase();
      const isQuote=['quote','quoted','cite','citation','refer','references','引用','转述','引述'].includes(raw);
      const isSay=['say','dialog','dialogue','npc','speech','character','char','台词','对白'].includes(raw);
      const isAct=['act','action','gesture','manner','动作','神态','举止'].includes(raw);
      if(isSay||isQuote)text=fixEmperorMention(text); // 台词里提天子称“陛下”，不写“帝”
      let type=isQuote?'quote':isAct?'act':isSay?'say':'narr';
      let who=p.who?String(p.who).trim():'';
      if(type==='act'){ // 模型常把主控/旁人的整段叙事塞进 act：以「你」起句、或通篇第二人称叙述（还带着叙事动作）的，其实是旁白
        const bare=text.replace(/^[（(]\s*|\s*[）)]$/g,'').trim();
        const proto=String((state&&state.protagonist&&state.protagonist.name)||'');
        const fromHer=/^你/.test(bare)||(proto&&bare.indexOf(proto)===0);
        const muchYou=bare.length>=60&&(bare.match(/你/g)||[]).length>=3&&NARR_VERB_RE.test(bare);
        if(fromHer||muchYou){type='narr';text=bare;who=''}
      }
      if(type==='say'){ // 只处理明显是第二人称叙事的那种：以「你」起句，或长、三处提你、还满是叙事动作。长台词里带两个「你」不算
        const bare=text.replace(/^[（(]\s*|\s*[）)]$/g,'').trim();
        const startsYou=/^你/.test(bare);
        const muchYou=bare.length>=60&&(bare.match(/你/g)||[]).length>=3&&NARR_VERB_RE.test(bare);
        if(startsYou||muchYou){type='narr';text=bare;who=''}
      }
      if(type==='narr'){ // 反推：带问号又直呼「你」、或短句以自称起头的，都是她对主控说的话（模型常把台词误标成 narr）
        const bare=text.replace(/^[（(]\s*|\s*[）)]$/g,'').trim();
        const toYou=bare.length>=12&&bare.length<=260&&/你/.test(bare)&&/[？?]/.test(bare)
          &&!/^你/.test(bare)&&!/[「『“"]/.test(bare)
          &&!/她问|他问|问道|问起|听说|传闻|只说|信里|纸上|写道|自问/.test(bare);
        const claim=/^(臣妾|妾身|妾|奴婢|奴才|老奴|微臣|小人)[^。！？]{0,30}[。！？!?]?$/.test(bare); // 短句、以宫中自称起头：只能是台词
        if(toYou||claim){type='say';who=''}
      }
      out.push({type,text,who});
    }
    if(!out.length)return null;
    if(!out.some(x=>x.type==='say'||x.type==='quote')){ // parts 只给了动作/旁白、台词却落在 scene.line 上：补一句，别让这轮只剩个动作
      const line=filterText(String((sc&&(sc.line||sc.text||sc.dialogue))||'')).trim().replace(/^[「『“"]\s*|\s*[」』”"]$/g,'');
      if(line){
        const i=out.findIndex(x=>x.type==='narr'); // 台词该在旁白之前，接在动作后面
        out.splice(i<0?out.length:i,0,{type:'say',text:fixEmperorMention(line),who:''});
      }
    }
    return out;
  },
  quoteBubble(who,text){ // 转述他人原话：不挂当前说话人头像，单独成一只引文气泡
    const body=$('#chatBody');
    const wrap=document.createElement('div');wrap.className='msg quote';
    const b=document.createElement('div');b.className='bubble quote';
    const tag=document.createElement('div');tag.className='qtag';tag.textContent=who?`转 述 · ${who}`:'转 述';
    const clean=String(text||'').replace(/^[「『“"]\s*|\s*[」』”"]$/g,''); // 模型若自带引号，去掉以免与样式里的「」叠成两层
    const t=document.createElement('div');t.className='qtext';t.textContent=clean;
    b.appendChild(tag);b.appendChild(t);wrap.appendChild(b);body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
  },
  noteCast(whos,intro){ // 记本场在场的人：开口的人 + 开场旁白里点到名的人；旁白里“说到谁”不算到场
    if(!sceneCtx)return;
    const cast=Array.isArray(sceneCtx.cast)?sceneCtx.cast:(sceneCtx.cast=[]);
    const add=id=>{const c=canonicalSceneWho(id)||String(id||'').trim();if(c&&!cast.includes(c))cast.push(c)};
    if(sceneCtx.who)add(sceneCtx.who);
    for(const w of (Array.isArray(whos)?whos:[]))if(!isPlaceholderWho(w))add(w);
    const t=String(intro||''); // 只有开场那一段旁白用来认人：后文里的名字多半只是被谈起
    if(t)for(const id in (state.npcs||{})){
      const n=state.npcs[id]||{};
      const names=[id,n.name,n.realName].filter(Boolean).map(String).filter(s=>s.length>=2);
      if(names.some(nm=>t.includes(nm)))add(id);
    }
    if(cast.length>24)sceneCtx.cast=cast.slice(-24);
  },
  sayParts(parts,who){ // 按 API 给的语义段渲染：act 与 say 并入同一只对方气泡，quote 走转述，narr 走完全旁白
    const fallback=who||(sceneCtx?sceneCtx.who:'');
    const proto=String((state&&state.protagonist&&state.protagonist.name)||'');
    parts=(Array.isArray(parts)?parts:[]).map(p=>Object.assign({},p));
    // 没标 who 的段认人：
    // 台词是当前说话人接着说的，只往回认；若往后认，上一句就会被挂到下一位名下，同一只气泡里混进两个人的话。
    // 动作默认也算当前说话人的；只有这条动作点名了后面那位（「（赵贵妃从廊那头过来）」），才算是对方的过场。
    const nameHit=(text,whoId)=>{
      const t=String(text||''),w=String(whoId||'').trim();if(!t||!w)return false;
      if(t.includes(w))return true;
      const n=(state&&state.npcs||{})[w]||Object.values((state&&state.npcs)||{}).find(x=>x&&(x.name===w||x.realName===w))||{};
      for(const nm of [n.name,n.realName,dispName(w)]){const s=String(nm||'').trim();if(s.length>=2&&t.includes(s))return true}
      return false;
    };
    for(let i=0;i<parts.length;i++){
      const p=parts[i];
      if(!p||p.who||(p.type!=='act'&&p.type!=='say'))continue;
      let pick='';
      if(p.type==='act'){
        for(let j=i+1;j<parts.length;j++){const q=parts[j];if(!q||q.type==='narr'||q.type==='quote')break;if(q.who){if(nameHit(p.text,q.who))pick=q.who;break}}
      }
      if(!pick)for(let j=i-1;j>=0;j--){const q=parts[j];if(!q||q.type==='narr'||q.type==='quote')break;if(q.who){pick=q.who;break}}
      if(pick)p.who=pick;
    }
    let group=[],groupWho='';
    const speakerOf=p=>{ // parts 上标了 who 就以它为准：一轮里换人，不能全挂在上一位名下
      const raw=String((p&&p.who)||'').trim();
      if(isPlaceholderWho(raw)||raw==='你'||raw==='主控'||(proto&&raw===proto))return ''; // 「…」这类占位不算标了人，仍归当前说话人
      return canonicalSceneWho(raw)||raw;
    };
    // 气泡只标“这句话是谁说的”，不改对话对象：对话人是这场戏的对手，旁人插一句不该把标题抢走。
    // 换对话对象由 requestScene 统一判定（整场换手、玩家当面点名、引见交人）。
    const flush=()=>{
      if(!group.length)return;
      const segs=group.map(p=>p.type==='act'?{act:p.text}:{text:p.text});
      const plain=group.map(p=>p.type==='act'?'（'+p.text+'）':p.text).join('');
      const speaker=groupWho||who||(sceneCtx?sceneCtx.who:'')||fallback; // 未标人的段归“此刻的”说话人，上一段换过人也要跟上
      this.bubble('npc',speaker,'',segs);
      if(sceneCtx)sceneCtx.lines.push({who:'npc',name:speaker,text:plain});
      group=[];groupWho='';
    };
    for(const p of parts){
      if(p.type==='act'||p.type==='say'){
        const sp=speakerOf(p);
        if(sp&&group.length&&sp!==groupWho)flush(); // 同一轮里换了说话人：先收上一人的气泡
        if(sp)groupWho=sp;
        group.push(p);continue;
      }
      flush();
      if(p.type==='quote'){
        this.quoteBubble(p.who||'',p.text);
        if(sceneCtx)sceneCtx.lines.push({who:'quote',name:p.who||'',text:p.text});
      }else{
        this.bubble('narr','',p.text);
        if(sceneCtx)sceneCtx.lines.push({who:'narr',text:p.text});
      }
    }
    flush();
  },
  sayNarrative(text,whole){ // 旁白回显：whole=true 时整段当旁白（API 已语义分段，不再猜引号）
    const parts=filterText(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    if(whole){
      const t=parts.join('\n');
      if(t){this.bubble('narr','',t);if(sceneCtx)sceneCtx.lines.push({who:'narr',text:t})}
      return;
    }
    for(const line of parts){
      for(const seg of this.splitSpeech(line)){
        if(seg.type==='dialog'){
          const t=fixEmperorMention(seg.text);
          this.bubble('npc',sceneCtx?sceneCtx.who:'',t);
          if(sceneCtx)sceneCtx.lines.push({who:'npc',name:sceneCtx.who,text:t});
        }else{
          this.bubble('narr','',seg.text);
          if(sceneCtx)sceneCtx.lines.push({who:'narr',text:seg.text});
        }
      }
    }
  },
  sayLine(text,who){ // 对方本轮话语：引号内为台词，引号外的动作/神态以（）并入同一只对方气泡
    const parts=filterText(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const speaker=who||(sceneCtx?sceneCtx.who:'');
    for(const line of parts){
      const segs=this.splitSpeech(line).map(seg=>seg.type==='dialog'?{text:fixEmperorMention(seg.text)}:{act:seg.text});
      if(!segs.length)continue;
      const hasDialog=segs.some(seg=>seg.text!=null);
      if(!hasDialog){ // 整行都是动作神态：仍挂在对方气泡里，不另起旁白框
        const act=segs.map(seg=>String(seg.act).replace(/[。\s]+$/,'')).join('');
        this.bubble('npc',speaker,'',[{act}]);
        if(sceneCtx)sceneCtx.lines.push({who:'npc',name:speaker,text:'（'+act+'）'});
      }else{
        const plain=segs.map(seg=>seg.act!=null?'（'+String(seg.act).replace(/[。\s]+$/,'')+'）':seg.text).join('');
        this.bubble('npc',speaker,'',segs);
        if(sceneCtx)sceneCtx.lines.push({who:'npc',name:speaker,text:plain});
      }
    }
  },
  recordLine(who,text){if(sceneCtx&&text)sceneCtx.lines.push({who,text:String(text)})},
  chatBusy(on){
    const box=$('#chatOpts');
    if(on){
      const who=sceneCtx?sceneCtx.who:'';
      box.innerHTML=`<div class="msg typing">${avatarHtml(who,'mav sm')}<div class="mcol"><div class="mwho">${esc(dispName(who))}</div><div class="bubble npc"><span class="busy-dots"><i>·</i><i>·</i><i>·</i></span></div></div></div>`;
    }
  },
  closeChat(){ // 剧情未收尾前须先应对；否则收起对话回住处
    if(phase==='RESOLVING'){toast('正在结算本旬，稍候');return}
    if(phase==='EVENT_CHOICE'){toast('剧情未了，请先应对');return}
    $('#chatview').classList.remove('on');
    UI.syncGlobalSet();
  },
  sceneMeta(sc){ // 场景地点/时辰标注：同一场里只在地点或时辰真正变化时显示，避免每轮重复
    if(!sceneCtx||!sc)return;
    const when=String(sc.when||'').trim(),where=String(sc.where||'').trim();
    const prev=sceneCtx.meta||(sceneCtx.meta={when:'',where:''});
    const wc=!!when&&when!==prev.when, pc=!!where&&where!==prev.where;
    if(!wc&&!pc)return;
    if(wc)prev.when=when;
    if(pc)prev.where=where;
    this.bubble('sys','',(wc?when:'')+(wc&&pc?'｜':'')+(pc?where:''));
  },
  /* 剧情场景：开场 → 想聊多久聊多久（点选项或自由接话）→ 玩家点「结束对话」才收尾结算 */
  openScene(p){
    phase='EVENT_CHOICE';
    const sc=p.scene||{};
    const who0=sceneSpeaker(p,sc);
    sceneCtx={who:canonicalSceneWho(who0)||(isPlaceholderWho(who0)?'':who0)||'宫中来人',round:1,lastOptions:Array.isArray(p.options)?p.options:(Array.isArray(sc.options)?sc.options:[]),offered:[],lines:[],ledger:[],meta:{when:'',where:''},resolveRetried:false,cast:[],
      scheme:Game._pendingScheme||null,schemeDone:false};
    Game._pendingScheme=null; // 只认本场：下一场不继承
    const adj0=Game._lastAdj||{};
    sceneCtx.banquet=p._fest||null; // 本场是照常过的节宴：群聊场，不锁单一对话人（由结算时按本轮裁决打标）

  playerSegs(text){ // 玩家气泡按现场对话渲染：括号/【】内是动作，括号外是当场说出口的话

          const mention=!!curNow&&(narrAll.includes(curNow)||(curName&&narrAll.includes(curName)));
          const curHere=unlabeled||spk.some(w=>(canonicalSceneWho(w)||w)===curNow)||(mention&&!left);
          const want=String(sceneCtx.wantWho||'');
          const wantSpoke=!!want&&spk.some(w=>(canonicalSceneWho(w)||w)===(canonicalSceneWho(want)||want)); // 被当面叫到的人这一轮真的应了声
          const wantOk=wantSpoke&&(canonicalSceneWho(want)||want)===nw;
          const newNpc=(state.npcs||{})[nw]||{};
          const newNames=[nw,newNpc.name,newNpc.realName,dispName(nw)].filter(Boolean).map(String).filter(s=>s.length>=2);
          const newIntro=newNames.some(nm=>narrAll.includes(nm)); // 旁白里把新人引到场：算整场换手，不是插话
          if(curHere&&!wantOk&&!newIntro)nw=curNow; // 玩家没当面叫别人、原对象还在场，也没交代换人：不换
        }
        if(sceneCtx)sceneCtx.wantWho=null; // 点名只认这一轮：下一轮由玩家重新叫
      }
      if(nw&&sceneCtx&&nw!==sceneCtx.who){sceneCtx.who=nw;if(!sceneCtx.banquet)$('#chatTitle').textContent='剧情对话 · '+dispName(nw);$('#chatAva').innerHTML=avatarHtml(nw)}
      this.sceneMeta(sc);
      if(parts){
        this.sayParts(parts);
        // parts 里一句话都没有、台词落到了 narrative：别把这段吞掉，带引号的仍按台词渲染
        if(narr&&!parts.some(x=>x.type==='say'||x.type==='quote'))this.sayNarrative(p.narrative,false);
      }
      else if(sc.line)this.sayLine(sc.line);
      else if(narr)this.sayNarrative(p.narrative,true);
      const hasText=!!(parts||sc.line||narr);
      let fresh=sopts;
      if(sceneCtx&&sopts.length){ // 重复选项不再端出来
        const seen=sceneCtx.offered||[];
        fresh=sopts.filter(o=>{const t=String(o.text||o).trim();return t&&!seen.includes(t)});
      }
      if(!hasText&&!sopts.length)toast('对方没有答话，接一句或点「结束对话」',2600); // 空输出不偷偷收场
      else if(sopts.length&&!fresh.length)toast('对方没有新的话头，你可以直接接话或结束对话',2600);
      this.renderSceneOpts(fresh);
      $('#chatBody').scrollTop=$('#chatBody').scrollHeight;
    }).catch(e=>{
      this.chatBusy(false);
      if(e.name==='AbortError')return; // 脱困/取消已经复位界面，晚到的失败不再改状态
      if(gift&&sceneCtx)sceneCtx.giftBusy=false; // 赠礼未成：礼物不曾扣下，原样留在囊中
      if(perf&&sceneCtx)sceneCtx.perfBusy=false; // 献艺未成：精力不曾扣下
      phase='EVENT_CHOICE';
      this.renderSceneOpts(sceneCtx?sceneCtx.lastOptions||[]:[]);
      this.handleCallErr(e);
    });
  },
  sceneRound(choice){

    const maidPendNote=maidPend.length?`她名下还挂着这些待办：${maidPend.map(x=>pendText(x)).join('；')}。主控问起办差时她须逐条回进度——办妥的交货、回话并从 statePatch.pending 移除；未妥的说清缘由与预计何时能成；不得反问一堆或佯装忘记。`:'';

    const b=sceneCtx.brief;

    const strongBrief=b&&!banquet&&(b.kind==='scheme'||b.kind==='plot'); // 宴席不是冲突场：不逼它每轮推进一个"核心问题"
    const briefNote=b&&b.question?(banquet
      ?`【本场】${b.question}${b.note?`（背景：${b.note}）`:''}`
      :`【本场戏核】${b.question}${b.note?`（背景：${b.note}）`:''}${b.stake?`（得失：${b.stake}）`:''}${strongBrief?'本轮必须让这个核心问题前进一步：给出新信息、条件、决定、代价或后果；不得转向簿册、花色、茶点等无关细节，也不得另起无关的小问题。':'本场不必强行制造冲突；每轮必须让关系、信息或态度有实际变化，没有新内容就一句交代，不要用追问硬撑。'}`):'';
    const banquetNote=banquet?`【宴席】本场是「${sceneCtx.banquet.name}」：席上人多，一轮里可有二三人各自开口，每人都用 who 标明、各成一只气泡；被主控点到名的那位须回应，没人被点名就照常推进场面（上菜、赐物、乐起、竞渡、旁座低语），不必人人答话，也不得凭空再安排一个人来挑事。`:'';
    const prevOffered=(sceneCtx.offered||[]).slice(-8);
    const optNote=prevOffered.length?`此前已给过的接话选项：${prevOffered.map(t=>`「${t}」`).join('；')}。本轮必须换新的方向，不得重复这些原句或同义改写；玩家已选过、答过的方向不再作为选项。`:'';
    const asked=(sceneCtx.lines||[]).filter(l=>l.who==='npc'&&/[？?]/.test(String(l.text||''))).slice(-5).map(l=>`「${String(l.text||'').slice(0,40)}」`).join('；');
    const askedNote=asked?`本场对方已经问过的问句：${asked}。这些已经得到回答，不得再问或换说法重问；只能追问影响得失的关键点，或直接给出处置、条件与下一步行动。`:'';

      :`【节奏】本场第${r}轮：事已定局，对方只作收束性回应——简短作答、婉拒深谈（「改日再叙」「此处不便」）或起身相送，答与不答、答多答少由她的性情与场合定：玩家追问不保证有得答；不得重新展开新话题，也不得以新问句把局面再搅开。接话选项至多留一个追问的口子，其余是从这件事走开的行动（递出去、去问别处、当场办、暂且搁下、起身告退）。`;
    let handoffNote='';
    if(!sceneCtx.maid&&isServantWho(sceneCtx.who)){ // 引见/通传的宫人占着对话人：正主真到场了才提示交人
      const heard=sceneCtx.lines.map(l=>String(l.text||'')).join(' ');
      const inRoom=/御前|御案|御笔|御览|御座|御书|御膳|龙颜|龙袍|陛下|皇上|圣上|天子/.test(heard); // 宫女口中的「主子/娘娘」是称呼主控，不算正主到场
      if(inRoom)handoffNote=`本场对话人${sceneCtx.who}只是通传、引路、捧物的宫人，场上已有正主（帝、后、贵妃等）在场、甚至已经开口：正主一到就由正主自己说话——把 scene.who 改写为正主（帝写「皇帝」），正主的话写进 say 并标 who，${sceneCtx.who}这一轮至多一句通传或一个陪衬动作；不得替正主发话、替正主下令，也不得把正主的意思吞下去只写她自己的反应。本场已拖了几轮没让正主开口，这一轮必须交人。`;

    const parseNote=plainChoice?'这一条没有用括号标出动作、也没标明哪句是说出口的原话：按她此刻的言行演绎，NPC 只回应她实际做了、说了的，不得把她心里的打算当作已说出口的承诺来复述。':'';

    const addressee=(function(){ // 只有当面称呼（开口叫名、转向/看向某人）才算冲另一个人说话；话里提到谁不等于跟谁说
      const t=String(choice||'');if(!t||!state)return null;
      const cur=String(sceneCtx.who||'');

      const esc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const called=(name)=>{
        const n=esc(name);
        if(new RegExp('^(?:（[^）]*）|\\([^)]*\\))?\\s*'+n+'\\s*[，,、：:！!]').test(t))return true; // 一开口就叫她
        if(new RegExp('(转向|转过身|回过头|对着|看向|望向|面向|朝|冲)\\s*(了|着)?\\s*'+n).test(t))return true; // 动作指向她

      const hits=[];

    if(sceneCtx.chamber)msg=msg.replace(/她/g,'帝');

  sceneEnd(){ // 玩家主动结束：对方应声简短收尾，统一结算（不耗精力）；本地开场且一言未发则不调 API、不结算

    this.requestScene(msg,'（结束对话）',undefined,undefined,undefined,true); // endReq：响应必须收场结算，宫女问话亦不例外

  _sceneResolve(p){
    phase='RESOLVING';
    const body=$('#chatBody');
    if(sceneCtx&&sceneCtx.standalone)p=stripStandaloneGrowth(p); // 旬中问话不结算本旬养成，兜底剔除模型硬塞的才艺/属性成长
    if(!p._narrShown){
      const parts=this.sceneParts(p.scene);
      if(parts)this.sayParts(parts); // 收尾前若有最后一句对白，先按语义段渲染
      if(p.narrative)this.sayNarrative(p.narrative,!!parts); // 有 parts 时收尾 narrative 整段当旁白
    }
    if(sceneCtx&&sceneCtx.chamber){ // 侍寝夜话：只收场、不结算本旬，也不写纪事卡；但这一夜谈成的约定、信物与旧事要留痕
      try{
        const sp=(p&&p.statePatch)||{},patch={};
        for(const k of ['pending','inventory.add','emperor.memories'])if(sp[k]!=null)patch[k]=sp[k];
        if(Object.keys(patch).length){applyPatch(patch);flushAcquired();persistCurrent();markSafe()}
      }catch(e){console.warn('[夜话] 留痕失败',e)}
      body.scrollTop=body.scrollHeight;
      $('#chatOpts').innerHTML='<button class="btn btn-primary" style="letter-spacing:.2em;text-indent:.2em" onclick="Game.sceneDone()">继续</button>';
      return;
    }
    if(sceneCtx&&sceneCtx.scheme&&!sceneCtx.schemeDone){ // 暗流结果由模型裁定：前端只落账，不掷骰、不代改数值
      const raw=String(p.schemeOutcome||'').toLowerCase();
      const result=/^(win|draw|lose|defuse)$/.test(raw)?raw:inferSchemeOutcome(p);
      resolveSchemeByModel(sceneCtx.scheme,result);
      p.changes=(Array.isArray(p.changes)?p.changes:[]).concat([`暗流结果：${schemeOutcomeText(result)}`]);
      sceneCtx.schemeDone=true;
      this.bubble('sys','',`【暗流结账】${schemeOutcomeText(result)}——后果已按你的应对与当场局势写实`);
    }
    finalize(p,{focus:Game._lastFocus||'剧情',choice:'剧情应对',adj:Game._lastAdj});
    body.scrollTop=body.scrollHeight;
    $('#chatOpts').innerHTML='<button class="btn btn-primary" style="letter-spacing:.2em;text-indent:.2em" onclick="Game.sceneDone()">继续</button>';
  },

  customFocus(){ // 宫务·行事里自拟的一件事：查账、领料、家书、抄经、传话、当面托请等都在这里办
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    const el=document.getElementById('focusText');
    const t=el?String(el.value||'').trim():'';
    if(!t){toast('先写一句要吩咐的事');return}
    if((state.energy??0)<=0){this.collapse();return}
    const cost=focusEnergyCost(t);
    const who=customActionWho(t);
    const ctx=customActionCtx(t);
    const hits=matchLeads(ctx);
    const phits=matchPending(ctx);
    const leadHint=hits.length?`\n【呼应引线】此事与在途引线相关（按要紧程度排序）：${hits.map(p=>`「${p.title}」（${p.line}）`).join('；')}。挑真相关的推进或了结：能兑现的当旬兑现并回写台账；暂不能的让此事与之产生实质关联（新信息、态度变化、埋下下一步）即可。每条引线最多被提示 ${ECHO_LEAD_TOTAL} 次，勿为凑交集硬编。`:'';
    const pendHint=phits.length?`\n【呼应待续】此事与待续琐事相关：${phits.map(x=>pendText(x)).join('；')}。办妥的从 statePatch.pending 移除，未办妥的更新一句现状（回写即重置挂账计旬）。`:'';
    const msg=`第${xunNo()}旬第一轮：玩家自行安排「${t}」（耗精力 ${cost}，精力由前端扣除，你不必也不得自行加减）。这是本旬的一件实际安排，按下列两种方式之一结算，由你依指令判断：
【普通交代】若只是独自办事、派人去办、递话、查账、领料、写家书、抄经、整理妆奁等不必长时间当面周旋的事：hasEvent=false，完整结算；正文写清谁去办、怎么办、办到什么程度、最终成没成，办不成要写卡在哪一步。
【当面详演】若要见某人、当面请托、对质、传召问话、赏罚或安抚下人、与人商议：hasEvent=true，用剧情对话 scene 结构开场（scene.state="ongoing"，scene.who 填对方，narrative 先交代主控在何处、如何见到此人，scene.parts 只写对方第一轮的动作与台词，顶层 options 给 2—4 个接话选项），就此停下、不结算应对后果（开场这一轮 changes 与 statePatch 留空，收场那一轮再统一结算）。这类交涉是玩家自己约的，不算另行生成剧情；但对方肯不肯应、提什么条件，须依其性情、立场、交情与位份礼制如实写，不得有求必应。
无论走哪一路，此事都必须真正影响剧情：普通交代在本次结算里、当面详演在收场那一轮里，statePatch 必须写 log 一句话，并至少落下一项实质结果（银两、关系或恩宠、才艺、行囊、待续 pending、剧情账 plots 的推进或新立、状态、情报、机会）。办不成、被推诿、扑空、逾矩受斥同样是结果：写明卡在哪一步，并留下代价或后患（欠人情、走漏风声、失掉时机、被人记恨、下人抱怨等）；不得只写一段没有下文的过程，也不得把没请示过的事写成既成事实。${leadHint}${pendHint}`;
    UI.closeSheet();
    this.round1(msg,`吩咐·${t.length>12?t.slice(0,12)+'…':t}`,cost,{leadIds:hits.map(p=>p.id),pendTexts:phits.map(pendText),whoHint:who||undefined,mode:{kind:'act',text:t,who,ctx,ids:hits.map(p=>p.id)}});
  },

    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}

      this.round1(msg,`相邀·${name}`,0,{skipDice:true,_xunPop:true,whoHint:isEmp?'皇帝':who,mode:{kind:'act',text:'相邀'+name,who:isEmp?'皇帝':who,ctx:[who,name]}});

    }

  maybeIncomingVisit(){ // 旬中来客：每次行动收尾掷一回（本旬尚无戏、尚未来客），越到后半晌越容易有人找上门
    if(!state||phase!=='FOCUS_SELECT')return false;
    if(sceneCtx||currentEvent)return false;
    if(['busyModal','actModal','incidentModal','questModal','dawnModal','collapseModal','restModal','tutorialModal','errModal'].some(id=>{const el=document.getElementById(id);return el&&el.classList.contains('on')}))return false;
    const meta=ensurePlotMeta();
    if(meta.visitThisTurn===state.turn||meta.midVisitDone===state.turn)return false;
    if(meta.lastEventTurn===state.turn)return false; // 本旬已有一场需应对的戏，不再叠一场
    const energy=Math.round(Number(state.energy)||0);
    if(energy<=0)return false;
    const firstRoll=meta.midVisitRollTurn!==state.turn;
    meta.midVisitRollTurn=state.turn;
    meta.midVisitRolls=firstRoll?1:(Number(meta.midVisitRolls)||0)+1; // 本旬行事的第几件：越往后越可能有人来
    const spent=Math.max(0,ENERGY_MAX-energy);
    const chance=Math.min(0.68,0.14+spent*0.008)+(meta.midVisitRolls>1?0.08:0);
    if(Math.random()>=chance)return false;
    const v=pickIncomingVisitor('mid');
    if(!v)return false;
    meta.midVisitDone=state.turn;meta.visitThisTurn=state.turn;
    const isEmp=v.kind==='emperor';
    const who=isEmp?'帝':dispName(v.id);
    const where=this.homeLocation()||'本宫住处';
    const errand=v.reasonKind==='errand';
    const msg=`第${xunNo()}旬旬中：主控本旬行事至此，精力剩下 ${energy}，人回到${where}。${who}忽然登门（由头：${v.reason}）。用剧情对话 scene 结构开场（scene.state="ongoing"，scene.who 填「${isEmp?'皇帝':v.id}」，scene.where 写「${where}」，narrative 只交代你在何处、此人如何进来或被引进，scene.parts 写对方第一句话与动作），给 2—4 个接话选项后停下，不结算应对后果，等玩家点「结束对话」再统一结算。${isEmp?'这是帝主动来：须写出他为什么此刻来、记得什么或破什么例，收场经 statePatch["emperor.contact"] 记一句相处注记。':(errand?'她只是来送点东西、认认门，说几句场面话；不托事、不打听底细，也不必留出什么大用。':'她是主动登门，须有实际来意（消息、请托、试探、赔礼或结盟），不得写成恰好路过；肯不肯说、说到几分，按交情与性情来。')}来客不占精力，也不要写成主控另行出门。`;
    this.leavePlace(); // 人在住处被登门：场景页收起，别让来客的戏压在外出的景上
    this.round1(msg,isEmp?'来访·帝':`来访·${who}`,0,{skipDice:true,_xunPop:true,whoHint:isEmp?'皇帝':v.id});
    return true;
  },

        const o=Craft.materials().find(m=>m.name===n);

      });

    }
    const next=Math.max(0,Math.min(meta.count,cur+(Number(delta)||0)));

    p.skills=p.skills||{};
    const key=Object.keys(p.skills).find(x=>x.indexOf(k)>-1)||k;
    const before=Number(p.skills[key])||0;
    const skillName=CR_SKILLNAME[k]||k;
    const cost=focusEnergyCost('才艺修习');
    const book=(mode==='book')?libHeldBook(state,k):null; // 临帖读谱：手头须有该艺谱册

    else if(mode==='teacher'&&accepted)gain=before<100?3+Math.floor(Math.random()*2):skillGainAtBook(before);

    p.skills[key]=Math.min(SKILL_MAX,before+gain);

    const level=SKILL_LEVEL(before);
    let flavor='';
    if(mode==='teacher'&&teacher){
      const ta=npcSexOf(state,teacher.id)==='m'?'他':'她';
      if(accepted){
        flavor=(gain>0?[
          `你带着${k}上的疑难去寻${teacher.name}。${ta}没有多话，只把最吃重的地方拆开，一遍遍带你走——这一旬下来，${k}进益${gain}点。`,
          `${teacher.name}在廊下陪你练了半日，指出你几处旧毛病。${k}进益${gain}点，比独练扎实得多。`,
          `${ta}先说你这处“急了些”，又亲手带你走了两遍。${k}涨了${gain}点，你心里明白这人情记下了。`
        ]:[
          `你去寻${teacher.name}，${ta}陪你练了半日。虽未立刻见效，${k}的路数却清了些。`,
          `${teacher.name}把手上那点诀窍说给你听，你记下了，却还没练到手上。`
        ])[Math.floor(Math.random()*(gain>0?3:2))];
        if(addPending(`欠${teacher.name}一份人情（陪练${skillName}）`))iouNew=true;
      }else{
        flavor=(gain>0?[
          `你去寻${teacher.name}，${ta}推说这几日身上不好，改日再陪你练。你不好强求，回来自己闷头练了半日，${k}进益${gain}点。`,
          `${teacher.name}那边正有客，只隔着帘子说了两句，便打发你回来。你自己练了一阵，${k}涨了${gain}点，终究不如有人指点。`
        ]:[
          `你去寻${teacher.name}，${ta}推说宫务缠身。你回来自己练了半日，${k}却没见长进。`,
          `${teacher.name}婉言推了，说改日得空再叙。你独自练到掌灯，${k}仍停在原处。`
        ])[Math.floor(Math.random()*2)];
      }
    }else{
      flavor=(gain>0?[
        `你敛息凝神，一味苦修${k}，收势时指节微酸——但${k}确有进益。`,
        `这一旬心无旁骛，${k}进益${gain}点，${before<30?'虽仍生疏，倒也像了个样子':before<70?'日渐娴熟':before<100?'愈发精纯':`${level}之境又稳了一分`}。`,
        `反复打磨之下，${k}又精进了${gain}点。宫人路过，都夸你勤勉。`,
        `灯下调息练到深夜，${k}小有进益，只稍觉乏累。`,
        `一段时日闷头修习，${k}涨了${gain}点，心中有数，脚下生风。`
      ]:[
        `这一旬仍在一处旧毛病上打转，${k}未见长进。${before>=100?'技艺至此，再进一步都难。':''}`,
        `练到收势，${k}只觉比往日更艰涩，进益微乎其微。`,
        `你把旧谱翻来覆去地磨，${k}依旧停在原处——火候未到，急不得。`
      ])[Math.floor(Math.random()*(gain>0?5:3))];
      if(book)flavor+=gain>0?` 手边${book.name}翻在膝上，章法可循，这一旬进益比平日扎实。`:` 手边${book.name}翻在膝上，章法虽明，这一旬仍差些火候。`;

    const deltas=[];

    if(mode==='teacher'&&teacher){
      deltas.push(accepted?`${teacher.name}应了这次陪练`:`未能讨到${teacher.name}的指教`);

    history.push({turn:state.turn,focus:`才艺修习·${k}`,choice:'',narrative:flavor,log:`${k} +${gain}`});

    UI.actResult('才艺修习 · '+k,flavor,deltas);

  festPerform(k,pieceId){ // 节宴献艺：本地掷定成色与赏罚，不调模型；歌舞可指定已成曲目
    if(!state||!state.protagonist){toast('尚未开局');return}
    if(!ART_SKILLS.includes(k)){toast('此艺不列席间献艺');return} // 骑射、烹饪不上宴
    const banquet=!!(phase==='EVENT_CHOICE'&&sceneCtx&&sceneCtx.banquet); // 宴席对话里当场献：结果落在席上，不弹窗
    if(phase!=='FOCUS_SELECT'&&!banquet){toast('请先结束当前应对');return}
    const fest=festivalOf(state.time);
    if(!fest){toast('本旬没有固定节宴');return}
    if((ensurePlotMeta().graceTurn||0)>(state.turn||0)){toast('初入宫闱，先安顿下来');return}
    if(!banquet&&state.lastFestSerial===xunSerial(state.time)){toast('本旬节宴已过，不再补献');return}
    if(state.lastFestPerfSerial===xunSerial(state.time)){toast('本旬已经献过艺了');return}
    if(!banquet&&(state.energy??0)<=0){this.collapse();return}
    if(banquet&&(state.energy??0)<focusEnergyCost('节宴献艺')){toast('精力不足，撑不起这一场');return}
    const p=state.protagonist,sk=p.skills||{};
    const key=skillKeyIn(sk,k);
    if(!key){toast('这门还没入门');return}
    const pc=pieceId?pieceById(pieceId):null;
    const before=Number(sk[key])||0;
    UI.closeSheet();
    ensureXunBook();
    const cost=focusEnergyCost('节宴献艺');
    state.energy=Math.max(0,Math.round((state.energy??0)-cost));
    state.lastFestPerfSerial=xunSerial(state.time);
    const swing=Math.floor(Math.random()*25)-12; // 临场发挥
    const scaleBonus=fest.scale==='大宴'?5:0;
    const tired=(state.energy<25)?-8:0; // 精力见底，席上容易失手
    const pieceBonus=pc?(Math.max(0,WORK_QUALITIES.indexOf(pc.quality))*2+Math.floor((Number(pc.mastery)||0)/15)):0; // 曲目成色与熟练
    const score=before+swing+scaleBonus+tired+pieceBonus;
    if(pc){pc.perfCount=(Number(pc.perfCount)||0)+1;pc.lastPerfSerial=xunSerial(state.time)}
    const tier=score>=85?'great':score>=60?'good':score>=38?'plain':'fail';
    const deltas=[];
    const at=p.attributes=p.attributes||{};
    const dW=tier==='great'?2:tier==='good'?1:tier==='fail'?-1:0;
    if(dW){at['威望']=clamp01_100((Number(at['威望'])||0)+dW);deltas.push(`威望 ${dW>0?'+':''}${dW}`)}
    const fk=emperorKey();state.relationships=state.relationships||{};
    const buffBefore=relSnapshotNum();
    const rel=state.relationships[fk];
    const curFavor=typeof rel==='object'?Number(rel.value)||0:Number(rel)||0;
    const dF=tier==='great'?3:tier==='good'?1:tier==='fail'?-1:0;
    if(dF){
      state.relationships[fk]=Object.assign({},rel&&typeof rel==='object'?rel:{},{type:'宠爱',value:Math.max(0,curFavor+dF)});
      deltas.push(`宠爱 ${dF>0?'+':''}${dF}`);
      longBuffAfterGains(buffBefore);
    }
    const silver=tier==='great'?(fest.scale==='大宴'?20:12):tier==='good'?(fest.scale==='大宴'?10:6):0;
    if(silver){p.silver=(Number(p.silver)||0)+silver;deltas.push(`银两 +${silver}`)}
    const pts=tier==='great'?3:tier==='good'?1:0;
    if(pts){p.points=(Number(p.points)||0)+pts;deltas.push(`积分 +${pts}`)}
    if(tier==='fail'&&addPending(`节宴失手：${fest.name}上${pc?pc.name:k}没演好，席间议论未平`))deltas.push('席间议论未平');
    if(pc)deltas.push(`所献：${pc.name}（${pc.quality}）`);
    const act=pc?({歌:`唱起自己谱的${pc.name}`,舞:`当席舞了一折${pc.name}`}[k]||`献上${pc.name}`):({琴:'抚了一曲',棋:'对了一局',书:'当席写了一幅字',画:'即席勾了一幅小景',歌:'起身唱了一支',舞:'在席前舞了一段',女红:'呈上一件绣样',医术:'讲了一段脉理',莳花:'呈上一盆新培的花',香道:'当席焚了一炉香'}[k]||'献了一艺');
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    const flavor=tier==='great'?pick([
        `你在「${fest.name}」上${act}。起势时席间还有低语，到一半便静了；收势后上首先有人击节，随后满席附和。这一回，你露了脸。`,
        `你在席上${act}，比平日更稳。有人低声问这是谁家的，上首也朝这边看了一眼——今夜这席，你压住了场。`
      ]):tier==='good'?pick([
        `你在席上${act}，分寸拿捏得稳。有人点头，也有人只顾吃酒；至少没出差错，该看见的人都看见了。`,
        `你在「${fest.name}」上${act}，不算惊艳，却也体面。席间有人记下了你的名字。`
      ]):tier==='plain'?pick([
        `你在席上${act}，众人客气地看过，便转去说别的。这一回不算出彩，也没丢脸。`,
        `你${act}，中规中矩地收了势。席上有人应景地赞了一句，也就过去了。`
      ]):pick([
        `你${act}，起势便觉手生，收势时席上静得发紧。有人低头掩了口，你只作没看见。`,
        `你本想在「${fest.name}」上${act}，偏偏中途乱了一拍。你勉强收住，脸上发烫；席间已有人交换眼色。`
      ]);
    const tierText={great:'大放异彩',good:'得体',plain:'平平',fail:'失手'}[tier];
    const perfName=pc?pc.name:k;
    history.push({turn:state.turn,focus:`节宴献艺·${perfName}`,choice:'',narrative:flavor,log:`${fest.name}献${perfName}：${tierText}`});
    state.lastNode=`节宴献艺·${perfName}（${tierText}）`; // 留给下一旬的模型承接席间余波
    logXunAction(`节宴献艺·${perfName}`);
    if(tier==='great')chronicleAdd(`节宴献艺：${fest.name}上${perfName}得彩`);
    persistCurrent();markSafe();UI.updateStatusbar();checkRestWarn();
    if(banquet){
      sceneCtx.perfBusy=false;
      this.sayNarrative(flavor,false); // 席上的反应：旁白气泡
      this.bubble('sys','',`【席间献艺】${tierText}${deltas.length?'　'+deltas.join('　'):''}`);
      this.renderSceneOpts(sceneCtx.lastOptions||[]);
      if(state.energy<=0)toast('精力已尽，散席后该歇了',3000);
      return;
    }
    UI.actResult('节宴献艺 · '+perfName,flavor,deltas);
    if(state.energy<=0)setTimeout(()=>this.collapse(),600);
  },
  practicePiece(id){ // 温习旧曲：只精熟这一件，不会再起新功课
    if(!state||!state.protagonist){toast('尚未开局');return}
    if(phase!=='FOCUS_SELECT'){toast('对话中只能查看，修习须回住处');return}
    if((state.energy??0)<=0){this.collapse();return}
    const pc=pieceById(id);if(!pc){toast('此作已不在');return}
    const cost=focusEnergyCost('才艺修习');
    if((state.energy??0)<cost){toast('精力不足，先歇一歇');return}
    ensureXunBook();
    const p=state.protagonist,sk=p.skills||{};
    const key=skillKeyIn(sk,pc.skill);
    const before=key?Number(sk[key])||0:0;
    const skillName=CR_SKILLNAME[pc.skill]||pc.skill;
    UI.closeSheet();
    const gain=before<100?(1+Math.floor(Math.random()*2)):(Math.random()<0.55?1:0);
    if(key)p.skills[key]=Math.min(SKILL_MAX,before+gain);
    const mBefore=Math.max(0,Math.min(100,Number(pc.mastery)||0));
    const mGain=mBefore>=100?0:(mBefore>=85?2:6+Math.floor(Math.random()*5));
    pc.mastery=Math.min(100,mBefore+mGain);
    state.energy=Math.max(0,Math.round((state.energy??0)-cost));
    const label=PIECE_LABELS[pc.skill]||'曲目';
    const flavor=(pc.skill==='医术'
      ?`你把旧日那册${pc.name}重新翻出来，逐条对脉证与方药，又在空白处补了两笔。${mGain?`这一册又熟了 ${mGain} 分。`:'已到火候，再磨也只是守住。'}`
      :pc.skill==='棋'
        ?`你照着${pc.name}把旧局从头打了一遍，几处应手、劫争与收官都比先前熟了。${mGain?`熟练 +${mGain}。`:'已到火候，再打也只是守住。'}`
      :pc.skill==='舞'
        ?`你关起门来，把${pc.name}从起势到收束又走了几遍，回旋处比先前更稳。${mGain?`熟练 +${mGain}。`:'已到火候，再练也只是守住。'}`
        :`你调息开嗓，把${pc.name}从头唱到尾，气口与转腔都按旧谱收着。${mGain?`熟练 +${mGain}。`:'已到火候，再唱也只是守住。'}`)
      +(gain>0?` ${skillName}也长了 ${gain} 点。`:' 技艺未再进，手上却更熟了。');
    const deltas=[];
    if(gain>0)deltas.push(`${skillName} +${gain}（${SKILL_LEVEL(before+gain)}）`);
    else deltas.push(`${skillName} 无进益`);
    deltas.push(mGain?`${pc.name}熟练 +${mGain}（${pc.mastery}／100）`:`${pc.name}已至炉火纯青`);
    history.push({turn:state.turn,focus:`温习·${pc.name}`,choice:'',narrative:flavor,log:`${label}${pc.name}熟练 ${pc.mastery}`});
    logXunAction(`温习·${pc.name}`);
    persistCurrent();markSafe();UI.updateStatusbar();checkRestWarn();
    UI.actResult(`温习 · ${pc.name}`,flavor,deltas);
    if(state.energy<=0)setTimeout(()=>this.collapse(),600);
  },
  performPiece(id){ // 才艺面板的施用入口：歌舞献艺、棋对弈、医术施治
    if(!state||!state.protagonist){toast('尚未开局');return}
    const pc=pieceById(id);if(!pc){toast('此作已不在');return}
    if(phase==='EVENT_CHOICE'&&sceneCtx){
      if(sceneCtx.perfBusy)return;
      if((state.energy??0)<focusEnergyCost('献艺')){toast('精力不足，先歇一歇');return}
      if(pc.skill==='棋'){sceneCtx.chamber?toast('帷帐里不摆棋'):this.sceneChess(pc.id);return}
      if(pc.skill==='医术'){sceneCtx.chamber?toast('此刻不是问诊的时候'):this.sceneConsult(pc.id);return}
      this.scenePerform(pc);
      return;
    }
    if(phase!=='FOCUS_SELECT'){toast('此刻不便施用');return}
    if(pc.skill==='医术'){toast('医案要在人前施用：与人对谈时，从互动菜单取出');return}
    if(pc.skill==='棋'){toast('棋谱要有人对局：与人对谈时，从互动菜单摆开棋盘');return}
    const fest=festivalOf(state.time);
    if(fest&&state.lastFestSerial!==xunSerial(state.time)&&state.lastFestPerfSerial!==xunSerial(state.time)&&(ensurePlotMeta().graceTurn||0)<=(state.turn||0)){
      this.festPerform(pc.skill,pc.id);
      return;
    }
    toast('献艺须有场合：节宴席上，或与人相对时从互动菜单献上一段');
  },
  scenePerform(pc){ // 对话中当场献艺：扣精力，由模型演反应并结算关系
    if(!sceneCtx||!pc)return;
    const cost=focusEnergyCost('献艺');

      :pc.skill==='舞'?(sceneCtx.chamber?`（起身，就着烛影舞了一折${pc.name}）`:`（起身，当众舞了一折${pc.name}）`)
      :(sceneCtx.chamber?`（移步灯下，轻轻唱了一曲${pc.name}）`:`（起身，当众唱了一曲${pc.name}）`);

  sceneImprov(k){ // 没有成曲时即席唱／舞一段
    if(!sceneCtx)return;

    const fake={id:null,improv:true,name:names[k]||'即席一段',skill:k,kind:PIECE_SKILLS[k]||'唱段',quality:'寻常',traits:[],mastery:0,description:'',perfCount:0};

  perfMsg(pc,who){
    const ta=npcSexOf(state,who)==='m'?'他':'她';

      pc.improv?'':(pc.quality?`品质：${pc.quality}`:''),

    ].filter(Boolean).join('；');

      `品质与熟练只是更好的起点，不保证得脸：对方正有心事、场合不合、此艺不对其脾胃，反应可以平淡甚至冷淡。`+

  consultMsg(pc,who){

    ].filter(Boolean).join('；'):'';

      `请只演${ta}与在场者的即时反应与场面（配合、遮掩、讳疾忌医、将信将疑、被说中隐疾而变色皆可），用 scene.parts 呈现（1—4 段，act/say/quote/narr 规则同前，总长 ≤120 字），并给 2—3 个接话选项；scene.state 必须写 "ongoing"，不得替玩家结束对话。`+

      `若对方确有病痛且这册医案对得上，可同轮以 statePatch.pending 清掉相应的病痛待续；误诊、当众说破私密病症、或贸然下重药，也可能招忌。`+
      this.sceneContextBlock();

  _perfResolve(p,perf){
    if(!sceneCtx||!perf)return;
    p=stripStandaloneGrowth(p); // 献艺／对弈／问诊只结算关系与任务，不结算才艺与属性成长
    const sc=p.scene||{};
    const parts=this.sceneParts(sc);
    const narr=filterText(p.narrative||'').trim();
    try{
      applyPatch(p.statePatch||{});
      applyDossier(p.dossier);
    }catch(e){console.warn('[互动] 结算失败',e)}
    flushAcquired(); // 献艺／问诊当场得的赏赐与回礼当场报
    const pc=perf.piece;
    const kind=perf.kind||'perform';
    const label=kind==='chess'?'对弈':kind==='consult'?'问诊':(pc&&pc.skill==='医术'?'施治':(pc&&pc.improv?'即席献艺':'献艺'));
    state.energy=Math.max(0,Math.round((Number(perf.beforeEnergy)||0)-(Number(perf.cost)||0))); // 精力由前端照扣，覆盖模型回写
    if(pc&&pc.id){pc.perfCount=(Number(pc.perfCount)||0)+1;pc.lastPerfSerial=xunSerial(state.time)}
    sceneCtx.perfBusy=false;
    this.sceneMeta(sc);
    if(parts){
      this.sayParts(parts);
      if(narr&&!parts.some(x=>x.type==='say'||x.type==='quote'))this.sayNarrative(narr,false);
    }
    else if(sc.line)this.sayLine(sc.line);
    else if(narr)this.sayNarrative(narr,true);
    const ch=(Array.isArray(p.changes)?p.changes:[]).filter(Boolean).map(String);
    const result=kind==='chess'?chessResultText(perf.result):'';
    const perfName=pc&&kind!=='chess'&&!pc.improv?pc.name:'';
    const head=[label,result,perfName,ch.join('；')].filter(Boolean).join(' · ');
    this.bubble('sys','',head);
    state.lastNode=[label,result,perfName].filter(Boolean).join('·');
    logXunAction(state.lastNode);
    const sopts=(Array.isArray(p.options)&&p.options.length)?p.options:(Array.isArray(sc.options)?sc.options:[]);
    this.renderSceneOpts(sopts.length?sopts:(sceneCtx.lastOptions||[]));
    $('#chatBody').scrollTop=$('#chatBody').scrollHeight;
    persistCurrent();markSafe();UI.updateStatusbar();
  },
  askMaidSkill(k){ // 侍女打听：耗 5 精力，问出一位精于此道的能人，写入其 skillIntel
    if(!state||!state.protagonist){toast('尚未开局');return}
    if(phase!=='FOCUS_SELECT'){toast('请先结束当前旬务');return}
    if((state.energy??0)<=0){this.collapse();return}
    ensureXunBook();
    const skillName=CR_SKILLNAME[k]||k;
    if(skillUnlocked(state.protagonist.skills||{},k)){toast('此艺已入门');return}
    const cost=5;
    const cands=[];
    for(const who in (state.npcs||{})){
      const n=state.npcs[who];if(!n)continue;
      const key=skillKeyIn(n.skills||{},k),v=key?Number(n.skills[key])||0:0;
      if(!(v>SKILL_TEACH_MIN))continue; // 只打听真正教得了的人
      if(n.skillIntel&&n.skillIntel[skillName])continue; // 已经听说了
      cands.push({who,n,v});

  useInstant(i){ // 即时之物：本地结算，不占本旬、不耗精力（每旬限一件，防刷属性）
