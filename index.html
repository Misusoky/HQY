function sanitizePlot(p){ // 单条台账归一；字段缺失时给默认值（仅新建条目用）
  if(!p||!p.id)return null;
  const numOrNull=v=>(v==null||v===''||!Number.isFinite(+v))?null:+v;
  return {
    id:String(p.id),
    line:['主线','支线','引线','敌对','目标'].includes(p.line)?p.line:'支线',
    title:String(p.title||'').slice(0,30),
    stage:['进行中','已兑现','已作废'].includes(p.stage)?p.stage:'进行中',
    earliest:numOrNull(p.earliest),latest:numOrNull(p.latest),
    dueText:String(p.dueText||'').slice(0,40),goal:String(p.goal||'').slice(0,180),note:String(p.note||'').slice(0,300),
    next:String(p.next||'').slice(0,90),tie:String(p.tie||'').slice(0,24), // next=下一步（一次见面内能办完的动作）；tie=所系（挂在哪条长期线上）
    touch:numOrNull(p.touch),staleMiss:numOrNull(p.staleMiss)||0, // touch=最近推进旬号（xunSerial 单位，与裁决一致）；staleMiss=发酵后连续被无视次数
    echo:numOrNull(p.echo),echoMiss:numOrNull(p.echoMiss)||0, // echo=最近被呼应的旬号；echoMiss=连续被呼应却无台账回写的次数
    echoTotal:numOrNull(p.echoTotal)||0,// echoTotal=被呼应的总次数（到 ECHO_LEAD_TOTAL 后不再主动提示）
    schemeId:p.schemeId?String(p.schemeId):undefined, // 暗流账的镜像条目：到期/发酵结账交给暗流账，不让台账代结
    factionId:p.factionId?String(p.factionId):undefined, // 派系排期的条目：到期无人应对时由派系账记一笔损失
    seed:p.seed?String(p.seed):undefined // 故事引子的条目：铺垫/回响的分段提示靠它认
  };
}
function plotKeyOf(title){ // 同一件事的不同说法：去掉标点空白后取前 16 字作键，用来认重复条目
  return String(title||'').replace(/[\s，。、；：！？…—·「」『』“”‘’"'（）()《》\[\]]/g,'').slice(0,16);
}
function mergePlots(base,incoming,nowTurn){ // 增量回写：模型只给变化条目，未提及的保持不变；凡回写即记 touch=本旬
  const list=Array.isArray(base)?base.slice():[];
  const byId=new Map(list.map(p=>[p.id,p]));
  const arr=Array.isArray(incoming)?incoming:[incoming];
  for(const raw of arr){
    if(!raw||!raw.id)continue;
    if(String(raw.id)===DESTINY_PLOT_ID)continue; // 命途条目前端维护，模型回写一律不认
    const old=byId.get(String(raw.id));
    if(!old){
      const p=sanitizePlot(raw);
      if(p&&p.title){
        const twin=list.find(x=>x&&x.stage==='进行中'&&!x.schemeId&&!p.schemeId&&!/^暗流/.test(p.title)&&plotKeyOf(x.title)===plotKeyOf(p.title));
        if(twin){ // 同一件事换个 id 又发一遍：并进原条目，不再另起一条
          for(const k of ['line','stage','goal','note'])if(raw[k]!==undefined)twin[k]=sanitizePlot(Object.assign({},twin,{[k]:raw[k]}))[k];
          twin.touch=nowTurn;twin.staleMiss=0;
          continue;
        }
        // 起于=建档这一旬；限期只从 dueText 换算，模型给的旬号一律不认
        if(!p.schemeId){
          const r=dueRangeFromText(raw.dueText);
          p.earliest=nowTurn;
          p.latest=r?Math.max(r.latest,nowTurn):null; // 话术写成过去了就是本旬到期，别让新条目一落地就逾期
        }
        p.touch=nowTurn;list.push(p);byId.set(p.id,p)
      }
      continue;
    }
    const merged=Object.assign({},old);
    for(const k of ['title','line','stage','dueText','goal','note','next','tie'])if(raw[k]!==undefined)merged[k]=raw[k];
    // 期限跟着 dueText 走：模型改期限话术才重算，没改就沿用旧旬号；它直接写的数字不作数
    if(!merged.schemeId&&raw.dueText!==undefined&&String(raw.dueText||'')!==String(old.dueText||'')){
      const r=dueRangeFromText(raw.dueText);
      merged.latest=r?Math.max(r.latest,nowTurn):(raw.latest!=null?Number(raw.latest):old.latest);
    } else if(merged.schemeId&&raw.latest!==undefined){
      merged.latest=sanitizePlot(raw).latest; // 暗流钉死的时刻由暗流账写，照收
    }
    const p=sanitizePlot(merged);
    if(p){
      const stepMoved=raw.next!==undefined&&String(raw.next||'').trim()&&String(raw.next||'').trim()!==String(old.next||'').trim(); // 换了一步：这条线真的往前走了一格（只改措辞不算，见 note 同款逻辑）
      const progressed=(raw.stage!==undefined&&raw.stage!==old.stage)||(p.latest!=null&&p.latest!==old.latest)||(raw.dueText!==undefined&&raw.dueText!==old.dueText)||stepMoved; // 实质推进：兑现/作废/立改期限；原样重发期限或只改写 note 文案都不算（防止"每旬换个说法"架空发酵裁决）
      if(progressed){p.touch=nowTurn;p.staleMiss=0}else{p.touch=old.touch;p.staleMiss=old.staleMiss} // 敷衍回写：挂账时钟照走
      p.echoMiss=0;Object.assign(old,p)}
  }
  return list;
}
function dedupePlots(s){ // 旧档遗留的重复条目：同一标题、同一状态的，只留先立的那条
  if(!s||!Array.isArray(s.plots))return 0;
  const seen=new Map(),out=[];let dropped=0;
  for(const p of s.plots){
    if(!p||!p.id){continue}
    if(String(p.id)===DESTINY_PLOT_ID){out.push(p);continue}
    const key=plotKeyOf(p.title)+'｜'+p.stage+'｜'+(p.schemeId||'')+'｜'+(p.factionId||'');
    const twin=seen.get(key);
    if(!twin){seen.set(key,p);out.push(p);continue}
    if(p.note&&String(p.note)!==String(twin.note||''))twin.note=((twin.note||'')+'；'+String(p.note)).slice(0,140);
    if(twin.latest==null&&p.latest!=null)twin.latest=p.latest;
    dropped++;
  }
  if(dropped){
    s.plots=out;
    console.info('[台账] 合并重复条目 '+dropped+' 条');
  }
  return dropped;
}

    }
  }
}

  const next=p.next?`下一步：${p.next}`:'';
  const note=p.note?`；前情：${String(p.note).slice(0,80)}`:'';
  const recap=p.factionId?'（派系账：开场先用一两句把前情交到主控眼前——此前谁、在哪、做了什么，此刻来要什么；前情此前已演过则承接，不得再凭空加新桥段）':'';
  return `${head}${next}${note}${recap}`;
}
function ensurePlotMeta(){return state.plotMeta=state.plotMeta||{lastEventTurn:-99,lastBigTurn:-99}}
function pendText(x){return typeof x==='string'?x:(x&&x.t)||''} // 待续条目取文本（兼容旧档纯字符串）
function addPending(text){ // 记一条待续琐事（去重；touch 以本旬起算）
  if(!state||!text)return false;
  state.pending=state.pending||[];
  if(state.pending.some(x=>pendText(x)===text))return false;
  state.pending.push({t:String(text),touch:Number(state.turn)||0,staleMiss:0});
  return true;
}
function dispName(who){return (typeof UI!=='undefined'&&UI.isEmperorId(who))?'帝':who} // 展示名：天子第三人称一律称"帝"（存档键、匹配、头像仍用原称谓）
function normalizePending(arr,turn){ // 统一为 {t:文本, touch:最近推进旬号, staleMiss:连续未理次数}；旧档字符串视为已发酵（下轮裁决即强制处理）
  return (arr||[]).map(x=>typeof x==='string'?{t:x,touch:(turn??0)-STALE_PLOT_XUN,staleMiss:0}:(x&&x.t?{t:String(x.t),touch:typeof x.touch==='number'?x.touch:(turn??0),staleMiss:0}:null)).filter(Boolean);
}
function matchPending(ctxList){ // 与给定语境相关的待续琐事（同 matchLeads 的命中规则）
  const cvs=(ctxList||[]).map(s=>String(s||'').trim()).filter(s=>s.length>=2);
  if(!cvs.length||!state)return[];
  return (state.pending||[]).filter(x=>{
    const hay=pendText(x);if(!hay)return false;
    return cvs.some(cv=>{
      if(hay.includes(cv))return true;
      for(let i=0;i+2<=cv.length;i++)if(hay.includes(cv.slice(i,i+2)))return true;
      return false;
    });
  });
}

function matchLeads(ctxList){ // 与给定语境（人名/地名/事由）相关的在途引线：标题或备注含对方名讳/地名即命中
  const cvs=(ctxList||[]).map(s=>String(s||'').trim()).filter(s=>s.length>=2);
  if(!cvs.length||!state)return[];
  const now=xunSerial(state.time);
  const rank={主线:0,敌对:1,支线:2,引线:3,目标:4};
  return activePlots().filter(p=>{
    if(p.schemeId){const sc=(state.schemes||[]).find(x=>x&&x.id===p.schemeId);if(!sc||!sc.clueShown)return false} // 暗流未露征兆前，不借散步/拜访提前撞破
    if((p.echoMiss||0)>=ECHO_MISS_MAX)return false; // 连续呼应无回写：不再借散步拜访硬凑交集，留待旬首发酵强制处置
    if((p.echoTotal||0)>=ECHO_LEAD_TOTAL)return false; // 总呼应次数到顶：交回旬首发酵/到期裁决，散步不再永远撞同一件事
    if(p.echo===now)return false; // 本旬已呼应过：同一引线不连演两场，免得每次闲逛都撞同一件事
    const hay=`${p.title||''}｜${p.note||''}`;
    if(!hay||hay==='｜')return false;
    return cvs.some(cv=>{
      if(hay.includes(cv))return true;
      for(let i=0;i+2<=cv.length;i++)if(hay.includes(cv.slice(i,i+2)))return true; // 名讳取连续二字（如"砚秋"），防止全名对不上
      return false;
    });
  }).sort((a,b)=>(rank[a.line]??9)-(rank[b.line]??9)); // 主线/敌对排前：同场多条时先带要紧的
}
function autoSettleDuePlots(adj){ // 模型漏写台账时由前端结账；当旬改写期限算顺延，拖得太久的直接作废
  if(!adj||!state)return [];
  const now=xunSerial(state.time);
  const settled=[],expired=[];
  for(const old of [...(adj.overdue||[]),...(adj.due||[])]){
    if(String(old.id)===DESTINY_PLOT_ID)continue; // 命途不设期限、不结账，只随门槛与关目推进
    const cur=(state.plots||[]).find(p=>p.id===old.id);
    if(!cur||cur.stage!=='进行中')continue;
    const snap=adj.before&&adj.before[old.id];
    const tooLate=old.latest!=null&&now-old.latest>STALE_PLOT_XUN; // 超期过久：反复顺延也不认了
    if(!tooLate&&snap!=null&&cur.dueText&&cur.dueText!==snap)continue; // 当旬已改写期限并在 note 说明理由
    if(tooLate){ // 拖得太久：这条线不再兑现，按错过处理
      cur.stage='已作废';
      const f=cur.factionId?(state.factions||[]).find(x=>x.name===cur.factionId):null;
      if(f)factionClearStep(f);
      cur.note=(cur.note?cur.note+'；':'')+'拖得太久，时机已过（前端自动作废）';
      expired.push(cur.title||cur.id);
      continue;
    }
    if(cur.factionId){ // 派系排的账：到期无人应对，这一步就真落了地，不能无声揭过
      cur.stage='已兑现';
      const f=(state.factions||[]).find(x=>x.name===cur.factionId);
      const ch=factionLandUnopposed(f);
      factionClearStep(f);
      cur.note=(cur.note?cur.note+'；':'')+'无人应对，这一步落了地'+(ch?`（${ch}）`:'');
    }else{ // 主控这边没人办成：按错过销账，不算任务兑现，也不发积分
      cur.stage='已作废';
      cur.note=(cur.note?cur.note+'；':'')+'到期没人办，时机已过（前端销账，不计积分）';
    }
    settled.push(cur.title||cur.id);
  }
  if(settled.length)console.info('[台账] 到期未办，前端销账：'+settled.join('、')); // 没人办成的事不发积分

function autoExpireStalePlots(adj){ // 发酵条目模型连续不理会：计 staleMiss，满额自动作废/清除（机会流失）；本旬有回写则重置

const SEED_GAP=14; // 同一张牌至少隔多少旬再抽到
function seedPick(a){return Array.isArray(a)&&a.length?a[Math.floor(Math.random()*a.length)]:null}
function seedAlive(s,n){ // 已故、幽禁、冷宫、禁足、出家、逐出的人不进出事牌
  const npc=((s&&s.npcs)||{})[n]||{},rel=((s&&s.relationships)||{})[n]||{};
  const txt=String(npc.status||npc.state||'')+' '+String(rel.note||'');
  return !/已故|薨|殁|幽禁|冷宫|禁足|出家|逐出/.test(txt);
}
function seedConsorts(s){
  s=s||state||{};const out=[];
  const add=n=>{
    if(!n||out.includes(n))return;
    if(/皇帝|陛下|皇上|太后|皇后/.test(n))return;
    const npc=(s.npcs||{})[n]||{};
    if(!(rankTitleOf(n)||rankTitleOf(npc.rank||'')))return;
    if(!seedAlive(s,n))return;
    out.push(n);
  };
  for(const n in (s.relationships||{}))add(n);
  for(const n in (s.npcs||{})){const x=s.npcs[n];if(x&&(x.known||x.rank))add(n)}

}
function seedRankNum(s,n){const npc=(s&&s.npcs||{})[n]||{};return RANK_ORDER.indexOf(rankTitleOf(n)||rankTitleOf(npc.rank||''))}
function seedHigh(s){return seedConsorts(s).filter(n=>seedRankNum(s,n)>=RANK_ORDER.indexOf('嫔'))}
function seedLow(s){return seedConsorts(s).filter(n=>seedRankNum(s,n)<RANK_ORDER.indexOf('贵人'))}
function seedHostile(s){const rel=(s&&s.relationships)||{};return seedConsorts(s).filter(n=>{const r=rel[n]||{};return r.type==='仇恨'||Number(r.value)<25})}
function seedMaid(s){return seedPick(((s&&s.protagonist||{}).maids)||[])||'你宫里的掌事宫女'}
function seedFertile(s){ // 有生育可能的妃嫔：不知年龄的照算，老妇与幼女不算

}
function seedHeirs(s){return (((s&&s.heirs)||[]).filter(h=>h&&(!Number.isFinite(Number(h.age))||Number(h.age)<=12)))}

function seedMetaOf(s){

}

function storySeedPick(s){
  s=s||state;if(!s)return null;
  const meta=seedMetaOf(s),turn=Number(s.turn)||0;
  if(meta.turn===turn&&meta.pick)return meta.pick;
  const invActive=((s.plots||[]).filter(p=>p&&p.stage==='进行中'&&!p.schemeId&&!p.factionId&&p.id!==DESTINY_PLOT_ID&&INVESTIGATION_RE.test(`${p.title||''}${p.goal||''}${p.note||''}${p.next||''}`)));
  const pool=STORY_SEEDS.filter(c=>{
    if(!c)return false;
    if(invActive.length&&c.query)return false; // 查证类只许一条：手上已有查证线，不再抽查证牌
    const last=Number(meta.last[c.id]);
    if(Number.isFinite(last)&&turn-last<(c.cooldown||SEED_GAP))return false;
    try{return !c.check||!!c.check(s)}catch(e){return false}
  });
  if(!pool.length)return null;
  let short=pool.filter(c=>c.cat!==meta.lastCat); // 尽量不连着抽同一类事
  if(!short.length)short=pool;
  let total=0;for(const c of short)total+=(Number(c.weight)||1);
  let r=Math.random()*total,card=short[short.length-1];

function schemeMethodFor(s){

    ?['steal','rumor','frame','medicine']

  const usable=hasPearl?pool.filter(id=>id!=='medicine'):pool;

function schemeTick(){ // 每旬只跑一次：结旧账、起新图谋；在旬首第一个动作前调用

  const notes=[];
  if(meta.tickTurn===turn)return notes;

    if(!sc||sc.stage==='已了'||sc.done)continue;
    if(sc.stage==='发难'&&sc.firedTurn!=null&&turn>sc.firedTurn){ // 发难当旬没应对：过了这旬就真扣
      const ch=applySchemeOutcome(sc,'lose');
      notes.push({sc,changes:ch,auto:true});
    }
  }
  const grace=(ensurePlotMeta().graceTurn||0)>turn;
  const active=(state.schemes||[]).filter(sc=>sc&&sc.stage!=='已了');
  if(!grace&&active.length<SCHEME_MAX_ACTIVE&&now-(meta.lastSpawn??-99)>=SCHEME_SPAWN_GAP){
    const hosts=schemeHosts(state);
    if(hosts.length){
      const sc=spawnScheme(state,hosts[0].who);
      if(sc){meta.lastSpawn=now;console.info('[暗流] 起念：'+sc.who+'，'+sc.aim)}

}

function adjudicateSchemes(now){ // 只读裁决：给提示词添块、给前端交出本轮要发难的图谋

function schemeCostText(sc){
  const sev=sc.severity||1;
  const map={恩宠:`宠爱 -${6+4*sev}、知心 -${2+sev}`,名声:`威望 -${4+3*sev}、忌惮 +${2+sev}`,
    位份:`罚俸 ${20+15*sev} 两、威望 -${3+2*sev}${sev>=3?'、位份降一级':''}`,
    财物:`银两 -${15+12*sev}`,子嗣:`动了胎气：孕况转“不稳”、体质 -${6+3*sev}`,盟友:`身边人好感 -${8+5*sev}`};
  return map[sc.target]||'威望与银钱受损';

function _schemeRel(who,delta){
  const rs=state.relationships=state.relationships||{};
  const r=rs[who];
  if(r&&typeof r==='object'&&typeof r.value==='number'){
    const before=r.value;r.value=Math.max(-100,Math.min(100,Math.round(before+delta)));
    return `${who} ${r.value-before>0?'+':''}${Math.round((r.value-before)*10)/10}`;
  }
  if(r&&typeof r==='object'&&delta<0){ // 旧档把“长期死敌”写在 value 里：保留原形容，转为可结算的数值
    const old=String(r.value||'');
    r.value=Math.max(-100,Math.round(delta));
    if(old)r.note=(r.note?r.note+'；':'')+old;
    return `${who} ${Math.round(delta)}`;
  }
  if(typeof r==='string'&&delta<0){
    rs[who]={type:/仇/.test(r)?'仇恨':'好感',value:Math.max(-100,Math.round(delta))};
    return `${who} ${Math.round(delta)}`;
  }

}
function _schemeAttr(name,delta){
  const a=state.protagonist&&state.protagonist.attributes;if(!a)return '';
  const before=Number(a[name])||0;
  a[name]=clamp01_100(before+delta);
  const d=Math.round((a[name]-before)*10)/10;
  return d?`${name} ${d>0?'+':''}${d}`:'';
}
function _schemeSilver(delta){
  const p=state.protagonist;if(!p)return '';
  const before=Number(p.silver)||0;
  p.silver=Math.max(0,Math.round(before+delta));
  const d=p.silver-before;
  return d?`银两 ${d>0?'+':''}${d}`:'';
}
function applySchemeCost(sc,factor){ // factor=1 全损，0.5 折半；只动真实会痛的地方
  const sev=sc.severity||1,k=Math.max(0.35,Math.min(1,Number(factor)||1));
  const ch=[];
  const rel=state.relationships||{};
  if(sc.target==='恩宠'){
    const r=rel['皇帝'];
    if(r&&typeof r==='object'&&typeof r.value==='number')ch.push(_schemeRel('皇帝',-Math.round((6+4*sev)*k)));
    const e=state.emperor=state.emperor||{};
    if(typeof e.intimacy==='number')e.intimacy=Math.max(0,Math.round(e.intimacy-(2+sev)*k));
    if(!e.absence)e.absence={reason:`${sc.who}借故生事，御前不宁`,since:xunSerial(state.time)};
  }else if(sc.target==='名声'){
    ch.push(_schemeAttr('威望',-Math.round((4+3*sev)*k)));
    ch.push(_schemeAttr('忌惮',Math.round((2+sev)*k)));
  }else if(sc.target==='位份'){
    ch.push(_schemeSilver(-Math.round((20+15*sev)*k)));
    ch.push(_schemeAttr('威望',-Math.round((3+2*sev)*k)));
    if(sev>=3&&k>=1){
      const p=state.protagonist,i=rankScoreOf(p.rank);
      if(i>2){
        const old=p.rank;
        p.rank=rankWithGrade(RANK_ORDER[i-1]);
        p.salary=`每月${monthlySalaryFor(p.rank)}两，月初份例领取`;
        ch.push(`位份 ${old} → ${p.rank}`);
      }
    }
  }else if(sc.target==='财物'){
    ch.push(_schemeSilver(-Math.round((15+12*sev)*k)));
  }else if(sc.target==='子嗣'){
    const p=state.protagonist;
    const preg=state.pregnancy;
    if(preg){
      preg.health=k>=1?'不稳':'将稳';
      ch.push(`孕况 ${preg.health}`);
    }
    ch.push(_schemeAttr('体质',-Math.round((6+3*sev)*k)));

    const ally=Object.entries(rel).filter(([n,r])=>!/皇帝|太后|皇后/.test(n)&&r&&typeof r==='object'&&typeof r.value==='number'&&r.type!=='仇恨').sort((a,b)=>b[1].value-a[1].value)[0];
    if(ally)ch.push(_schemeRel(ally[0],-Math.round((8+5*sev)*k)));

function inferSchemeOutcome(p){
  const blob=((p&&Array.isArray(p.changes)?p.changes:[]).join(' '))+' '+String((p&&p.narrative)||'');
  if(/败露|挫败|反将|拿住|拆穿|化解/.test(blob))return 'win';
  if(/得手|受损|失手|丢了|被夺|罚俸|降位|蒙冤/.test(blob))return 'lose';

function resolveSchemeByModel(sc,result){ // 暗流结果由模型按玩家选择、局势与人设裁定：前端只落账，不掷骰、不代改数值

  sc.done=true;sc.stage='已了';sc.result=r;sc.resolvedTurn=state.turn;

function applySchemeOutcome(sc,result,opt){ // result: win 挫败 / draw 勉强挡下 / lose 得手 / defuse 提前化解

  const sev=sc.severity||1;let ch=[];
  if(result==='win'){

    ch.push(_schemeRel(sc.who,-(10+5*sev)));
    ch.push(_schemeAttr('威望',3+sev));

  }else if(result==='defuse'){
    ch.push(`暗流化解：你抢先按住了${sc.who}的手`);
    ch.push(_schemeRel(sc.who,-(6+3*sev)));

  sc.done=true;sc.stage='已了';sc.result=result;sc.resolvedTurn=state.turn;
  const plot=(state.plots||[]).find(p=>p.id===sc.id);
  if(plot){
    plot.stage='已兑现';
    plot.note=(plot.note?plot.note+'；':'')+`已了：${result==='lose'?'对方得手':(result==='draw'?'勉强挡下':(result==='defuse'?'提前化解':'对方布置败露'))}`;
  }
  chronicleAdd(`暗流「${sc.who}」：${sc.methodName||sc.aim||'出手'}——${schemeOutcomeText(result)}`);
  npcMemoryAdd(sc.who,`对主控使了${sc.methodName||sc.aim||'手段'}——${schemeOutcomeText(result)}`);
  try{if(sc.mainLine)mainLineOnScheme(sc,result)}catch(e){console.warn('[命途] 发难结账失败',e)}

function factionNpc(name){
  if(!state||!name)return null;
  const npcs=state.npcs||{};
  return npcs[name]||Object.values(npcs).find(n=>n&&(n.name===name||n.realName===name))||null;
}
function factionMemberRank(name,s){ // 一个人物的位份排序：认称谓也认本名；0＝未定位份
  const npcs=((s||state||{}).npcs)||{};
  const n=npcs[name]||Object.values(npcs).find(x=>x&&(x.name===name||x.realName===name));
  return n?rankScoreOf(n.rank):0;
}
function pruneFactionMembers(f,s){ // 尊卑不许倒置：帝、太后、皇后不入派系，位份高于领袖的也不算成员
  if(!f||!Array.isArray(f.members))return f;
  const npcs=((s||state||{}).npcs)||{};
  const npcOf=nm=>npcs[nm]||Object.values(npcs).find(x=>x&&(x.name===nm||x.realName===nm));
  const ls=f.leader?factionMemberRank(f.leader,s):0;
  const seen=new Set();
  const drop=nm=>{const n=npcOf(nm);if(n&&n.faction===f.name)n.faction=''}; // 清掉错挂的归属，重载时不再被反推回来
  f.members=f.members.map(x=>String(x||'').trim()).filter(nm=>{
    if(!nm||nm===f.leader||seen.has(nm))return false;
    seen.add(nm);
    if(/皇帝|皇上|太后|皇后/.test(nm)){drop(nm);return false}
    const sc=factionMemberRank(nm,s);
    if(sc>0&&ls>0&&sc>ls){drop(nm);return false}
    return true;
  }).slice(0,12);
  return f;
}
function factionRelValue(who,s){
  if(!who)return null;
  const rels=((s||state||{}).relationships)||{};
  const r=rels[who];
  if(r==null)return null;
  const v=(r&&typeof r==='object')?Number(r.value):Number(r);
  return Number.isFinite(v)?v:null;
}
function factionRelLine(f){ // 派系对你的数值化交代：只给一个关系值（首领×0.6＋相识成员均值×0.4，另有实力表）；明细不逐项列出
  if(!f||f.defunct)return '';
  const mix=factionRelMix(f);
  return mix==null?'关系未明':`关系 ${mix}`;
}
function factionRelMix(f){ // 派系对主控的关系值：首领六成、相识成员均值四成；首领无账全看成员，成员无账全看首领
  if(!f)return null;
  const lv=factionRelValue(f.leader);
  const mem=(f.members||[]).map(m=>factionRelValue(m)).filter(v=>v!=null);
  const avg=mem.length?mem.reduce((a,b)=>a+b,0)/mem.length:null;
  if(lv==null&&avg==null)return null;
  if(lv==null)return Math.round(avg);
  if(avg==null)return Math.round(lv);
  return Math.round(lv*0.6+avg*0.4);
}
function factionPowerOf(f,s){
  const npcs=(s&&s.npcs)||{};
  const lead=npcs[(f||{}).leader]||null;
  const rk=lead?rankScoreOf(lead.rank):rankScoreOf((f||{}).leader);
  const fav=lead?(Number(lead.favor)||0):0;
  const mem=((f||{}).members||[]).length;
  return clamp01_100(Math.round(12+Math.min(rk,18)*2+fav*0.2+mem*3));
}
function playerFactionOf(s){ // 主控自领的一系
  const st=s||state,me=st&&st.protagonist;
  return ((st&&st.factions)||[]).find(f=>f&&!f.defunct&&(f.player||(me&&f.leader===me.name)))||null;
}
function playerFactionFollowers(s){ // 能入主控这一系的人：位份不高于她、好感到相熟、仍在走动
  const st=s||state,me=st&&st.protagonist;if(!me)return [];
  const ls=rankScoreOf(me.rank),out=[];
  for(const id in (st.npcs||{})){
    const n=st.npcs[id];if(!n||!n.known)continue;
    if(/皇帝|皇上|太后|皇后/.test(id))continue;
    if(n.dead||/薨|病逝|殁/.test(String(n.health||n.state||'')))continue;
    if(/幽禁|冷宫|禁足|逐出|出家/.test(String(n.status||'')))continue;
    const rk=rankScoreOf(n.rank);if(!(rk>0)||rk>ls)continue;
    if((relValueOf(id)||0)>=40)out.push(id);
  }
  return out;
}
function playerFactionName(){ // 系名不能与已有的撞：先取所居宫殿，再退到姓氏
  const me=(state&&state.protagonist)||{};
  const taken=new Set(((state&&state.factions)||[]).map(f=>f&&f.name));
  const cands=[];
  const home=String((typeof Game!=='undefined'&&Game.homeLocation)?Game.homeLocation():'');
  const m=home.match(/^([^殿宫阁轩堂斋楼]{1,9}[殿宫阁轩堂斋楼])/);
  if(m)cands.push(m[1]+'一系',m[1]+'主位');
  cands.push(String(me.name||'主控').charAt(0)+'氏一系');
  for(const c of cands)if(c&&!taken.has(c))return c;
  let base=cands[0]||'本宫一系',i=2;
  while(taken.has(base+i))i++;
  return base+i;
}
function foundPlayerFaction(){ // 自立一系：位至嫔、两个相熟可入系的人、三十两与十点精力
  if(!state)return {ok:false,msg:'无存档'};
  const me=state.protagonist||{};
  if(playerFactionOf())return {ok:false,msg:'已自立一系'};
  if(rankScoreOf(me.rank)<rankScoreOf('嫔'))return {ok:false,msg:'位份未至嫔'};
  const followers=playerFactionFollowers();
  if(followers.length<2)return {ok:false,msg:'相熟可入系者不足两人'};
  if((Number(me.silver)||0)<30)return {ok:false,msg:'银两不足三十'};
  if((Number(state.energy)||0)<10)return {ok:false,msg:'精力不足'};
  me.silver=Number(me.silver)-30;

function factionLeaderCandidates(s){ // 旧档没有 factionLeaders 时，从关系账里挑有妃嫔位号的人，位高者先
  const out=[];

    if(rankScoreOf(who)<=0)continue;
    const r=s.relationships[who];
    if(r&&typeof r==='object'&&r.type==='仇恨')continue;
    if(/幽禁|冷宫|禁足|已故|薨/.test(String((r&&r.note)||'')))continue;

function ensureFactions(s){ // 旧档/新档归一：world.factionLeaders → 派系账；缺成员从人物归属反推

  const out=[];
  const add=raw=>{
    const f=sanitizeFaction(raw,s);
    if(f&&!out.some(x=>x.name===f.name))out.push(f);
  };
  if(Array.isArray(s.factions))for(const f of s.factions)add(f);

  for(const r of leaders)add(r);

    for(const n of s.world.factions)add({name:n,leader:'',stance:'观望',goal:''});
  }
  for(const f of out){
    if(!f.leader){ // 没有领袖：从本档人物的 faction 字段里找位份最高者
      const mem=Object.keys(s.npcs||{}).filter(id=>{const n=s.npcs[id];return n&&String(n.faction||'')===f.name});
      mem.sort((a,b)=>rankScoreOf((s.npcs[b]||{}).rank)-rankScoreOf((s.npcs[a]||{}).rank));

    }
    for(const id in (s.npcs||{})){
      const n=s.npcs[id];
      if(!n||String(n.faction||'')!==f.name)continue;
      const nm=n.name||id;
      if(nm===f.leader||id===f.leader)continue;
      if(!f.members.includes(nm))f.members.push(nm);
    }
    f.members=f.members.slice(0,12);
    pruneFactionMembers(f,s); // 皇后、太后、帝与位份高于领袖的人，不算成员

    const cands=factionLeaderCandidates(s).filter(w=>!out.some(f=>f.leader===w));

      const who=cands.shift();
      if(!who)continue;
      f.leader=who;
      if(!/一系$/.test(f.name))f.name=who+'一系';
      const v=factionRelValue(who,s);
      if(!f.goal)f.goal='争宠固位';
      if(f.stance==='观望')f.stance=v<=10?'强硬':(v>=50?'主和':'观望');

      const v=factionRelValue(f.leader,s);
      if(f.stance==='观望'&&v!=null)f.stance=v<=10?'强硬':(v>=50?'主和':'观望');
      if(v!=null&&f.attitude!=='敌对')f.attitude=factionAttitudeFrom(v,f.stance);

function factionHostileEvidence(f){ // 近期真对你下过几次手：以剧情账为准，不认口头态度

function factionMovePick(f){

  const use=fresh.length?fresh:pool;
  return use[Math.floor(Math.random()*use.length)];

const DESTINY_PLOT_ID='p-destiny';
const ATTR5=['外貌','才华','交际','手段','威望'];
function mlAttr(s,k){return Number((((s||{}).protagonist||{}).attributes||{})[k])||0}
function emperorRelKeyIn(s){ // 帝的关系键可能是「皇帝」，也可能是他的本名：两处都要认
  const rels=(s&&s.relationships)||{};
  return Object.keys(rels).find(k=>{
    if(/^(皇帝|皇上|陛下|圣上|圣人|天子|万岁|今上|官家|大家)$/.test(String(k)))return true;
    if(s&&s.world&&s.world.emperor&&s.world.emperor.name===k)return true;
    return (rels[k]&&typeof rels[k]==='object'&&rels[k].type==='宠爱');
  })||'皇帝';
}
function mlFavor(s){const r=((s||{}).relationships||{})[emperorRelKeyIn(s)];return Number(r&&typeof r==='object'?r.value:r)||0}
function mlIntimacy(s){return Number((((s||{}).emperor)||{}).intimacy)||0}
function mlKnown(s){const n=(s||{}).npcs||{};return Object.keys(n).filter(k=>n[k]&&n[k].known).length}
function mlRankNow(s){return rankScoreOf(((s||{}).protagonist||{}).rank)}
function mlAllyCount(s,minRank){const rels=(s||{}).relationships||{},npcs=(s||{}).npcs||{};return Object.keys(rels).filter(w=>{const r=rels[w];const v=Number(r&&typeof r==='object'?r.value:r);const rk=rankScoreOf((npcs[w]&&npcs[w].rank)||rankTitleOf(w));return Number.isFinite(v)&&v>=60&&rk>=minRank}).length}
function mlSkillCount(s,min){const sk=((s||{}).protagonist||{}).skills||{};return Object.values(sk).filter(v=>Number(v)>=min).length}
function mlSpread(s){const vs=ATTR5.map(k=>mlAttr(s,k));return Math.max.apply(null,vs)-Math.min.apply(null,vs)}
function mlHateCount(s,min){const rels=(s||{}).relationships||{};return Object.keys(rels).filter(w=>{const r=rels[w];return r&&typeof r==='object'&&r.type==='仇恨'&&Number(r.value)>=min}).length}
function mlFavCount(s,min){const rels=(s||{}).relationships||{},npcs=(s||{}).npcs||{};return Object.keys(rels).filter(w=>{if(w==='皇帝')return false;const r=rels[w];const v=Number(r&&typeof r==='object'?r.value:r);if(!(v>=min))return false;const rk=rankScoreOf((npcs[w]&&npcs[w].rank)||rankTitleOf(w));return rk>0&&rk<27}).length}
function mlSkillLowest(s){const sk=((s||{}).protagonist||{}).skills||{};const vs=Object.values(sk).map(Number).filter(Number.isFinite);return vs.length?Math.min.apply(null,vs):0}
/* 翻手为云专用的“清册”：只认前端能查的痕迹——死、废、幽、逐、出家、禁足都算不再走动；
   “自己这一系”＝仍立着、且态度为「拉拢」的派系（或领袖正是主控本人）。 */
const FAN_OUT_MARK=/薨|殁|病逝|已故|亡故|遇害|暴毙|幽禁|圈禁|冷宫|禁足|待罪|废为庶人|废黜|逐出|出宫|出家|失势/;
function mlFanOwnFactions(s){
  const me=String((((s||{}).protagonist||{}).name)||'').trim();
  return (((s||{}).factions)||[]).filter(f=>{
    if(!f||f.defunct)return false;
    return f.attitude==='盟友'||f.attitude==='拉拢'||(!!me&&String(f.leader||'')===me);
  });
}
function mlFanOwnSet(s){
  const own=new Set();
  for(const f of mlFanOwnFactions(s)){
    if(f.leader)own.add(String(f.leader));
    for(const m of (f.members||[]))own.add(String(m));
  }
  return own;
}
function mlFanRankOf(s,who){
  const n=((s||{}).npcs||{})[who]||Object.values((s||{}).npcs||{}).find(x=>x&&(x.name===who||x.realName===who));
  return rankScoreOf((n&&n.rank)||rankTitleOf(who));
}
function mlFanActiveOf(s,who,n,names){
  if(n&&(n.alive===false||n.dead))return false;
  if(n&&/已死|身死|亡故/.test(String(n.life||'')))return false;
  const rels=(s||{}).relationships||{};
  const noteOf=nm=>{const r=rels[nm];return r&&(r.note||r.state)||''};
  const txt=[n&&n.status,n&&n.state,n&&n.health,n&&n.note,
    n&&n.profile&&n.profile.note,noteOf(who),
    ...(names||[]).map(noteOf)].filter(Boolean).join(' ');
  return !FAN_OUT_MARK.test(txt);
}
function mlFanRivals(s){ // 六宫里仍在走动、且不在主控这一系的妃嫔；只算有位份的女性
  s=s||state;if(!s)return [];
  const own=mlFanOwnSet(s);
  const rels=(s||{}).relationships||{};
  const me=String((((s||{}).protagonist||{}).name)||'').trim();
  const seen=new Set(),out=[];
  const consider=(id,n)=>{
    const names=[id,n&&n.name,n&&n.realName].filter(Boolean).map(String);
    if(!names.length)return;
    if(me&&names.indexOf(me)>=0)return;
    if(names.some(x=>/皇帝|皇上|太后/.test(x)))return;
    if(names.some(x=>own.has(x)))return; // 自己这一系的人不算
    if(names.some(x=>seen.has(x)))return;
    const rk=rankScoreOf((n&&n.rank)||rankTitleOf(id));
    if(rk<=0)return; // 宫女、女官、太医等无妃嫔位号者不算
    if(!mlFanActiveOf(s,id,n,names))return; // 死人、幽禁、冷宫、禁足、废黜、逐出、出家都不算
    names.forEach(x=>seen.add(x));out.push(names[0]);
  };
  for(const id in (s.npcs||{}))consider(id,s.npcs[id]);
  for(const who in rels)consider(who,(s.npcs||{})[who]||null);
  out.sort((a,b)=>mlFanRankOf(s,b)-mlFanRankOf(s,a));
  return out;
}

这件事若要延续成一件要主控在几旬内应对的事（有得失、有后续），才以 statePatch.plots 立条：line 用“支线”或“敌对”，id 用“p-人物-事由”，goal 写清此人要什么、卡在哪、怎样算成，next 写一次见面内能办完的下一步，tie 写它挂在哪条长期线上，dueText 给 2—4 旬。一句话就能了结的试探、传话、避让，当场演完、只改关系或留一句传闻，不立账——别为每旬一动的规矩往账上堆空条目。账上已有 ${PLOT_ACTIVE_CAP} 条在途时不得再立新条，把这个动作演成一次当场的事。
arc 里若写着期限或下一步，本旬须推进或改写它（statePatch.npcArc）；连续三旬不动，视为搁置——她自己的事会自己往前拱，不能让全宫停着等你。`;

function mainLineSwitch(id){
  const ml=state&&state.mainLine;if(!ml||!MAIN_LINES[id]||id===ml.id)return false;
  if(ml.switched)return false;
  const oldName=(MAIN_LINES[ml.id]||{}).name||ml.id;
  const next=MAIN_LINES[id];
  chronicleAdd('改道：舍「'+oldName+'」，自「'+next.name+'」重走。');
  const oldSchemes=(state.schemes||[]).filter(sc=>sc&&sc.mainLine&&!sc.done);
  for(const sc of oldSchemes){sc.done=true;sc.stage='已了';sc.result='defuse';}
  startMainLine(id,true);
  state.mainLine.switched=true;
  state.mainLine.switchedAt=xunSerial(state.time);
  mainLineSync();
  queueQuest({kind:'new',id:'p-destiny-switch',title:'改道 · '+next.name+'·'+next.stages[0].title,goal:next.stages[0].goal,note:'从头走起；这一条路的积分与旧账都已清零',dueText:''});
  return true;
}
function ensureMainLine(){ // 旧档补记：没有命途按现状推一条，别让老档卡死
  if(!state||state.mainLine)return state&&state.mainLine;
  if((state.turn||0)<=0)return null; // 新档由入梦定线
  const tong=mlFavor(state)*0.6+mlIntimacy(state)*1.2;
  const bal=ATTR5.map(k=>mlAttr(state,k)).reduce((a,b)=>a+b,0)/ATTR5.length-mlSpread(state)*0.5-mlHateCount(state,50)*4;
  const fan=(mlAttr(state,'忌惮')+mlAttr(state,'手段'))*0.6+mlHateCount(state,50)*5; // 手段狠、仇家多、宫里怕她：才推到翻手为云
  const id=(fan>tong&&fan>bal)?'fan':(tong>=bal?'tong':'an');
  startMainLine(id,true);
  chronicleAdd('旧档补记命途：按你眼下的处境与手段，系统替你认定——「'+MAIN_LINES[id].name+'」。');
  return state.mainLine;
}

function queueQuest(q){
  if(!q)return false;
  Game._questQueue=Array.isArray(Game._questQueue)?Game._questQueue:[];
  if(Game._questNotice&&Game._questNotice.kind===q.kind&&Game._questNotice.id===q.id)return false;
  if(Game._questQueue.some(x=>x.kind===q.kind&&x.id===q.id))return false;
  Game._questQueue.push(q);return true;
}
function markQuestNotice(q){
  if(!q)return;
  const meta=ensurePlotMeta();
  if(q.kind==='new'){
    meta.seenMain=Array.isArray(meta.seenMain)?meta.seenMain:[];
    if(!meta.seenMain.includes(q.id))meta.seenMain.push(q.id);
  }else if(q.kind==='done'){
    meta.ackedMain=Array.isArray(meta.ackedMain)?meta.ackedMain:[];
    if(!meta.ackedMain.includes(q.id))meta.ackedMain.push(q.id);
  }
}
function flushQuestQueue(){ // 只在住处空闲时弹；对话、面板、其他弹窗期间先排队
  if(!state||Game._questOpen)return false;
  if(phase!=='FOCUS_SELECT')return false;
  const blocked=['actModal','incidentModal','restModal','tutorialModal','collapseModal','dawnModal','questModal'].some(id=>{const e=document.getElementById(id);return !!(e&&e.classList.contains('on'))});
  if(blocked)return false;
  if(document.getElementById('chatview').classList.contains('on')||document.getElementById('mapview').classList.contains('on'))return false;
  if(document.getElementById('sheet').classList.contains('on'))return false;
  Game._questQueue=Array.isArray(Game._questQueue)?Game._questQueue:[];
  const q=Game._questQueue.shift();if(!q)return false;
  UI.showQuestNotice(q);return true;
}
function checkMainQuestNotices(){ // 主线发布/了结：弹窗 + 大事记；只报一次
  if(!state||!Array.isArray(state.plots))return;
  const meta=ensurePlotMeta();
  const mains=state.plots.filter(p=>p.line==='主线');
  if(!Array.isArray(meta.seenMain))meta.seenMain=mains.filter(p=>p.stage==='进行中').map(p=>p.id);
  if(!Array.isArray(meta.ackedMain))meta.ackedMain=mains.filter(p=>p.stage!=='进行中').map(p=>p.id);
  for(const p of mains){
    if(p.id===DESTINY_PLOT_ID)continue; // 命途的发布/了结与阶进弹窗由命途自己发，不走这条通用通道
    if(p.stage==='进行中'&&!meta.seenMain.includes(p.id)){
      queueQuest({kind:'new',id:p.id,title:p.title,note:p.note,goal:p.goal,dueText:p.dueText});
    }else if(p.stage!=='进行中'&&!meta.ackedMain.includes(p.id)){
      queueQuest({kind:'done',id:p.id,title:p.title,note:p.note,goal:p.goal,dueText:p.dueText,stage:p.stage});
    }
  }
  flushQuestQueue();
}
function xunMainQuestCheck(){ // 旬首主线判定（每旬开头一次）：发布/了结弹窗＋逾期提醒
  if(!state||!Array.isArray(state.plots))return;
  try{ensureMainLine()}catch(e){console.warn('[命途] 旧档补记失败',e)}
  checkMainQuestNotices();
  const now=xunSerial(state.time);
  const main=state.plots.find(p=>p.line==='主线'&&p.stage==='进行中'&&p.id!==DESTINY_PLOT_ID)||null;
  if(main&&main.latest!=null&&now>main.latest)toast(`【宫斗系统】警示：主线任务「${main.title}」已逾期（期限：${main.dueText||'已过'}）。本旬务必了结；再搁置将按发酵处置。`,5200);
}
/* ============================================================ 恩宠账（帝感情线双轨）
   明面恩宠=relationships.皇帝.value（宠爱，面板可见）；内里知心=emperor.intimacy（不显示数字，只显阶段）。
   代码管节奏：相处逾期注入裁决；模型管演绎：写戏并经 statePatch["emperor.*"] 回写。 */
function emperorStage(v){v=Number(v)||0;return v>=90?'牵挂':v>=70?'亲近':v>=50?'信任':v>=30?'熟悉':v>=10?'留意':'生疏'}
const EMPEROR_MEM_TYPES=['共历','约定','信物','分歧','误会','和解'];
function sanitizeEmperorMemory(m){ // 共同经历条目归一（xun 缺省由前端补当前旬）
  if(!m||typeof m!=='object')return null;
  const text=String(m.text||'').slice(0,90);if(!text)return null;
  return {xun:String(m.xun||'').slice(0,24),text,type:EMPEROR_MEM_TYPES.includes(m.type)?m.type:'共历',open:!!m.open};
}
function trimEmperorMemories(e){if(Array.isArray(e.memories)&&e.memories.length>30)e.memories=e.memories.slice(-30)}
function applyEmperorPatch(field,v){ // 回写 emperor.*：contact 由前端记旬（模型不知道旬号），自动入共同经历并销缺席
  const e=state.emperor=state.emperor||{intimacy:0,lastContact:xunSerial(state.time),absence:null,hisState:'',memories:[]};
  const majors=[];
  if(field==='intimacy'&&typeof v==='number'){e.intimacy=Math.max(0,Math.min(100,Math.round(v)));majors.push('知心变化')}
  else if(field==='contact'&&typeof v==='string'&&v.trim()){e.lastContact=xunSerial(state.time);if(e.absence)e.absence=null;
    const m=sanitizeEmperorMemory({xun:fmtTime(),text:v,type:'共历'});
    if(m&&!e.memories.some(x=>x.text===m.text)){e.memories.push(m);trimEmperorMemories(e)}
    majors.push('帝相处');
    try{rankBreakRoll('御前那日他心情极好')}catch(err){console.warn('[晋位] 破格掷骰失败',err)}} // 相处得好也可能开一道破格口子
  else if(field==='memories'){for(const raw of (Array.isArray(v)?v:[v])){const m=sanitizeEmperorMemory(raw);if(m){if(!m.xun)m.xun=fmtTime();const ex=e.memories.find(x=>x.text===m.text);if(ex)Object.assign(ex,m);else e.memories.push(m)}}trimEmperorMemories(e)} // 同文本视为更新（可关闭 open/改类型），不重复堆叠
  else if(field==='absence'){e.absence=(v&&typeof v==='object')?{reason:String(v.reason||v.note||'').slice(0,60),since:xunSerial(state.time)}:null;if(e.absence&&!e.absence.reason)e.absence=null}
  else if(field==='hisState'&&typeof v==='string'){e.hisState=v.slice(0,90)}
  return majors;
}
function migrateEmperor(s){ // 旧档补恩宠账：知心按宠爱保守初值，上次接触自本旬起算（不追溯历史）；已有 emperor 块只补旗标，不动数据
  if(s.emperorV1)return;
  if(!s.emperor||typeof s.emperor!=='object'){
    const favor=Number((s.relationships&&s.relationships['皇帝']||{}).value)||0;
    s.emperor={intimacy:favor>=70?50:favor>=50?35:favor>=30?20:8,lastContact:xunSerial(s.time),absence:null,hisState:'',memories:[]};
  }
  s.emperorV1=true;
}
function adjudicateEmperor(now,ctx){ // 恩宠账：相处节奏硬约束＋注意力经济软约束；与剧情账并行，剧情额度紧张时降格"并账"
  const e=state.emperor;if(!e)return{lines:[],due:false};
  const openVows=(e.memories||[]).filter(m=>m.type==='约定'&&m.open&&m.xun&&m.xun!==fmtTime()); // 许在往旬、至今未了的约定（如"定戌时来"）：不许无声放过
  const favor=Number((state.relationships&&state.relationships['皇帝']||{}).value)||0;
  if(favor<40&&!openVows.length)return{lines:[],due:false}; // 恩宠未至：相处随缘，不查岗（但未了约定仍要交代）
  const win=favor>=60?2:4; // 60—74与75以上：每1—2旬；40—59：每2—4旬
  const gap=now-(typeof e.lastContact==='number'?e.lastContact:now);
  const stage=emperorStage(e.intimacy);
  const busy=ctx&&(ctx.due.length||ctx.overdue.length||ctx.stale.length||ctx.pendStale.length||ctx.hit||ctx.mainPub||ctx.skipDice||ctx.playerAct);
  const lines=[`【恩宠账】宠爱 ${favor}（每 ${win} 旬须至少一次有内容相处，现距上次 ${Math.max(0,gap)} 旬）；知心阶段「${stage}」${e.hisState?`；他近来：${e.hisState}`:''}。世界后台给帝安排一处注意力落点（这旬他看了谁、宿在何处、为何事烦），主控可感知的部分写入 haremNews；本旬与主控有相处则不必单写。`];
  let due=false;
  if(openVows.length){
    due=!busy;
    lines.push(`${due?'【恩宠账·未了约定】':'【恩宠账·未了约定·并账】'}${openVows.map(m=>`「${m.text}」`).join('；')}——许自往旬，至今未兑现：本旬必须给出交代。①依约兑现：补演这场相处（他来了/改期再约），写 statePatch["emperor.contact"] 并把该条约定 open 改 false；②他失约：演绎主控空等与被失约的分寸，给出世界内原因（前朝急务、他人阻挠、他改了主意），可另立"分歧/误会"条目，原约定作废或重订，同样回写；③实为远期之约：改写该条文本写明新的兑现时点。不得无声略过。`);
  }
  if(favor<40)return{lines,due}; // 恩宠未至：只催未了约定，不查相处节奏
  if(e.absence&&e.absence.reason){
    lines.push(`【恩宠账·搁置】不召见原因「${e.absence.reason}」已挂 ${Math.max(0,now-(typeof e.absence.since==='number'?e.absence.since:now))} 旬：本旬须推进——让主控可感知地接近缘由、化解误会，或任其发酵成剧情线；原因消除当旬恢复相处并写 statePatch["emperor.contact"]，不得无声揭过。`);
  }else if(gap>win){
    due=!busy;
    lines.push(`${due?'【恩宠账·到期】':'【恩宠账·并账】'}已 ${gap} 旬未见有内容相处（上限 ${win} 旬）。${due?'本旬必须安排一场有内容的帝相处戏（召见、夜访、共膳、游园、书信往还皆可，须有具体内容，不得走赏赐过场），scene 或 narrative 呈现':'本旬剧情额度另有安排：相处戏并入本轮剧情（作该场戏的一部分或其后场），或至少在 narrative 写一段真实的相处或挂念'}，并经 statePatch["emperor.contact"] 记一句注记。若确不宜相见，给出主控可感知的世界内原因，写 statePatch["emperor.absence"]={reason,note}，并使之成为日后可追查消除的线头。`);
  }
  return{lines,due};
}

const CHAMBER_RANKS=/皇后|皇贵妃|贵妃|贤妃|良妃|淑妃|德妃|妃|贵嫔|嫔|昭仪|昭容|昭媛|修仪|修容|修媛|充仪|充容|充媛|贵人|美人|才人|宝林|常在|答应|选侍|更衣|采女|官女子/;
const CHAMBER_BLOCK=/皇嗣|皇子|皇女|公主|太后|太妃|太嫔|宫女|太监|太医|侍卫|掌事|姑姑|女官|女史|乳母/;
function isConsortNpc(id,n){
  if(!n||!n.rank)return false;
  const s=String(id||'')+' '+String(n.rank||'');
  if(CHAMBER_BLOCK.test(s))return false;
  return CHAMBER_RANKS.test(String(n.rank||''));
}
function favorOf(who){
  const r=(state.relationships||{})[who];
  const v=r&&typeof r==='object'?r.value:r;
  const n=Number(v);
  return Number.isFinite(n)?n:0;
}
function nightCharmActive(){ // 子嗣缘符：佩戴中才有效（长期之物 equipped!==false）
  return (state.inventory||[]).some(it=>it&&it.name==='子嗣缘符'&&it.durable&&it.equipped!==false&&(Number(it.count)||0)>0);
}
function chamberFavorKey(){return Object.keys(state.relationships||{}).find(k=>UI.isEmperorId(k))||'皇帝'}
function chamberFavor(){return favorOf(chamberFavorKey())}
function chamberRankTier(rank){
  const r=String(rank||'');
  if(/皇后/.test(r))return 2.2;
  if(/皇贵妃|贵妃|贤妃|良妃|淑妃|德妃|妃/.test(r))return 1.7;
  if(/贵嫔|嫔|昭仪|昭容|昭媛|修仪|修容|修媛|充仪|充容|充媛/.test(r))return 1.35;
  if(/贵人|美人|才人/.test(r))return 1.1;
  return 1;
}
function nightNpcWeight(id,n){
  let w=chamberRankTier(n.rank);
  const v=favorOf(id);if(v>0)w+=Math.min(2.2,v/45);
  if(v<0)w*=0.6;
  const tr=String((state.world&&state.world.emperor&&state.world.emperor.traits)||'');
  if(/勤政|励精|冷|寡情|端方|清冷/.test(tr))w*=0.9;
  if(/荒|昏|好色|多情|风流/.test(tr))w*=1.25;
  const last=(state.bedchamber&&state.bedchamber.log||[]).slice().reverse().find(x=>x&&x.who===id);
  if(last){const gap=(state.turn||0)-(Number(last.turn)||0);if(gap<=1)w*=0.35;else if(gap<=2)w*=0.6}
  return Math.max(0.05,w);
}
function nightAloneWeight(){
  let w=2.4;
  const tr=String((state.world&&state.world.emperor&&state.world.emperor.traits)||'');
  if(/勤政|励精|端方|清冷/.test(tr))w+=0.7;
  if(/荒|昏|好色|多情|风流/.test(tr))w*=0.7;
  if((Number(state.world&&state.world.emperor&&state.world.emperor.age)||0)>=28)w+=0.2;
  return w;
}
function nightMeWeight(intent){
  const p=state.protagonist||{},at=p.attributes||{};
  const favor=Math.max(0,chamberFavor());
  let w=0.35+favor/45;
  if((state.turn||0)<12)w+=0.8; // 新入宫：帝对新人有几分好奇
  const looks=Number(at['外貌'])||50,social=Number(at['交际'])||50;
  w*=0.85+looks/200;
  w*=0.9+social/250;
  w*=chamberRankTier(p.rank);
  if(favor>=75)w*=1.15;
  if(intent&&intent.mode==='strive')w*=1.5;
  if(intent&&intent.mode==='strive'&&intent.paid)w*=1.12;
  return Math.max(0,w);
}
function nightSummonAllowed(){
  if(state.pregnancy)return false;
  if((Number(state.postpartumUntil)||0)>(state.turn||0))return false;
  const ti=Number((state.protagonist&&state.protagonist.attributes||{})['体质'])||0;
  return ti>=30;
}
function pickNightPartner(intent){
  const entries=[];
  if(nightSummonAllowed()&&(!intent||intent.mode!=='avoid')){
    const w=nightMeWeight(intent);if(w>0)entries.push({kind:'me',w});
  }
  for(const id in (state.npcs||{})){
    const n=state.npcs[id];
    if(!isConsortNpc(id,n))continue;
    if(state.protagonist&&id===state.protagonist.name)continue;
    entries.push({kind:'npc',id,w:nightNpcWeight(id,n)});
  }
  const alone=nightAloneWeight();
  entries.push({kind:'alone',w:alone});
  const total=entries.reduce((a,x)=>a+x.w,0);
  let r=Math.random()*total;
  for(const x of entries){r-=x.w;if(r<=0)return x}
  return entries[entries.length-1];
}
function chamberRecord(rec){
  const b=state.bedchamber=state.bedchamber||{log:[],last:null,seq:0};
  b.seq=(Number(b.seq)||0)+1;rec.seq=b.seq;
  b.last=rec;b.log=Array.isArray(b.log)?b.log:[];
  b.log.push(rec);if(b.log.length>30)b.log=b.log.slice(-30);
  return rec;
}
function nightRecordText(rec){
  if(!rec)return '尚无记档';

  if(rec.kind==='npc')return `帝召${rec.who}侍寝`;

}
function nightGossip(id,n){

function conceptionChance(){
  const p=state.protagonist||{},at=p.attributes||{};
  let c=0.10+(Number(at['孕率'])||50)*0.0035;
  if(nightCharmActive())c+=0.14;
  if((Number(p.age)||18)<=20)c+=0.04;
  const ti=Number(at['体质'])||50;
  if(ti<50)c-=0.08;if(ti<35)c-=0.07;
  if(chamberFavor()>=70)c+=0.03;
  return Math.max(0.02,Math.min(0.75,c));
}
function startPregnancy(){
  const doctor=((state.world&&state.world.keyServants)||[]).find(x=>/太医|林守拙|院判/.test(String(x)))||'太医';
  state.pregnancy={startTurn:state.turn,dueTurn:(state.turn||0)+19,month:1,health:'平稳',doctor};

function losePregnancy(report){

  state.chronicle.push({time:fmtTime(),text});

function advancePregnancy(report){
  const p=state.pregnancy;if(!p)return;
  const turn=Number(state.turn)||0;
  const month=Math.min(10,Math.floor((turn-(Number(p.startTurn)||turn))/2)+1);
  p.month=month;
  if(turn>=Number(p.dueTurn)){birthChild(report);return}
  const ti=Number((state.protagonist.attributes||{})['体质'])||50;
  let risk=0;
  if(ti<30)risk=0.18;else if(ti<40)risk=0.06;else if(ti<50)risk=0.02;
  if(Math.random()<risk){losePregnancy(report);return}
  p.health=ti<45?'偏弱':month>=7?'沉重':'平稳';
  report.pregnancy={month,health:p.health};

function heirSurname(){

}

function heirAgeOf(h,turn){

function refreshHeirAges(s){

function heirSummary(s){

function resolveNight(prevTurn){
  const report={turn:state.turn,time:fmtTime(),kind:'alone',who:'',rank:'',intent:'wait'};

  if(!Array.isArray(state.bedchamber.log))state.bedchamber.log=[];

  if(state.pregnancy)advancePregnancy(report);
  refreshHeirAges(state);
  const intent=(state.xunIntent&&state.xunIntent.turn===prevTurn)?state.xunIntent:{mode:'wait'};
  report.intent=intent.mode;
  const e=state.emperor||(state.emperor={});
  if(e.absence&&e.absence.reason){
    report.kind='none';report.reason=String(e.absence.reason).slice(0,60);
    chamberRecord({turn:state.turn,time:fmtTime(),kind:'none',who:'',note:'帝未召人：'+report.reason,intent:intent.mode,paid:!!intent.paid});

    if(rel&&typeof rel==='object'){
      const add=1+(Math.random()<0.35?1:0);
      rel.value=Math.min(100,(Number(rel.value)||0)+add);

    }
    e.lastContact=xunSerial(state.time);

    e.memories=Array.isArray(e.memories)?e.memories:[];

    trimEmperorMemories(e);
    report.where=Math.random()<0.5?'养心殿':((state.world&&state.world.residence)||state.location||'你的住处');
    chamberRecord({turn:state.turn,time:fmtTime(),kind:'me',who:state.protagonist.name,note:'帝召主控侍寝',favor:report.favor||0,intent:intent.mode,paid:!!intent.paid});
    try{if(rankBreakRoll('侍寝那夜他心情极好'))report.rankBreak=true}catch(err){console.warn('[晋位] 破格掷骰失败',err)} // 帝意偶动：资已足时偶开一道破格口子
    if(!state.pregnancy&&Math.random()<conceptionChance()){startPregnancy();report.conceived=true}
  }else if(pick.kind==='npc'){
    const id=pick.id,n=state.npcs[id]||{};

    report.gossip=nightGossip(id,n);

  }else{
    report.kind='alone';

  }

      rel.value=Math.max(0,(Number(rel.value)||0)-1);report.avoided=true;
    }
  }
  state.xunIntent=null;
  longBuffAfterGains(buffBefore);
  return report;
}

function dawnReportHtml(r){
  const rows=[];
  let head='';
  if(r.kind==='me'){
    head=`本旬末，敬事房的记档上添了你的名字。帝召你侍寝${r.where?`，在${r.where}`:''}。`;
    rows.push('事毕你回到住处，宫人看你的眼神比往日多了几分小心。');
    if(r.favor)rows.push(`恩宠 +${r.favor}。`);
    if(r.conceived)rows.push('敬事房照例记了档；至于有没有喜信，还要过些日子才知。');
  }else if(r.kind==='npc'){
    head=`本旬末，帝翻了「${r.who}」的牌子。`;
    if(r.intent==='strive')rows.push('你的牌子也递上去了，到底落到了旁人手里。');
    if(r.intent==='avoid')rows.push('你称病避了牌子；帝便召了旁人。');
    if(r.gossip)rows.push('转日六宫都在传：'+r.gossip);
  }else if(r.kind==='none'){
    head=`帝近来${r.reason}，本旬末未召任何人。`;
    if(r.intent==='strive')rows.push('你的牌子递上去了，帝未召人。');
    if(r.intent==='avoid')rows.push('你称病避了牌子。');
  }else{
    head='本旬末，帝宿在御书房，未召任何人。';
    if(r.intent==='strive')rows.push('你的牌子递上去了，帝没有翻。');
    if(r.intent==='avoid')rows.push('你称病避了牌子，帝也未召旁人。');
  }
  if(r.pregnancy)rows.push(`太医请脉：已孕${r.pregnancy.month}月，胎象${r.pregnancy.health}。`);
  if(r.loss)rows.push(`<b style="color:var(--cinnabar)">小月</b>　${esc(r.loss.text)}`);
  if(r.birth)rows.push(`<b style="color:var(--cinnabar)">生产</b>　你诞下${r.birth.gender}「${esc(r.birth.name)}」，${esc(r.birth.health)}${r.birth.weak?'，太医嘱咐仔细将养':''}。`);
  if(r.kind==='me'&&!r.pregnancy&&!r.birth&&!r.conceived)rows.push('敬事房问要不要留档；你让人记下了。');
  const recent=(state.bedchamber&&state.bedchamber.log||[]).slice(-5,-1).reverse();
  const recentHtml=recent.length?`<div class="sheet-note" style="margin-top:12px">承宠录 · 近旬</div>`+recent.map(x=>`<div class="itemrow"><span>第${xunNoOf(x.turn)}旬</span><span class="cnt">${esc(nightRecordText(x))}</span></div>`).join(''):'';
  return `<div style="font-size:14px;line-height:1.9;color:var(--ink)">${esc(head)}</div>`
    +(rows.length?`<div style="font-size:13px;line-height:1.85;color:var(--ink-soft);margin-top:8px">${rows.map(x=>`<div>${x}</div>`).join('')}</div>`:'')
    +recentHtml
    +`<div class="sheet-note" style="margin-top:12px">${r.kind==='me'?'要入帐，点下面「入帐相见」。':'帝召幸他人，记入承宠录。'}</div>`;
}

/* 外貌/忌惮分档：提示词、剧情对话与面板共用，数值以存档为准 */
function presenceLook(v){
  v=Number(v);
  if(!Number.isFinite(v))return {label:'未知',short:'',cue:''};
  if(v>=90)return {label:'绝色',short:'见者失神',cue:'见者目光追随、易失神；有他人在场时每旬至多两处「另眼相看」小勾子，代价也更明显（议论、防备、借机近身）。'};
  if(v>=85)return {label:'殊色',short:'席间目光追随',cue:'席间目光会追随你；有他人在场时每旬可出现一至两处「另眼相看」小勾子，须写成细节，可招妒。'};
  if(v>=70)return {label:'出众',short:'旁人易多看一眼',cue:'初见者易多看一眼、语气放软；有他人在场时可出现 1—2 处「另眼相看」的小勾子（多答半句、让话头、请摹样子等），只是机会，不改数值。'};
  if(v>=50)return {label:'清秀',short:'顺眼不夺目',cue:'清秀顺眼，不额外给「另眼相看」；旁人态度由位份、交情与忌惮决定。'};
  return {label:'寻常',short:'不惹眼',cue:'不被多看；旁人态度只看位份、交情与忌惮。'};
}
function presenceFear(v){
  v=Number(v);
  if(!Number.isFinite(v))return {label:'未知',short:'',cue:''};
  if(v>=85)return {label:'敬畏',short:'敬畏而疏远',cue:'连高位者也要掂量，下人不敢多话；但易被孤立、被表面恭敬地架空。'};
  if(v>=70)return {label:'慎言',short:'不敢当面冒犯',cue:'不敢当面冒犯，回话斟酌、背后更周密；相熟信任者不受影响。'};
  if(v>=50)return {label:'有分寸',short:'不熟者留三分',cue:'不熟者留三分、先观色再表态；敌对者不当面轻慢，背后仍会试探。'};
  if(v>=30)return {label:'寻常',short:'按交情待你',cue:'多按位份与交情说话。'};
  return {label:'无威',short:'易被轻慢',cue:'易被轻慢、试探、推诿；下人回话随意，敌对者敢当面试你。'};
}
function presencePair(look,fear){
  const l=Number(look),f=Number(fear);
  if(!Number.isFinite(l)||!Number.isFinite(f))return null;
  if(l>=70&&f>=60)return {label:'艳而有锋',cue:'旁人既想看又不敢多看，连搭话都先掂量分寸。'};
  if(l>=70&&f<40)return {label:'美而无威',cue:'容易被当摆设、被轻慢调笑，也容易被人低估。'};
  if(l<50&&f>=70)return {label:'威重于色',cue:'敬畏多于亲近，旁人先看你的规矩与手段。'};
  if(l<50&&f<40)return {label:'存在感弱',cue:'容易被漏掉、被插话，得自己把话递出去。'};
  return null;
}
function presenceOf(p){
  const at=(p&&p.attributes)||{};
  const lv=Number(at['外貌']),fv=Number(at['忌惮']);
  return {lookValue:Number.isFinite(lv)?lv:null,fearValue:Number.isFinite(fv)?fv:null,look:presenceLook(lv),fear:presenceFear(fv),pair:presencePair(lv,fv)};
}
function presenceCue(s){ // 剧情对话【本场信息】用的一句话
  const p=presenceOf(s&&s.protagonist);
  if(p.lookValue==null&&p.fearValue==null)return '';
  const bits=[];
  if(p.lookValue!=null)bits.push(`外貌 ${p.lookValue}·${p.look.label}（${p.look.short}）`);
  if(p.fearValue!=null)bits.push(`忌惮 ${p.fearValue}·${p.fear.label}（${p.fear.short}）`);
  return bits.join('｜')+(p.pair?`；${p.pair.label}：${p.pair.cue}`:'');
}
function presenceBrief(s){ // 每旬系统提示里的档位硬约束
  if(disguiseActive(s))return ''; // 易容期间言行按被冒名者：另由 disguiseBrief 给，别让主控的数值抢先
  const p=presenceOf(s&&s.protagonist);
  if(p.lookValue==null&&p.fearValue==null)return '';
  const lines=['【本旬言行态度（前端按当前数值生成，硬约束）】'];
  const head=[];
  if(p.lookValue!=null)head.push(`外貌 ${p.lookValue}（${p.look.label}）`);
  if(p.fearValue!=null)head.push(`忌惮 ${p.fearValue}（${p.fear.label}）`);
  lines.push('主控 '+head.join('｜'));
  if(p.lookValue!=null)lines.push(`- 外貌：${p.look.cue}`);
  if(p.fearValue!=null)lines.push(`- 忌惮（${p.fear.label}）：${p.fear.cue}`);
  if(p.pair)lines.push(`- 相合：${p.pair.label}——${p.pair.cue}`);
  lines.push('- 只落实为 NPC 的措辞、眼神、距离、回话快慢与下人殷勤程度；无人在场时不必硬加小勾子，也不为凑勾子让无关 NPC 登场；不报数值与档位，不据此改任何数值、好感或宠爱。');
  return lines.join('\n');
}
function presenceNote(p){ // 面板「属性」里的一行说明
  const x=presenceOf(p);
  if(x.lookValue==null&&x.fearValue==null)return '';
  const bits=[];
  if(x.lookValue!=null)bits.push(`外貌 ${x.lookValue}·${x.look.label}（${x.look.short}）`);
  if(x.fearValue!=null)bits.push(`忌惮 ${x.fearValue}·${x.fear.label}（${x.fear.short}）`);
  return bits.join('｜')+(x.pair?`｜${x.pair.label}`:'');
}

function monthlySalaryFor(rank){ // 位份 → 每月俸银；先认品级，缺品级时按位号兜底
  const s=String(rank||'');
  const m=s.match(/([正从])([一二三四五六七八九])品/);
  if(m&&SALARY_BY_GRADE[m[1]+m[2]+'品']!=null)return SALARY_BY_GRADE[m[1]+m[2]+'品'];

/* 月份例：每月在住处领一次——例银＋手作料（总值约为例银三倍）＋厨下食料。
   月俸仍按旬自动入账，份例另算；只在前端结算，不进剧情额度。 */
function allowanceMonthKey(){const t=(state&&state.time)||{};return `${Number(t.year)||0}-${Number(t.month)||0}`}
function allowanceDue(){ // 本月还没领
  if(!state||!state.protagonist)return false;
  return !(state.allowance&&state.allowance.month===allowanceMonthKey());
}
function allowanceSilverFor(rank){ // 例银＝当月月俸：月俸已并入月份例，不另发
  return monthlySalaryFor(rank);
}
function allowanceMatUnit(name){ // 一份料的折价：与手作面板同口径
  const meta=CRAFT_MATERIALS[name];if(!meta)return 2;
  const tier=Math.max(1,Math.min(4,Math.round(Number(meta.tier)||1)));
  return CRAFT_MAT_VALUE[tier]||2;
}
function rollAllowanceMaterials(budget){ // 随机手作料，总值贴近 budget（约三倍例银）
  const pool=wlShuffle(CRAFT_RESTOCK_POOL.slice()).slice(0,4+Math.floor(Math.random()*2));
  const picked=pool.map(name=>({name,count:0}));
  let left=Math.max(2,Math.round(Number(budget)||0));
  for(const it of picked){const v=allowanceMatUnit(it.name);if(left>=v){it.count=1;left-=v}}
  for(let guard=0;left>=2&&guard<300;guard++){
    const cands=picked.filter(it=>it.count>0&&it.count<99&&allowanceMatUnit(it.name)<=left);
    if(!cands.length)break;
    const it=cands[Math.floor(Math.random()*cands.length)];
    it.count+=1;left-=allowanceMatUnit(it.name);
  }
  return picked.filter(it=>it.count>0);
}
function rollAllowanceFood(){ // 厨下食料：按位份 3—5 种，每种 1—2 份
  const names=Object.keys(KITCHEN_MATERIALS);
  const n=3+(monthlySalaryFor(state&&state.protagonist&&state.protagonist.rank)>=20?1:0)+(monthlySalaryFor(state&&state.protagonist&&state.protagonist.rank)>=60?1:0);
  return wlShuffle(names).slice(0,n).map(name=>({name,count:1+(Math.random()<0.4?1:0)}));
}

function isConsortWho(id,n){ // 此人是否妃嫔（太后与宫人除外；中宫另由 consortVisitIds 过滤）
  const w=String(id||'');const rank=String((n&&n.rank)||'');

  if(/后|妃|嫔|昭仪|昭容|昭媛|修仪|修容|修媛|充仪|充容|充媛|贵人|才人|美人|宝林|常在|答应|选侍|更衣|采女/.test(rank))return true;
  return /皇后|贵妃|昭仪|昭容|昭媛|修仪|修容|修媛|充仪|充容|充媛|妃|嫔|贵人|才人|美人|宝林|常在|答应|选侍|更衣|采女/.test(w);
}

function consortVisitIds(){ // 可主动登门或受邀的妃嫔：已认识、未结怨、未幽禁病重

  const ids=new Set();const npcs=(state&&state.npcs)||{};
  const dg=disguiseActive(state); // 易容中：被她本人登门/受邀会当场穿帮，先把这张脸从名单里摘掉
  for(const id in npcs){const n=npcs[id]||{};if(n.known&&isConsortWho(id,n))ids.add(id)}
  for(const id in ((state&&state.relationships)||{})){if(isConsortWho(id,npcs[id]||{}))ids.add(id)}
  return [...ids].filter(id=>{
    if(dg&&(id===dg.who||id===dg.name))return false;
    if(/皇后|中宫/.test(id))return false; // 中宫不轻易移驾/赴低位之约，另走请安与传召
    const n=npcs[id]||{};
    if(n.alive===false||n.dead)return false;
    const rel=(state.relationships||{})[id];const note=typeof rel==='object'?String(rel.note||''):'';
    if(/幽禁|冷宫|禁足|病重|卧床|薨|殁/.test(String(n.status||'')+String(n.rank||'')+String(n.note||'')+note))return false;
    return relTier(id).key!=='feud';
  });
}
function consortVisitReason(id){ // 来访由头：交情不到相熟的人，必须有一件共同的事、一个共同的敌人，或有求于你
  const n=(state.npcs||{})[id]||{};
  const name=String(n.name||id);
  const tier=relTier(id);
  if(tier.key==='feud')return null;
  const goal=String(((state.npcGoalCards||{})[id])||n.arc||'');
  const enemies=Object.keys((state&&state.relationships)||{}).filter(k=>{
    if(k===id)return false;
    const r=state.relationships[k];const v=(r&&typeof r==='object')?Number(r.value):Number(r);
    return (r&&typeof r==='object'&&r.type==='仇恨')||v<=-20;
  });
  const shared=enemies.find(en=>goal&&goal.includes(en));
  if(shared)return {kind:'enemy',text:`她与${shared}不睦——敌人的敌人，正可彼此借力`,weight:1.25};
  const leads=matchLeads([id,name]);
  const pends=matchPending([id,name]);
  if(leads.length||pends.length)return {kind:'stake',text:`与你同在一件事上：${leads.length?leads[0].title:pendText(pends[0])}`,weight:1.2};
  if(tier.key==='close'||tier.key==='ally')return {kind:'friend',text:'交情到了，来看看你',weight:1};
  if(tier.key==='familiar')return {kind:'familiar',text:'相熟了，顺路来坐坐',weight:0.85};
  if(goal&&state.protagonist&&(String(state.protagonist.name||'')&&goal.includes(state.protagonist.name)))return {kind:'business',text:'她有事要与你商量',weight:0.9};
  if(tier.key==='new')return {kind:'errand',text:'新近照过面，提了些时令东西来认认门',weight:0.55}; // 初识只送东西、闲话，不托事

function pickConsortVisitor(){ // 在可来的妃嫔里按交情、由头与位份差择一人：高位不登低位者的门，低位更爱来试探结交
  const pool=[];
  for(const id of consortVisitIds()){
    const r=consortVisitReason(id);if(!r)continue;
    const gap=rankGapToMe(id);
    if(gap>=5&&r.kind!=='enemy'&&r.kind!=='stake')continue; // 高五级以上不主动来：低位新人何劳她移驾（同仇敌忾/同在一件事上除外）
    const bond=Math.max(0,Number(relValueOf(id))||0);
    let w=r.weight*(0.4+bond/140);
    if(gap>=3)w*=0.35; // 高三四级：来得少，多是居高施恩的姿态
    else if(gap<=0)w*=1.3; // 平位与低位：更爱登门试探、结交、投靠
    pool.push({id,kind:'consort',reason:r.text,reasonKind:r.kind,w});
  }
  if(!pool.length)return null;
  const total=pool.reduce((a,b)=>a+b.w,0);let x=Math.random()*total;
  for(const p of pool){x-=p.w;if(x<=0)return {id:p.id,kind:p.kind,reason:p.reason,reasonKind:p.reasonKind}}
  return {id:pool[pool.length-1].id,kind:'consort',reason:pool[pool.length-1].reason,reasonKind:pool[pool.length-1].reasonKind};
}
function pickIncomingVisitor(stage){ // 旬中来客：帝按恩宠、妃嫔按交情与由头，各掷一回

  }

  return null;
}

function personaCanon(t){ // 词条归一：去标点、同义词折回标准词；认不出的保留原描述
  let s=String(t==null?'':t).trim();
  s=s.replace(/^[·、，,。；;：:\s]+/,'').replace(/[。；;：:\s]+$/,'');
  if(!s)return'';
  if(PERSONA_ALL.includes(s))return s;
  if(PERSONA_ALIAS[s])return PERSONA_ALIAS[s];
  if(s.length<=6){
    const hits=new Set();
    for(const x of PERSONA_ALL)if(s.includes(x))hits.add(x);
    for(const k in PERSONA_ALIAS)if(s.includes(k))hits.add(PERSONA_ALIAS[k]);
    if(hits.size===1)return [...hits][0];
  }

  const raw=Array.isArray(list)?list:(list==null||list===''?[]:[list]);
  const out=[];
  for(const x of raw){

    if(!t||out.includes(t)||!personaCompatible(out,t))continue;
    out.push(t);
  }

function rollPersona(n){ // 开局随机：从固定词表中抽 1—3 项相容词条

function avatarCatLive(s,id,n){ // 在世人物的当前身份池：妃嫔随位份升降换档，其余按职司固定

function avatarPick(pool,used,traits,age,cat){ // 池内挑一张最合气质的未占用头像：先过硬条件，再比气质分

function resolveAvatar(cat,used,traits,age){ // 本类池 → 备用池 → 同类复用 → 互通类复用；都不行就留白，绝不跨身份

function dealAvatars(assign,used0){ // assign:[{who,cat,traits,age}] 依池发像：先小池后大池，全局不重复
  const out={},used=new Set(used0||[]);

function npcSkillPlan(id,rank){
  const s=String(id||'')+' '+String(rank||'');
  if(/林守拙/.test(s))return{fixed:['棋','医术'],pool:[]};
  if(/太医|院判|医官/.test(s))return{fixed:['医术'],pool:['莳花','香道','书']};
  if(/掌事|姑姑|嬷嬷|女官|女史/.test(s))return{fixed:['女红'],pool:['香道','书','莳花']};
  if(/宫女|侍女/.test(s))return{fixed:['女红'],pool:['歌','舞','香道','书']};
  if(/太监|内侍|宦官/.test(s))return{fixed:['棋'],pool:['书','香道']};
  if(/侍卫|禁军|校尉/.test(s))return{fixed:['棋'],pool:['书','医术']};
  if(/皇帝|皇上|陛下|帝/.test(s))return{fixed:[],pool:['琴','棋','书']};
  if(/太后|太妃|太嫔/.test(s))return{fixed:[],pool:['书','画','香道']};
  if(/后|妃|昭仪|昭容|昭媛|修仪|修容|修媛|充仪|充容|充媛|贵人|美人|才人|宝林|常在|答应|选侍|更衣|采女|官女子/.test(s))
    return{fixed:[],pool:['琴','棋','书','画','歌','舞','女红','莳花','香道']};
  return{fixed:[],pool:['棋','书','女红']};
}
function ensureNpcSkills(n,id){
  if(!n||typeof n!=='object')return n&&n.skills;
  if(n.skills&&typeof n.skills==='object'&&Object.keys(n.skills).length)return n.skills;
  if(/皇嗣|皇子|皇女|公主|阿哥|格格/.test(String(n.rank||'')))return n.skills; // 年幼皇嗣不设
  const plan=npcSkillPlan(id||n.name,n.rank);
  const h=hashStr('nsk|'+(n.realName||n.name||id||''));
  const out={};
  const add=(k,v)=>{const nm=CR_SKILLNAME[k]||k;if(out[nm]==null)out[nm]=clamp01_100(v)};
  plan.fixed.forEach((k,i)=>add(k,45+((h>>>(3+i*6))%36))); // 吃饭的本事：45—80
  const extra=plan.pool.filter(k=>!plan.fixed.includes(k));
  if(extra.length){
    const want=Math.min(extra.length,plan.fixed.length?(h%2):1+(h%2)); // 专业者另可兼一门；妃嫔等一至二门
    const start=(h>>>9)%extra.length;
    for(let i=0;i<want;i++)add(extra[(start+i)%extra.length],30+((h>>>(4+i*7))%41)); // 兼任与闲艺：30—70
  }
  n.skills=out;
  return n.skills;
}

function setPath(obj,path,val){

  for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null||typeof o[ks[i]]!=='object')o[ks[i]]={};o=o[ks[i]]}
  o[ks[ks.length-1]]=val;
}

  for(const k of ks){if(o==null||typeof o!=='object')return undefined;o=o[k]}
  return o;

function mergeDeep(target,src){ // 模型偶尔把嵌套对象整块写进 statePatch：合并而非替换，避免丢掉未提及的字段
  for(const k in src){
    if(k==='__proto__'||k==='constructor'||k==='prototype')continue;
    const v=src[k],cur=target[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&cur&&typeof cur==='object'&&!Array.isArray(cur))mergeDeep(cur,v);
    else if(v!==undefined)target[k]=v;
  }
  return target;
}
function toCN(n){n=Number(n)||0;if(n<10)return'一二三四五六七八九'[n-1]||String(n);if(n<20)return'十'+(n%10?'一二三四五六七八九'[n%10-1]:'');return Math.floor(n/10)+'十'+(n%10?'一二三四五六七八九'[n%10-1]:'')}
function xunNoOf(turn){return (Number(turn)||0)+1} // 存档 turn=已完成旬数（从 0 起），展示给玩家/模型时统一 +1

function fmtTime(t){t=t||state.time;return `${t.era}${toCN(t.year)}年·${MONTHS[t.month]||t.month+'月'}${t.xun||''}`}
function chronicleAdd(text){ // 大事记：持续记录里程碑；同一条不重复，最多留 160 条
  if(!state||!text)return;
  const t=String(text).replace(/\s+/g,' ').trim().slice(0,200);
  if(!t)return;
  if(!Array.isArray(state.chronicle)){state.chronicle=[];state.chronicleLegacy=true;} // 旧档首次追加：保留原静态沿革
  const last=state.chronicle[state.chronicle.length-1];
  if(last&&String(last.text||'')===t)return;
  state.chronicle.push({time:fmtTime(),text:t});
  if(state.chronicle.length>160)state.chronicle=state.chronicle.slice(-160);
}
function npcMemoryAdd(who,text){ // NPC 事件记忆账：此人与主控之间具体的、可翻的旧账（恩怨、许诺、当众得失）
  if(!state||!who||!text)return;
  const n=(state.npcs||{})[who];
  if(!n)return; // 只记在册人物
  if(!Array.isArray(n.memories))n.memories=[];
  const entry={xun:fmtTime(),text:String(text).slice(0,80)};
  if(n.memories.some(m=>m&&m.text===entry.text))return; // 同款不重复
  n.memories.push(entry);
  if(n.memories.length>10)n.memories=n.memories.slice(-10);

function secretAddS(s,who,text,kind){ // 新立一条秘密（s 可为任意存档对象；全局态走 secretAdd）

  const sec={id:'sec'+s.secretSeq,who:String(who).slice(0,20),text:String(text).slice(0,90),kind:['把柄','隐私','旧事'].includes(kind)?kind:'隐私',learned:false,used:false,born:fmtTime(s.time)};

function secretAssignS(s,who,traits,force){ // 给一个人物从牌库挑 1—2 条合性情的秘密（幂等：一人只发一次，force 跳检）；帝走专用池
  if(!s)return;
  s.secrets=Array.isArray(s.secrets)?s.secrets:[];
  if(!force&&s.secrets.some(x=>x.who===who))return;
  const tr=Array.isArray(traits)?traits:[];
  const isEmp=EMPEROR_ID_RE.test(String(who).trim())||(typeof UI!=='undefined'&&UI.isEmperorId(who));
  const src=isEmp?SECRET_POOL_EMPEROR:SECRET_POOL;
  const fit=src.filter(x=>!tr.length||!x.fit||x.fit.some(f=>tr.includes(f)));
  const pool=(fit.length>=2?fit:src).slice();
  const n=1+(Math.random()<0.35?1:0),picks=[];
  while(picks.length<n&&pool.length)picks.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);

/* ============================================================ BGM
   曲目按加入顺序命名：一、二、三……；新增曲目只需在 BGM_TRACKS 末尾追加一项。
   默认开启，受浏览器自动播放限制，首次点击页面后启动；设置里可随时切换曲目、开关与变速率。 */
const BGM_TRACKS=[
  {id:1,name:'一',src:'assets/audio/bgm.m4a'},
  {id:2,name:'二',src:'assets/audio/bgm2-aac.m4a'}
];
const BGM=(()=>{
  const FADE_MS=800,VOL=0.6;
  let audio=null,timer=null,playing=false,rate=1,track=1;
  function meta(id){return BGM_TRACKS.find(t=>t.id===id)||BGM_TRACKS[0]}
  function ensure(id){ // 始终复用同一个 audio 元素：iOS 切曲时新建元素容易被拦成"无声"
    const m=meta(id||track);
    if(!audio){
      audio=new Audio();
      audio.loop=true;audio.preload='auto';
      audio.volume=0;audio.playbackRate=rate;
      try{audio.setAttribute('playsinline','');audio.style.display='none';document.body.appendChild(audio)}catch(e){} // 挂进 DOM：iOS 对游离的 audio 切源更挑剔
    }
    if(audio.dataset.track!==String(m.id)){
      try{audio.pause()}catch(e){}
      audio.src=m.src;
      audio.dataset.track=String(m.id);
      try{audio.load()}catch(e){}
    }
    track=m.id;
    return true;
  }
  function fadeTo(v){
    clearInterval(timer);
    timer=setInterval(()=>{
      if(!audio){clearInterval(timer);return}
      const d=1/(FADE_MS/100); // 每 100ms 一步，FADE_MS 内线性淡完
      let nv=audio.volume+(v>audio.volume?d:-d);
      if(Math.abs(nv-v)<=d){nv=v;clearInterval(timer)}
      audio.volume=Math.max(0,Math.min(1,nv));
    },100);
  }
  function playNow(){
    ensure(track);playing=true;
    clearInterval(timer);
    audio.playbackRate=rate;
    try{audio.volume=VOL}catch(e){} // 直接给足音量：不把出声与否押在 play() 的 promise 上
    const p=audio.play();
    if(p&&p.catch)p.catch(err=>{
      playing=false;
      const nm=(err&&(err.name||err.message))||'未知';
      toast(err&&err.name==='NotAllowedError'?'浏览器拦住了播放：点一下页面再试':'背景音乐播放失败：'+nm);
    });
  }
  function start(){if(playing)return;playNow()}
  function stop(){if(!playing)return;playing=false;
    fadeTo(0);setTimeout(()=>{if(!playing&&audio)audio.pause()},FADE_MS+100);}
  function setTrack(id,play){ // play=undefined 只换曲；true 立即播放；false 只记曲目不播
    id=Number(id)||1;
    if(!BGM_TRACKS.some(t=>t.id===id))id=BGM_TRACKS[0].id;
    const wasPlaying=playing;
    clearInterval(timer);
    ensure(id);
    if(play===false||(!wasPlaying&&play!==true)){playing=false;try{audio.pause()}catch(e){}return}
    playNow();
  }
  document.addEventListener('visibilitychange',()=>{ // 切后台暂停，回来自动续
    if(!audio)return;
    if(document.hidden)audio.pause();else if(playing)audio.play().catch(()=>{});});
  return{start,stop,setTrack,
    setRate(v){rate=Math.max(0.5,Math.min(1.5,v||1));if(audio)audio.playbackRate=rate;},
    get playing(){return playing},
    get track(){return track},
    get current(){return meta(track)}};
})();
function applyBgm(){
  const s=loadSettings();
  if(s.bgm!==false){BGM.setTrack(s.bgmTrack||1,false);BGM.start()}
  else BGM.stop();
}
document.addEventListener('pointerdown',()=>applyBgm(),{once:true}); // 首次点击后按设置启动（绕开自动播放限制）

const HAREM_TITLE_WORDS=['皇贵妃','贵妃','贵嫔','昭仪','昭容','昭媛','修仪','修容','修媛','充仪','充容','充媛','贤妃','良妃','淑妃','德妃','妃','嫔','贵人','美人','才人','宝林','常在','答应','选侍','更衣','采女','官女子'];
function npcRealName(n,used){ // 旧档里「姓+位份」的称谓补一个稳定本名；已是本名的原样返回
  const raw=String(n&&n.name||'').trim();
  if(!raw)return '';
  let surname='';
  const q=raw.match(/^皇后(.+?)氏$/);
  if(q)surname=q[1];
  if(!surname)for(const t of HAREM_TITLE_WORDS){
    if(raw.length>t.length&&raw.endsWith(t)){surname=raw.slice(0,-t.length);break}
  }
  const pool=(typeof WORLD_LIB!=='undefined'&&Array.isArray(WORLD_LIB.givenNames))?WORLD_LIB.givenNames:[];
  if(!surname||surname.length>1||!pool.length)return raw;
  const start=hashStr('npc:'+raw)%pool.length;
  for(let k=0;k<pool.length;k++){
    const cand=surname+pool[(start+k)%pool.length];
    if(!used.has(cand)){used.add(cand);return cand}
  }
  return raw;
}
function ensureNpcRealNames(s){ // 幂等：已有本名不动，缺的按名讳哈希稳定补齐
  const npcs=(s&&s.npcs)||{};
  const used=new Set();
  for(const id in npcs){const n=npcs[id];if(!n)continue;if(n.name)used.add(n.name);if(n.realName)used.add(n.realName)}
  const emperorName=s.world&&s.world.emperor&&s.world.emperor.name;
  for(const id in npcs){
    const n=npcs[id];if(!n||typeof n!=='object'||n.realName)continue;
    if(emperorName&&(n.name==='皇帝'||id==='皇帝')){n.realName=emperorName;continue}
    n.realName=npcRealName(n,used)||n.name||id;
  }
}
function normalizeState(s){

  if(!Number(s.lastConsortYear))s.lastConsortYear=Number((s.time&&s.time.year)||0); // 每年新人：旧档从当前年起算，不补发往年的秀女
  ensureNpcMeets(s); // 会面账：旧档按既有好感折回次数，新档从零计
  s.system=(s.system&&typeof s.system==='object')?s.system:{shop:[]};
  if(!Array.isArray(s.system.shop))s.system.shop=[];
  if(!Array.isArray(s.secrets)){ // 旧档补隐秘账：在册人物各发一两条，只发一次
    s.secrets=[];s.secretSeq=0;
    for(const id in s.npcs){const n=s.npcs[id];if(n&&n.rank)secretAssignS(s,id,((n.profile||{}).traits)||[])}
  }
  { // 旧档把妃嫔池秘密错发给帝的，换发帝专用池：只换未掌握的（玩家已见过的留在账上，不改口）
    const wEmp=String((((s||{}).world||{}).emperor)||{}).name||'';
    const empKeys=[...new Set([...Object.keys(s.npcs||{}),...Object.keys(s.relationships||{})])]
      .filter(k=>EMPEROR_ID_RE.test(String(k).trim())||(wEmp&&String(k)===wEmp));
    for(const k of empKeys){
      const foreign=(s.secrets||[]).filter(x=>x.who===k&&!x.learned&&!SECRET_POOL_EMPEROR.some(p=>p.text.split('{w}').join(k)===x.text));
      if(!foreign.length)continue;

      secretAssignS(s,k,(((s.npcs||{})[k]||{}).profile||{}).traits||[],true);
    }
  }
  s.time=s.time||{era:'元朔',year:1,month:3,xun:'上旬'};
  if(!s.plotLedgerV1){migratePlotLedger(s);s.plotLedgerV1=true} // 一次性迁移须先于 pending 归一：此时剧情类条目还是字符串，模式才匹配得上；归一后再迁永远命中不了
  s.pending=normalizePending(s.pending,s.turn);

function parseLegacyItem(x,src){ // 旧档条目解析：剥离「×N」与（备注），按词条推断可否典卖

  const m=s.match(/×\s*(\d+)/);if(m){count=+m[1];s=s.replace(/×\s*\d+/,'')}

  };

  const rf={},rt={};
  for(const k in (from.relationships||{}))rf[k]=relVal(from.relationships[k]);

function buildMessages(userMsg,noHistory){

/* ============================================================ API */
function appendBudgetNote(msgs){ // 截断后原样重发必然再截断：附一段精简要求，把结算压回预算内
  const note='【上一次输出超出长度上限被截断】请重新输出完整 JSON，并压缩篇幅：narrative 不超过 350 字；scene.parts 总长不超过 120 字；changes 不超过 5 条；statePatch 只写本旬确有变化的键；dossier 至多 1 人。务必保证 JSON 完整闭合。';
  const out=msgs.map(m=>Object.assign({},m));
  const last=out[out.length-1];
  if(last&&last.role==='user')last.content=String(last.content)+'\n'+note;
  else out.push({role:'user',content:note});
  return out;
}
function appendJsonHint(msgs,empty,err){ // 空/坏 JSON 重发：连同原请求再要一次，不改变剧情内容
  const note=empty
    ?'【系统】上一次回复为空（接口 JSON 模式偶发，不是你的错）。请重新完整输出本旬 JSON：只输出一个 JSON 对象，不加解释或 markdown 代码块。'
    :`【系统】上一次回复无法解析为 JSON（${(err&&err.message)||'格式错误'}）。请重新完整输出本旬 JSON：只输出一个 JSON 对象，不加解释或 markdown 代码块${err&&err.raw?`；上次回复开头是：${String(err.raw).slice(0,80)}`:''}。`;
  const out=msgs.map(m=>Object.assign({},m));
  const last=out[out.length-1];
  if(last&&last.role==='user')last.content=String(last.content)+'\n'+note;
  else out.push({role:'user',content:note});
  return out;
}
function modelText(message){ // content 可能是字符串、分段数组（部分网关）或对象，统一取出文本
  const c=message&&message.content;
  if(typeof c==='string')return c;
  if(Array.isArray(c))return c.map(x=>typeof x==='string'?x:(x&&typeof x==='object'?(typeof x.text==='string'?x.text:(typeof x.content==='string'?x.content:'')):'')).join('');
  if(c&&typeof c==='object')return typeof c.text==='string'?c.text:(typeof c.content==='string'?c.content:JSON.stringify(c));
  return '';
}
async function callModel(userMsg,opts){
  const epoch=runEpoch;
  const s=loadSettings();
  if(!s.apiKey){const err=new Error('尚未填写 API Key');err.noKey=true;throw err}
  const baseMsgs=(opts&&opts.messages)||buildMessages(userMsg,opts&&opts.noHistory);
  const maxTokens=(opts&&opts.maxTokens)||MAX_OUTPUT_TOKENS;
  const timeoutMs=(opts&&opts.timeoutMs)||REQUEST_TIMEOUT;

  const expect=(opts&&opts.expect)||'payload';

    if(expect==='payload'){parsePayload(raw);return}
    if(expect==='impression'){
      let ok=false;
      try{
        const t=String(raw==null?'':raw),a=t.indexOf('{'),b=t.lastIndexOf('}');

    }
    if(expect==='craft'){

        if(b>a){
          const o=JSON.parse(t.slice(a,b+1))||{};

        }
      }catch(e){}
      if(!ok){const err=new Error('返回不是手作 JSON');err.raw=String(raw==null?'':raw).trim();err.invalidJson=true;throw err}
    }
    if(expect==='market'){
      let ok=false;
      try{
        const t=String(raw==null?'':raw),a=t.indexOf('{'),b=t.lastIndexOf('}');

          const o=JSON.parse(t.slice(a,b+1))||{};
          ok=Array.isArray(o.items)&&o.items.length>0&&o.items.every(it=>it&&typeof it.name==='string'&&!!it.name.trim()&&MARKET_KINDS.includes(it.kind)&&['寻常','精巧','珍罕'].includes(it.tier));
        }

      if(!ok){const err=new Error('返回不是市集 JSON');err.raw=String(raw==null?'':raw).trim();err.invalidJson=true;throw err}
    }

  const send=async(messages,useStream=true,sansFormat=false)=>{
    const ctrl=new AbortController();abortCtrl=ctrl;

    const started=Date.now();
    try{
      const body={model:s.model||'deepseek-chat',messages,temperature:0.75,max_tokens:maxTokens};
      if(!sansFormat)body.response_format={type:'json_object'};
      if(useStream)body.stream=true;
      const res=await fetch(s.baseUrl.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST',signal:ctrl.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
        body:JSON.stringify(body)
      });
      if(!res.ok){
        const text=(await res.text()).slice(0,300);
        if(useStream&&(res.status===400||res.status===422)&&/stream|event-stream/i.test(text))return await send(messages,false,sansFormat); // 网关不支持流式：退回整包
        if(!sansFormat&&(res.status===400||res.status===422)&&/response_format|json_object|json mode/i.test(text))return await send(messages,useStream,true); // 网关不认 JSON 模式：去掉再要一次

      }

      let content='',finish='',usage=null,respModel='';
      const takeObj=obj=>{ // 一段增量或整包：OpenAI 的 choices、Gemini 原生 candidates、数组包体都认
        if(!obj||typeof obj!=='object')return;
        if(Array.isArray(obj)){for(const x of obj)takeObj(x);return}
        if(obj.error){const em=obj.error.message||obj.error.code||JSON.stringify(obj.error);throw new Error('接口返回错误：'+em)}
        if(obj.usage)usage=obj.usage;
        else if(obj.usageMetadata&&!usage)usage={prompt_tokens:obj.usageMetadata.promptTokenCount,completion_tokens:obj.usageMetadata.candidatesTokenCount};
        if(obj.model)respModel=obj.model;
        const ch=obj.choices&&obj.choices[0];
        if(ch){
          const piece=modelText({content:(ch.delta&&ch.delta.content)||(ch.message&&ch.message.content)});
          if(piece)content+=piece;
          if(ch.finish_reason)finish=String(ch.finish_reason);

        }

        if(!cand)return;
        const parts=(cand.content&&Array.isArray(cand.content.parts))?cand.content.parts:[];
        const piece=parts.map(x=>x&&typeof x.text==='string'?x.text:'').join('');
        if(piece)content+=piece;
        if(cand.finishReason)finish=String(cand.finishReason);
      };
      const onLine=line=>{

      };
      if(useStream&&/text\/event-stream/i.test(ctype)&&res.body&&typeof res.body.getReader==='function'){
        const reader=res.body.getReader(),dec=new TextDecoder();

      }else{
        // 一律读文本再判：网关常把 SSE 标成 text/plain，或把限流/报错页当 HTTP 200 返回。
        // res.json() 遇到非 JSON 时，Safari 抛的是「The string did not match the expected pattern.」，看不出所以然。
        const raw=(await res.text()).trim();
        if(raw&&/^data:/.test(raw)&&!/^[\[{]/.test(raw)){raw.split('\n').forEach(onLine)} // 标错类型的 SSE
        else if(raw){
          let data;
          try{data=JSON.parse(raw)}catch(e){
            const err=new Error(`接口返回的不是 JSON（HTTP ${res.status}${ctype?`，${ctype.split(';')[0]}`:''}）`);
            err.raw=raw.slice(0,1200);
            throw err;
          }
          takeObj(data);
        }
      }
      if(usage){ // 耗时与 token 用量：用于判断慢在输入还是输出
        const u=usage;
        const sec=(Date.now()-started)/1000;
        lastApiStat={sec,in:u.prompt_tokens??null,out:u.completion_tokens??null,cache:u.prompt_cache_hit_tokens??null,model:respModel||s.model||'',at:Date.now()};
        console.info(`[API] ${sec.toFixed(1)}s  prompt ${u.prompt_tokens??'?'} / completion ${u.completion_tokens??'?'} tokens`
          +(u.prompt_cache_hit_tokens!=null?` / cache hit ${u.prompt_cache_hit_tokens}`:''));
      }
      if(finish==='length'||finish==='max_tokens'||finish==='MAX_TOKENS'){ // 截断的 JSON 必然解析失败，标记后由外层精简重试
        const err=new Error('输出达到长度上限被截断，JSON 未闭合');err.raw=content;err.truncated=true;throw err;
      }
      if(!String(content).trim()){ // JSON 模式会把无法识别的输出替换成空格：这是接口已知问题，自动重试
        const err=new Error('模型返回了空内容（接口 JSON 模式偶发）');
        err.empty=true;err.raw='';err.detail=`模型：${respModel||s.model||'—'}${finish?`｜finish_reason：${finish}`:''}`;
        throw err;
      }
      return content;
    }catch(e){
      if(timedOut){const err=new Error(`请求超时（${Math.round(timeoutMs/1000)} 秒），请重试或换更快的模型`);err.timeout=true;throw err}
      if(e&&e.name==='TypeError'&&/load failed|failed to fetch|networkerror|network error/i.test(String(e.message||''))){ // Safari 只说 Load failed：多半是接口没允许本站来源
        const err=new Error(`请求没有到达接口（跨域被拒或网络不可达）。若网络正常，请让中转站允许本站来源 ${location.origin}`);
        err.cors=true;
        throw err;
      }
      throw e;
    }finally{
      clearTimeout(timer);
      if(abortCtrl===ctrl)abortCtrl=null;
    }
  };
  let messages=baseMsgs,truncatedTried=false;
  for(let emptyTried=0,parseTried=0;;){
    if(epoch!==runEpoch)throw abortedError();
    let raw;
    try{
      raw=await send(messages,allowStream);
      if(epoch!==runEpoch)throw abortedError();
    }catch(e){
      if(e.truncated&&!truncatedTried&&!(opts&&opts.noRetry)){ // 截断：压缩篇幅后重试
        truncatedTried=true;
        console.info('[API] 输出被截断，追加精简要求后重试一次');
        messages=appendBudgetNote(messages);
        continue;
      }
      if(e.empty&&emptyTried<JSON_RETRY_EMPTY&&!(opts&&opts.noRetry)){ // 空内容：DeepSeek 等 JSON 模式偶发，重试通常即可
        emptyTried++;

        messages=appendJsonHint(messages,true);
        continue;
      }
      throw e;
    }
    try{

    }catch(e){
      if(e.invalidJson&&parseTried<JSON_RETRY_PARSE&&!(opts&&opts.noRetry)){
        parseTried++;

        messages=appendJsonHint(messages,false,e);
        continue;
      }
      throw e;
    }
  }
}
function unquoteEmbeddedJson(s){ // 模型把对象/数组当字符串塞进值里："scene":"{…}" → "scene":{…}
  const re=/("(?:scene|statePatch|plots|options|dossier|emperor|protagonist|world|pregnancy|bedchamber|chars|npcs)"\s*:\s*)"(\{|\[)/g;
  let out=String(s||''),m,guard=0;
  while((m=re.exec(out))!==null&&guard++<8){
    const quoteIdx=m.index+m[1].length; // 值前那个引号的位置
    const openIdx=quoteIdx+1;           // 紧随其后的 { 或 [
    const open=out[openIdx],close=open==='{'?'}':']';
    let depth=0,end=-1;
    for(let i=openIdx;i<out.length;i++){
      const c=out[i];
      if(c===open)depth++;
      else if(c===close){depth--;if(depth===0){end=i;break}}
    }
    if(end<0)break; // 没闭合：多半是截断，别硬修
    let tail=end+1;
    if(out[tail]==='"')tail++; // 去掉多余的那个收尾引号
    const inner=out.slice(openIdx,end+1);
    out=out.slice(0,quoteIdx)+inner+out.slice(tail);
    re.lastIndex=quoteIdx+inner.length;
  }
  return out;
}
function repairJsonText(t){ // 模型常见的三种小毛病：对象被写成字符串、字符串里有裸换行、对象末尾多逗号。就地修好，省一次整轮重发
  let s=unquoteEmbeddedJson(String(t||'')),out='',inStr=false,esc=false;
  for(const ch of s){
    if(inStr){
      if(esc){out+=ch;esc=false;continue}
      if(ch==='\\'){out+=ch;esc=true;continue}
      if(ch==='"'){out+=ch;inStr=false;continue}
      if(ch==='\n'){out+='\\n';continue}
      if(ch==='\r')continue;
      if(ch==='\t'){out+='\\t';continue}
      out+=ch;continue;
    }
    if(ch==='"'){inStr=true;out+=ch;continue}
    out+=ch;
  }
  if(inStr)return ''; // 字符串都没闭合：多半是截断，交给重试，别把半截数据当结果
  out=out.replace(/,\s*([}\]])/g,'$1');
  return out;
}
function parsePayload(raw){
  const src=raw==null?'':String(raw);
  let t=src.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  const fail=m=>{const e=new Error(m);e.raw=src.trim();e.invalidJson=true;throw e};
  if(!t)fail('模型返回了空内容');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a<0)fail('返回不是 JSON');
  if(b<=a)fail('输出在 JSON 闭合前被截断（可重试）');
  const body=t.slice(a,b+1);
  let p;try{p=JSON.parse(body)}catch(e){
    const fixed=repairJsonText(body);
    if(fixed&&fixed!==body){try{p=JSON.parse(fixed)}catch(e2){}}
    if(!p)fail(/end of (JSON )?input|unterminated|unexpected end/i.test(e.message)?'输出在 JSON 闭合前被截断（可重试）':'JSON 解析失败：'+e.message);
  }
  if(typeof p.narrative!=='string')fail('JSON 缺 narrative 字段');
  if(p.narrative.length>700)console.info(`[文风] 正文 ${p.narrative.length} 字，超出 700 字上限`);
  // 字段洗净：模型偶发把数组写成字符串、把 scene 写成字符串，后续 .map/.join 会直接抛错并让界面无响应
  const asList=v=>Array.isArray(v)?v:(v==null||v===''?[]:[v]);
  const asText=v=>typeof v==='string'?v:String(v==null?'':JSON.stringify(v));
  const asOption=o=>typeof o==='string'?{text:o}:(o&&typeof o==='object'?o:{text:asText(o)});
  p.changes=asList(p.changes).map(asText).filter(Boolean);
  p.todo=asList(p.todo).map(asText).filter(Boolean);
  p.options=asList(p.options).map(asOption);
  if(p.eventSource!=null&&typeof p.eventSource!=='string')p.eventSource=asText(p.eventSource);
  if(typeof p.scene==='string'&&/^\s*\{/.test(p.scene)){ // scene 被整个塞成 JSON 字符串：解开再用，别把原文当台词显示
    try{p.scene=JSON.parse(p.scene)}catch(e){try{p.scene=JSON.parse(repairJsonText(p.scene))}catch(e2){}}
  }
  if(p.scene!=null&&(typeof p.scene!=='object'||Array.isArray(p.scene)))p.scene={line:asText(p.scene)};
  if(p.scene){
    if(p.scene.line!=null&&typeof p.scene.line!=='string')p.scene.line=asText(p.scene.line);
    if(p.scene.who!=null&&typeof p.scene.who!=='string')p.scene.who=asText(p.scene.who);
    if(p.scene.where!=null&&typeof p.scene.where!=='string')p.scene.where=asText(p.scene.where);
    if(p.scene.when!=null&&typeof p.scene.when!=='string')p.scene.when=asText(p.scene.when);
    if(p.scene.options!=null)p.scene.options=asList(p.scene.options).map(asOption); // 字符串/单对象也不能留到 .map
  }
  if(p.dossier!=null&&!Array.isArray(p.dossier))p.dossier=[];
  if(p.statePatch!=null&&(typeof p.statePatch!=='object'||Array.isArray(p.statePatch)))p.statePatch={};
  if(p.schemeOutcome!=null)p.schemeOutcome=String(p.schemeOutcome).toLowerCase();
  if(p.mainBeat!=null)p.mainBeat=String(p.mainBeat).trim();
  return p;
}

/* ============================================================ 结算 */
function advanceTime(t){ // 两旬制日历推进：上旬→同月下旬；下旬→次月上旬（跨年自动）
  t=Object.assign({},t);
  if(t.xun==='上旬'){t.xun='下旬'}
  else{t.xun='上旬';t.month=(Number(t.month)||1)+1;if(t.month>12){t.month=1;t.year=(Number(t.year)||1)+1}}
  delete t.note;
  return t;
}
function applyPatch(patch){
  if(!patch)return[];
  const majors=[];
  let rankChanged=false;
  const buffBefore=relSnapshotNum(); // 命途长赐：本轮结束后统一给上涨的关系补点
  const dgNow=disguiseActive(state); // 本旬易容：旁人认的是这张脸，主控自己的关系与帝前账本旬不动
  let baseCap=Number(state&&state.protagonist&&state.protagonist.constitutionBase)||0; // 体质根基：气血上限
  const pb=patch['protagonist.constitutionBase'];
  if(typeof pb==='number')baseCap=Math.max(baseCap,Math.round(pb)); // 同补丁先抬根基，再按新根基钳气血
  for(const k in patch){
    if(k==='log')continue;
    if(dgNow&&(/^relationships\./.test(k)||/^emperor\./.test(k)||/^protagonist\.rank$/.test(k)||/^protagonist\.attributes\.(外貌|威望|忌惮|交际)$/.test(k)))continue; // 易容期间：这些账记在被冒名者名下，不落到主控身上
    if(k==='mainBeat'){mainLineNoteBeat(patch[k]);continue} // 命途关目：模型演完后报 id，前端校验后落账
    if(k==='emperorFavor'){ // 帝宠变动：{称谓: 新值}
      const obj=patch[k]||{};for(const w in obj){const n=(state.npcs||{})[w]||Object.values(state.npcs||{}).find(x=>x&&(x.name===w||x.realName===w));if(!n)continue;const old=Number(n.favor)||0;n.favor=clamp01_100(obj[w]);if(Math.abs(n.favor-old)>=8)majors.push(`帝宠「${w}」`)}
      continue}
    if(k==='emperorStory'){ // 帝与某人的旧事：{称谓: "一句话"}，覆盖式更新

function applyDossier(list){

      state.npcs[id]={known:true,metAt:fmtTime(),name:id,realName:d.realName||'',rank:d.rank||'',faction:d.faction||'',age:Number(d.age)||null,

    }

    ensureNpcSkills(npc,id); // 新人物补才艺，供往后求师

  }

}
function isMajorTurn(patch,payload){
