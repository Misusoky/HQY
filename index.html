/* 侍女问话等旬中插话：本旬养成不在此结算。模型若仍写了才艺/属性成长，剔除键与对应变化条目 */
const STANDALONE_GROWTH_RE=/^(琴艺|棋艺|书法|画艺|歌艺|舞艺|女红|医术|药理|莳花|香道|外貌|才华|交际|忌惮|手段|威望|体质|孕率)\s*[+＋\-－]/;
function stripStandaloneGrowth(p){
  if(!p)return p;
  const patch=(p.statePatch&&typeof p.statePatch==='object'&&!Array.isArray(p.statePatch))?p.statePatch:{};
  const dropped=[];
  const walk=(o,pre)=>{
    for(const k of Object.keys(o)){
      const key=pre?pre+'.'+k:k;
      if(/^protagonist\.(skills|attributes)\./.test(key)){dropped.push(k);delete o[k];continue}
      const v=o[k];
      if(v&&typeof v==='object'&&!Array.isArray(v)&&/^protagonist(\.(skills|attributes))?$/.test(key))walk(v,key);
    }
  };
  walk(patch,'');
  if(Array.isArray(p.changes))p.changes=p.changes.filter(c=>{
    const s=String(c);
    if(dropped.some(n=>n&&s.includes(n)))return false;
    return !STANDALONE_GROWTH_RE.test(s.trim());
  });
  return p;
}

    if(a!==z)diffs.push(`行囊·${n}　${a} → ${z}`);
  }
  return {acts,diffs};
}
function xunSummaryHtml(){

function finalize(payload,meta){
  let ok=true;
  try{
    const tiBefore=state&&state.protagonist&&state.protagonist.attributes?Number(state.protagonist.attributes['体质']):null;
    const mainBefore=(state.plots||[]).filter(p=>p.line==='主线').map(p=>({id:p.id,stage:p.stage,note:String(p.note||''),title:p.title})); // 主线进度：本步有没有推进
    if(payload.mainBeat&&payload.statePatch&&payload.statePatch.mainBeat==null)payload.statePatch.mainBeat=payload.mainBeat; // 关目也可能写在外面
    const majors=applyPatch(payload.statePatch);
    if(disguiseActive(state)&&Array.isArray(payload.changes)){ // 易容期间：面板别把记在被冒名者名下的账说成主控的
      payload.changes=payload.changes.map(c=>/好感|宠爱|威望|忌惮|交际|知心|帝宠/.test(String(c))?`${c}（记在易容之名下）`:c);
    }
    try{mainLineAfterSettle()}catch(e){console.warn('[命途] 过阶检查失败',e)} // 数值与关目都到了就进下一阶；剧情账主线条目在前端维护
    for(const p of (state.plots||[]).filter(x=>x.line==='主线')){
      if(p.id===DESTINY_PLOT_ID)continue; // 命途进度每旬都刷新，不逐旬记大事记（过阶时另行记）
      const old=mainBefore.find(x=>x.id===p.id);
      if(old&&old.stage==='进行中'&&p.stage==='进行中'&&String(old.note||'')!==String(p.note||'')){
        chronicleAdd(`主线「${p.title}」：${String(p.note||'').slice(0,160)}`); // 每一步推进都进大事记
      }
    }
    if(payload&&Array.isArray(payload.changes)&&tiBefore!=null){ // 体质被根基钳住、实际未涨时，撤下"体质+"变化条，面板不说假话
      const tiAfter=Number(state.protagonist.attributes['体质']);
      if(!(tiAfter>tiBefore))payload.changes=payload.changes.filter(c=>!/^体质\s*[+＋]/.test(String(c)));
    }
    autoSettleDuePlots(meta&&meta.adj);
    autoExpireStalePlots(meta&&meta.adj);
    try{applyDossier(payload.dossier)}catch(e){console.warn('[dossier] 人物档案回写失败',e)} // 单条人物档案出错不拖垮整旬结算
    const intelChanged=syncSkillIntel(state); // 交好到相熟：补记已知才艺
    const summary=String((payload.statePatch&&payload.statePatch.log)||'').trim();
    if(majors.length||isMajorTurn(payload.statePatch,payload)){ // 大事记：晋升/降位/孕事/生死/派系/重大宫斗等里程碑
      const t=summary||(Array.isArray(payload.changes)?payload.changes.slice(0,3).join('；'):'');
      if(t)chronicleAdd(t);
    }
    state.lastNode=summary||`${fmtTime()} · ${meta.focus||meta.choice||'本旬行事'}`; // 自动档摘要用这句，不沿用开局的旧节点
    history.push({turn:state.turn,focus:meta.focus||'',choice:meta.choice||'',narrative:filterText(payload.narrative),log:summary});
    if(history.length>HISTORY_CAP)history.splice(0,history.length-HISTORY_CAP);
    try{UI.renderTurnCard(payload,meta)}catch(e){console.warn('[card] 纪事卡渲染失败',e)}
    UI.updateStatusbar();
    if(intelChanged)toast('来往渐深，你已知道某人的才艺（人物谱可查）',3200);
    const major=!!(majors.length||isMajorTurn(payload.statePatch,payload));
    const saved=saveToSlot(0,true); // 每旬结算都更新自动档：不再只在大事件与逢五旬时存
    if(!saved)toast('自动存档失败：本机存储空间不足，请删除旧档或先导出备份',5200);
    else if(major)toast('已自动存档（'+fmtTime()+'）');
    flushAcquired(); // 模型这一轮给的东西：与本地入库同一套提示
  }catch(e){
    ok=false;
    console.error('[结算] 失败',e);
    toast('本旬结算出错：'+(e.message||e),4000);
  }
  persistCurrent();
  if(ok)markSafe();
  try{checkMainQuestNotices()}catch(e){console.warn('[主线] 弹窗检查失败',e)}
}

function plotUrgency(){ // 只读视角：哪些到期、超期、搁置——不掷骰、不改账，专供面板显示
  const now=xunSerial(state&&state.time);
  const active=activePlots().filter(p=>p.id!==DESTINY_PLOT_ID&&!p.schemeId);
  return {
    due:active.filter(p=>p.latest!=null&&now<=p.latest),
    overdue:active.filter(p=>p.latest!=null&&now>p.latest),
    stale:active.filter(p=>p.latest==null&&now-(p.touch??now)>=STALE_PLOT_XUN),
    pendStale:((state&&state.pending)||[]).filter(x=>(state.turn||0)-(x.touch??state.turn)>=STALE_PLOT_XUN)
  };
}
function questPointsText(){ // 一条任务兑现能拿多少分：翻手为云另有长赐
  const bonus=state&&state.mainLine&&state.mainLine.id==='fan'?10:0;
  const total=QUEST_POINTS+bonus;
  return bonus?`积分 +${total}（含命途长赐 +${bonus}）`:`积分 +${total}`;
}
function questRewardLine(p){ // 剧情详情里写清这条兑现给多少分、有没有发过
  if(!p)return '';
  if(String(p.id)===DESTINY_PLOT_ID)return '命途不另计任务积分';
  if(p.stage==='已兑现')return p.paid?`已发 ${questPointsText()}`:'已了结，未计任务积分';
  if(p.stage==='已作废')return '未兑现，不发积分';
  return questPointsText();
}

  nightIntentHtml(){ // 承宠：本旬争/候/避；结果在旬末结算，点结束本旬后弹出夜账
    const turn=state.turn||0;
    const cur=state.xunIntent&&state.xunIntent.turn===turn?state.xunIntent:null;
    const mode=cur?cur.mode:null;
    const preg=!!state.pregnancy;
    const pp=(Number(state.postpartumUntil)||0)>turn;
    const lowE=(Number(state.energy)||0)<10;
    const canStrive=!preg&&!pp&&!lowE;
    const opt=(m,label,desc,dis)=>`<button class="nightopt${mode===m?' on':''}" ${dis?'disabled':''} onclick="Game.setNightIntent('${m}')"><span class="no-main">${esc(label)}</span><span class="no-sub">${esc(desc)}</span></button>`;
    let status='尚未打算；不选则按静候。';
    if(mode==='strive')status=`已递牌子${cur&&cur.paid?'，敬事房已打点':'，银两不足未打点'}。`;
    else if(mode==='avoid')status='已称病避宠。';
    else if(mode==='wait')status='本旬静候。';
    const hint=preg?'有孕在身，太医嘱咐静养，本旬不宜承宠。':pp?'产后调养中，暂不宜承宠。':lowE&&!preg?'精力不足十点，本旬无法打点争取。':'';
    return `<div class="sec"><div class="sec-cap">承宠 · 本旬打算</div>
      <div class="sheet-note" style="margin:0 0 6px">${esc(status)}${hint?'　'+esc(hint):''}</div>
      ${opt('strive','争取','耗精力10 · 打点10两（银两不足则只递牌子）',!canStrive)}
      ${opt('wait','静候','不耗精力 · 听凭敬事房安排',preg||pp)}
      ${opt('avoid','避宠','不耗精力 · 免去争宠风险，但恩宠会缓跌',preg||pp)}

    </div>`;
  },

  plotRow(p,adj){ // 剧情账一行：点开看任务说明与期限（active only 也用它）；adj 在时把「将到期／搁置」标在行上，几张面板不必再另列一节
    if(!p)return '';
    const stale=!!(adj&&Array.isArray(adj.stale)&&adj.stale.some(s=>String(s.id)===String(p.id)));
    const soon=!!(adj&&Array.isArray(adj.due)&&adj.due.some(s=>String(s.id)===String(p.id)));
    const now=xunSerial(state.time);

    const cnt=`${overdue?'已逾期·':(soon?'将到期·':(stale?'搁置发酵·':''))}${esc(tail)}`;
    return `<button class="itemrow" onclick="UI.goSheet('剧情详情','${esc(p.id)}')"><span>${esc(p.title)}　<span class="tag">${esc(p.line)}${p.tie?'·'+esc(String(p.tie).slice(0,10)):''}</span></span><span class="cnt">${cnt}</span><span class="go">详情›</span></button>`;

  sheetPlotDetail(id){ // 剧情账详情：任务说明、期限、当前进展与相关记事

    const stageText=p.stage==='已兑现'?'已了结':(p.stage==='已作废'?'已作废':'进行中');
    let dueText=p.dueText||'';
    if(left!=null)dueText=(dueText?dueText+'　':'')+(left<0?`已逾期 ${-left} 旬`:(left===0?'本旬到期':`还有 ${left} 旬`));
    const goal=p.goal?`<div class="sheet-note" style="margin:0;line-height:1.95;color:var(--ink)">${esc(p.goal)}</div>`:'';
    const next=p.next?`<div class="sec"><div class="sec-cap">下一步</div><div class="sheet-note" style="margin:0;line-height:1.95;color:var(--ink)">${esc(p.next)}</div></div>`:'';
    const note=p.note?`<div class="sec"><div class="sec-cap">当前进展</div><div class="sheet-note" style="margin:0;line-height:1.95">${esc(p.note)}</div></div>`:'';
    const keys=[p.title,p.id].filter(Boolean).map(String);
    const log=((state.chronicle||[]).filter(e=>keys.some(k=>k&&String(e.text||'').includes(k)))).slice(-4).reverse();
    const logSec=log.length?`<div class="sec"><div class="sec-cap">相关记事</div><div class="tl">${log.map(e=>`<div class="tl-item"><div class="tl-time">${esc(e.time||'')}</div>${esc(e.text||'')}</div>`).join('')}</div></div>`:'';
    const hint=p.stage==='进行中'?(p.id===DESTINY_PLOT_ID?'这是你入梦选定的命途：五阶由前端判定，关目须真演出来。点下方「命途总览」看门槛与接口。':(p.line==='主线'
      ?'主线不催期限：把门槛与关目走到才算数；有真实期限的支线到期才会催办。'
      :(p.line==='敌对'?'敌意条目不靠等它消失：对方的动作会自己找上门。':'这条随剧情推进更新；条件满足时应当了结。'))):'';
    return back+`<div class="sec">
        <div class="nd-head"><div><div class="nd-nm">${esc(p.title)}</div><div class="nd-rk">${esc(p.line)} · ${esc(stageText)}</div></div></div>
        <div class="itemrow"><span>类别</span><span class="cnt">${esc(p.line)}</span></div>
        ${p.tie?`<div class="itemrow"><span>所系</span><span class="cnt">${esc(p.tie)}</span></div>`:''}
        <div class="itemrow"><span>状态</span><span class="cnt">${esc(stageText)}</span></div>
        ${dueText?`<div class="itemrow"><span>期限</span><span class="cnt">${esc(dueText)}</span></div>`:''}
        <div class="itemrow"><span>兑现</span><span class="cnt num">${esc(questRewardLine(p))}</span></div>
        ${p.earliest!=null?`<div class="itemrow"><span>起于</span><span class="cnt">${esc(serialTimeText(p.earliest))}</span></div>`:''}
        ${p.latest!=null?`<div class="itemrow"><span>限期</span><span class="cnt">${esc(serialTimeText(p.latest))}</span></div>`:''}
      </div>
      <div class="sec"><div class="sec-cap">任务说明</div>${goal||'<div class="sheet-note" style="margin:0">尚无说明。</div>'}</div>
      ${next}${note}${logSec}
      ${hint?`<div class="sheet-note">${esc(hint)}</div>`:''}
      ${p.id===DESTINY_PLOT_ID?`<div class="setbtns"><button class="btn btn-primary" onclick="UI.goSheet('命途')">命途总览</button></div>`:''}
      ${p.stage==='进行中'&&!p.schemeId&&p.id!==DESTINY_PLOT_ID?`<div class="setbtns"><button class="btn btn-line" onclick="UI.dropPlot('${esc(p.id)}')">与实情不符，作废此条</button></div>`:''}`;
  },
  dropPlot(id){ // 玩家自行作废一条剧情账：模型硬编出来的主线、与标题不符的旧条目，不必留着膈应自己
    const p=(state.plots||[]).find(x=>String(x.id)===String(id));

  sheetDestiny(){ // 命途总览：路线、五阶、本阶门槛与关目、改道

    const stateNote=ml.finished?`<div class="sheet-note" style="margin-top:0">此路已走到头：${esc(def.finale)}。要不要就此收束，由你决定。</div>`
      :(ml.fails?`<div class="sheet-note" style="margin-top:0">已记债 ${ml.fails}：路还照走，账先记着。</div>`:'');

        ${MAIN_LINE_IDS.filter(id=>id!==ml.id).map(id=>{const d=MAIN_LINES[id];return `<button class="itemrow" onclick="UI.askSwitch('${id}')"><span>${esc(d.name)} · ${esc(d.sub)}</span><span class="go">改走›</span></button>`}).join('')}</div>`);

        <div class="itemrow"><span>本阶</span><span class="cnt">第${ml.stage}阶 · ${esc(st.title)}</span></div>
        <div class="sheet-note" style="margin-top:10px">${esc(st.goal)}</div>
        ${ml.openingBuff?`<div class="sheet-note">${esc(ml.openingBuff)}</div>`:''}

  fanDestinySec(){

      :'<div class="sheet-note">眼下还没有一系公开站在你这边。门槛只把“态度为盟友或拉拢的派系”算作你的人。</div>';

      <div class="sec"><div class="sec-cap">你这一系</div>${campRows}</div>`;

  askSwitch(id,force){ // 改道：一次机会；force=旧档补选（不算改道）

    const d=MAIN_LINES[id];if(!d)return;

        ${state.nextStep?`<div class="itemrow"><span>下一步：${esc(state.nextStep)}</span></div>`:''}</div>

  },

      `<div class="librow"><span class="lr-name">${esc(b.name)} <span class="qbadge ${tierQ(b.tier)}">${esc(LIB_TIERS[b.tier])}</span></span><span class="lr-state">${esc(tag)} · 涉「${esc(b.skill)}」</span><span class="lr-act">${tag.startsWith('借阅')?mini('提前归还','Game.libReturn()'):mini('撤下案头',`Game.libDesk('${b.id}')`)}</span></div>`

    const groups={};
    for(const id of L.revealed){const b=libBook(id);if(b)(groups[b.skill]=groups[b.skill]||[]).push(b)}
    const order=[...SKILL_POOL,...Object.keys(groups).filter(k=>!SKILL_POOL.includes(k))];
    const groupHtml=order.filter(k=>groups[k]&&groups[k].length).map(k=>{
      const books=groups[k].slice().sort((a,b)=>{
        const pri=x=>L.borrowed===x.id?0:L.desk===x.id?0:L.owned.includes(x.id)?1:2;
        return pri(a)-pri(b)||a.tier-b.tier;
      });
      const inHand=books.filter(b=>L.borrowed===b.id||L.desk===b.id||L.owned.includes(b.id)).length;
      const open=libOpen[k]!=null?libOpen[k]:inHand>0;
      const rows=books.map(b=>{
        const owned=L.owned.includes(b.id);
        const learned=skillKeyIn(skills,b.skill),lv=learned?Number(skills[learned])||0:0;
        const readable=b.tier===3||owned||L.borrowed===b.id;
        const readGain=!learned?`入门 ${['','3—5','4—7','5—8'][b.tier]}`:(lv>=100&&b.tier===3?'过百 +1':null);
        const acts=[];

  /* 墨妙斋：写字作画（前端自结，不走模型） */
  sheetStudio(){

    const forms=(STUDIO_FORMS[sel.type]||[]).map(f=>`<button class="craftchip${sel.form===f.id?' on':''}" onclick="Game.studioForm('${f.id}')">${esc(f.name)}</button>`).join('');
    const left=Math.max(0,STUDIO_QUOTA-stu.made);
    const papers=STUDIO_PAPERS.map(pp=>{

      const noSilver=!free&&silver<pp.cost;

      const meta=free?`本旬余 ${left}／${STUDIO_QUOTA} 幅`:`${pp.cost} 两／幅`;

        <div class="cm-meta">${esc(pp.desc)}</div></button>`;

    }).join('');
    const paper=studioPaper(sel.paper);
    const lackQuota=paper.id==='li'&&left<=0;
    const lackSilver=silver<paper.cost;
    const lackEnergy=energy<sel.energy;

    let why='';
    if(locked)why=`「${skillName}」尚未入门——先往才艺修习求师，或到藏书阁寻帖。`;

  paneTo(btn){ // 点左栏子菜单：右侧切换对应内容（不整页重渲染）

  meter(nm,v,cls){return `<div class="meter ${cls}"><span class="meter-nm">${esc(nm)}</span><span class="meter-track"><span class="meter-fill" style="width:${clamp01_100(Number(v)||0)}%"></span></span><span class="meter-v num">${esc(v)}</span></div>`},

    const panes=[
      {k:'属性',html:rankSec+`<div class="sec">${this.meter('精力',Math.round(state.energy??ENERGY_MAX),'m-cinnabar')}${tiMeter}${attrs||'<div class="sheet-note">—</div>'}${stance?`<div class="sheet-note">言行：${esc(stance)}</div>`:''}${baseNote}${disguiseRow}

  sheetChronicle(){

  npcCard(who){ // 人物行：本名为主（不变），身份（位份）为辅（会随升降变动）
    const n=(state.npcs||{})[who];

  isEmperorId(who){
    const w=String(who||'').trim();
    if(/^(皇帝|皇上|陛下|圣上|圣人|天子|万岁|今上|官家|大家|帝)$/.test(w))return true; // 古代称谓都归到帝：模型常把 who 写成单字「帝」
    if(w==='皇帝')return true;
    if(!state)return false; // 开局生成时全局 state 尚未落定：按称谓判完就收
    return !!(state.world&&state.world.emperor&&state.world.emperor.name===w)||(((state.relationships||{})[w]||{}).type==='宠爱');
  },
  empPill(who){ // 列表行知心徽标：只显阶段不显数字

  empSection(){ // 知心专页：双轨概况＋共同经历账＋久未召见的原因（数字不外露）
    const e=state.emperor;if(!e)return '';
    const stage=emperorStage(e.intimacy);
    const favor=(state.relationships||{})['皇帝'];
    const fv=typeof favor==='object'?favor.value:favor;
    const mems=[...(e.memories||[])].reverse();
    const gap=typeof e.lastContact==='number'?xunSerial(state.time)-e.lastContact:null;
    const persona=(state.world&&state.world.emperor&&state.world.emperor.persona)||''; // 玩家亲撰帝设

      `<div class="rowline"><span class="rk">知心</span><span class="rv">${esc(stage)}</span></div>`,

      (gap===0)?`<div class="rowline"><span class="rk">近来</span><span class="rv">本旬刚见过</span></div>`:(gap>0?`<div class="rowline"><span class="rk">近来</span><span class="rv">距上次有内容相处 ${gap} 旬</span></div>`:''),

    ].join('');
    const list=mems.slice(0,10).map(m=>`<div class="tl-item"><div class="tl-time">${esc(m.xun||'')} <span class="tag">${esc(m.type||'共历')}</span>${m.open?' <span class="tag t-rumor">未了</span>':''}</div>${esc(m.text)}</div>`).join('');

      ${persona?`<div class="sec"><div class="sec-cap">帝设（你所撰）</div><div class="sheet-note" style="white-space:pre-wrap;line-height:1.8">${esc(persona)}</div><div class="sheet-note">「移性符」每件可改一次。</div></div>`:''}`;

  sheetVisit(kind){ // 出门拜访：kind='妃'（六宫）/'医'（太医院）/缺省=全部相识
    const head=kind==='医'?'太医院当值的人不多。':'';

      (ids.length?`<div class="sec"><div class="sec-cap">可拜访的人物（${ids.length}）</div>${ids.map(row).join('')}</div>`:`<div class="sec"><div class="sheet-note">${empty}</div></div>`)+

  sheetHorse(){ // 马球场：观赛与学骑射；骑射每满20点，根基+1
    const p=state.protagonist||{},at=p.attributes||{},sk=p.skills||{};

    const trainNote=qi<20?'气血太虚，先养一养':(energy<HORSE_TRAIN_COST?'精力不足':(qi>=70?'气血充盈，进益更快':'骑射 +1—3，逢二十点根基 +1'));

      <div class="itemrow"><span>距下一槛</span><span class="cnt num">${esc(left)} 点（${esc(next)}）</span></div>
      <div class="itemrow"><span>气血</span><span class="cnt num">${esc(qi)}／根基 ${esc(base)}</span></div>
      <div class="sheet-note">每满 20 点，气血根基 +1；根基与骑射都不设上限。</div></div>
      <div class="sec"><div class="sec-cap">下场</div>
        <button class="npcrow" ${(phase!=='FOCUS_SELECT'||energy<HORSE_WATCH_COST)?'disabled style="opacity:.45"':''} onclick="Game.horseWatch()">
          <span class="nr-main"><span class="nr-name">场边观赛</span><span class="nr-role">看谁在打球、谁在看台，听几句场边闲话</span></span>

          <span class="nr-rel num">精力 ${HORSE_TRAIN_COST}</span></button>

      <button class="backbtn" onclick="UI.sheetBack()">◀ 返回</button>`;
  },
  setBagPane(p){bagPane=ITEM_TABS.some(([k])=>k===p)?p:'work';bagPaneTouched=true;UI.renderSheet('行囊')},
  sheetItems(){
    let h='';
    { // 手头书册：压成一行，点进藏书阁
      const L=libState();
      const held=[];
      if(L.borrowed){const b=libBook(L.borrowed);if(b)held.push(b.name+'（借阅中）')}
      if(L.desk){const b=libBook(L.desk);if(b)held.push(b.name+'（案头）')}
      const shelf=L.owned.filter(id=>id!==L.desk).length;
      if(held.length||shelf>0){
        h+=`<button class="npcrow libstrip" onclick="UI.goSheet('藏书阁')"><span class="nr-main"><span class="nr-name">手头谱册</span><span class="nr-role">${esc(held.join('、')||'无')}${shelf?` · 自抄 ${shelf} 册`:''}</span></span><span class="nr-rel">藏书阁 ›</span></button>`;
      }
    }
    const inv=state.inventory||[];
    const counts={work:0,story:0,food:0,tool:0};
    const rows=inv.map((it,i)=>{itemFlags(it);const k=itemKindOf(it);counts[k]++;return {it,i,k}});
    if(!bagPaneTouched&&!counts[bagPane]){ // 初次打开：落在第一类有东西的栏上
      const first=ITEM_TABS.find(([k])=>counts[k]);
      if(first)bagPane=first[0];
    }
    const tabs=ITEM_TABS.map(([k,label])=>`<button class="${bagPane===k?'on':''}" onclick="UI.setBagPane('${k}')">${label}<span class="snav-n num">${counts[k]}</span></button>`).join('');
    const notes={
      work:'修习功课、手作与书画所得，可赠、可献、可陈设。',
      story:'信物、文书、御赐与查案线索，多半不可典卖。',
      food:'吃食点心，吃用不耗精力，演一场后精力略复。',
      tool:'药物、香露、长期之物、手作材料与厨下食材。'
    };
    const empties={
      work:'还没有修习、手作或书画的成品。',
      story:'还没有任务、信物或查案所得。',
      food:'还没有吃食。',
      tool:'还没有药物、香露或手作物料。'
    };
    const list=rows.filter(x=>x.k===bagPane).map(({it,i})=>{
      const qtag=it.crafted?`<span class="itag on">${esc(it.quality||'手作')}</span>`:'';
      const ctag=(it.crafted&&it.category)?`<span class="itag">${esc(it.category)}</span>`:'';
      const ftag=bagPane==='food'?'<span class="itag on">可食</span>':'';
      const stag=bagPane==='story'?`<span class="itag on">${esc(it.src||'剧情')}</span>`:'';
      const specialUse=!!(SHOP_CATALOG[it.name]&&SHOP_CATALOG[it.name].usable===false);
      const ttag=bagPane==='tool'
        ?(it.durable?`<span class="itag on">长期</span><span class="itag${it.equipped!==false?' on':''}">${it.equipped!==false?'佩戴中':'已收存'}</span>`
          :`${it.mat?'<span class="itag on">材料</span>':''}<span class="itag${(it.usable||specialUse)?' on':''}">${it.usable?'可使用':(specialUse?'人物谱使用':(it.pawnable===false?'收藏':'不可使用'))}</span>`)
        :'';
      const sub=bagPane==='work'?String(it.description||it.effect||'').slice(0,22)
        :bagPane==='food'?String(it.effect||it.note||'').slice(0,22)
        :bagPane==='story'?String(it.note||'').slice(0,22)
        :String(it.mat?'手作材料':(it.effect||it.note||'')).slice(0,20);
      const count=(bagPane==='work'||it.durable)?'':(Number(it.count)>0?'×'+esc(it.count):'已典出');
      return `<button class="npcrow" onclick="UI.goSheet('物品详情',${i})"><span class="nr-main"><span class="nr-name">${esc(it.name)}</span>${sub?`<span class="nr-role">${esc(sub)}</span>`:''}</span>${qtag}${ctag}${ftag}${stag}${ttag}<span class="nr-rel num">${count}</span></button>`;
    }).join('');
    return h+`<div class="sheet-split steady"><div class="sheet-snav">${tabs}</div><div class="sheet-spane">
      <div class="sheet-note" style="margin:16px 0 6px">${esc(notes[bagPane])}</div>`
      +(list||`<div class="sec"><div class="sheet-note">${esc(empties[bagPane])}</div></div>`)+`</div></div>`;

      ${Array.isArray(it.traits)&&it.traits.length?`<div class="rowline" style="align-items:flex-start"><span style="flex:none">特质</span><span class="cnt" style="text-align:right;max-width:70%">${it.traits.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</span></div>`:''}

      ${it.inspiration?wide('灵感',it.inspiration):''}`:'';

      <div class="itemrow"><span>品质</span><span class="cnt"><span class="qbadge ${this.qualityClass(it.quality)}">${esc(it.quality||'—')}</span></span></div>
      ${it.craftValue?`<div class="itemrow"><span>估价</span><span class="cnt num">料钱 ${esc(it.matValue||0)} ＋ 工钱 ${esc(it.labor||0)} ＝ ${esc(it.craftValue)} 两</span></div>`:''}

      ${Array.isArray(it.materials)&&it.materials.length?`<div class="itemrow"><span>${it.src==='墨妙斋'?'用纸':'耗料'}</span><span class="cnt">${esc(it.materials.join('、'))}</span></div>`:''}
      ${it.energy!=null?`<div class="itemrow"><span>耗精力</span><span class="cnt num">${esc(it.energy)}</span></div>`:''}
      ${it.inspiration?wide('灵感',it.inspiration):''}`:'';

  },
  sheetShop(){
    const p=state.protagonist||{};const shop=(state.system&&state.system.shop)||[];
    const left=SHOP_CYCLE-(((Number(state.turn)||1)-1)%SHOP_CYCLE); // 本轮珍品还剩几旬
    const ownOf=nm=>(state.inventory||[]).filter(x=>x.name===nm).reduce((a,x)=>a+(Number(x.count)||0),0);
    const row=(it,i)=>{
      const cat=SHOP_CATALOG[it.name]||{};
      const durable=cat.kind==='durable';
      const owned=durable&&ownOf(it.name)>0;
      const mode=shopModeOf(it.name);
      const tag=`<span class="itag${mode==='instant'?' on':''}">${SHOP_MODE_LABEL[mode]||'消耗'}</span>`;
      const right=owned?'<span class="nr-rel" style="color:var(--ink-soft)">已拥有</span>'
        :`<span class="nr-rel num">积分 ${esc(it.cost)}${!durable&&ownOf(it.name)>0?` · 持有 ×${ownOf(it.name)}`:''}</span>`;
      return `<button class="npcrow" onclick="UI.goSheet('商品详情',${i})"><span class="nr-name">${esc(it.name)}</span>${tag}${right}</button>`;
    };
    const take=names=>names.map(n=>{const i=shop.findIndex(x=>x.name===n);return i>=0?[shop[i],i]:null}).filter(Boolean);
    const staples=take(SHOP_STAPLES), guards=take(SHOP_GUARDS);
    const rot=shop.map((it,i)=>[it,i]).filter(([it])=>!SHOP_STAPLE_SET.has(it.name)&&!SHOP_GUARD_SET.has(it.name));
    const sec=(cap,note,list)=>list.length?`<div class="sec"><div class="sec-cap">${cap}</div><div class="sheet-note" style="margin:0 0 6px">${note}</div>${list.map(([it,i])=>row(it,i)).join('')}</div>`:'';
    return `<div class="sec"><div class="sec-cap">宫斗系统 · 商城</div>

      +sec('护身常备','买一次便随身生效，不必复购；入手后在行囊详情页启停。',guards)

  sheetShopDetail(i){
    const it=((state.system&&state.system.shop)||[])[i];
    if(!it)return '<div class="sheet-note">此物已不在本轮货色中。</div>';
    const cat=SHOP_CATALOG[it.name]||{};
    const durable=cat.kind==='durable';
    const mode=shopModeOf(it.name);
    const own=(state.inventory||[]).filter(x=>x.name===it.name).reduce((a,x)=>a+(Number(x.count)||0),0);
    const owned=durable&&own>0;
    const invIdx=(state.inventory||[]).findIndex(x=>x.name===it.name&&(Number(x.count)||0)>0);
    const modeText=mode==='instant'?'即时 · 点用即结：不占本旬、不耗精力（每旬限用一件即效之物）'
      :mode==='scene'?'剧情 · 需演一场：占本旬一轮、耗 5 精力'
      :mode==='guard'?'护身 · 随身生效：自动触发，无需使用'
      :'系统 · 专用入口：按用法所示使用';
    const wide=(k,v)=>`<div class="rowline" style="align-items:flex-start"><span style="flex:none">${k}</span><span class="cnt" style="white-space:normal;text-align:right;max-width:70%">${esc(v)}</span></div>`;
    const buy=owned
      ?`<button class="btn" disabled style="opacity:.45;letter-spacing:.1em;text-indent:.1em">已拥有 · 随身启用中</button>`
      :`<button class="btn btn-primary" style="letter-spacing:.1em;text-indent:.1em" onclick="Game.buyItem(${i})">购买 · 积分 ${esc(it.cost)}</button>`;
    const useNow=(mode==='instant'&&invIdx>=0)
      ?`<button class="btn btn-line" style="letter-spacing:.1em;text-indent:.1em" onclick="Game.useItem(${invIdx})">现在就用 · 不占本旬</button>`:'';
    return `<button class="backbtn" onclick="UI.sheetBack()">◀ 返回商城</button>
      <div class="sec"><div class="sec-cap">${esc(it.name)}</div>
      <div class="itemrow"><span>类别</span><span class="cnt">${durable?'长期之物 · 随身为用':'消耗品 · 用毕即无'}</span></div>
      <div class="itemrow"><span>使用方式</span><span class="cnt">${modeText}</span></div>
      <div class="itemrow"><span>价格</span><span class="cnt num">积分 ${esc(it.cost)}</span></div>
      ${own>0?`<div class="itemrow"><span>持有</span><span class="cnt num">×${own}</span></div>`:''}
      ${cat.desc?wide('详情',cat.desc):''}
      ${cat.usage?wide('用法',cat.usage):''}
      ${cat.fx?wide('效用',cat.fx):''}</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">${buy}${useNow}</div>`;
  },
  sheetMeetTargets(){ // 邂逅笺：择定下一次园中必遇之人
    const npcs=state.npcs||{};
    const rels=state.relationships||{};
    const empId=Object.keys(npcs).find(id=>this.isEmperorId(id))||Object.keys(rels).find(id=>this.isEmperorId(id))||'皇帝';
    const dg=disguiseActive(state);
    const ids=[empId];
    for(const id of Object.keys(npcs)){
      if(id===empId)continue;
      if(dg&&(id===dg.who||id===dg.name))continue;
      const n=npcs[id];if(!n)continue;
      if(!n.known&&!/太后/.test(id+(n.rank||'')))continue; // 未照面的人不在可选之列；太后是例外
      ids.push(id);
    }
    const rows=ids.map(id=>{
      const c=this.npcCard(id);
      const role=c.role==='只知名讳'?'':c.role; // 帝的档案可能不在 npcs 里，别在名字下写“只知名讳”
      return `<button class="npcrow" onclick="Game.pickMeetTarget('${esc(id)}')"><span class="nr-main"><span class="nr-name">${esc(c.name)}</span>${role?`<span class="nr-role">${esc(role)}</span>`:''}</span><span class="nr-rel">${this.relBadge(id)}</span></button>`;
    }).join('');
    const pending=state.gardenMeetWhom;
    return `<div class="sheet-note" style="margin-top:0">下一次往御花园，必遇此人。${pending?`<br>当前已记：<b>${esc(dispName(pending))}</b>，重择即作废。`:''}</div>
      <div class="sec"><div class="sec-cap">可选之人</div>${rows||'<div class="sheet-note">宫中尚无相识之人，暂无可遇。</div>'}</div>
      <button class="backbtn" onclick="UI.sheetBack()">◀ 返回行囊</button>`;
  },
  sheetKnotTargets(){ // 同心结：择一人相赠
    const npcs=state.npcs||{},rels=state.relationships||{};
    const empId=Object.keys(npcs).find(id=>this.isEmperorId(id))||Object.keys(rels).find(id=>this.isEmperorId(id))||'皇帝';
    const dg=disguiseActive(state);
    const ids=[empId],seen=new Set(ids);
    const add=id=>{if(!id||seen.has(id))return;if(dg&&(id===dg.who||id===dg.name))return;seen.add(id);ids.push(id)};
    for(const id of Object.keys(npcs)){
      if(id===empId)continue;
      const n=npcs[id];if(!n)continue;
      if(!n.known&&!/太后/.test(id+(n.rank||'')))continue;
      add(id);
    }
    for(const id of Object.keys(rels))if(!this.isEmperorId(id))add(id); // 只有关系簿、没有档案的旧识也可赠
    const rows=ids.map(id=>{
      const c=this.npcCard(id);
      const role=c.role==='只知名讳'?'':c.role;
      return `<button class="npcrow" onclick="Game.giveKnot('${esc(id)}')"><span class="nr-main"><span class="nr-name">${esc(c.name)}</span>${role?`<span class="nr-role">${esc(role)}</span>`:''}</span><span class="nr-rel">${this.relBadge(id)}</span></button>`;
    }).join('');
    return `<div class="sheet-note" style="margin-top:0">择一人相赠：好感 +2；赠帝为宠爱 +1。即刻生效，不占本旬、不耗精力。</div>

      <button class="backbtn" onclick="UI.sheetBack()">◀ 返回行囊</button>`;
  },

          :`<button class="npcrow" onclick="UI.goSheet('商城')">

            <span class="nr-rel">去商城 ›</span></button>`}</div>`;

      <span class="nr-main"><span class="nr-name">${esc(o.label)}</span><span class="nr-role">${esc(o.desc)}</span></span>
      <span class="nr-rel num">精力 ${o.cost}</span></button>`};
    const frame=d?`<div class="sec"><div class="sec-cap">借脸行事</div>
      <button class="npcrow" onclick="UI.goSheet('借脸')">
        <span class="nr-main"><span class="nr-name">以「${esc(d.name)}」的名义做点什么</span><span class="nr-role">赊账、争执、递物、留名帖</span></span>
        <span class="nr-rel">栽赃 ›</span></button></div>`:'';
    return `<div class="sec"><div class="sec-cap">宫门</div>${status}
      <div class="sheet-note">${d?'凭这张脸出宫：门禁未必记得住你，也未必查不出。':'腰牌出入有记档，言行仍会传回宫里。'}</div></div>
      <div class="sec"><div class="sec-cap">宫外去处</div>${['market','teahouse','temple','family'].map(row).join('')}</div>
      ${frame}
      <div class="sheet-note">事毕回宫；每处耗精力按行内所记。</div>`;
  },
  sheetDisguiseTargets(){ // 易容膏：择一个已相识之人（帝除外）
    const npcs=state.npcs||{},rels=state.relationships||{};
    const ids=[],seen=new Set();
    for(const id of Object.keys(npcs)){
      if(this.isEmperorId(id))continue;
      const n=npcs[id];if(!n)continue;
      if(!n.known&&!/太后/.test(id+(n.rank||'')))continue;
      if(seen.has(id))continue;seen.add(id);ids.push(id);
    }
    for(const id of Object.keys(rels)){if(!this.isEmperorId(id)&&!seen.has(id)){seen.add(id);ids.push(id)}}
    const rows=ids.map(id=>{
      const c=this.npcCard(id);
      const role=c.role==='只知名讳'?'':c.role;
      return `<button class="npcrow" onclick="Game.pickDisguiseTarget('${esc(id)}')"><span class="nr-main"><span class="nr-name">${esc(c.name)}</span>${role?`<span class="nr-role">${esc(role)}</span>`:''}</span><span class="nr-rel">${this.relBadge(id)}</span></button>`;
    }).join('');
    return `<div class="sheet-note" style="margin-top:0">气血 -10，本旬以她的身份行事；帝不可易容。</div>

      <button class="backbtn" onclick="UI.sheetBack()">◀ 返回</button>`;

      <div class="sheet-note" style="margin-top:10px">${it.mat?'入手作料。':'入行囊。'}</div>`;
  },
  relBadge(who){
    const r=(state.relationships||{})[who];
    const isObj=r&&typeof r==='object';
    const val=isObj?r.value:r;
    const num=(typeof val==='number')?val:null;
    if(isObj&&r.type==='仇恨'){ // 仇恨值是敌意深浅，不能拿好感档位读成"往来密切"
      const tag=num==null?'宿怨':(num>=50?'积怨已深':(num>=20?'有嫌隙':(num>0?'不睦':'有隙')));
      return `<span class="relpill p-bad">${esc(tag)}</span><span class="rel-v num">${num==null?'':num}</span>`;
    }
    const cls=num==null?'p-mid':(num>=50?'p-good':(num>0?'p-mid':'p-bad'));
    const tag=num==null?'—':(num>=50?'往来密切':(num>=20?'相熟':(num>0?'相识':(num===0?'初识':'有隙')))); // 只按数值客观描述熟悉程度：不用友善/敌意等感情词，也不采信模型自填的 type/note 标签
    return `<span class="relpill ${cls}">${esc(tag)}</span><span class="rel-v num">${num==null?'':num}</span>`;
  },

  sheetNpcs(){
    const seg=this.gongpuSeg();
    const npcs=state.npcs||{};
    const ids=Object.keys(npcs).filter(id=>npcs[id].known);
    const rels=Object.keys(state.relationships||{});
    const all=[...ids,...rels.filter(who=>!ids.includes(who))];
    if(!all.length)return seg+'<div class="gongpu-body"><div class="sec"><div class="sheet-note">尚无相识之人。</div></div></div>';
    const row=who=>this.npcRowHtml(who,`UI.goSheet('NPC详情','${esc(who)}')`);
    const cls=who=>avatarClassOf(this.isEmperorId(who)?'皇帝':who,(npcs[who]&&npcs[who].rank)||'');
    const G={top:[],consort:[],maid:[],eunuch:[],misc:[]};
    all.forEach(who=>{
      const c=cls(who);
      const g=(c==='emperor'||c==='dowager')?'top':((c==='consort'||c==='consortHi')?'consort':((c==='maid'||c==='matron')?'maid':(c==='eunuch'?'eunuch':'misc')));
      G[g].push(who);
    });
    const block=(label,list,open)=>list.length?`<details class="libgroup npcgroup"${open?' open':''}><summary>${label}（${list.length}）</summary>${list.map(row).join('')}</details>`:'';
    const topLabel=!G.top.length?'':(G.top.every(who=>cls(who)==='dowager')?'太后':(G.top.every(who=>cls(who)==='emperor')?'帝':'帝与太后'));
    return seg+'<div class="gongpu-body">'+(G.top.length?`<div class="sec"><div class="sec-cap">${topLabel}</div>${G.top.map(row).join('')}</div>`:'')
      +block('妃嫔',G.consort,true)+block('宫女',G.maid)+block('太监',G.eunuch)+block('其他',G.misc)+'</div>';
  },

        ? `<div class="fac-meta">领袖 ${esc(own.leader)}（${esc(me.rank)}）　·　盟友　·　实力 ${own.power}</div>
           <div class="rowline"><span class="rk">成员</span><span class="rv">${(own.members||[]).length?own.members.map(m=>esc(m)).join('、'):'尚无'}</span></div>`
        : `<button class="npcrow" style="width:100%"${canFound?'':' disabled style="opacity:.45"'} onclick="Game.foundFaction()"><span class="nr-name">自立一系</span><span class="nr-depth">${okRank?'':'须嫔及以上'}　相熟 ${followers.length}/2　银两 ${Math.round(Number(me.silver)||0)}/30　精力 ${Math.round(Number(state.energy)||0)}/10</span></button>`)+
      `</div>`;
    if(!fs.length)return seg+'<div class="gongpu-body">'+ownBlock+'<div class="sec"><div class="sheet-note">宫中尚无成形的派系。</div></div></div>';
    const order={敌对:0,压制:1,观望:2,拉拢:3,盟友:4};
    fs.sort((a,b)=>(a.defunct?9:(order[a.attitude]??8))-(b.defunct?9:(order[b.attitude]??8)));
    const cards=fs.map(f=>{
      const npc=factionNpc(f.leader);
      const rk=npc&&npc.rank?String(npc.rank):'';
      const tr=npc?normalizePersona((npc.profile||{}).traits||[]).join('、'):'';
      const ls=f.leader?factionMemberRank(f.leader):0;
      const mem=(f.members||[]).filter(m=>{ // 显示前再挡一道：皇后、太后与位份高于领袖的人不列
        const n=factionNpc(m);if(!n||!n.known)return false;
        if(/皇帝|皇上|太后|皇后/.test(m))return false;
        const sc=rankScoreOf(n.rank);return !(sc>0&&ls>0&&sc>ls);
      });
      const notes=(f.notes||[]).slice(-1).map(n=>`${n.xun?esc(n.xun)+'　':''}${esc(n.text)}`).join('<br>'); // 最近动向只留一句
      const pill=f.defunct?'p-mid':(f.attitude==='敌对'||f.attitude==='压制')?'p-bad':(f.attitude==='盟友'||f.attitude==='拉拢')?'p-good':'p-mid';
      return `<div class="faccard${f.defunct?' off':''}">
        <div class="fac-head"><span class="fac-nm">${esc(f.name)}</span><span class="relpill ${pill}">${f.defunct?'名存实亡':esc(f.attitude)}</span></div>
        <div class="fac-meta">领袖 ${esc(f.leader||'未明')}${rk?`（${esc(rk)}${tr?`，${esc(tr)}`:''}）`:''}　·　${esc(f.stance)}${f.goal?`　·　${esc(f.goal)}`:''}</div>
        ${this.meter('实力',f.power,f.defunct?'m-ink':'m-indigo')}
        ${f.defunct?'':`<div class="rowline"><span class="rk">对你</span><span class="rv num">${esc(f.attitude)}｜${esc(factionRelLine(f))}</span></div>`}
        <div class="rowline"><span class="rk">成员</span><span class="rv">${mem.length?mem.map(m=>esc(m)).join('、'):'尚无相识的成员'}</span></div>
        ${f.defunct?'':(f.step?`<div class="fac-step"><b>当前一步</b>：${esc(f.step)}</div>`:`<div class="fac-step" style="color:var(--ink-soft)">按兵不动</div>`)}
        ${notes?`<div class="sheet-note" style="margin-top:8px">最近动向<br>${notes}</div>`:''}
      </div>`;
    }).join('');
    return seg+'<div class="gongpu-body">'+ownBlock+`<div class="sec"><div class="sec-cap">宫中派系（${fs.filter(f=>!f.defunct).length} 系在世）</div>${cards}</div>
      <div class="sheet-note">只列听说过的成员。</div>`+'</div>';
  },
  mindSection(id){ // 对方对你：默认不可知；印象位即按钮，点击即耗读心笺一张即时生成，不落档
    const ta=npcSexOf(state,id)==='m'?'他':'她';
    const v=impView[id];
    if(v&&typeof v==='object')return `<div class="rel"><span class="rel-v" style="width:auto">${esc(v.text)}</span></div><div class="sheet-note">——读心所见，止于第 ${xunNoOf(v.turn)} 旬；要知如今，再点一次。</div>`;
    if(v==='…')return `<div class="sheet-note">笺上火光一闪，${ta}的影子正在笺上聚拢……</div>`;
    const own=(state.inventory||[]).filter(x=>x.name==='读心笺').reduce((a,x)=>a+(Number(x.count)||0),0);
    if(own)return `<button class="npcrow" style="width:100%" onclick="Game.readMind('${esc(id)}')"><span class="nr-name">${ta}心底如何看待你——不可知</span><span class="nr-depth">读心笺 ×1 · 点击窥心</span></button><div class="sheet-note">尚有 ${own} 张。</div>`;
    return `<div class="sheet-note">读心笺可在商城换购。</div>`;
  },
  sheetNpcDetail(id){
    const n=(state.npcs||{})[id];
    if(!n){ // 只知名讳：暂无双层档案，先给关系概况
      return `<button class="backbtn" onclick="UI.sheetBack()">◀ 返回人物谱</button>
      <div class="sec"><div class="sec-cap">概况</div>
        <div class="rowline"><span class="rk">称谓</span><span class="rv">${esc(id)}</span></div>
        <div class="rowline"><span class="rk">关系</span><span class="rv">${this.relBadge(id)}</span></div>
        <div class="rowline"><span class="rk">相识</span><span class="rv">—</span></div></div>
      ${this.isEmperorId(id)?this.empSection():''}
      <div class="sheet-note">尚无档案。</div>`;
    }
    const prof=n.profile||{};
    const empPersonaOn=this.isEmperorId(id)&&!!(state.world&&state.world.emperor&&String(state.world.emperor.persona||'').trim()); // 帝设在档：感知性情栏退位
    const imp=prof.impressions||{};
    const me=state.protagonist.name||'主控';
    const ta=npcSexOf(state,id)==='m'?'他':'她';
    const impRow=([who,v])=>`<div class="rel"><span class="rel-nm">${esc(who)}</span><span class="rel-v" style="width:auto">${esc(v.note||v.tag||'')}</span></div>`;
    const impOther=Object.entries(imp).filter(([w])=>w!==me).map(impRow).join('')||`<div class="sheet-note">未见${ta}对旁人的表态。</div>`;
    const bio=[...(Array.isArray(prof.biography)?prof.biography:[])].reverse().map(e=>`<div class="tl-item"><div class="tl-time">${esc(e.time)} ${e.src==='传闻'?'<span class="tag t-rumor">传闻·存疑</span>':`<span class="tag">${esc(e.src||'亲见')}</span>`}</div>${esc(e.text)}</div>`).join('');
    const recent=(Array.isArray(prof.recent)?prof.recent:[]).map(x=>`<div class="itemrow"><span>${esc(x)}</span></div>`).join('');
    const realName=n.realName||n.name||id, addr=n.name||id;
    const intel=n.skillIntel&&typeof n.skillIntel==='object'?n.skillIntel:{};
    const bond=bondValue(state,id);
    const intelSection=Object.keys(intel).map(name=>{
      const v=Number((n.skills||{})[name])||0;
      const selfHas=skillUnlocked(state.protagonist.skills||{},name);
      const bondOk=bond!=null&&bond>=SKILL_TEACH_BOND;
      const act=selfHas
        ?'<div class="sheet-note">此艺你已入门，不必再学。</div>'
        :(!(v>SKILL_TEACH_MIN)
          ?`<div class="sheet-note">${ta}于此道未至精熟，教不了人。</div>`
          :(bondOk?`<div class="setbtns"><button class="btn btn-line" onclick="Game.askTeach('${esc(id)}','${esc(name)}')">当面求教「${esc(name)}」 · 精力 ${focusEnergyCost('求师')}</button></div>`
            :`<div class="sheet-note">好感 ${bond??'—'}／${SKILL_TEACH_BOND}，尚不够。</div>`));
      return `<div class="rowline"><span class="rk">${esc(name)}</span><span class="rv num">${esc(v)} · ${SKILL_LEVEL(v)}</span></div>${act}`;
    }).join('');
    return `<button class="backbtn" onclick="UI.sheetBack()">◀ 返回人物谱</button>
      <div class="sec"><div class="sec-cap">概况</div>
        <div class="nd-head">${avatarHtml(id,'nd-av')}<div><div class="nd-nm">${esc(realName)}</div><div class="nd-rk">${esc([n.rank,n.faction].filter(Boolean).join(' · ')||'宫中之人')}</div></div></div>
        <div class="rowline"><span class="rk">本名</span><span class="rv">${esc(realName)}</span></div>
        ${addr!==realName?`<div class="rowline"><span class="rk">称谓</span><span class="rv">${esc(addr)}</span></div>`:''}
        ${n.rank?`<div class="rowline"><span class="rk">位份</span><span class="rv">${esc(n.rank)}</span></div>`:''}
        ${n.faction?`<div class="rowline"><span class="rk">派系</span><span class="rv">${esc(n.faction)}</span></div>`:''}
        <div class="rowline"><span class="rk">相识</span><span class="rv">${esc(n.metAt||'—')}</span></div>
        ${this.isEmperorId(id)?'':`<div class="rowline"><span class="rk">亲疏</span><span class="rv">${esc(relTier(id).label)}${relTier(id).value==null?'':'（'+relTier(id).value+'）'}${relTier(id).meets==null?'':' · 见过 '+relTier(id).meets+' 次'}</span></div>`}
        <div class="rowline"><span class="rk">解锁度</span><span class="rv">${esc(prof.depth||'初识')}</span></div></div>
      ${this.isEmperorId(id)?this.empSection():''}
      ${(n.favor!=null&&!this.isEmperorId(id))?`<div class="sec"><div class="sec-cap">帝前</div>
        <div class="rowline"><span class="rk">帝宠</span><span class="rv num">${esc(n.favor)}</span></div>
        <div class="itemrow"><span>帝待她</span><span class="cnt">${esc(emperorAttitudeOf(n))}</span></div>
        ${n.emperorStory?`<div class="sheet-note" style="margin-top:6px">${esc(n.emperorStory)}</div>`:''}
        ${n.arc?`<div class="itemrow" style="margin-top:6px"><span>她眼下的事</span><span class="cnt">${esc(n.arc)}</span></div>`:''}</div>`:''}
      ${(this.isEmperorId(id)&&empPersonaOn)?'':`<div class="sec"><div class="sec-cap">已感知的性情</div>${normalizePersona(prof.traits).map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'<div class="sheet-note">所知尚浅。</div>'}</div>`}
      <div class="sec"><div class="sec-cap">才艺见闻</div>${intelSection||`<div class="sheet-note">尚未听说${ta}精于何艺。</div>`}</div>
      <div class="sec"><div class="sec-cap">${ta}对你</div>${this.mindSection(id)}</div>
      ${(secretsKnownOf(id).length)?`<div class="sec"><div class="sec-cap">掌握的把柄</div>${secretsKnownOf(id).map(s=>`<div class="itemrow"><span>${s.used?'（已抖出，成公开旧事）':''}${esc(s.text)}</span></div>`).join('')}</div>`:''}
      ${(n.memories&&n.memories.length)?`<div class="sec"><div class="sec-cap">旧账</div><div class="tl">${[...n.memories].reverse().map(m=>`<div class="tl-item"><div class="tl-time">${esc(m.xun||'')}</div>${esc(m.text)}</div>`).join('')}</div></div>`:''}
      <div class="sec"><div class="sec-cap">${ta}对他人（据你所知）</div>${impOther}</div>
      <div class="sec"><div class="sec-cap">生平所知</div>${bio?`<div class="tl">${bio}</div>`:'<div class="sheet-note">还没有可记的往来。</div>'}</div>
      ${recent?`<div class="sec"><div class="sec-cap">最近动向</div>${recent}</div>`:''}`;
  },
  paneSaves(){
    const cur=state?`<div class="sheet-note">当前：第 ${xunNo()} 旬 · ${esc(fmtTime())}</div>`:'';
    const slotHtml=(key,label,auto)=>{
      let p=null;try{p=JSON.parse(localStorage.getItem(key))}catch(e){}
      const t=p?new Date(p.savedAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      if(!p)return auto?`<div class="slot empty"><div class="sl-head">${label}</div><div class="sl-log">空档位</div></div>`
        :`<div class="slot empty"><div class="sl-head">${label}</div><div class="sl-log">空档位</div>
        <div class="sl-ops"><button onclick="Game.overwriteSlot('${key}')">存入当前进度</button></div></div>`;
      return `<div class="slot"><div class="sl-head">${label}<span class="sl-time num">${t} · 第${p.turn==null?'?':xunNoOf(p.turn)}旬</span></div>
        <div class="sl-log">${esc(p.log||'（无摘要）')}</div>
        <div class="sl-ops"><button onclick="Game.loadSlot('${key}',${auto?1:0})">读取</button>${auto?'':`<button onclick="Game.overwriteSlot('${key}')">覆盖</button>`}<button class="danger" onclick="Game.deleteSlot('${key}')">删除</button></div></div>`;
    };
    return cur+`<div class="sec"><div class="sec-cap">自动档</div>${slotHtml(SV.auto,'自动存档',true)}</div>
      <div class="sec"><div class="sec-cap">手动档</div>${[1,2,3].map(i=>slotHtml(SV.manual(i),'档位 '+i,false)).join('')}</div>
      <div class="setbtns"><button class="btn btn-ghost" onclick="Game.exportSave()">导出当前档</button><button class="btn btn-line" onclick="Game.importSave()">导入 JSON</button></div>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="Game.onImportFile(this)">
      <div class="sheet-note">自动档在每次本旬结算后更新；导入会直接覆盖当前进度，操作前请确认。</div>`;
  },
  sheetSettings(){
    return `<div class="setnav">
      <button class="${setPane==='存档'?'on':''}" onclick="Game.switchSetPane('存档')">存档</button>
      <button class="${setPane==='API'?'on':''}" onclick="Game.switchSetPane('API')">API 设置</button>
      <button class="${setPane==='音乐'?'on':''}" onclick="Game.switchSetPane('音乐')">音乐</button>
      <button class="${setPane==='脱困'?'on':''}" onclick="Game.switchSetPane('脱困')">脱困</button>
    </div>${setPane==='存档'?this.paneSaves():setPane==='音乐'?this.paneBgm():setPane==='脱困'?this.paneEscape():this.paneApi()}`;
  },
  paneEscape(){
    const hasState=!!state;
    return `<div class="sec"><div class="sec-cap">脱离卡死</div>
      <div class="sheet-note" style="margin-top:0">中止当前生成并回到住处；本次未落定的变化一并退还，已结算的旬不回退。</div>
      <div class="setbtns"><button class="btn btn-primary" onclick="Game.escapeStuck()" ${hasState?'':'disabled'}>脱离卡死</button></div>
      <div class="sheet-note">${hasState?(safePoint?'可退回本次操作前。':'进入对局后会记录落定点。'):'尚未开局。'}</div></div>`;
  },
  paneBgm(){
    const s=loadSettings();
    return `<div class="sec"><div class="sec-cap">背景音乐</div>
      <div class="setrow"><span class="sk">曲目</span><select onchange="Game.chooseBgm(this.value)"><option value="0" ${s.bgm===false?'selected':''}>关闭</option>${BGM_TRACKS.map(t=>`<option value="${t.id}" ${s.bgm!==false&&(Number(s.bgmTrack)||1)===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div>
      <div class="setrow"><span class="sk">速率</span><input type="range" id="setBgmRate" min="0.5" max="1.5" step="0.05" value="${s.bgmRate||1}" oninput="Game.setBgmRate(parseFloat(this.value))"><span class="sk num" id="bgmRateVal">${Math.round((s.bgmRate||1)*100)}%</span></div>
      <div class="sheet-note" style="margin-top:6px">选中即切换。</div></div>`;
  },
  paneApi(){
    const s=loadSettings();
    const profs=readApiProfiles();
    const profHtml=profs.length?profs.map((p,i)=>{
      const host=apiHostOf(p.baseUrl),note=String(p.note||'').trim();
      return `<div class="slot">
        <div class="sl-head"><span id="apiProfHead${i}">${esc(note||host)}</span><span class="sl-time">${apiProfileActive(p,s)?'使用中':''}</span></div>
        <div class="sl-log" id="apiProfLog${i}">${esc(p.model||'deepseek-chat')}${note?` · ${esc(host)}`:''} · ${esc(apiProfileTail(p.apiKey))}</div>
        <div class="sl-note"><input id="apiProfNote${i}" maxlength="20" placeholder="备注（如：主号、备用、便宜档）" value="${esc(note)}" onchange="Game.setApiProfileNote(${i},this.value)"></div>
        <div class="sl-ops"><button onclick="Game.applyApiProfile(${i})" ${apiProfileActive(p,s)?'disabled':''}>切换</button><button class="danger" onclick="Game.deleteApiProfile(${i})">删除</button></div>
      </div>`;}).join(''):`<div class="slot empty"><div class="sl-head">还没有存过接口</div><div class="sl-log">填好下方配置后，点「存为常用」即可保存，最多三个。</div></div>`;
    return `<div class="sec"><div class="sec-cap">常用接口 <span style="font-size:12px;font-weight:400;color:var(--ink-soft)">最多三个</span></div>
      ${profHtml}
      <div class="setbtns"><button class="btn btn-line" onclick="Game.saveApiProfile()">把当前填写存为常用</button></div>
      <div class="sheet-note" style="margin-top:6px">点「切换」即刻换用，不必重填；只改本机配置，不影响存档。地址、模型与 Key 都相同的再存一次即覆盖，不另占一格。备注可随手改，离开输入框即保存。</div></div>
      <div class="sec"><div class="sec-cap">模型服务</div>
      <div class="setrow"><span class="sk">API Key</span><input id="setKey" type="password" placeholder="sk-…" value="${esc(s.apiKey)}"></div>
      <div class="setrow"><span class="sk">接口地址</span><input id="setBase" placeholder="https://api.deepseek.com/v1" value="${esc(s.baseUrl)}"></div>
      <div class="setrow"><span class="sk">模型</span><input id="setModel" placeholder="deepseek-chat" value="${esc(s.model)}"></div>
      <div class="setrow"><span class="sk">流式输出</span><select id="setStream"><option value="1" ${s.stream!==false?'selected':''}>开启（边写边看，推荐）</option><option value="0" ${s.stream===false?'selected':''}>关闭（接口不支持流式时）</option></select></div>
      <div class="setrow"><span class="sk">外观</span><select id="setTheme"><option value="auto" ${s.theme==='auto'?'selected':''}>跟随系统</option><option value="light" ${s.theme==='light'?'selected':''}>宣纸（浅色）</option><option value="dark" ${s.theme==='dark'?'selected':''}>墨底（深色）</option></select></div>
      <div class="setrow"><span class="sk">例行速览</span><select onchange="Game.setFastRoutine(this.value==='1')"><option value="1" ${s.fastRoutine!==false?'selected':''}>开启（无事旬正文压成一句）</option><option value="0" ${s.fastRoutine===false?'selected':''}>关闭（无事旬也全文演绎）</option></select></div>
      <div class="sheet-note" style="margin-top:6px">${lastApiStat?`上次请求：${lastApiStat.sec.toFixed(1)} 秒 · 输入 ${lastApiStat.in??'?'}${lastApiStat.cache!=null?`（缓存命中 ${lastApiStat.cache}）`:''} / 输出 ${lastApiStat.out??'?'} tokens`:'尚无请求记录'}</div>
      <div class="setbtns"><button class="btn btn-primary" onclick="Game.saveSettingsFromUI()">保存设置</button><button class="btn btn-line" id="btnTestApi" onclick="Game.testApi()">测试连通</button></div>
      <div id="apiTestRes" style="display:none;margin-top:10px;font-size:13px;line-height:1.7;border-radius:2px;padding:8px 10px"></div></div>
      <div class="sec"><div class="sec-cap">数据</div>
      <div class="setbtns"><button class="btn btn-line" onclick="Game.clearAll()">清空本地全部数据</button></div>
      <div class="sheet-note">Key 只保存在本机浏览器。版本 ${BUILD}。</div></div>`;
  }
};

/* 货架分组：常备即用 9 件、护身常备 7 件常驻；其余消耗品三旬轮换 4 件 */
const SHOP_STAPLES=['读心笺','玉容散','益气丸','安神香','明目露','双鲤笺','同心结','小还丹','易容膏'];
const SHOP_GUARDS=['避毒珠','玉髓杯','敛息佩','免罪金牌（小）','藏锋匣','耳报铃','子嗣缘符'];
const SHOP_ROTATE_POOL=['驻颜膏','静心香篆','传声鹤','邂逅笺','《青囊残方》','迷魂香','壮骨膏','替身纸人','坐胎药','假孕散','移性符'];
const SHOP_STAPLE_SET=new Set(SHOP_STAPLES), SHOP_GUARD_SET=new Set(SHOP_GUARDS);
const SHOP_INSTANT=new Set(['玉容散','驻颜膏','益气丸','小还丹','同心结']);
const SHOP_SYSTEM=new Set(['读心笺','邂逅笺','移性符','易容膏']);
const SHOP_VER=3; // 货架与价目改版：旧档读入时按新版本重排一次
const SHOP_MODE_LABEL={instant:'即时',scene:'演一场',guard:'护身',system:'系统'};
function shopModeOf(name){const c=SHOP_CATALOG[name];return (c&&c.mode)||(SHOP_INSTANT.has(name)?'instant':(SHOP_SYSTEM.has(name)?'system':'scene'))}
function shopCycleOf(turn){return Math.floor(((Number(turn)||1)-1)/SHOP_CYCLE)} // 第几轮货色（每 3 旬一轮）
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function refreshShop(s){ // 常备货固定，珍品按轮次洗牌：同轮货色固定，旧档读入与新旬推进都会重算
  const sys=s.system=s.system||{};if(!Array.isArray(sys.shop))sys.shop=[];
  const cycle=shopCycleOf(s.turn);
  if(sys.shopV===SHOP_VER&&sys.shopCycle===cycle&&sys.shop.length)return;
  const rnd=mulberry32((cycle+1)*2654435761>>>0);
  const pool=SHOP_ROTATE_POOL.slice();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  const names=SHOP_STAPLES.concat(SHOP_GUARDS,pool.slice(0,SHOP_ROTATE));
  sys.shop=names.map(n=>({name:n,cost:SHOP_CATALOG[n].cost}));
  sys.shopCycle=cycle;sys.shopV=SHOP_VER;
}

function craftPushItemTo(s,item){ // 不依赖全局 state 的入库：供旧档迁移补入门材料
  if(!s||!Array.isArray(s.inventory)||!item||!item.name)return null;
  const it=itemFlags(Object.assign({count:1,note:''},item));
  const n=Number(it.count);it.count=Number.isFinite(n)?n:1;
  if(it.count<=0)return null;
  if(!it.crafted){
    const ex=s.inventory.find(o=>o&&o.name===it.name&&o.note===it.note&&!o.crafted);
    if(ex){ex.count=(Number(ex.count)||0)+it.count;return ex}
  }
  s.inventory.push(it);
  return it;
}
function ensureCraftState(s){ // 旧档/新档：补 craft 状态；只补一次入门材料，不追溯历史成品

  if(!s.craft||typeof s.craft!=='object'||Array.isArray(s.craft))s.craft={v:1,history:[]};

function craftValidate(input){ // 只校验、不扣料；返回 {ok,errors,data}

function craftCapQuality(q,category){ // 前端硬封顶：技艺未习最多寻常，20—49最多精巧，50—79最多珍品，80以上才可能绝品

function craftNormalizeTraits(v){

function craftNormalizeCategory(c,data){

function craftMaterialValue(mats){ // 料钱：按材料品级与份数折算

function craftValueParts(parsed,data){ // 估价＝料钱＋工钱：料看品级与份数，工钱看品质

function revalueCraftItem(it){ // 旧档手作按「料钱＋工钱」重估：耗料记作「名×N」，按名查材料品级（书画查纸价）

  let matValue=0;
  for(const raw of (Array.isArray(it.materials)?it.materials:[])){
    const m=/^(.+?)\s*[×xX]\s*(\d+)$/.exec(String(raw||'').trim());
    const name=(m?m[1]:String(raw||'')).trim();
    const n=m?Math.max(1,Math.round(Number(m[2])||1)):1;
    let unit=0;
    const meta=CRAFT_MATERIALS[name];
    if(meta)unit=CRAFT_MAT_VALUE[Math.max(1,Math.min(4,Math.round(Number(meta.tier)||1)))]||2;
    else{const paper=STUDIO_PAPERS.find(pp=>pp.name===name);if(paper)unit=Number(paper.cost)||0}
    matValue+=unit*n;
  }

  it.labor=CRAFT_QUALITY_VALUE[it.quality]||0;
  it.craftValue=Math.max(1,Math.round(it.matValue+it.labor));

function craftConsumeMaterials(s,mats){
  for(const m of mats){
    let left=m.count;
    for(let i=(s.inventory||[]).length-1;i>=0&&left>0;i--){
      const it=s.inventory[i];
      if(!it||it.name!==m.name||!craftIsMaterialItem(it))continue;
      const have=Number(it.count)||0;
      const take=Math.min(have,left);
      it.count=have-take;left-=take;
      if(it.count<=0)s.inventory.splice(i,1);
    }
    if(left>0)throw new Error('材料「'+m.name+'」不足');
  }
}

  if(mats.length>COOK_MAX_KINDS)errs.push('食材至多 '+COOK_MAX_KINDS+' 种');
  const total=mats.reduce((a,m)=>a+m.count,0);
  if(total>COOK_MAX_TOTAL)errs.push('食材总数至多 '+COOK_MAX_TOTAL+' 份');
  const energy=Math.round(Number(input&&input.energy));
  if(!Number.isFinite(energy)||energy<COOK_ENERGY_MIN||energy>COOK_ENERGY_MAX)errs.push('精力须在 '+COOK_ENERGY_MIN+'—'+COOK_ENERGY_MAX+' 之间');
  if((Number(state&&state.energy)||0)<energy)errs.push('本旬精力不足（余 '+(Number(state&&state.energy)||0)+'）');
  const inspiration=String((input&&input.inspiration)||'').replace(/\s+/g,' ').trim();
  if(!inspiration)errs.push('先写一句灵感');
  if(inspiration.length>COOK_INSPIRATION_MAX)errs.push('灵感最多 '+COOK_INSPIRATION_MAX+' 字');
  return {ok:errs.length===0,errors:errs,data:{materials:mats,energy,inspiration}};
}
function cookBuildPayload(data){
  const p=(state&&state.protagonist)||{};
  const sk=p.skills||{},relevant={};
  for(const k in sk)if(/烹饪|药理|医术/.test(k))relevant[k]=sk[k];
  return {
    time:fmtTime(),place:'小厨房',
    protagonist:{name:p.name,rank:p.rank,age:p.age,personality:normalizePersona(p.personality),skills:relevant},
    materials:data.materials.map(m=>({name:m.name,count:m.count,tier:m.tier,tags:m.tags})),
    energy:data.energy,inspiration:data.inspiration
  };
}
function cookParse(raw,data){
  const obj=craftParseJson(raw);
  const name=craftCleanText(obj.name,12);
  if(!name)throw new Error('菜式缺少名字');
  const quality=cookCapQuality(craftNormalizeQuality(obj.quality));
  const traits=craftNormalizeTraits(obj.traits);
  const description=craftCleanText(obj.description,60)||`一道${traits[0]||'寻常'}的${data.materials[0]?data.materials[0].name:'家常'}菜。`;
  const effect=craftCleanText(obj.effect||obj.taste,100)||'入口之后，滋味一时说不清。';
  const dark=obj.dark===true||traits.some(t=>/焦糊|腥|馊|苦涩|怪味|夹生/.test(t));
  const usable=obj.usable!==false;
  const pawnable=obj.pawnable!==false;
  return {name,quality,traits,description,effect,dark,usable,pawnable};
}
function cookValueParts(parsed,data){ // 菜的估价与精力回补：品质、投入精力、食材三者一起算
  const matValue=craftMaterialValue(data.materials);
  const labor=parsed.dark?0:(COOK_LABOR[parsed.quality]||0); // 做坏了没手艺钱，只当半价料处理
  const eBase=COOK_RESTORE[parsed.quality]||0;
  const eLabor=Math.round((Number(data.energy)||0)/10);
  const eMat=Math.min(6,(data.materials||[]).reduce((a,m)=>a+Math.max(0,(Number(m.tier)||1)-1)*(Number(m.count)||1),0));
  return {
    matValue,labor,value:Math.max(1,Math.round(parsed.dark?matValue*0.5:matValue+labor)),
    cookEnergy:parsed.dark?0:Math.max(0,eBase+eLabor+eMat),
    eBase,eLabor,eMat
  };
}
function revalueCookItem(it){ // 旧档菜式按同一套重估：耗料记作「名×N」，品级查厨下食材表
  if(!it||!it.cook)return;
  const rows=Array.isArray(it.materials)?it.materials:[];
  let matValue=0,eMat=0;
  for(const raw of rows){
    const m=/^(.+?)\s*[×xX]\s*(\d+)$/.exec(String(raw||'').trim());
    const name=(m?m[1]:String(raw||'')).trim();
    const n=m?Math.max(1,Math.round(Number(m[2])||1)):1;
    const meta=kitchenMetaOf(name)||craftMaterialMeta(name);
    const tier=Math.max(1,Math.min(4,Math.round(Number(meta&&meta.tier)||1)));
    matValue+=(CRAFT_MAT_VALUE[tier]||2)*n;
    eMat+=Math.max(0,tier-1)*n;
  }
  eMat=Math.min(6,eMat);
  const labor=it.dark?0:(COOK_LABOR[it.quality]||0);
  it.matValue=matValue;it.labor=labor;
  it.craftValue=Math.max(1,Math.round(it.dark?matValue*0.5:matValue+labor));
  it.cookEnergy=it.dark?0:(COOK_RESTORE[it.quality]||0)+Math.round((Number(it.energy)||0)/10)+eMat;
}
function cookCommit(data,parsed,s){
  s=s||state;
  for(const m of data.materials){
    if(craftInventoryCount(m.name,s)<m.count)throw new Error('食材「'+m.name+'」不足');
  }
  if((Number(s.energy)||0)<data.energy)throw new Error('精力不足，菜未做成');
  craftConsumeMaterials(s,data.materials);
  s.energy=Math.max(0,Math.round((Number(s.energy)||0)-data.energy));
  const p=s.protagonist=s.protagonist||{};
  p.skills=p.skills||{};
  const oldSkill=Number(p.skills['烹饪'])||0;
  const qIdx=Math.max(0,COOK_QUALITY.indexOf(parsed.quality));
  const skillGain=1+(qIdx>=2?1:0);
  p.skills['烹饪']=Math.min(SKILL_MAX,oldSkill+skillGain);
  const worth=cookValueParts(parsed,data);
  const cookEnergy=worth.cookEnergy;
  const item={
    name:parsed.name,count:1,kind:'食物',
    note:'小厨房·'+parsed.quality+(parsed.dark?'·黑暗料理':'')+'·'+parsed.traits.join('・'),
    usable:true,pawnable:true,src:'小厨房',
    cook:true,dark:!!parsed.dark,quality:parsed.quality,traits:parsed.traits,
    description:parsed.description,effect:parsed.effect,
    inspiration:data.inspiration,
    materials:data.materials.map(m=>m.name+'×'+m.count),
    energy:data.energy,maker:p.name||'',madeAt:fmtTime(),
    matValue:worth.matValue,labor:worth.labor,craftValue:worth.value,
    cookEnergy,cookQi:!parsed.dark&&qIdx>=2,cookGlow:!parsed.dark&&qIdx>=4,
    skillGain
  };
  craftPushItemTo(s,item);
  if(typeof acquiredThisTurn!=='undefined'&&Array.isArray(acquiredThisTurn)){
    acquiredThisTurn.push({name:item.name,usable:true,pawnable:true});
    if(typeof flushAcquired==='function')flushAcquired();
  }
  const k=s.kitchen=s.kitchen&&typeof s.kitchen==='object'?s.kitchen:{v:1,history:[]};
  if(!Array.isArray(k.history))k.history=[];
  k.history.push({turn:s.turn,time:fmtTime(),name:item.name,quality:item.quality,dark:!!parsed.dark,traits:item.traits,materials:item.materials,energy:item.energy,inspiration:item.inspiration,skillGain});
  if(k.history.length>30)k.history=k.history.slice(-30);
  k.lastDish={turn:s.turn,name:item.name,quality:item.quality,dark:!!parsed.dark,traits:item.traits,inspiration:item.inspiration,skillGain};
  if(typeof logXunAction==='function')logXunAction('下厨·'+item.name);
  if(typeof persistCurrent==='function')persistCurrent();
  if(typeof markSafe==='function')markSafe();
  if(typeof UI!=='undefined'&&UI.updateStatusbar)UI.updateStatusbar();
  item.skillGain=skillGain;
  return item;
}
async function cookMake(input){
  if(abortCtrl)throw new Error('已有请求正在进行，稍候再下厨');
  const s=state;
  const v=cookValidate(input);
  if(!v.ok){const e=new Error(v.errors[0]||'下厨条件不足');e.cookErrors=v.errors;throw e}
  const data=v.data;
  const payload=cookBuildPayload(data);
  const userMsg='请按规则裁定这道菜。输入：'+JSON.stringify(payload);
  const raw=await callModel(userMsg,{
    messages:[{role:'system',content:COOK_SYSTEM},{role:'user',content:userMsg}],
    maxTokens:700,
    expect:'craft'
  });
  if(state!==s)throw new Error('下厨期间存档已切换，菜式未入库');
  const parsed=cookParse(raw,data);
  return cookCommit(data,parsed,s);
}

};

function wlPick(a){return a[Math.floor(Math.random()*a.length)]}
function wlInt(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function wlShuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=c[i];c[i]=c[j];c[j]=t}return c}
function wlPickN(a,n){return wlShuffle(a).slice(0,n)}

/* ============================================================ 每年新人（写死的年例）
   每年正月上旬固定有一名新选秀女入宫；名字、位份、家世与性情都由前端生成，模型只演入场。
   性情从“现存妃嫔里最少见的词条”起手，组合不得与任何在位者重样，避免满宫一个模子。 */
const ANNUAL_RANKS={
  high:['贵人','才人','美人'],
  mid:['才人','美人','宝林','常在'],
  low:['宝林','常在','答应','选侍','更衣','采女']
};
function consortPersonaScan(){
  const freq={},combos=new Set();
  PERSONA_ALL.forEach(t=>freq[t]=0);
  const npcs=(state&&state.npcs)||{};
  for(const id in npcs){
    const n=npcs[id];
    if(!n||rankScoreOf(n.rank)<=0)continue;
    const tr=normalizePersona(npcTraits(n));
    if(!tr.length)continue;
    combos.add(tr.slice().sort().join('|'));
    tr.forEach(t=>{freq[t]=(freq[t]||0)+1});
  }
  return {freq,combos};
}
function freshConsortPersona(){ // 冷门词条优先、组合唯一：新人的性情一眼能和旧人分开
  const scan=consortPersonaScan();
  const order=wlShuffle(PERSONA_ALL.slice()).sort((a,b)=>(scan.freq[a]||0)-(scan.freq[b]||0));
  for(const first of order){
    const out=[first];
    for(const t of order){if(out.length>=3)break;if(personaCompatible(out,t))out.push(t)}
    for(const n of [3,2]){
      const pick=out.slice(0,n);
      if(pick.length===n&&!scan.combos.has(pick.slice().sort().join('|')))return pick;
    }
  }
  const out=[order[0]||'机敏'];
  for(const t of wlShuffle(PERSONA_ALL)){if(out.length>=2)break;if(personaCompatible(out,t))out.push(t)}
  return out;
}
function annualConsortName(short){
  const used=new Set();
  const npcs=(state&&state.npcs)||{};
  for(const id in npcs){const n=npcs[id];used.add(id);if(!n)continue;if(n.name)used.add(n.name);if(n.realName)used.add(n.realName)}
  for(const who in ((state&&state.relationships)||{}))used.add(who);
  const me=state&&state.protagonist&&state.protagonist.name;
  if(me)used.add(me);
  let surname='';
  for(const s of wlShuffle(WORLD_LIB.surnames.slice())){
    if(!used.has(s+short)){surname=s;break}
  }
  if(!surname)surname=wlPick(WORLD_LIB.surnames);
  let realName='';
  for(const g of wlShuffle(WORLD_LIB.givenNames.slice())){
    if(!used.has(surname+g)){realName=surname+g;break}
  }
  if(!realName)realName=surname+short;
  return {name:surname+short,realName,surname};
}
function annualConsortIntake(){ // 每年一次；已在此年发过则不重复（读档、重进同一旬都安全）
  if(!state)return null;
  const year=Number(state.time&&state.time.year)||1;
  if(Number(state.lastConsortYear)>=year)return null;
  state.lastConsortYear=year;
  const high=Math.random()<0.22;
  const family=high?wlPick(WORLD_LIB.highFamilies):wlPick(WORLD_LIB.lowFamilies);
  const pool=/宗室|勋贵/.test(family)?ANNUAL_RANKS.high
    :/父任县令|书香|小吏|罪臣|医家|织户/.test(family)?ANNUAL_RANKS.mid:ANNUAL_RANKS.low;
  const short=wlPick(pool);
  const rank=WL_LOW_RANKS[short]||'正九品 采女';
  const {name,realName}=annualConsortName(short);
  const traits=freshConsortPersona();
  const age=wlInt(15,19);
  const goal=wlPick(['站稳脚跟，先看清谁说得上话','寻一位靠得住的姐姐','攒些体面，好在人前不怯','替母家探一探宫里的风向']);
  const npc={known:false,metAt:fmtTime(),name,realName,rank,faction:'',age,
    profile:{traits,biography:[{time:fmtTime(),text:`今岁选秀入宫，出身${String(family||'').split('，')[0]}`,src:'听说'}],impressions:{},recent:[],depth:'初识'},
    hidden:{真实性情:personaLine(traits,'初入宫，锋芒还收着'),当前目标:goal,对主控:'新入宫，先看你在这宫里站得稳不稳'}};
  npc.avatarCat='consort';
  npc.avatar=giveAvatar(state,name,rank,traits,age,'consort');
  npc.favor=clamp01_100(10+rankScoreOf(rank)*2+wlInt(-4,8));
  npc.emperorStory=wlPick(['选秀时被帝多看了一眼，还没轮上说话','入宫那年正逢宫中办宴，只在席末露过一面','是太后宫里的人先提起的名字','没人替她说话，全凭家世与品貌入选']);
  npc.arc='眼下的心思：'+wlPick(['先认全宫里的路，免得走错门','想寻个由头去给主位请安','攒着家里带来的体己，不敢乱花','听人说起宫里旧事，正琢磨真假']);
  state.npcs=state.npcs||{};
  state.npcs[name]=npc;
  state.relationships=state.relationships||{};
  state.relationships[name]={type:'好感',value:wlInt(0,8)};
  secretAssign(name,traits); // 新人自带一两条隐秘：日后查证与读心的交付物
  const cands=((state.factions)||[]).filter(f=>f&&!f.defunct&&f.leader&&rankScoreOf(f.leader)>=rankScoreOf(rank));
  if(cands.length&&Math.random()<0.4){ // 有现成靠山就挂进去；没有就暂不入派系
    const f=wlPick(cands);
    npc.faction=f.name;
    if(!f.members.includes(name))f.members.push(name);
    pruneFactionMembers(f,state);
  }
  ensureNpcSkills(npc,name);
  state.npcGoalCards=state.npcGoalCards||{};
  state.npcGoalCards[name]=goal+'；下一步：先给主控递个话头，试她接不接';
  addPending(`新入宫：${name}（${rank}，${traits.join('、')}）。尚未照面，宜往见或探她站哪一边`);
  chronicleAdd(`${MONTHS[(state.time||{}).month]||''}，今岁选秀新人入宫：${name}，封${rank}，性情${traits.join('、')}。`);
  maybeNewNpcFaction(); // 新人在册，旧人也可能借势另立门户
  return npc;
}

function buildOpeningWorld(proto){

  };
  if(proto.emperorPersona){emperor.persona=String(proto.emperorPersona).slice(0,1000);emperor.traits=''} // 玩家亲撰帝设：开局写入存档并清空随机性情——两者并存只会打架，帝设独大

  const factionCount=Math.min(3,Math.max(2,leaders.length));
